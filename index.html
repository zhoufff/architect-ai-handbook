er-radius:4px;padding:8px 10px;min-height:40px;max-width:100%}.term-filter select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}\n.term-card{margin:0;border-top:0;border-bottom:1px solid var(--line);padding:20px 0;scroll-margin-top:20px}.term-card summary{display:grid;grid-template-columns:minmax(0,1fr) 24px;gap:7px 14px;list-style:none}.term-card summary::-webkit-details-marker{display:none}.term-card summary::after{content:'＋';grid-column:2;grid-row:1/3;align-self:center;color:var(--accent);font-weight:400;font-size:22px}.term-card[open] summary::after{content:'－'}.term-name{font-size:17px;overflow-wrap:anywhere}.term-plain{font-size:14px;font-weight:400;color:var(--muted)}.term-body{padding:6px 22px 6px;border-left:2px solid #c8aa91;margin-top:18px}.term-analogy{color:#79543b;font-size:14px}.term-card dl{margin:20px 0}.term-card dt{font-size:12px;color:var(--accent);margin:18px 0 4px}.term-card dd{margin:0;font-size:15px;overflow-wrap:anywhere}.term-card dd p{margin:0 0 9px}.term-check{padding:15px 18px;background:#eee7db}.term-pitfall{font-size:13px!important;color:var(--muted)}.term-walk li{margin:18px 0}.term-walk strong{color:#79543b}\n@media(max-width:760px){.term-body{padding-left:15px;padding-right:0}.term-name{font-size:16px}.term-plain{font-size:13px}.term-filter label{flex-basis:100%}}\n@media print{body{font-size:11pt;background:#fff}.layout{display:block}.sidebar,.toc,.topline,.copy-btn,.book-end,.notice-live{display:none}.page{padding:0}.reading-grid{display:block}.hero{padding:10px 0 20px}h1{font-size:26pt}h2{font-size:18pt}article>section{break-inside:auto}a{color:#222}.prompt,.example,table{break-inside:avoid}details:not([open]){display:block}footer{margin-top:25px}}\n</style><style>.layout{display:block;max-width:1240px}.page{padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}</style><style>.table-scroll{overflow-x:auto;margin:24px 0}.table-scroll th,.table-scroll td{min-width:125px}.route-map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin:25px 0}.route-map>div{border-top:3px solid #bf9472;background:#eee6d9;padding:12px}.route-map strong,.route-map span{display:block}.route-map span{font-size:13px;margin-top:6px;color:#70665c}.knowledge-map{border:1px solid #ddd5c9;margin:25px 0}.knowledge-map>div{display:grid;grid-template-columns:125px 1fr;padding:13px 18px;border-bottom:1px solid #ddd5c9}.knowledge-map>div:last-child{border-bottom:0}.knowledge-map span{font-size:14px;color:#70665c}article h3{font:500 22px/1.5 Georgia,SimSun,serif;margin:28px 0 14px}article h4{font-size:17px;margin:24px 0 12px}article a[title^=\"P0\"]{font-size:.85em}#sources p{overflow-wrap:anywhere}.toc{max-height:calc(100vh - 40px);overflow-y:auto}@media(max-width:680px){.route-map{grid-template-columns:1fr}.route-map>div{border-top:0;border-left:3px solid #bf9472;display:grid;grid-template-columns:110px 1fr}.route-map span{margin:0}.knowledge-map>div{grid-template-columns:1fr;gap:3px}}</style></head><body><a class=\"skip\" href=\"#wayfinder/main\" data-book-route=\"wayfinder/main\">跳到正文</a><div class=\"layout\"><main class=\"page\" id=\"main\"><header class=\"hero\"><p class=\"eyebrow\">复杂规划 · 分会话推进</p><h1>如何使用 Wayfinder</h1><p class=\"lead\">从使用时机、建图和逐票推进，到与你现有开发流程衔接。完整例子也在这一栏，不需要另开说明文件。</p></header><div class=\"reading-grid\"><article><section id=\"start\">\n<p><a id=\"start-heading-1\"></a></p>\n<h2>用 Wayfinder，把复杂问题逐个想清楚</h2>\n<p>知道想做什么，却还说不清应该怎样做；每次聊到一半，又冒出研究、原型和新的问题——这才是 Wayfinder 擅长的场景。</p>\n<p>它是 <strong>Matt Pocock 的一个 Skill（给智能体使用的方法说明）</strong>，不是新模型，也不是大型记忆插件。它把跨会话的规划整理成一张“问题地图”，让下一次讨论知道从哪里接着走。<a href=\"https://github.com/mattpocock/skills/blob/main/docs/engineering/wayfinder.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者说明</a></p>\n<blockquote>\n<p>对你最有用的理解：它像方案阶段的专题协调表。先明确这轮要定到什么程度，再分别解决使用需求、界面样例和技术条件。不是一开始就把整个项目拆成施工任务。</p>\n</blockquote>\n<p><a id=\"start-heading-2\"></a></p>\n<h3>先判断：这次真的需要它吗</h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>你现在的情况</th>\n<th>建议走法</th>\n<th>为什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>只改一处文案、布局或已定位的小问题</td>\n<td>按小任务方式修改并验证</td>\n<td>没有需要跨会话厘清的路线，不必建图。</td>\n</tr>\n<tr>\n<td>有一个功能，需要讨论，但一次谈话能定清</td>\n<td>使用 grilling；有项目资料时按 grill-with-docs 的方式先查资料再讨论</td>\n<td>讨论本身足够，地图会增加负担。</td>\n</tr>\n<tr>\n<td>几个决定互相影响，还需要分别调研、做原型才能判断</td>\n<td>使用 Wayfinder</td>\n<td>问题会跨会话展开，需要记录依赖与已定结论。</td>\n</tr>\n<tr>\n<td>工程量很大，但规格和取舍已经批准</td>\n<td>直接复用规格，安排施工</td>\n<td>工期长不等于规划仍不清楚。</td>\n</tr>\n<tr>\n<td>长对话已经失去重点，事情还没定清</td>\n<td>先整理已有决定，再交接给 Wayfinder</td>\n<td>从已有结果接续，不能把批准过的事全部重问。</td>\n</tr>\n</tbody></table></div>\n<p><strong>关键不是产品“大不大”，而是这轮规划是否跨会话、路线是否仍不清楚。</strong> 对你而言，不需要让每一个功能都先跑 Wayfinder。<a href=\"https://github.com/mattpocock/skills/blob/main/docs/engineering/wayfinder.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者适用场景</a></p>\n<p><a id=\"start-heading-3\"></a></p>\n<h3>地图、决策票、施工票，不是一回事</h3>\n<p><strong>问题地图</strong>这轮要定什么？还有哪些未知？</p>\n<p><strong>决策票</strong>一次会话解决一个明确问题</p>\n<p><strong>规格</strong>把批准的决定整理成要做的成果</p>\n<p><strong>施工票</strong>划定每次实现范围和验收要求</p>\n<p><strong>实现与验收</strong>写代码、验证，再由人确认可用</p>\n<p>例如，“权限审批放在哪一步？”是决策票；“实现已经批准的审批弹窗”才是施工票。原型里出现一个能点的弹窗，不代表真实权限控制已经做好。</p>\n<p>地图通常是一个主记录，下挂多个问题。每项结论保存在原票中，地图只写简短摘要和链接。因此新会话不用从头翻完所有聊天，也不必一次加载全部历史。<a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/wayfinder/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者核心规则</a></p>\n<p><a id=\"start-heading-4\"></a></p>\n<h3>这一栏怎样读</h3>\n<ul>\n<li>第一次尝试：看“第一次用”，按示例向智能体说明目的地。</li>\n<li>已经建好地图：看“走完一张票”，知道怎样认领、讨论、回写与交接。</li>\n<li>想融入你的开发手册：看“接入现有流程”和“完整例子”。</li>\n<li>想核对视频原意：看本栏末尾<a href=\"#wayfinder/sources-heading-3\" data-book-route=\"wayfinder/sources-heading-3\">作者与方法入口</a>里的两条原始视频。</li>\n</ul>\n<p>本文区分三类内容：<strong>视频中的做法、作者 Skill 的默认规则、本手册的适配建议</strong>。它们有关联，但不完全相同。特别是“是否直接执行”和“完成后是否删除规格”，不能只听一句话就改成全局硬规则。</p>\n\n</section>\n<section id=\"first\">\n<p><a id=\"first-heading-1\"></a></p>\n<h2>第一次用，先说明这轮要得到什么</h2>\n<p>不必先写一份专业的需求文件。你需要提供的是背景、已经确认的事情、拿不准的地方，以及这轮想得到的成果。</p>\n<p><a id=\"first-heading-2\"></a></p>\n<h3>先检查入口，不要重复安装</h3>\n<p>Wayfinder 来自 <a href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">mattpocock/skills</a>，作者展示的调用方式是 <code>/wayfinder</code>。不同客户端的技能入口可能不同；以实际能找到并加载的技能为准。<strong>安装了 Matt 插件，不等于所有会话都已经获得其中的每个 Skill。</strong></p>\n<p>Wayfinder 是手动触发型 Skill，Agent 不会自己想起来用它，要用真实名称点名调用。这里是在讲它的使用方法，<strong>没有替你安装、启用或验证某个项目能直接调用</strong>。</p>\n<p>可以先把这段交给智能体：</p>\n<div class=\"prompt\"><pre>请先只读检查这个项目能否使用 Matt Pocock 的 Wayfinder。\n检查实际可用的技能入口、项目规则、知识库入口，以及记录地图和票据的位置。\n确认是否已经有 tracker 配置及 Wayfinding operations。\n已有设置就复用；列出已确认和缺失的内容。\n这一步不要安装、不要修改规则、不要创建票。</pre></div>\n<p>如果入口不可用，智能体应说明“方法文件存在，但尚未验证可以调用”，再给出接入建议。不能假装执行过 <code>/wayfinder</code>。如果你明确同意，也可以让它读取作者完整说明后按方法处理，但要说清这不是已验证的客户端 Skill 调用。</p>\n<p><a id=\"first-heading-3\"></a></p>\n<h3>票放在哪里：先沿用项目已有位置</h3>\n<p>Tracker 可以理解成“任务登记处”：记录地图、问题、依赖、负责人和结论。GitHub Issues 是作者支持最好的路径：它自带的子议题和阻塞关系，让人不打开地图也能看出哪些票现在能做。本地 Markdown 也能用，没配 tracker 时技能默认用它；但作者说明页写的是“不推荐”，理由是规划材料放进仓库，容易被意外长期留下。并非必须再购买一个服务。</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>项目现状</th>\n<th>建议</th>\n<th>需要注意</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>已用 GitHub Issues 管任务</td>\n<td>继续使用同一个仓库</td>\n<td>先核实读写权限、子票、依赖和认领方式。不要另外创建第二套票。</td>\n</tr>\n<tr>\n<td>单人本地项目，没有远程任务系统</td>\n<td>本手册的适配：采用本地 Markdown，放进项目知识库（作者不推荐，理由见上）</td>\n<td>目录要有一个明确入口；多会话同时编辑要防冲突。</td>\n</tr>\n<tr>\n<td>团队已经用其他系统</td>\n<td>配置现有系统的操作规则</td>\n<td>“方法支持”不等于客户端已有对应连接器。</td>\n</tr>\n</tbody></table></div>\n<p>作者的 <code>setup-matt-pocock-skills</code> 用于项目级配置：先发现现状，展示草稿，再按确认的方案写入。常见输出是 <code>docs/agents/issue-tracker.md</code> 和 <code>docs/agents/domain.md</code>，并在项目规则中加入入口。这些是作者默认位置，<strong>不是要求你移动现有知识库</strong>。<a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/setup-matt-pocock-skills/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Setup 原文</a></p>\n<p>本地模板用 <code>.scratch/&lt;本轮工作&gt;/map.md</code> 和 <code>issues/</code>。如果你已经把资料集中在项目知识库里，可以明确配置成现有结构；这是项目适配，不是作者默认目录。地图和施工票要分开标识，避免同一个 <code>issues/</code> 中混淆两类任务。<a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/setup-matt-pocock-skills/issue-tracker-local.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">本地模板</a></p>\n<p><a id=\"first-heading-4\"></a></p>\n<h3>第一步：提供四样东西</h3>\n<ol>\n<li><strong>现在要解决什么问题</strong>：谁在什么场景下遇到了困难。</li>\n<li><strong>已有材料</strong>：项目知识库入口、现有页面、资料样本、相关决定。</li>\n<li><strong>这轮要得到什么</strong>：例如“一份我能确认、可交给开发者实施的首版规格”。</li>\n<li><strong>本轮边界</strong>：哪些已定、哪些不做、是否允许原型、哪些操作需另外授权。</li>\n</ol>\n<p>不要把目的地写成“完成今天的聊天”，也尽量不要写成“把整个平台所有功能想完”。它是<strong>这张地图整体的终点</strong>，不是本次会话的终点。</p>\n<p>入口确认可用后，可以这样开始：</p>\n<div class=\"prompt\"><pre>请使用 Wayfinder，为【这轮功能】建立问题地图。\n项目资料入口是【实际路径或链接】；已经批准的决定见【实际材料】。\n这轮目的地是：明确【首版使用场景、功能边界和验收要求】，形成可交接的决定。\n当前拿不准的是【几个真实问题】；本轮不做【排除事项】。\n允许为做决定制作可抛弃的原型，但不写正式产品功能、不操作真实项目数据。\n先核对已有事实，再向我提出重要取舍。每次先讲为什么要决定、推荐是什么、影响是什么。\n只给目前能准确提出的问题建票，其余未知保留在地图里。</pre></div>\n<p><a id=\"first-heading-5\"></a></p>\n<h3>第二步：看首轮地图，而不是立即开工</h3>\n<p>首次建图会话主要做三件事：核对当前项目、与你确认目的地、把已明确的问题和依赖登记起来。普通决策票留给后续会话，研究票可以并行启动。<a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/wayfinder/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">建图规则</a></p>\n<p>你只需要检查：</p>\n<ul>\n<li>终点是不是你这轮真正需要的？</li>\n<li>有没有把“已经批准”重新写成“待讨论”？</li>\n<li>有没有把不做的内容悄悄放进地图？</li>\n<li>当前可做的票，是不是你看得懂的问题？</li>\n<li>是否先做便宜的研究或原型，再决定代价更高的事？</li>\n</ul>\n<p>首轮若发现一次讨论就能定清，可以不建地图。这不是少走必要流程，而是问题已经不需要跨会话规划。</p>\n\n</section>\n<section id=\"ticket\">\n<p><a id=\"ticket-heading-1\"></a></p>\n<h2>每次会话，解决一个明确的问题</h2>\n<p>地图负责保持方向，一张票负责把当前问题说透。它不是让主控长期记住每次谈话，而是让工作结果留在可查的原记录中。</p>\n<p><a id=\"ticket-heading-2\"></a></p>\n<h3>先分清四种票，该用哪个 Skill</h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>现在缺什么</th>\n<th>票的类型与 Skill</th>\n<th>你会看到什么</th>\n<th>怎样才算完成</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>需要你作取舍</td>\n<td>grilling；结合 domain-modeling 统一项目术语</td>\n<td>围绕一个问题的选项、推荐与追问</td>\n<td>你作出选择，关键理由和边界记进票。</td>\n</tr>\n<tr>\n<td>光靠文字想象不出来</td>\n<td>prototype</td>\n<td>可操作的逻辑样例，或几种界面方案</td>\n<td>你看过并说明选择；原型链接和结论留存。</td>\n</tr>\n<tr>\n<td>缺少能查证的事实</td>\n<td>research</td>\n<td>带来源的调查结果，以及事实对选择的影响</td>\n<td>问题得到有依据的答案，未确认处明确列出。</td>\n</tr>\n<tr>\n<td>必须先做准备才能判断</td>\n<td>task；视需要配合 wizard</td>\n<td>如准备脱敏样本、取得测试环境访问条件</td>\n<td>所需准备完成并留证据，不顺势写正式功能。</td>\n</tr>\n</tbody></table></div>\n<p>这些都是 <a href=\"https://github.com/mattpocock/skills/tree/main/skills/engineering\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Matt 的工程技能</a>。Wayfinder 是组织者，research、prototype 等是具体做事的方法。<code>wizard</code> 只适用于人必须亲自做、智能体无法代做的步骤，不是每张 task 都必须调用。</p>\n<p><strong>HITL</strong> 是需要人参与：grilling 和 prototype 的重要选择必须由你作出。<strong>AFK</strong> 是智能体可独立推进：例如公开资料研究。AFK 不等于你授权它付费、改真实数据、部署或控制同事电脑。<a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/wayfinder/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">四类票的规则</a></p>\n<p><a id=\"ticket-heading-3\"></a></p>\n<h3>怎样开一个新的决策会话</h3>\n<p>作者的规则是一会话一张决策票，研究例外。这里的“新会话”不是在同一条长聊天里再发一句“下一张”，而是给下一问题一个独立上下文。</p>\n<p>入口可用的客户端中，作者的简写是 <code>/wayfinder</code> 加地图或具体票的链接。你也可以明确写成：</p>\n<div class=\"prompt\"><pre>请使用 Wayfinder，处理【决策票名称＋实际链接或路径】。\n地图入口是【实际链接或路径】，项目知识库入口是【实际位置】。\n先核对依赖和是否已有其他会话认领，再按项目 tracker 规则认领。\n本会话只解决这张票；先读地图概要，再读本票所需资料。\n需要我作取舍时，给出推荐、理由和影响；不要替我回答。\n完成后把答案和依据写回原票，地图只增加摘要与链接，并说明下一步。</pre></div>\n<p>不指定具体票时，Wayfinder 会从 <strong>frontier（目前可推进的票）</strong> 里选择：票未完成、前置事项已完成、也没人认领。只是“尚未完成”还不够，有依赖的票不能抢跑。</p>\n<p>认领必须可见。两个会话若使用同一个 GitHub 账号，不能想当然地把同一个负责人当成独立会话锁；可以由主控串行分配明确的票，或按 tracker 约定补充会话标识。这是使用上的防冲突建议。</p>\n<p><a id=\"ticket-heading-4\"></a></p>\n<h3>遇到什么问题，怎样纠正智能体</h3>\n<p><a id=\"ticket-heading-5\"></a></p>\n<h4>文字越问越多，还是看不懂</h4>\n<div class=\"prompt\"><pre>这个问题光靠文字我无法判断。请说明需要哪种原型来验证它，\n先复用现有项目的关键界面或逻辑，做可抛弃的对比样例。\n不要因此另做一套产品。等我看过再确定选择。</pre></div>\n<p>原型的目的是回答一个问题。例如比较“先录入材料还是先建项目”，不必同时把登录、数据库、部署都做好。原型能运行和演示，不等于已经通过生产验收。<a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/prototype/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Prototype 说明</a></p>\n<p><a id=\"ticket-heading-6\"></a></p>\n<h4>这张票突然发现另一个大问题</h4>\n<p>先判断新问题是否确实服务于本轮目的地。范围外的想法记到“本轮不做”，不要自动建票。按作者原文，范围外的工作只在终点重画时才回来，而且是另起一轮新工作，不在这张地图上接着做；重画终点要你批准，这是本手册按关口加的要求。对范围内的问题，再看能否准确提问：能提出，就登记新票并写清依赖；还不能提出，就放进雾区。不要靠一句“顺便研究一下”让当前会话无限扩张。</p>\n<p>例如“采用哪种导出格式？”是可建票的问题，即使它还等着前面的用途选择；“控制范围确定后还会出现哪些未知例外”则可能仍是雾区。</p>\n<p><a id=\"ticket-heading-7\"></a></p>\n<h4>另一会话刚刚改了相关决定</h4>\n<div class=\"prompt\"><pre>这张票受【另一票名称与链接】的新决定影响。\n请先核对谁是前置项，指出受影响的内容，再调整依赖与当前问题。\n已有批准仍适用的部分不要重问；真正发生冲突的取舍交给我确认。</pre></div>\n<p>不要假设会话之间会自动共享聊天。<strong>结论要先回写，另一个会话再读取。</strong> 发生重大变化时，记录旧决定为什么不再适用，标明替代关系，不无痕覆盖历史。这是针对追溯需求的维护建议。</p>\n<p><a id=\"ticket-heading-8\"></a></p>\n<h3>结束这一票时，应当交回什么</h3>\n<ul>\n<li>问题的答案，或仍未解决的具体缺口。</li>\n<li>答案依据：研究来源、选择理由、原型和必要的版本位置。</li>\n<li>原票状态与地图摘要已更新，还是写入受阻尚未更新。</li>\n<li>新发现的问题、依赖变化，以及接下来哪张票可以继续。</li>\n</ul>\n<p>需要你选择的票，智能体不能因为“做出了三个方案”就自行选一个关闭。写入被工具拦截时，也不能只口头说已经回写。让它先保存安全的交接结果、报告实际状态，按权限处理，不关闭保护机制。</p>\n\n</section>\n<section id=\"workflow\">\n<p><a id=\"workflow-heading-1\"></a></p>\n<h2>把 Wayfinder 接入现有开发流程</h2>\n<p>你已经认可的四阶段不用因为 Wayfinder 再推倒重来。它可以贯穿前面几个阶段的某一轮复杂决策；路线清楚后，回到原来的规格、施工与验收。</p>\n<p><a id=\"workflow-heading-2\"></a></p>\n<h3>放在你的哪一个阶段</h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>现有阶段</th>\n<th>Wayfinder 什么时候值得用</th>\n<th>常配合的方法</th>\n<th>不要做什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>场景研究</td>\n<td>用户、用途和边界存在多个相互影响的问题</td>\n<td>grilling、research</td>\n<td>用 AI 编造访谈答案，代替真实使用需求。</td>\n</tr>\n<tr>\n<td>概念原型</td>\n<td>看不到实物就无法决定流程或界面</td>\n<td>prototype；必要时 research</td>\n<td>把漂亮原型当成正式功能，顺带重做全部设计。</td>\n</tr>\n<tr>\n<td>施工准备</td>\n<td>技术、数据、权限等未决事项仍会阻碍规格</td>\n<td>domain-modeling、research、grilling；清楚后 to-spec、to-tickets</td>\n<td>已有合格规格还重新开一套地图和票据。</td>\n</tr>\n<tr>\n<td>开发交付</td>\n<td>原则上按已批准施工票推进；发现新的重大未知再专门规划</td>\n<td>implement、tdd、code-review，按实际任务选择</td>\n<td>每遇到一个 Bug 就重启 Wayfinder，或主控自己施工。</td>\n</tr>\n</tbody></table></div>\n<p>这张表是本手册工作法的适配，不是 Matt 把软件开发固定分成这四个阶段。<code>to-spec</code> 等名称表达作者的方法入口，仍需先确认相应技能在当前客户端可用。</p>\n<p><a id=\"workflow-heading-3\"></a></p>\n<h3>主控和建图会话怎样配合</h3>\n<p><strong>探索期，建图会话是决策现场。</strong>它和你一起列问题、定答案，直接记进决策卡和地图 MD；轮末在对话里和你逐条确认，再出一页简报。主控这时只在轮末接收地图，核方向、挑冲突，不重新定。一个问题需要大量查证或原型时，另开一个会话或派内部子代理专门解它；轻的就在建图会话里谈。</p>\n<p><strong>地图上没有未定问题挡住第一份 Spec 时交笔。</strong>建图会话交地图，主控在施工日志把决策现场改成“主控”，开始写 Spec、拆票。票序批准后主控冻结：写记录不写产品。施工期冒出一大片互相牵连的新未知，主控会提议再开一轮建图，把现场改回去，轮末改回来。你在不是现场的窗口问“选 A 还是 B”，它会记下并让你去现场。</p>\n<p><strong>施工票会话</strong>一票一个，负责实现、验证、交验收单。Wayfinder 的决策票和正式施工票属于不同阶段，不能把“解决了决策票”写成“已通过施工验收”。角色的正式定义见 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/04-Agent角色说明.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">04</a>。</p>\n<blockquote>\n<p>给你的建议：同时只保留一张需要你持续回答的决策票；独立研究可以并行。等熟悉后，再尝试并行两个互不影响的问题。不要照着直播一次开四轮提问，把自己变成转发消息的人。</p>\n</blockquote>\n<p>内部子代理通常更适合窄范围资料调查、检查或辅助工作；需要你看界面、表达偏好、反复作决定的票，用你能直接参与的独立会话更清楚。会话与子代理的具体工具能力需核实，不能靠角色名称推断。</p>\n<p><a id=\"workflow-heading-4\"></a></p>\n<h3>项目知识库怎样与地图衔接</h3>\n<p>你担心的是资料散落、接手找不到入口。Wayfinder 能补上“这项决定从何而来”的链条，但不会自动成为全部项目知识库。</p>\n<p><strong>项目入口</strong>项目 AGENTS：项目是什么、资料在哪</p>\n<p><strong>施工日志</strong>现在到哪、决策现场在谁、待你定什么</p>\n<p><strong>地图</strong>问题、摘要、下一步；指向原票</p>\n<p><strong>决策票</strong>决定与理由；指向研究、原型、相关记录</p>\n<p><strong>集中的是入口和管理规则，不一定是复制所有正文。</strong> 用 GitHub 记票，就从项目知识库链接过去；用本地文件，就统一放在批准的目录里。不要在聊天、地图、CONTEXT 和多份 Spec 中各维护一份同样的结论。</p>\n<p>建议分清三种信息：</p>\n<ul>\n<li><strong>当前事实</strong>：现在实际运行的功能、数据结构、部署方式，由对应项目文档维护。</li>\n<li><strong>本轮决定</strong>：这次为什么选 A、不选 B，留在决策票及关联的决定记录中。</li>\n<li><strong>现行与历史材料</strong>：已完成但仍有效的地图、决定和票据继续留在所属位置，并标清状态；被新版本替代的材料才移入历史，保留替代关系和链接。带日期的交接与样例用于追溯，不代替当前状态来源。</li>\n</ul>\n<p>新会话只需拿到项目 AGENTS、施工日志、地图和当前票；先读施工日志，再按链接读必要材料。这样减少“把所有文档一次塞进去”的负担，但不能保证永不压缩、永不遗漏。重要决定能回查，比强求聊天永不忘记更实用。</p>\n<p>想每轮拿到一页给你读的总览，接着看<a href=\"#wayfinder/visualization\" data-book-route=\"wayfinder/visualization\">决策简报</a>：地图 MD 与决策卡继续保存事实，简报在每轮决策结束时由程序从卡生成。</p>\n<p><a id=\"workflow-heading-5\"></a></p>\n<h3>怎样结束地图，回到正式开发</h3>\n<p>本轮真正需要的决定都已明确，阻碍它们的研究和准备已有结果；雾区已解决或明确排除；重要选择由你确认，才接近地图的终点。</p>\n<p>然后按实际需要：<strong>to-spec 整理已批准决定 → 人确认范围 → to-tickets 拆施工票 → 按原有规则分配实现、验证和审查。</strong> 如果原项目已具备合格规格，只更新受影响的部分，不重复创建。</p>\n<p>作者常把已完成规格所在的 issue 关闭，不把规格一直留作长期同步文档。你的项目按资料是否仍有效处理：仍适用的规格保留在原位置；被替代的版本保留日期、状态和替代关系后归入历史。<strong>关闭、归档、删除是三个不同动作</strong>，完成本身不要求搬走文件，本文也没有授权删除任何既有资料。</p>\n\n</section>\n<section id=\"visualization\">\n<p><a id=\"visualization-heading-1\"></a></p>\n<h2>把决策记录，变成每轮一页的简报</h2>\n<p>决定记在项目的决策卡里，地图 MD 是一行一条的索引。每轮结束，程序从卡生成一页<strong>决策简报</strong>给你读；平时想查某个决定，开一个<strong>决策问答</strong>会话直接问。架构图由上游的 Archify 技能生成，只在你要配图时出；这一轮改了架构，现场会在轮末问你要不要。像专题协调会：会后发一页纪要，平时有疑问直接问记录员，图纸只在方案变了时重出。</p>\n<aside class=\"note\"><p>这是本手册作者的<strong>个人模板扩展</strong>，不是 Matt 视频里的 Wayfinder 原版功能。Matt 的地图是一份文字索引，每次会话都加载它，人也读其中“已定决定”一栏；进度和哪些票能做，人在 GitHub 的票列表里看，点进票读结论；我们的项目以本地 MD 为事实源，没有那样的界面，所以用简报和问答来读。已经进入实施或验收、现有资料足够的项目，可以直接按卡出简报，不必倒回去重跑 Wayfinder。</p></aside>\n<p><a id=\"visualization-heading-2\"></a></p>\n<h3>讨论及时落盘，每轮一页简报</h3>\n<p>讨论中新确认的内容，由决策现场及时写回决策卡或地图 MD，卡的写法见 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/03-项目规则模板.md#decision-card\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">03 的决策卡写法</a>；重要选择当时请你确认，不等整张地图完成。出简报按 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/02-通用开发规程.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">02 第 6 节</a>：<strong>探索期一轮决策结束、施工期每张票人工验收关票后，现场先在对话里用编号清单逐条复述本轮定下的措辞，你按编号确认，现场按确认的措辞改好卡；然后由程序从卡生成本轮简报。</strong>你不用读 MD，核对在对话里做。程序读不出卡上规定的标签就报错停下，不猜；现场补好卡再出。探索期的一轮就是一个关口：需求范围、Spec、方案、票序，加批准的变更、阶段回退和 Wayfinder 决策票关闭。</p>\n<p>“一轮”可以只是一个专题或一批讨论，不必解决全部未知；出了这一轮的简报，不等于结束整张 Wayfinder 地图。</p>\n<p><a id=\"visualization-heading-3\"></a></p>\n<h3>简报首屏五栏，点开看详情</h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>栏</th>\n<th>回答什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>要你决定</td>\n<td>必答栏，没有写“无”；有的列出问题、选项（含什么都不做）和代价、推荐、何时之前、不定会挡住什么。</td>\n</tr>\n<tr>\n<td>本轮定了什么</td>\n<td>每条一行，标题就是结论本身。</td>\n</tr>\n<tr>\n<td>改了哪些旧决定</td>\n<td>旧→新、原因、影响。</td>\n</tr>\n<tr>\n<td>带前提或未定</td>\n<td>前提由谁满足、何时核实；还没定和暂缓的问题。</td>\n</tr>\n<tr>\n<td>下一步</td>\n<td>谁＋做什么＋何时之前。</td>\n</tr>\n</tbody></table></div>\n<p>首屏每行一个短语，一屏看完；点开一行看详情：问题、比较过的选项、选择与理由、影响、前提、依据、后续。依据是能点开的相对链接，页面不把原文嵌进来。简报是阅读页，<strong>不会写回项目 MD</strong>；其他任务的新资料要先落盘，下一轮简报才会带上。</p>\n<p>平时想问“某个功能怎么定的、改了会影响什么”，开一个决策问答会话直接问：它读简报、地图 MD、决策卡和 ADR，每条回答附出处；你在问答里定下或改了主意，它连同你的原话投回决策现场，现场向你复述确认后写卡，问答会话自己不写。角色见 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/04-Agent角色说明.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">04</a>，开工三行见 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/05-任务开工包模板.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">05</a>。</p>\n<p><a id=\"visualization-heading-4\"></a></p>\n<h3>架构图按需，看懂它的证据边界</h3>\n<p>架构图由 Archify 生成：AI 按要表达的内容选图类型（架构、流程、时序、数据流、状态），从已落盘的资料写一份 JSON 规格，Archify 校验后出一张独立 HTML。页面里可以看依赖上下游、两点之间的路径，也能搜索、缩放、切换明暗主题、导出图片；这些只改变阅读视图，不会写回项目 MD。</p>\n<p><strong>图不存决策历史。</strong>决定和它的来龙去脉只住在决策卡里；一张图是某一刻资料的画面，重出一张不产生新的决策版本，也不能代替卡上的状态。</p>\n<p><strong>架构 Before / Delta / After</strong>回答的是两份架构规格之间“原来怎样、改变了什么、现在怎样”，由 Archify 的 <code>compare</code> 生成，目前只支持架构图。它需要明确的前后两份规格，不能把一次出图自动当成架构变更证明。</p>\n<p>已知依据、用户决定、实施状态、实际验证要分别表达：有依据不等于已批准，决策已定不等于已经实现，实现完成也不等于已经验证。简报和图做完，都不代表批准施工或通过验收。官方能力示例与虚构资料只用于说明表现能力，不作为项目事实。</p>\n<p class=\"muted\">本章没有替你运行决策简报和架构图的浏览器交互或图形导出验证。格式支持与实际可用性需在具体交付环境分别核验，不能把本节说明当作测试结果。</p>\n<p><a id=\"visualization-limits\"></a></p>\n<h3>出架构图时，先核对原资料与输出位置</h3>\n<p>Archify 只按 JSON 规格出图，不认识决策卡：AI 先读项目 MD（决策卡、架构资料、ADR），只把已落盘的事实写进规格。你不需要手填 JSON，也不另建一套手工维护的平行台账。</p>\n<p><strong>输出位置按 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/03-项目规则模板.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">03 项目规则模板</a>的目录约定。</strong> 每张图一个独立 HTML 放 <code>项目总览/html/</code>，同名 JSON 规格留在旁边，改架构时作对比的前一版；现场在相关决策卡的“依据”里链到图，简报随卡带出，所以先出图再出简报。<code>deliver</code> 全部校验通过才替换输出，失败时保留上一版；<code>compare</code> 会在输出旁边另写一份回执 JSON。</p>\n<p>Archify 和决策简报都不做来源目录保护，写到哪里全看命令给的路径；所以输出只给 <code>项目总览/html/</code> 下的路径，不写进 <code>项目总览/md/</code> 或 <code>决策卡/</code> 目录。</p>\n<p>这里讨论的是<strong>项目 MD → 架构图 HTML</strong>。本教学手册另有自己的维护方向：<strong>手册 HTML 源 → Agent 使用的 MD 副本</strong>。两种用途不同，不要因为给项目出图，就反向改写手册来源或把手册副本当项目事实。</p>\n<p><a id=\"visualization-heading-6\"></a></p>\n<h3>三种可直接复制的请求</h3>\n<h4>一轮结束，出本轮简报</h4>\n<p>探索期贴给建图会话；施工期贴给主控，由它确认后派建图会话出简报。</p>\n<div class=\"prompt\"><pre>【专题／这批讨论】这一轮结束了。请按 02 第 6 节：先用编号清单逐条复述本轮定下的措辞，我按编号确认；按确认的措辞改好决策卡和地图 MD 头字段，再用决策简报程序从卡出本轮简报。\n程序读不出卡上规定的标签就停下，列出哪张卡缺什么，补好卡再出，不猜。\n简报不批准新选择，不代表整张地图结束、施工批准或验收通过。交付时给简报路径，说明实际验证与未验证内容。</pre></div>\n<h4>要配架构图</h4>\n<div class=\"prompt\"><pre>请用 Archify 技能，依据【项目原 MD 入口与架构资料】为【专题】出一张【架构／流程／时序／数据流／状态】图。\n只整理已落盘的事实，不修改决定或状态；图、同名 JSON 规格和对比页都写在【项目总览/html/】下。\n图出好后在【相关决策卡】的“依据”里加一行它的相对链接；你不是决策现场，就把链接交给现场写。\n架构改过时，拿上一版和本版规格用 compare 出前后对比；没有上一版规格就说明，不凭记忆补一份。\n说明哪些是 Archify 的校验、哪些在浏览器实际看过、哪些没验证。这次请求不授权安装、后台预览、发布或施工。</pre></div>\n<h4>开一个决策问答</h4>\n<div class=\"prompt\"><pre>你是决策问答会话，边界按 04，开工三行见 05 的决策问答变体。项目：【项目路径】。\n我想问【某个功能或决定】是怎么定的、如果改了会影响什么。每条回答附出处，分清已定、未定、暂缓、否决和已被取代。\n我在这里定下或改了主意，你连同原话用交回包投给决策现场，由现场向我复述确认后写卡，你自己不写。</pre></div>\n<p class=\"source\">继续阅读：<a href=\"#skills/card-decision-map\" data-book-route=\"skills/card-decision-map\">手册中的 Archify 技能卡</a>。卡的写法见 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/03-项目规则模板.md#decision-card\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">03 的决策卡写法</a>。执行入口与约束以已装 Archify 技能的 <code>SKILL.md</code> 为准，上游见 <a href=\"https://github.com/tt-a1i/archify\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">tt-a1i/archify</a>。</p>\n</section>\n<section id=\"example\">\n<p><a id=\"example-heading-1\"></a></p>\n<h2>以 Windows 设计助手为例，从想法走到可交接</h2>\n<p>下面是为你的场景设计的教学例子，不是视频原项目，也不是已经批准的技术方案。它不预设某个设计软件一定能被安全控制，需要研究与测试。</p>\n<p><a id=\"example-heading-2\"></a></p>\n<h3>原始想法</h3>\n<p>“我想做一个 Windows 桌面助手，能看懂同事的设计任务，操作电脑，帮他们完成一些重复工作。”</p>\n<p>这个想法里同时有用途、可行性、操作权限和交互问题。直接叫 AI 拆一百张施工票，会让大量尚未作出的选择藏进代码里。</p>\n<p><a id=\"example-heading-3\"></a></p>\n<h4>把这一轮缩成可判断的目的地</h4>\n<p>建议先定成：<strong>确认一个可试用的首版场景：使用什么输入、助手可做什么、哪些步骤需人批准、失败怎样停止，以及用什么结果验收。</strong></p>\n<p>这轮不做无人监督的批量操作，不接入同事真实项目数据，也不决定未来平台的所有功能。你批准范围后，才开始建图。</p>\n<p><a id=\"example-heading-4\"></a></p>\n<h3>第一版地图可以这样组织</h3>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>决策或准备</th>\n<th>类型</th>\n<th>先需要什么</th>\n<th>交回什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>首版帮同事完成哪一种重复任务？</td>\n<td>grilling</td>\n<td>一段真实工作描述</td>\n<td>明确的场景、用户和完成标准。</td>\n</tr>\n<tr>\n<td>目标 Windows 版本和设计软件有哪些可用的控制方式与限制？</td>\n<td>research</td>\n<td>首版场景已选定</td>\n<td>有来源的能力与限制，不保证每个接口都可用。</td>\n</tr>\n<tr>\n<td>准备脱敏样例和可安全试验的环境</td>\n<td>task</td>\n<td>使用边界与样本权限明确</td>\n<td>经允许的测试材料；不是复制同事真实文件。</td>\n</tr>\n<tr>\n<td>人怎样查看建议、批准、暂停和撤销？</td>\n<td>prototype</td>\n<td>已知首版动作，且有安全样例</td>\n<td>可操作的界面或逻辑样例，供你选择。</td>\n</tr>\n<tr>\n<td>哪些动作允许自动做，失败时怎样恢复？</td>\n<td>grilling</td>\n<td>能力研究与样例反馈</td>\n<td>动作边界、人工批准点、停止与恢复要求。</td>\n</tr>\n</tbody></table></div>\n<p>地图还可以记一项雾区：“选定首版控制范围后，可能出现的复杂例外场景尚无法列全。”当某个例外已经能准确说出来，就转成明确问题；不要让它长期停在模糊描述里。</p>\n<p>这只是一个起点。真正建图时应依据项目现状决定票的数量，不能把表里的五项机械照搬成每个项目的固定表格。</p>\n<p><a id=\"example-heading-5\"></a></p>\n<h3>一段你能直接使用的对话</h3>\n<p><a id=\"example-heading-6\"></a></p>\n<h4>你先提出问题</h4>\n<div class=\"prompt\"><pre>我想先确定 Windows 设计助手的一个首版场景，而不是把整个平台规划完。\n请使用 Wayfinder，先核对现有项目资料，帮我明确这轮目的地。\n我希望助手能辅助同事，但不允许在未确认的情况下修改他们的真实文件。\n请把需要查资料、需要看原型、需要我作选择的事情分开。</pre></div>\n<p><a id=\"example-heading-7\"></a></p>\n<h4>AI 应当给你的不是一堆术语</h4>\n<p>合适的问法：“首版先做‘读取材料后给建议’，还是‘经批准后实际操作软件’？前者更容易安全试用，后者更贴近最终目标，但需要验证控制方式和恢复能力。建议先选一个能在测试环境验证的操作场景，你想先解决哪项重复工作？”</p>\n<p>不合适的问法：“请确认 Agent Harness、Tool Runtime、Action Schema、Orchestrator 的技术选型。”这些概念如果真影响结果，应由 AI 翻译成你能判断的影响，再提出建议。</p>\n<p><a id=\"example-heading-8\"></a></p>\n<h4>调研回来后，先讲它改变了什么</h4>\n<p>你要的不是二十页网址，而是：“哪条路线已被验证可行、哪条还缺证据、这些限制会影响首版什么能力。”仍未确认的事实不能靠一次模型回答就定为项目条件。</p>\n<p>如果研究发现某项能力需要付费、管理员权限或真实电脑操作，先说明成本和风险，等待相应授权。研究票可以独立完成，不代表它能自行替你购买或授权。</p>\n<p><a id=\"example-heading-9\"></a></p>\n<h4>看原型时，提出可执行的反馈</h4>\n<div class=\"prompt\"><pre>我能看懂方案 B，但在真正执行前还要看到：会改哪个文件、会做什么、失败后怎么办。\n请用假数据演示批准、拒绝、执行中暂停和失败后的状态。\n我确认的是这个交互方向，不是授权它操作同事的电脑。</pre></div>\n<p>这样反馈能让原型验证“人是否能掌控操作”，而不只是按钮好不好看。若原型发现新的安全问题，补票并更新依赖；不让 UI 先表现成系统已经具备的能力。</p>\n<p><a id=\"example-heading-10\"></a></p>\n<h3>到什么程度，可以交给施工</h3>\n<p>你应当能用普通话回答：谁在何时用；输入什么；会发生什么；哪些事情不会发生；遇到失败怎么办；怎样证明这轮做好了。</p>\n<p>智能体再把这些决定整理进规格，链接回原票与研究。施工票写的是“按这套已批准边界实现什么”，不再重复问一遍产品方向。涉及真实控制的功能，仍须在对应 Windows 测试环境验证；演示 HTML 不能替代这一环节。</p>\n<p><a id=\"example-heading-11\"></a></p>\n<h3>已有项目聊到一半，也可以接入</h3>\n<div class=\"prompt\"><pre>这段讨论已经跨了很多问题，我不想从头重新来。\n请先整理已批准的决定、仍有效的项目事实、尚未决定的问题和它们的来源。\n对仍需跨会话解决的部分使用 Wayfinder；不要把已定内容重新变成待选项。\n地图只覆盖【本轮问题】，原有规格和知识库沿用原位置。</pre></div>\n<p>如果接到这段要求的是已冻结的主控，单纯补充已有结论的来源指针或有依据的状态，可在已授权管理范围内完成；需要建立新的规划地图、修改规格或架构决定时，由获授权的规划任务处理。按正式《Agent 角色说明》分工，不因为使用 Wayfinder 就自动解除冻结。</p>\n\n</section>\n<section id=\"faq\">\n<p><a id=\"faq-heading-1\"></a></p>\n<h2>这些地方最容易用重、用偏</h2>\n<p><a id=\"faq-heading-2\"></a></p>\n<h3>是不是以后直接说 Wayfinder，就不用管其他 Skill 了？</h3>\n<p>在地图内部，你可以主要围绕 Wayfinder 和当前票沟通，由它选择研究、原型或讨论方法。但前提是相关技能确实可用，而且你给的任务和边界清楚。地图结束后的规格、施工、审查仍是不同工作；它不是一个包办全项目的按钮。</p>\n<p><code>writing-for-agents</code> 负责把 Agent 规则写清楚，<code>research</code> 负责查证，<code>prototype</code> 负责用样例回答问题。它们解决不同的问题，不应因为使用 Wayfinder 就全部删除，也不应在每一步全部调用。</p>\n<p><a id=\"faq-heading-3\"></a></p>\n<h3>它会不会把我的流程变得更重？</h3>\n<p>会，尤其是事情本来一次就能讨论清楚时。作者也把它列为较重的流程。先用一轮有边界、确实存在依赖的功能试用；如果问题已清楚，就直接退出地图路线。不要把“必须先建图”加入全局准则。</p>\n<p>观察的不是票越来越多，而是：当前问题是否更清楚，已定事项是否不再反复争论，原型是否帮助作出选择，新会话能否沿资料入口继续。</p>\n<p><a id=\"faq-heading-4\"></a></p>\n<h3>地图是不是开一个大文档，把所有上下文塞进去？</h3>\n<p>不是。地图是摘要和链接，原票保留决定，研究保留依据，项目知识库保留当前事实。不要把全部逐字稿堆在地图里。也不要另建一套完全重复的“超级记忆库”。</p>\n<p>所谓减少上下文压力，来自按需读取和分会话，不是凭空扩大模型窗口。文档会过期、链接会失效，仍需在变化发生时维护它们。</p>\n<p><a id=\"faq-heading-5\"></a></p>\n<h3>100K、150K、聪明区间，应该当作硬上限吗？</h3>\n<p>不应该。本次短视频提到聪明区间，但没有性能对照实验；Skill 中的 100K 是作者用于估计一票大小的约定。长演示也提到原型可能消耗较多上下文，这些不是适用于所有模型的统一阈值。</p>\n<p>更实用的做法是：问题开始混杂、重复确认增多、资料变得难以核对时，先保存决定和当前状态，再转入合适的新会话。不要等到卡住才凭记忆临时写一句“继续上次”。</p>\n<p><a id=\"faq-heading-6\"></a></p>\n<h3>地图做了很多票，后面的票又不适用了怎么办？</h3>\n<p>先核对是不是范围过大，或过早把尚不清楚的内容拆成了假精确的票。告诉智能体哪里变了，重新评估受影响的依赖；保留仍有效的结论，只调整真正改变的部分。新的重要取舍交给你批准。</p>\n<p>作者说明也记录了“前面决定改变后，后面票失效”的实际反馈。它不是一次规划后永不变化的系统。<a href=\"https://github.com/mattpocock/skills/blob/main/docs/engineering/wayfinder.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者常见问题</a></p>\n<p><a id=\"faq-heading-7\"></a></p>\n<h3>默认只规划，为什么视频又说可以直接执行？</h3>\n<p>这是需要保留的差异。作者核心 Skill 默认“规划，不交付产品”；短片结尾确实说目的地由用户决定，也可选择通过 tasks 实施。源码的 Notes 允许声明例外，作者文档同时提醒：智能体可能自己写入执行许可，再把它当成授权。</p>\n<p>给你的建议是把默认边界写明：“本地图只形成决定；原型仅供判断；正式施工另行安排；Agent 不得自行修改 Notes 扩大权限。”若你确实选择执行型地图，应另外明确范围、运行环境、验收与权限，而不是让 AI 自己决定已经获得授权。</p>\n<p><a id=\"faq-heading-8\"></a></p>\n<h3>看完地图，怎样知道可以停了？</h3>\n<p>不只看“已完成几张”。还要检查本轮目标需要的决定是否齐全、有没有悬而未决的关键问题、依赖是否闭合、范围外是否写清，以及需要你确认的选择是否真的经过你。</p>\n<p>研究完成、原型可看、规格批准、代码写完、人工验收通过，是不同状态。74 分钟演示结束时，Matt 明确说地图没有全部走完，当时是 8/9；不能把这段直播讲成“一个小时自动做好完整功能”。</p>\n<p><a id=\"faq-heading-9\"></a></p>\n<h3>原型阶段也会碰到环境和工具问题吗？</h3>\n<p>会。直播中出现过依赖、不同 worktree、预览地址和权限审批问题。Wayfinder 能组织工作，并不能保证环境一次跑通。</p>\n<p>让执行者先确认当前工作目录、启动命令和预览地址；先把当前样例跑通，再继续比较方案。按你的规则保护真实资料，不为了少一次提示而关闭安全控制。原型只做必要的可运行检查；正式实现按风险验证，不能照搬“原型不写测试”。</p>\n<p><a id=\"faq-heading-10\"></a></p>\n<h3>我不懂代码，面对技术取舍该怎么办？</h3>\n<p>你负责目的、优先级和能否使用；AI 应先检查现有项目，把技术选项翻译成成本、体验、风险和维护负担。确实需要专业判断时，让它给出证据和独立审查，不把“请确认一个你完全不理解的缩写”当成有效批准。</p>\n<p>可以随时这样说：“请用我能判断的影响解释这个选择，并给出推荐；现有约定能直接决定的实现细节，你自行处理。”</p>\n\n</section>\n<section id=\"sources\">\n<p><a id=\"sources-heading-1\"></a></p>\n<h2>来源、版本与阅读范围</h2>\n<p>整理日期：2026-09-11。本说明依据指定视频的完整音频转写、关键演示画面和 Matt Pocock 的第一方说明制作。它是一份使用教程，不是已安装或已执行 Wayfinder 的证明。</p>\n<p><a id=\"sources-heading-3\"></a></p>\n<h3>作者与方法入口</h3>\n<ul>\n<li><a href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Matt Pocock Skills 仓库</a></li>\n<li><a href=\"https://github.com/mattpocock/skills/blob/main/docs/engineering/wayfinder.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Wayfinder 作者使用说明</a></li>\n<li><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/wayfinder/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Wayfinder 核心 Skill</a></li>\n<li><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/setup-matt-pocock-skills/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">项目配置 setup-matt-pocock-skills</a></li>\n<li><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/setup-matt-pocock-skills/issue-tracker-local.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">本地 Markdown tracker 模板</a></li>\n<li><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/prototype/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">原型 prototype</a></li>\n<li><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/research/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">研究 research</a></li>\n<li><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/domain-modeling/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">领域建模 domain-modeling</a></li>\n<li><a href=\"https://www.youtube.com/watch?v=F3lL98Pj90o\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">短片原始 YouTube 视频</a></li>\n<li><a href=\"https://www.youtube.com/watch?v=251hsWgoTPM\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">演示原始 YouTube 视频</a></li>\n</ul>\n<p><a id=\"sources-heading-4\"></a></p>\n<h3>不把视频、最新网页和个人建议混在一起</h3>\n<p>作者电脑上核对的源码来自 Matt 插件；与作者 main 分支相关核心说明逐节比较未发现本次涉及内容的语义差异，但没有完成整个插件的版本审计，也没有锁定远端 commit。上面的 main 链接会变化。</p>\n<p>演示中的 <a href=\"https://github.com/mattpocock/course-video-manager/issues/1265\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">TikTok Creator 地图</a> 在本次网页核查时已是15/15关闭；直播结束时的8/9是当时状态。后续补充的票与结论，不算在直播中已经演示完成的内容里。本文不把其中第三方 API 的价格、额度或审核细节作为今天可以照搬的配置指南。</p>\n<p>采用一张需要人参与的票串行推进、保留旧规格归档、与四阶段及主控的冻结衔接、Windows 设计助手示例，都是本手册针对小团队协作提出的适配建议，不伪称 Matt 的原案例或强制规定。</p>\n<p>本专题现已合并进本手册；没有修改全局准则或项目规则，也没有替任何项目安装、启用 Wayfinder。以后真正接入项目时，再按项目现状配置与验证。</p>\n\n</section>\n<nav class=\"book-end\" aria-label=\"前后章节\"><a href=\"#skills\" data-book-route=\"skills\"><span>上一册</span>← Skill 操作教程</a><a class=\"next\" href=\"#governance\" data-book-route=\"governance\"><span>下一册</span>工具治理 →</a></nav></article><aside class=\"toc\" aria-label=\"本页目录\"><p>这一页</p><a href=\"#wayfinder/start\" data-book-route=\"wayfinder/start\">用 Wayfinder，把复杂问题逐个想清楚</a><a href=\"#wayfinder/first\" data-book-route=\"wayfinder/first\">第一次用，先说明这轮要得到什么</a><a href=\"#wayfinder/ticket\" data-book-route=\"wayfinder/ticket\">每次会话，解决一个明确的问题</a><a href=\"#wayfinder/workflow\" data-book-route=\"wayfinder/workflow\">把 Wayfinder 接入现有开发流程</a><a href=\"#wayfinder/visualization\" data-book-route=\"wayfinder/visualization\">把决策记录，变成每轮一页的简报</a><a href=\"#wayfinder/example\" data-book-route=\"wayfinder/example\">以 Windows 设计助手为例，从想法走到可交接</a><a href=\"#wayfinder/faq\" data-book-route=\"wayfinder/faq\">这些地方最容易用重、用偏</a><a href=\"#wayfinder/sources\" data-book-route=\"wayfinder/sources\">来源、版本与阅读范围</a></aside></div></main></div><div class=\"notice-live\" role=\"status\" aria-live=\"polite\"></div><script>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}));}\nwindow.addEventListener('hashchange',openHash);openHash();\nconst sections=[...document.querySelectorAll('article>section')],tocLinks=[...document.querySelectorAll('.toc a')];\nif('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const id=visible[0].target.id;tocLinks.forEach(a=>a.classList.toggle('current',a.hash==='#'+id));},{rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>observer.observe(s));}\n})();\n<\/script><script>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n<\/script>\n</body></html>"},{"id":"governance","nav":"工具治理","html":"<!doctype html><html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"color-scheme\" content=\"light\"><meta name=\"description\" content=\"分清插件、技能与命令的作用，避免重复执行流程，不为同一个问题堆叠多套工具。\"><title>工具治理 · 建筑师的 AI 开发手册</title><style>@charset \"UTF-8\";\n:root{--bg:#f7f4ed;--pap e,table{break-inside:avoid}details:not([open]){display:block}footer{margin-top:25px}}\n</style><style>.layout{display:block;max-width:1240px}.page{padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}</style></head><body><a class=\"skip\" href=\"#governance/main\" data-book-route=\"governance/main\">跳到正文</a><div class=\"layout\"><main class=\"page\" id=\"main\"><header class=\"hero\"><p class=\"eyebrow\">案头工具 · 少而清楚</p><h1>以 Matt 流程为主，按需要使用辅助技能。</h1><p class=\"lead\">分清插件、技能与命令的作用，避免重复执行流程，不为同一个问题堆叠多套工具。</p></header><div class=\"reading-grid\"><article><section id=\"toolbox-map\">\n<h2>先分清插件、市场、Skill、MCP 和斜杠命令</h2>\n<p>“装了一个插件”和“AI 已经按它工作”不是一回事。把这些东西想成工地的工具箱、操作说明和设备接口，会更容易判断该保留什么、什么时候调用。</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>名称</th>\n<th>它负责什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>插件</td>\n<td>将多种能力打包提供的载体，可能同时包含 Skill、命令、连接器或钩子。</td>\n</tr>\n<tr>\n<td>市场</td>\n<td>发现和分发插件的渠道；市场在列表中，不等于其中每个插件都安装了。</td>\n</tr>\n<tr>\n<td>Skill</td>\n<td>告诉 AI 怎样完成某类工作的说明书；它不等于已经执行的动作。</td>\n</tr>\n<tr>\n<td>MCP</td>\n<td>让 AI 连接工具或资源的接口机制；有没有连接、权限是什么，要另外核对。</td>\n</tr>\n<tr>\n<td>斜杠命令</td>\n<td>一个调用入口，可能来自 Skill、插件或产品内置功能；不同产品不保证同名同义。</td>\n</tr>\n</tbody></table></div>\n<p>安装数量也不等于每次装入全部正文。系统通常先加载名称和简介，再按需读取正文与资料；但简介仍有成本。整理工具时，重点看职责是否重叠、入口能否调用、规则是否冲突，而不是只数文件夹。</p>\n\n</section>\n<section id=\"matt-mainline\">\n<h2>以 Matt 为主流程，部分技能需要明确调用</h2>\n<p>正式开发保留一条主链：盘问、规格、架构决策、拆票、施工、审查与人工验收。具体教学见<a href=\"#skills\" data-book-route=\"skills\">Skill 调用方法</a>和<a href=\"#engineering\" data-book-route=\"engineering\">施工准备</a>。不要因为某个辅助插件也会写计划，就再建立第二套规格和票据。</p>\n<p>Matt 插件发布清单有 25 项，其中 14 项同时标记 <code>disable-model-invocation: true</code> 与 <code>allow_implicit_invocation: false</code>。前者用于 Claude 侧限制模型自行调用，后者用于 OpenAI 侧限制隐式调用。它们保留人或批准流程明确发起的入口，不是“自动匹配坏了”。</p>\n<details><summary>14 项手动型，以及“存在”与“可用”的区别</summary>\n<p>ask-matt、grill-with-docs、triage、improve-codebase-architecture、setup-matt-pocock-skills、to-spec、to-tickets、wayfinder、implement、grill-me、handoff、teach、to-questionnaire、wait-what。</p>\n<p>目录里有 SKILL.md，只能证明文件存在；还需区分发布清单、产品是否发现、入口是否显示、显式调用是否实际加载。本次没有为验证入口而执行正式施工。不同客户端使用的命令入口不同，不应擅自删除手动属性来“修好自动触发”。</p>\n</details>\n<p class=\"source\"><a href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Matt 源码</a>；<a href=\"https://learn.chatgpt.com/docs/build-skills\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">OpenAI Skill 文档</a>；<a href=\"https://code.claude.com/docs/en/skills\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Claude Code Skill 文档</a>。</p>\n</section>\n<section id=\"professional-assistance\">\n<h2>Superpowers：按需使用，不另建一套开发流程</h2>\n<p>6.3.0 已区分探索、小范围与架构级工作，不能再概括成“每件事都要求重型流程”。但它仍包含完整规划和子代理施工体系；若与 Matt 全套并行运行，会出现两份计划、两种状态和重复审查。</p>\n<p>本手册建议按职责借用：完工前验证；必要时独立复核；真实 Git 项目需要时才隔离工作区。新电脑默认不装它：这三样各有替代，完工前验证按 01 第 3 节自行核对，独立复核是审查会话，worktree 隔离 Claude Code 自带。疑难问题优先 Matt diagnosing-bugs，Superpowers systematic-debugging 作备用，不为同一故障同时开两套调试流程。严格 TDD 的适用范围仍服从现行全局规则与已批准施工票。</p>\n<aside class=\"note\"><p>“轻重分流”是能力事实，“不另建一套票据”是我们的流程约定。测试通过不等于需求全部满足，更不等于你已人工验收；Skill 自带收尾动作也不能越过你的提交、推送和部署授权。</p></aside>\n<p class=\"source\"><a href=\"https://github.com/obra/superpowers/blob/main/RELEASE-NOTES.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Superpowers 版本记录</a>。</p>\n</section>\n<section id=\"keep-roles-clear\">\n<h2>明确各个辅助工具的主要用途</h2>\n<p>Karpathy guidelines 是社区根据 Andrej Karpathy 观点整理的项目，不是他本人发布的官方 Skill。作者全局准则里的“先想再写、简单优先、外科手术式修改、目标可验证”已覆盖四条核心内容。可保留作参考，但不必在每次请求重复贴同样规则。</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>视觉类能力</th>\n<th>本手册建议的角色</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>frontend-design</td>\n<td>视觉设计主工具；结合真实简报和浏览器画面判断成果。</td>\n</tr>\n<tr>\n<td>Emil</td>\n<td>针对交互、动效与组件细节做精修，不代替场景研究或页面架构。</td>\n</tr>\n<tr>\n<td>Design Taste</td>\n<td>按需用于 landing page、作品集等探索；其说明排除数据表、仪表盘和多步骤产品界面，不适合统管这类系统。</td>\n</tr>\n<tr>\n<td>web-design-guidelines</td>\n<td>检查界面规范与可访问性；是审查，不是生成视觉方向。</td>\n</tr>\n</tbody></table></div>\n<p>这些角色分配是面向作者实际开发的判断，不是通用排名。不要把多份审美规则同时堆满上下文；已经明确的配色等视觉要求优先。Wayfinder 是梳理决策依赖的可选工具，不是独立的代码导航插件，也不必加入每个小需求。</p>\n<details><summary>其余工具怎样安排，避免重复建立工作流程？</summary>\n<ul>\n<li><strong>planning-with-files：</strong>独立长研究可记录恢复进度；正式工程已有 Spec/票时不再维护同内容的第二份任务计划。建议保留，按任务边界使用。</li>\n<li><strong>webapp-testing：</strong>用于实际浏览器验证；与视觉主创不重复，建议保留。</li>\n<li><strong>mcp-builder：</strong>真要开发 MCP 服务时用，不是每个项目的必备前置。</li>\n<li><strong>bili-note：</strong>研究专用工具，用于取得公开视频材料；不参与普通施工。</li>\n<li><strong>文档、表格、演示、PDF 与图片工具：</strong>按输出格式选择，与 Matt 管理链不是同一职责，不因为同属 Skill 就视作重复。</li>\n</ul>\n<p>某台电脑目录里的 65 个 SKILL.md 只是文件盘点，不是全应用启用总数；Matt 开发中目录和产品内置能力不能混算。未经实际入口与任务验证，不承诺每项都能在每个客户端直接调用。</p>\n</details>\n<p class=\"source\"><a href=\"https://github.com/multica-ai/andrej-karpathy-skills\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Karpathy 社区整理来源</a>；<a href=\"https://www.tasteskill.dev/changelog\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Taste 维护记录</a>；<a href=\"https://www.aihero.dev/skills-wayfinder\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Matt 对 Wayfinder 的说明</a>。</p>\n</section>\n<section id=\"karpathy-role\">\n<h2>Karpathy 仍有参考价值，但不必每次重复相同规则</h2>\n<p><strong>建议保留四条原则作为常驻底线，现有 Skill 暂不删除，但不安排成独立阶段或每次必输的启动命令。</strong>Matt 提供可复用做法；Karpathy 提醒 AI 控制自己的行为，二者不是同类替代品。作者的全局准则已经覆盖核心四条，重复贴一遍通常没有新的流程信息。</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>阶段</th>\n<th>Karpathy 在这里怎么起作用</th>\n<th>你可以检查什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>场景研究</td>\n<td>先想清假设与取舍，不装作知道同事经历。</td>\n<td>哪些是事实，哪些需要查证？</td>\n</tr>\n<tr>\n<td>概念原型</td>\n<td>只做回答问题所需的原型，不顺手接生产服务。</td>\n<td>是否为一个页面造了整个平台？</td>\n</tr>\n<tr>\n<td>施工准备</td>\n<td>明确范围和验收，不为想象的扩展设计多层架构。</td>\n<td>这层复杂度解决当前问题吗？</td>\n</tr>\n<tr>\n<td>开发交付</td>\n<td>只改必要范围、保留无关改动、实际验证。</td>\n<td>有没有多做？运行了什么证明它正确？</td>\n</tr>\n</tbody></table></div>\n<p>当 AI 开始过度设计、顺手重构或泛泛宣称成功，可以明确要求使用 <code>karpathy-guidelines</code> 检查当前改动；平时已有全局底线就直接贯彻。如果运行环境明确要求加载该 Skill，仍遵守环境规则，不能承诺靠一句“别重复”绕过它。</p>\n<div class=\"prompt\"><pre>请按全局已约定的 Karpathy 四条底线检查本次工作：假设和取舍是否说清、有没有多做、是否只改必要范围、有哪些实际验证。\n给具体偏差，不重复朗读原则。若需要实际调用 karpathy-guidelines，报告加载情况；不把它变成新的规划阶段，也不修改插件或全局配置。</pre></div>\n<p>以后确认没有项目依赖这份重复插件，再单独决定备份或停用。它是社区根据 Karpathy 观察整理的版本，不是本人发布的官方工作流。</p>\n<p class=\"source\"><a href=\"https://github.com/multica-ai/andrej-karpathy-skills\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">对应社区源码</a>；作者全局准则中的四原则已核对。跨阶段分工为本手册建议。</p>\n</section>\n<section id=\"four-buckets\">\n<h2>哪些保留、哪些手动调用，哪些继续观察或备份</h2>\n<ul>\n<li><strong>保留：</strong>经常用、职责明确，并且在当前产品中有可靠调用方式。</li>\n<li><strong>手动：</strong>流程型、会显著影响工作顺序，或只有特定任务才需要的能力。</li>\n<li><strong>观察：</strong>来源或产品适配尚不充分，先用无真实数据的小例子了解效果。</li>\n<li><strong>可移备份：</strong>长期不用、重复或冲突明显，先记录安装来源与版本，提出迁移或卸载建议，等你确认。</li>\n</ul>\n<p>这是整理建议，不是后台清理授权。不要看到重叠就自动卸载，不要把缓存目录手改成另一版本，也不要声称设成“手动”就已修改了产品配置。目录版本、远端最近提交、已加载版本是三种不同事实。</p>\n<p><strong>作者的实际选择：</strong>保留 Matt、frontend-design、Emil、界面审查和浏览器验证；Superpowers 不作为默认主流程，只按需使用其中的专业能力；Taste 保留给宣传页，别统管数据库界面。最适合先观察是否移到备份的是重复的个人规划技能，以及全局四条已覆盖的 Karpathy 副本。但应先确认没有项目依赖它，不急着删，也不关闭安全验证能力。</p>\n<div class=\"prompt\"><pre>请只读检查这个插件：来源、安装版本、当前产品入口、手动或自动触发属性、与现有规则的重叠。\n分别列出已证实、未验证和你的建议。\n不要卸载、安装、改配置或修改缓存；需要改变时先说明影响和回退办法。</pre></div>\n\n</section>\n<section id=\"safe-updates\">\n<h2>更新前记录版本，并准备好恢复办法</h2>\n<p>下列是取得相应安装或配置授权后的步骤；只读评估并不自动授权更新。</p>\n<ol>\n<li>记录现用版本、来源、修改过的本地内容和当前入口；确定备份与恢复方式。</li>\n<li>阅读版本差异，特别检查默认输出目录、自动动作、权限和工作流程变化。</li>\n<li>在无生产写入的代表性小例子中试验；验证是否遵守范围、事实源和人工确认。</li>\n<li>通过后再决定采用；失败则用受支持方式回退，不暗改缓存伪造已安装状态。</li>\n</ol>\n<p>Claude Code 文档说官方市场默认自动更新，第三方和本地市场默认手动；更新到磁盘也未必等于当前会话已经重新加载。不能把这条直接套到 Codex 的市场导入、插件缓存或手工复制 Skill，更不能承诺今后会自动替你维护。</p>\n<p class=\"source\"><a href=\"https://code.claude.com/docs/en/discover-plugins\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Claude Code 插件发现与更新</a>。改变更新策略仍属于配置变更，应先得到你的确认。</p>\n</section>\n<section id=\"version-and-rules\">\n<h2>手册更新不会自动改变全局规则</h2>\n<p>截至 2026-09-05 核验，当时安装的 Matt 插件对应的修订与所查主线修订一致，仓库最近提交为 9 月 4 日；Superpowers 作者电脑上的版本与最新发布均为 6.3.0，主线最近提交为 8 月 12 日，但没有宣称所有文件逐字比对；Karpathy 作者电脑上的 1.0.0 对应所查修订，最近提交为 4 月 20 日。近期有提交只证明维护活动，不保证未来维护，也不证明每次启动都已同步远端。</p>\n<details><summary>版本核验记录：前端、研究与出图工具</summary>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>来源</th>\n<th>所查主线最近提交 UTC</th>\n<th>作者电脑比较范围</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><a href=\"https://github.com/anthropics/skills/commits/main/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Anthropic frontend-design</a></td>\n<td>2026-09-03</td>\n<td>Skill 正文归一化后相同，不代表整个插件逐文件相同。</td>\n</tr>\n<tr>\n<td><a href=\"https://github.com/emilkowalski/skills/commits/main/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Emil</a></td>\n<td>2026-08-21</td>\n<td>已装主技能正文相同；官网其他新技能未因此自动安装。</td>\n</tr>\n<tr>\n<td><a href=\"https://github.com/Leonxlnx/taste-skill/commits/main/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Taste</a></td>\n<td>2026-08-24</td>\n<td>作者电脑上的正文相同；仍需按界面类型判断适用性。</td>\n</tr>\n<tr>\n<td><a href=\"https://github.com/vercel-labs/web-interface-guidelines/commits/main/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Web Interface Guidelines</a></td>\n<td>2026-08-18</td>\n<td>作者电脑上的入口要求读取最新规则；不等于本次业务界面已经审查。</td>\n</tr>\n<tr>\n<td><a href=\"https://github.com/Rimagination/bili-note/commits/main/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">bili-note</a></td>\n<td>2026-06-25</td>\n<td>已安装并实测公开媒体获取路径，不是所有功能端到端验收。</td>\n</tr>\n<tr>\n<td><a href=\"https://github.com/tt-a1i/archify/commits/main/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Archify</a></td>\n<td>2026-09-23</td>\n<td>2026-09-27 用 <code>npx skills add</code> 装为全局技能，版本 2.17.0-dev.1（主线提交 9e35d2b）：真身 <code>~/.agents/skills/archify</code> 供 Codex，Claude Code 经目录链接读同一份；上游示例出图与前后对比实测通过，不代表每类图和导出都已验证。</td>\n</tr>\n</tbody></table></div>\n<p>这些仓库在核查时未归档；时间是当时主线提交，不是发布版本日期。手动复制的 Skill 不会仅因作者更新而保证同步。</p>\n</details>\n<p>本手册是基于已核验材料提出的教程和治理建议，并未同步修改全局 AGENTS。现行主控冻结、票专属新任务、施工与执行子代理模型、人工验收及权限规则仍有效。若建议与旧全局文字不同，应列差异交你确认，不能拿新页面当作静默放宽授权的依据。</p>\n<div class=\"prompt\"><pre>准备采用手册的新规则前，请列出它与当前 AGENTS 的逐项差异。\n说明改变了什么、影响哪些任务、怎样验证和回退。\n先等我确认，不自动同步全局文件，也不改变正在施工任务的约束。</pre></div>\n</section>\n<nav class=\"book-end\" aria-label=\"前后章节\"><a href=\"#wayfinder\" data-book-route=\"wayfinder\"><span>上一册</span>← Wayfinder 使用</a><a class=\"next\" href=\"#context\" data-book-route=\"context\"><span>下一册</span>上下文与日常技巧 →</a></nav></article><aside class=\"toc\" aria-label=\"本页目录\"><p>这一页</p><a href=\"#governance/toolbox-map\" data-book-route=\"governance/toolbox-map\">先分清插件、市场、Skill、MCP 和斜杠命令</a><a href=\"#governance/matt-mainline\" data-book-route=\"governance/matt-mainline\">以 Matt 为主流程，部分技能需要明确调用</a><a href=\"#governance/professional-assistance\" data-book-route=\"governance/professional-assistance\">Superpowers：按需使用，不另建一套开发流程</a><a href=\"#governance/keep-roles-clear\" data-book-route=\"governance/keep-roles-clear\">明确各个辅助工具的主要用途</a><a href=\"#governance/karpathy-role\" data-book-route=\"governance/karpathy-role\">Karpathy 仍有参考价值，但不必每次重复相同规则</a><a href=\"#governance/four-buckets\" data-book-route=\"governance/four-buckets\">哪些保留、哪些手动调用，哪些继续观察或备份</a><a href=\"#governance/safe-updates\" data-book-route=\"governance/safe-updates\">更新前记录版本，并准备好恢复办法</a><a href=\"#governance/version-and-rules\" data-book-route=\"governance/version-and-rules\">手册更新不会自动改变全局规则</a></aside></div></main></div><div class=\"notice-live\" role=\"status\" aria-live=\"polite\"></div><script>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('inpu );if(!visible.length)return;const id=visible[0].target.id;tocLinks.forEach(a=>a.classList.toggle('current',a.hash==='#'+id));},{rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>observer.observe(s));}\n})();\n<\/script><script>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n<\/script></body></html>"},{"id":"context","nav":"上下文与日常技巧","html":"<!doctype html><html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"color-scheme\" content=\"light\"><meta name=\"description\" content=\"上下文容量大，不代表 AI 始终记得准确。学会判断何时继续对话、压缩上下文或新建任务。\"><title>上下文与日常技巧 · 建筑师的 AI 开发手册</title><style>@charset \"UTF-8\";\n:root{--bg:#f7f4ed;--paper:#fffdfa;--ink:#2d2823;--muted:#70665c;--accent:#a44c34;--line:#ddd5c9;--sage:#4d6655;--soft:#eee8de;--focus:#85331e}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:32px}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.85 \"Segoe UI\",\"Microsoft YaHei\",\"PingFang SC\",sans-serif}\na{color:var(--accent);text-decoration-thickness:1px;text-underl eight:40px;max-width:100%}.term-filter select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}\n.term-card{margin:0;border-top:0;border-bottom:1px solid var(--line);padding:20px 0;scroll-margin-top:20px}.term-card summary{display:grid;grid-template-columns:minmax(0,1fr) 24px;gap:7px 14px;list-style:none}.term-card summary::-webkit-details-marker{display:none}.term-card summary::after{content:'＋';grid-column:2;grid-row:1/3;align-self:center;color:var(--accent);font-weight:400;font-size:22px}.term-card[open] summary::after{content:'－'}.term-name{font-size:17px;overflow-wrap:anywhere}.term-plain{font-size:14px;font-weight:400;color:var(--muted)}.term-body{padding:6px 22px 6px;border-left:2px solid #c8aa91;margin-top:18px}.term-analogy{color:#79543b;font-size:14px}.term-card dl{margin:20px 0}.term-card dt{font-size:12px;color:var(--accent);margin:18px 0 4px}.term-card dd{margin:0;font-size:15px;overflow-wrap:anywhere}.term-card dd p{margin:0 0 9px}.term-check{padding:15px 18px;background:#eee7db}.term-pitfall{font-size:13px!important;color:var(--muted)}.term-walk li{margin:18px 0}.term-walk strong{color:#79543b}\n@media(max-width:760px){.term-body{padding-left:15px;padding-right:0}.term-name{font-size:16px}.term-plain{font-size:13px}.term-filter label{flex-basis:100%}}\n@media print{body{font-size:11pt;background:#fff}.layout{display:block}.sidebar,.toc,.topline,.copy-btn,.book-end,.notice-live{display:none}.page{padding:0}.reading-grid{display:block}.hero{padding:10px 0 20px}h1{font-size:26pt}h2{font-size:18pt}article>section{break-inside:auto}a{color:#222}.prompt,.example,table{break-inside:avoid}details:not([open]){display:block}footer{margin-top:25px}}\n</style><style>.layout{display:block;max-width:1240px}.page{padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}</style></head><body><a class=\"skip\" href=\"#context/main\" data-book-route=\"context/main\">跳到正文</a><div class=\"layout\"><main class=\"page\" id=\"main\"><header class=\"hero\"><p class=\"eyebrow\">案头工具 · 工作习惯</p><h1>保存重要信息，让长任务能够顺利接续。</h1><p class=\"lead\">上下文容量大，不代表 AI 始终记得准确。学会判断何时继续对话、压缩上下文或新建任务。</p></header><div class=\"reading-grid\"><article><section id=\"three-limits\">\n<h2>先分清模型上限、当前配置和实际可靠范围</h2>\n<p>上下文像 AI 眼前的工作台：当前要求、历史对话、工具结果、读入的文件，都可能占位置。模型公布的最大容量，是工作台的设计上限；客户端配置，是这次实际给它划出的面积；可靠工作区，则是面对当前任务还能稳定找对资料、守住约束的范围。三者不能画等号。</p>\n<p>容量以 token 计，不等于汉字数。窗口也不是只装聊天记录：输入、输出及部分模型的推理预算都要按产品规则计算。“还能放进去”不代表“每条早期细节都能准确利用”，但变长也不意味着必然突然失效。实际任务难度、材料相关性和验收难度，都比孤立的数字更重要。</p>\n<aside class=\"note\"><p>本页数字以 2026 年 9 月 5 日核验为边界；作者电脑上的观察、官方产品说明与讲师经验分别标明，不拿其中一种替代另外两种。</p></aside>\n</section>\n<section id=\"numbers-with-labels\">\n<h2>看上下文容量时，先确认模型和使用入口</h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>对象</th>\n<th>2026-09-05 核验及正确理解</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>作者 Codex 电脑上的 Astra 目录</td>\n<td>272000 × 95% = 258400，可解释界面约 258K；目录另列自动压缩值 244800。不是所有模型恒定值，也不是实际请求上限的实测。</td>\n</tr>\n<tr>\n<td>K3 两条入口</td>\n<td>订阅入口目录为 262144；API 入口为 307200。不是同一个配置，不能因名称相似就改成一样。</td>\n</tr>\n<tr>\n<td>公开产品窗口</td>\n<td>Astra API 公布 1050000；Claude 的 1M 要连同具体模型、产品入口和可用条件阅读。不能据此断言本机任务已经获得同样窗口。</td>\n</tr>\n</tbody></table></div>\n<details><summary>Matt 说过 80K、100K、120K，应该信哪个？</summary>\n<p>它们不是统一标准。早期 200K 窗口的 40% 是 80K，讲师将其作为个人谨慎界线；后插修订谈到 1M 时，他估计可靠区约 100K，并非把旧比例机械放大到 400K。答疑遇到 120K 问题时，他明确说是渐变，剩余工作简单且可人工审查时也可能继续到更长。这些是不同场景的经验，不是公认的、达到 150–200K 就突然失效的界线。</p>\n<p>长上下文研究支持“模型、任务、信息位置都会影响表现”，不支持给所有开发任务规定同一个失效数字。我的建议是：结合遗漏约束、重复失败、答非所问等实际表现，在自然阶段边界整理，而不是只盯百分比。</p>\n</details>\n<p class=\"source\">依据：课程 P02、答疑 P08；<a href=\"https://arxiv.org/abs/2404.06654\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">RULER</a>、<a href=\"https://arxiv.org/abs/2307.03172\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Lost in the Middle</a>；<a href=\"https://developers.openai.com/api/docs/models/gpt-6-astra\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Astra API</a>。</p>\n</section>\n<section id=\"choose-session\">\n<h2>继续、压缩，还是换任务？</h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>现在的情况</th>\n<th>怎么处理</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>仍在解决同一件事，资料相关、表现正常</td>\n<td>继续；不要为“清爽”丢掉刚建立的理解。</td>\n</tr>\n<tr>\n<td>历史很长，下一小段仍依赖当前工作</td>\n<td>有条件时先在自身权限内保存重要信息，优先在自然阶段边界压缩；自动压缩后仍以文件和实际环境复核。</td>\n</tr>\n<tr>\n<td>批准的正式施工票开始实施</td>\n<td>按现行全局规则开票专属新任务；普通压缩不能替代它。</td>\n</tr>\n<tr>\n<td>跨工具、跨项目或交给别人</td>\n<td>先提供对方能访问的既有票和事实文件，核对目录、版本与权限；材料不足以接手时才补独立 handoff，不因换工具或分叉重复建档。handoff 的文件默认在系统临时目录，要进仓库需另存。</td>\n</tr>\n<tr>\n<td>同项目另探一条独立路线</td>\n<td>可新建一个范围明确的任务，或确需继承历史时分叉；核对继承内容、工作目录和当前状态归谁维护。</td>\n</tr>\n</tbody></table></div>\n<p>handoff 是交接文档，不是执行了模型压缩；分叉也不保证是空白上下文。父任务给子任务交代具体问题、必要文件、允许范围和验收方法，子任务返回结论与证据即可。内部子代理不能替代施工票会话，会话分工见<a href=\"#delivery/ticket-workspace\" data-book-route=\"delivery/ticket-workspace\">开发交付</a>。</p>\n<details><summary>正在排查复杂故障，系统却必须压缩怎么办？</summary>\n<p>优先在自然边界整理，不等于为禁止中途压缩而硬撑到溢出。确实需要继续同一故障时，有条件就由获授权任务保存复现条件、已排除假设、失败尝试和下一次验证；超出写入范围的内容交还待记录摘要。自动压缩可能发生在阶段中途，恢复后仍核对文件和实际环境。这里按 02 通用开发规程第 6 节适配；旧“不要在阶段中途压缩”不作为绝对禁令。</p>\n</details>\n</section>\n<section id=\"claude-code-context\">\n<h2>会话的寿命：一个会话一件事，做完就换</h2>\n<p>不管用 Codex 还是 Claude Code，会话都是一次性的，文件才是记忆。一个会话做完它那件事，成果进了文件，交回被主控收下，窗口就可以关掉。以后再做同类的事，从文件出发，新开窗口贴开工包。建图会话出完这一轮的图、施工票会话交完验收单、审查会话交完问题清单，都是这样。</p>\n<p>关掉前只看两条：它的交回主控收到了没有；它产生的东西是否都在文件里，没有只存在聊天里的结论。</p>\n<p><strong>主控也换，因为主控是角色不是窗口。</strong>它的记忆设计在施工日志、根路由和开工包里；新主控读项目 AGENTS、施工日志、当前票三样就能接着派工，和项目大小无关。四个时点换：一个功能收尾、决策现场切换、它开始漏约束或重复问已定的事、用量过半且下一块很大；不在一张票做到一半时换。换的动作：先让旧主控把窗口里说过但没进文件的偏好、否决过的方案和约定写进对应位置，再更新日志、写交接摘要、做一轮清理；你新开窗口贴主控开工包。交接摘要正常只有几行，很长说明它没按关口落盘。</p>\n<p><strong>随口说的话有落点。</strong>你表达偏好、否决一个方案、第二次回答同一个问题，主控当场写进项目 AGENTS 的“偏好与不再问的事”。新主控本来就读 AGENTS。被问第三次就是规则没执行，修规则，不回旧窗口找。</p>\n<p><strong>记录有上限，超了就整理。</strong>施工日志正文两千字，偏好节两部分各二十行，根路由一个专题一行，交接摘要十行；主控每次更新日志或根 AGENTS 后先量一遍再提交，量法见 02 第 6 节；被替代的规格和票进历史目录，决策卡和 ADR 留在原位改状态。换主控前和功能收尾时各清一次，仓库的活动区永远只有现行的东西，历史都在历史目录里或原位的状态里。</p>\n<p>在一个会话的寿命内，你能做的就是三件事：</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>情况</th>\n<th>动作</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>同一件事还在做，表现正常</td>\n<td>继续</td>\n</tr>\n<tr>\n<td>同一件事做到一半，窗口很满或开始漏约束</td>\n<td>压缩。先让它把该落盘的写进日志或票，再用工具的压缩命令，说清要保留什么</td>\n</tr>\n<tr>\n<td>一件事做完</td>\n<td>新开会话</td>\n</tr>\n</tbody></table></div>\n<p>自动压缩会在窗口接近上限时自己发生，可能在一步中间，而且你不知道它丢了什么；所以重要事实随时落盘，压缩后先读日志和票核对约束。换窗是你控制的交接，交的是文件，能检查，比等自动压缩稳。查资料、读大文件让 AI 用内部子代理去做，主窗口只收结论。</p>\n<p>Matt 说的 80K、100K、120K 是他的个人经验，见上一节；两个工具的窗口大小、压缩命令和用量显示以当前版本为准。判断方法一样：一个会话一件事，关口过了就换。</p>\n\n</section>\n<section id=\"what-compaction-does\">\n<h2>压缩可能丢失细节，不能代替文件记录</h2>\n<p>公开 Responses 文档描述的是不透明、加密的压缩项，不能简单说成“AI 写了一段人能读的摘要”；独立压缩结果也可能保留其他消息。Claude Code 文档则说明接近窗口时先清理较旧工具输出，再总结对话，并提醒早期细节可能丢失。</p>\n<p>这是两个公开机制的区别，不代表已经核实作者电脑上每条模型调用路径。OpenCodex 的公开描述也分原生透传与第三方摘要路径；仅看到作者电脑的配置用了 Responses，不能证明每次内部行为。压缩后要验证约束有没有留下，不能承诺无损，也不能用压缩解决已经超过端点输入限制的所有情况。</p>\n<p>Claude Code 官方给了一张“压缩后什么还在”的表：项目根 CLAUDE.md、自动记忆、计划模式的计划从磁盘重新注入；读过或改过的文件最多重读五个；子目录 CLAUDE.md、路径限定的规则和只存在于对话里的内容被总结掉。所以关键约束放项目根规则和施工日志，压缩后先读日志和当前票。</p>\n<p class=\"source\"><a href=\"https://developers.openai.com/api/docs/guides/compaction\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">OpenAI 压缩文档</a>；<a href=\"https://code.claude.com/docs/en/how-claude-code-works\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Claude Code 工作机制</a>；<a href=\"https://code.claude.com/docs/en/context-window\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Claude Code 上下文窗口</a>，2026-09-16 核对；<a href=\"https://opencodex.me/getting-started/how-it-works/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">OpenCodex 公开说明</a>。</p>\n</section>\n<section id=\"written-memory\">\n<h2>把会影响下一步的事实留在文件里</h2>\n<p>文档散落、版本难辨，不能只靠压缩前写摘要解决。新增的<a href=\"#knowledge/knowledge-start\" data-book-route=\"knowledge/knowledge-start\">项目知识库与上下文维护</a>专门讲归档位置、资料来源、更新责任和新任务接手；本页继续解释客户端压缩与日常判断。</p>\n<p>唯一事实源不是把一切塞进一个巨型文档。CONTEXT.md 解释领域术语，ADR 解释重要取舍，Spec 保存批准范围，施工票保存真实进度、验证结果和未解决问题。当前状态只维护一处，其他文档引用它；不要另建一份内容相同、很快过期的交接档案。</p>\n<div class=\"prompt\"><pre>准备压缩或交接。有条件时先在自身权限内更新现有事实文件，不新增平行计划。\n若当前是主控，只更新施工日志和根路由，不写产品内容；不施工、不操作 Git。\n超出自己写权的更新交还待记录摘要，由对应写手维护；其他会话只更新自身允许范围。\n请核对：目标与不做范围、已批准决策、实际改动、已运行验证、失败尝试及原因、下一步与权限边界。\n继续后先读这些文件，复述当前状态并指出未知项。\n未运行的测试不能写成通过；工具报完成不能写成人工验收。</pre></div>\n<p>摘要后尤其检查：有没有忘记“不要做什么”、是否把尝试当成功、是否又准备重复已失败的方法。文件路径只有被下一位实际读取才有用，写进交接并不等于已经读过。</p>\n<p class=\"source\"><a href=\"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Anthropic 上下文工程</a>支持精选信息、外部笔记与分工，不承诺任意压缩都能保留全部细节。</p>\n</section>\n<section id=\"different-errors\">\n<h2>报错时，先判断原因，不要一概归咎于上下文</h2>\n<ul>\n<li><strong>502 或服务错误：</strong>先记录服务、时间与请求阶段，区分临时上游故障；不是安装 Superpowers 的理由。</li>\n<li><strong>证书错误：</strong>检查证书链、时间、代理或信任配置；不能用关闭证书验证来掩盖。</li>\n<li><strong>明确的上下文超限：</strong>检查实际模型入口、输入与压缩机制，再减少无关输入或按规则交接。</li>\n<li><strong>本机 sandbox／权限／DLL 错误：</strong>检查解释器、依赖和授权范围；不靠反复改提示词解决，也不绕过权限。</li>\n</ul>\n<aside class=\"warning\"><p>“第三次盲试前停下”是本手册的止损建议，不是某个软件的定律：同类错误没有新证据时，停止换参数碰运气，先保留错误信息并查明哪个环节出了问题。修改配置或申请更大权限，仍要遵守授权规则。</p></aside>\n</section>\n<section id=\"windows-habits\">\n<h2>Windows 上，让命令可复现</h2>\n<p>固定使用已经核验的解释器绝对路径，不混用系统 Python、项目虚拟环境与工具自带 Python。复杂命令先写成任务范围内的脚本文件，再传清楚的参数，避免在 PowerShell、Python、Bash 之间套多层引号。</p>\n<div class=\"example\"><p>例如排查 Python 中文输出，可要求 AI：“报告解释器路径、文件编码和错误位置；如证据指向 Python 输出编码，再评估 <code>-X utf8</code>。不要先重装整个环境。”这是诊断说法，不是让你现在执行安装或改配置。</p></div>\n<p>PowerShell 7 的默认文件编码更一致，却不保证 Python 输出编码正确，也不把 Bash 脚本变成 PowerShell 脚本。它们是不同层的问题。本页提供操作建议，不表示全局 AGENTS 已更新；正式任务仍受现行规则约束。</p>\n<p class=\"source\"><a href=\"https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_character_encoding?view=powershell-7.6\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">PowerShell 编码</a>；<a href=\"https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_parsing?view=powershell-7.6\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">参数与引号解析</a>。</p>\n</section>\n<nav class=\"book-end\" aria-label=\"前后章节\"><a href=\"#governance\" data-book-route=\"governance\"><span>上一册</span>← 工具治理</a><a class=\"next\" href=\"#glossary\" data-book-route=\"glossary\"><span>下一册</span>行话使用指南 →</a></nav></article><aside class=\"toc\" aria-label=\"本页目录\"><p>这一页</p><a href=\"#context/three-limits\" data-book-route=\"context/three-limits\">先分清模型上限、当前配置和实际可靠范围</a><a href=\"#context/numbers-with-labels\" data-book-route=\"context/numbers-with-labels\">看上下文容量时，先确认模型和使用入口</a><a href=\"#context/choose-session\" data-book-route=\"context/choose-session\">继续、压缩，还是换任务？</a><a href=\"#context/claude-code-context\" data-book-route=\"context/claude-code-context\">会话的寿命：一个会话一件事，做完就换</a><a href=\"#context/what-compaction-does\" data-book-route=\"context/what-compaction-does\">压缩可能丢失细节，不能代替文件记录</a><a href=\"#context/written-memory\" data-book-route=\"context/written-memory\">把会影响下一步的事实留在文件里</a><a href=\"#context/different-errors\" data-book-route=\"context/different-errors\">报错时，先判断原因，不要一概归咎于上下文</a><a href=\"#context/windows-habits\" data-book-route=\"context/windows-habits\">Windows 上，让命令可复现</a></aside></div></main></div><div class=\"notice-live\" role=\"status\" aria-live=\"polite\"></div><script>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}));}\nwindow.addEventListener('hashchange',openHash);openHash();\nconst sections=[...document.querySelectorAll('article>section')],tocLinks=[...document.querySelectorAll('.toc a')];\nif('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const id=visible[0].target.id;tocLinks.forEach(a=>a.classList.toggle('current',a.hash==='#'+id));},{rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>observer.observe(s));}\n})();\n<\/script><script>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n<\/script>\n</body></html>"},{"id":"glossary","nav":"行话使用指南","html":"<!doctype html><html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"color-scheme\" content=\"light\"><meta name=\"description\" content=\"从建筑师熟悉的事物理解软件开发：这个词是什么意思，什么时候出现，谁来做、用哪个 Skill，以及你要检查什么。\"><title>行话使用指南 · 建筑师的 AI 开发手册</title><style>@charset \"UTF-8\";\n:root{--bg:#f7f4ed;--paper:#fffdfa;--ink:#2d2823;--muted:#70665c;--accent:#a44c34;--line:#ddd5c9;--sage:#4d6655;--soft:#eee8de;--focus:#85331e}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:32px}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.85 \"Segoe UI\",\"Microsoft YaHei\",\"PingFang SC\",sans-serif}\na{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:4px}a:hover{color:#783221}button,input{font:inherit}button{cursor:pointer}a,button,input,summary{-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:3px}\n.skip{position:fixed;left:20px;top:-100px;z-index:9;backg
