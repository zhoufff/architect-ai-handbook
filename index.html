m-card dd p{margin:0 0 9px}.term-check{padding:15px 18px;background:#eee7db}.term-pitfall{font-size:13px!important;color:var(--muted)}.term-walk li{margin:18px 0}.term-walk strong{color:#79543b}\n@media(max-width:760px){.term-body{padding-left:15px;padding-right:0}.term-name{font-size:16px}.term-plain{font-size:13px}.term-filter label{flex-basis:100%}}\n@media print{body{font-size:11pt;background:#fff}.layout{display:block}.sidebar,.toc,.topline,.copy-btn,.book-end,.notice-live{display:none}.page{padding:0}.reading-grid{display:block}.hero{padding:10px 0 20px}h1{font-size:26pt}h2{font-size:18pt}article>section{break-inside:auto}a{color:#222}.prompt,.example,table{break-inside:avoid}details:not([open]){display:block}footer{margin-top:25px}}\n\u003c/style>\u003cstyle>.layout{display:block;max-width:1240px}.page{padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}\u003c/style>\u003c/head>\u003cbody>\u003ca class=\"skip\" href=\"#team/main\" data-book-route=\"team/main\">跳到正文\u003c/a>\u003cdiv class=\"layout\">\u003cmain class=\"page\" id=\"main\">\u003cheader class=\"hero\">\u003cp class=\"eyebrow\">案头工具 · 从一个人到几个人\u003c/p>\u003ch1>分工开发后，如何检查并合并彼此的成果。\u003c/h1>\u003cp class=\"lead\">你不必先学会写代码，才能与同事合作。先把分工、版本和验收交接清楚，再让每个人的 AI 在同一套约定下工作。\u003c/p>\u003c/header>\u003cdiv class=\"reading-grid\">\u003carticle>\u003csection id=\"team-start\">\n\u003ch2>先和一位同事试着合作，再考虑多人同时开发\u003c/h2>\n\u003cp>本册先按 \u003cstrong>2–4 人小团队、各自用 AI、主要交付 Windows 程序\u003c/strong>设计。这是起步建议，不是对你们现有人数、技术水平或仓库状态的判断。协作不是把几份“最终版”拼起来，而是约定谁做什么、依据哪个版本、怎样交验。\u003c/p>\n\u003cdiv class=\"route-picker\">\n\u003ca href=\"#team/first-pilot\" data-book-route=\"team/first-pilot\">\u003cspan>刚开始协作 · 推荐\u003c/span>\u003cstrong>先做一次小交接\u003c/strong>\u003csmall>你做主控，同事提供场景、试用，再接一张低风险票。\u003c/small>\u003c/a>\n\u003ca href=\"#team/team-flow\" data-book-route=\"team/team-flow\">\u003cspan>两个人都要开发\u003c/span>\u003cstrong>一人一票，各自施工\u003c/strong>\u003csmall>各自目录与任务，通过可审查的改动合并，不互传整包覆盖。\u003c/small>\u003c/a>\n\u003c/div>\n\u003cp>\u003cstrong>最小组合：\u003c/strong>一个公司允许使用的私有代码仓库、一处票据记录、每人自己的账号和工作目录、一名合并负责人。聊天群负责提醒，仓库与票据负责留事实；不急着添一套项目管理软件。\u003c/p>\n\u003caside class=\"note\">\u003cp>团队协作贯穿四阶段，\u003cstrong>不是新增第五阶段\u003c/strong>。先共同确认场景与原型，施工准备时分清责任，开发交付时按票交接。本册没有创建仓库、邀请人员或修改权限。\u003c/p>\u003cp>本册建议初次协作先按“主控调度、票专属任务、一次只开当前可施工票”串行试点。多人并行、推送权限和发布方式由团队另行确认，不因读过教程就自动生效。\u003c/p>\u003c/aside>\n\u003cdiv class=\"quick-links\">\u003ca href=\"#team/team-roles\" data-book-route=\"team/team-roles\">谁负责什么\u003c/a>\u003ca href=\"#team/team-shared\" data-book-route=\"team/team-shared\">哪些要共享\u003c/a>\u003ca href=\"#team/team-onboarding\" data-book-route=\"team/team-onboarding\">同事如何入场\u003c/a>\u003ca href=\"#team/team-feedback\" data-book-route=\"team/team-feedback\">主控如何了解另一台电脑上的结果\u003c/a>\u003ca href=\"#team/team-skills\" data-book-route=\"team/team-skills\">对应哪些 Skill\u003c/a>\u003ca href=\"#team/team-prompts\" data-book-route=\"team/team-prompts\">直接可用的说法\u003c/a>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"team-roles\">\n\u003ch2>四种职责，可以由两个人兼任\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>职责\u003c/th>\u003cth>做什么\u003c/th>\u003cth>不能混淆什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>产品负责人 · 初期建议你担任\u003c/td>\u003ctd>决定范围、设计方向和验收标准；处理分歧\u003c/td>\u003ctd>不必读懂每行代码，但要能判断演示是否满足工作需要\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>票负责人 · 你或同事\u003c/td>\u003ctd>带自己的 AI 完成一张票，交出改动、演示和证据\u003c/td>\u003ctd>不能只转发 AI 的“已完成”，也不私自扩张需求\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>复核人 · 另一位同事借助自己的 AI\u003c/td>\u003ctd>对照票与具体版本独立核查，再试用关键路径\u003c/td>\u003ctd>作者自查不等于独立复核；两份 AI 结论也不是人工批准\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>合并与发布负责人 · 初期建议你担任\u003c/td>\u003ctd>控制版本合入与发布顺序，确认回退和整体结果\u003c/td>\u003ctd>合并代码和部署是两次不同授权；不是人人都有管理员权\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>保留一个项目主控，但不用把同事都变成“子代理”。\u003c/strong>同事是独立的负责人，他的 AI 是他的执行助手。你的主控任务负责统一决定与接收摘要；读取差异、运行测试和合并等工作，交给专属复核或整合任务，不把主控重新变成施工现场。\u003c/p>\n\u003cp class=\"source\">参考：\u003ca href=\"https://docs.github.com/en/get-started/learning-about-github/types-of-github-accounts\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">GitHub 账号类型\u003c/a> · \u003ca href=\"https://docs.github.com/en/organizations/managing-user-access-to-your-organizations-repositories/managing-repository-roles/repository-roles-for-an-organization\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">仓库角色\u003c/a>\u003c/p>\n\u003c/section>\n\n\u003csection id=\"team-shared\">\n\u003ch2>共享项目约定，不共享同一个施工文件夹\u003c/h2>\n\u003cdiv class=\"example\">\u003ch3>像一个共享图纸档案库，配两张独立工作台\u003c/h3>\n\u003col class=\"team-chain\">\u003cli>\u003cstrong>共享仓库\u003c/strong>\u003cspan>保存已授权共享的代码、规格与票据版本。\u003c/span>\u003c/li>\u003cli>\u003cstrong>你 / 同事各自的 clone\u003c/strong>\u003cspan>clone 就是从仓库取得自己的本地副本；每台电脑各一份，不直接共改共享盘目录。\u003c/span>\u003c/li>\u003cli>\u003cstrong>一票一条短分支\u003c/strong>\u003cspan>先分开记录本票改动，复核后再合回共同主线。\u003c/span>\u003c/li>\u003cli>\u003cstrong>PR · 合并申请\u003c/strong>\u003cspan>把差异、票据和验证依据交给复核者；它不是另一份 Spec。\u003c/span>\u003c/li>\u003c/ol>\u003c/div>\n\u003cp>同一人确实需要多个并行工作目录，才考虑 \u003ca href=\"#glossary/term-worktree\" data-book-route=\"glossary/term-worktree\">worktree\u003c/a>。\u003cstrong>新任务隔离聊天，独立目录隔离文件；两者都不自动隔离数据库、账号或电脑权限。\u003c/strong>不要让两个人的 AI 在网络共享盘或同步盘里的同一个活动工作目录上写代码。\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>应该如何处理\u003c/th>\u003cth>内容\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>经批准随代码共享\u003c/td>\u003ctd>Spec、票据、CONTEXT.md、必要 ADR、原型基线、依赖版本锁文件、验证脚本、无秘密的环境配置示例、模拟数据\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>只保留一处当前记录\u003c/td>\u003ctd>负责人、票状态、阻塞、验收与版本。已用本地票就共享那一份；已用平台票就以平台为准，不要在群聊里另维护一张进度表\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>不复制个人全套环境\u003c/td>\u003ctd>AI 登录记录、个人全局配置、插件缓存、绝对路径、临时文件与整段聊天；分享必要规则、技能来源和核对过的版本即可\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>不随代码仓库上传\u003c/td>\u003ctd>真实 .env、密码、Token、私钥、真实客户图纸、生产/个人数据库、未脱敏录屏；私有仓库也不等于允许放这些资料\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>团队票使用仓库内相对路径或固定版本链接，例如 \u003ccode>.scratch/资料检索/issues/02-筛选.md\u003c/code>，不要只提供你电脑才能访问的绝对路径。每人的开工包再填入\u003cstrong>自己实际的\u003c/strong>本地目录。\u003c/p>\n\u003cp class=\"source\">参考：\u003ca href=\"https://git-scm.com/docs/git-clone\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Git clone\u003c/a> · \u003ca href=\"https://git-scm.com/docs/git-worktree\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">worktree\u003c/a>\u003c/p>\n\u003c/section>\n\n\u003csection id=\"team-onboarding\">\n\u003ch2>同事第一次加入，完成这六件事\u003c/h2>\n\u003cp>选择公司批准的平台：已用 GitHub / GitLab 就沿用；没有时先讨论公司组织名下的私有仓库。若公司要求资料不出内网，再选合规的内部平台。本册不替你决定上传许可，也不自动搭建服务器。\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>确认“谁能看到什么”。\u003c/strong>每人自己的账号，按职责授予权限；只试用的同事不必先拥有代码写权限。不要共享登录密码、个人 AI 会话或生产管理员账号。\u003c/li>\n\u003cli>\u003cstrong>拿到准确入口。\u003c/strong>仓库地址、默认分支、当前票据位置、合并负责人、可使用的测试数据；主分支叫什么以实际仓库为准，\u003ccode>main\u003c/code> 只是下文示例。\u003c/li>\n\u003cli>\u003cstrong>建立自己的副本。\u003c/strong>让 AI 先只读检查目录、已有文件和磁盘位置，确认后再 clone；不可覆盖旧项目或把同事已有改动清掉。\u003c/li>\n\u003cli>\u003cstrong>先复现基线，再接需求。\u003c/strong>使用项目记载的工具版本、依赖锁文件与启动方法；用模拟数据跑通同一条检查。缺依赖先列清单，不能因为“入场”就自行重装系统环境。\u003c/li>\n\u003cli>\u003cstrong>读统一规则，核对必要 Skill。\u003c/strong>共享项目级规则和这张票用到的技能来源/版本；不用安装你所有插件。换 AI 工具时仍遵守同一份需求、验收和权限约定。\u003c/li>\n\u003cli>\u003cstrong>给一份能追溯的入场结果。\u003c/strong>记录取得的提交编号、目标电脑环境、启动/验证结果和缺口；确认能复现基线，才开始本票。\u003c/li>\n\u003c/ol>\n\u003cdetails>\u003csummary>我的 Codex / Claude 配置，要整份复制给同事吗？\u003c/summary>\u003cp>不需要。团队共享的是做事规则与必要能力，不是你的个人账号。Codex 的项目级 \u003ccode>AGENTS.md\u003c/code> 和适用的仓库技能可以随版本管理；个人全局配置、插件登录和安装状态不会因此自动同步。其他客户端按其实际项目规则入口接入，先核实加载结果，不假定所有工具读法相同。\u003c/p>\u003cp>已有统一规则就引用它，不在两个文件各维护一套不同流程。技能升级先由一个人用小任务验证，再批准团队采用；暂时不要各自在施工中升级成不同版本。分发第三方 Skill 时还需遵守其许可。\u003c/p>\u003cp class=\"source\">参考：\u003ca href=\"https://learn.chatgpt.com/zh-Hans/docs/customization/overview\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">OpenAI 官方：项目规则与仓库技能\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Windows 上最容易不一致的地方\u003c/summary>\u003cp>把语言/运行时版本、包管理器、实际 Shell、编码、项目启动与测试入口写在已有开发说明里；让 AI 调用项目脚本，少在聊天里重新拼复杂命令。相对路径用于共享材料，真实当前环境路径用于执行。\u003c/p>\u003cp>\u003ccode>.gitattributes\u003c/code> 可以按文件类型约定行尾，不能顺便解决所有字符编码问题。首次规范化可能改变大量文件，要单独审查与批准，不能夹在功能票里“一键全库格式化”。\u003c/p>\u003cp class=\"source\">参考：\u003ca href=\"https://git-scm.com/docs/gitattributes\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Git 官方：行尾与文件属性\u003c/a>\u003c/p>\u003c/details>\n\u003c/section>\n\n\u003csection id=\"team-flow\">\n\u003ch2>同事完成一张票后，怎样合入项目\u003c/h2>\n\u003cp>以下流程以短分支和 PR 为基础，增加了本手册建议的人工确认步骤；采用前应与团队现有规则核对。初期可以只流转一张票，同事参与复核也属于协作，不必一开始就同时施工。\u003c/p>\n\u003col class=\"team-workflow\">\n\u003cli>\u003cstrong>你批准票与负责人，主控负责调度。\u003c/strong>引用 Spec、原型与验收，说明依赖、共享接口和禁止改动范围。不要两个人同时认领同一张票。\u003c/li>\n\u003cli>\u003cstrong>票负责人开专属任务。\u003c/strong>核对自己 clone 的实际目录、基线、分支和未存档改动。基线就是双方认可的起始版本，用提交编号标识；AI 从这里开始，只完成这一票。\u003c/li>\n\u003cli>\u003cstrong>先自检、审查，再演示。\u003c/strong>按票风险运行检查，核对需求和项目标准。截图只证明对应界面，不能代替真实行为测试；把未验证内容说清。\u003c/li>\n\u003cli>\u003cstrong>人工初验后，获准存档与推送。\u003c/strong>按本册建议、经团队确认的规则，本地存档须人工确认，push / PR 另获授权。允许推送的内容必须先做秘密和无关文件检查。\u003c/li>\n\u003cli>\u003cstrong>用一个 PR 交给另一位复核。\u003c/strong>关联原票、固定审查提交、写明验证和演示入口；复核者让自己的 AI 读真实差异。发现问题回原票修正，不另写一部新 Spec。\u003c/li>\n\u003cli>\u003cstrong>指定人批准，整合任务执行合并。\u003c/strong>合并前核对最新基线与审批是否仍适用；更新代码后过期的检查要重做。冻结的主控仅调度和接结论，不亲自跑合并命令。\u003c/li>\n\u003cli>\u003cstrong>合并后检查组合结果，再记完成。\u003c/strong>按影响范围回归并确认实际使用；票记录审查版本与最终合并版本。最终验收成立后才关票；部署或分发安装包继续单独批准。\u003c/li>\n\u003c/ol>\n\u003cp class=\"source\">参考：\u003ca href=\"https://docs.github.com/en/get-started/using-github/github-flow\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">GitHub Flow\u003c/a>\u003c/p>\n\u003cdetails>\u003csummary>别人都是先 push、发 Draft PR，我们为什么不同？\u003c/summary>\u003cp>Draft PR 是“尚未申请合并的草稿”，适合提前请同事看代码。但它已经把内容发送到远端，不能因为叫草稿就跳过你的推送授权。以后若你希望采用，可以单独批准“本票允许将已脱敏改动推到指定私有分支供复核，不允许合并/部署”；团队应先约定推送与审查顺序。\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>PR 与施工票会不会重复？\u003c/summary>\u003cp>票写做什么及完成状态，PR 展示这次准备合入的代码差异和审查讨论。PR 引用票，不抄一份平行需求。若未到最终验收，不用会自动关 issue 的关联方式或 \u003ccode>Closes #…\u003c/code> 等关键词；普通链接足够。合并成功不能冒充人工已经验收。\u003c/p>\u003cp class=\"source\">参考：\u003ca href=\"https://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/linking-a-pull-request-to-an-issue\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">GitHub：PR 与 issue 的关联及自动关闭\u003c/a>\u003c/p>\u003c/details>\n\u003c/section>\n\n\u003csection id=\"team-feedback\">\n\u003ch2>主控 AI 如何知道同事电脑上发生了什么？\u003c/h2>\n\u003cp>\u003cstrong>默认靠明确交接，不假设聊天自动互通。\u003c/strong>你的主控看到链接，不代表它已有访问权限或读过内容；它也不能仅凭版本名推断同事运行的是哪份程序。\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>方式\u003c/th>\u003cth>怎样用\u003c/th>\u003cth>适合什么时候\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>先用：人工转交短摘要\u003c/td>\u003ctd>同事把下面的回报贴到票/PR，再给你链接；无法读取时提供脱敏材料\u003c/td>\u003ctd>第一次协作，不额外搭系统\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>再用：授权读取共享仓库\u003c/td>\u003ctd>主控派只读复核任务，通过现有工具读取具体票、差异和检查；明确报告真正读到的版本\u003c/td>\u003ctd>仓库与权限稳定后；不因此取得同事桌面的控制权\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>以后按需：自动检查与回报\u003c/td>\u003ctd>CI 在配置的环境构建/测试，结果关联具体提交；Windows 真机另留证据\u003c/td>\u003ctd>同样的人工步骤反复发生时，再评估配置与运行费用\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cdiv class=\"example\">\u003ch3>每次只交这六项，详细日志留原处\u003c/h3>\u003col>\n\u003cli>票号与负责人；状态是待复核、阻塞、待验收还是已验收。\u003c/li>\n\u003cli>仓库、分支、提交编号；未存档内容单独说明，不冒充已推送。\u003c/li>\n\u003cli>做了什么，以及没做什么；链接实际差异与批准范围。\u003c/li>\n\u003cli>验证的命令/操作、环境、时间和结果；日志脱敏并给可访问位置。\u003c/li>\n\u003cli>演示或安装包版本、取得方式；有条件时记录文件哈希，避免拿错包。\u003c/li>\n\u003cli>已知问题、回退办法与需要主控决定的事项。\u003c/li>\n\u003c/ol>\u003c/div>\n\u003cp>这相当于同事交“这一版图纸＋检验记录＋待定问题”，不需要把一整天的聊天都交给主控。跨人员交接可用 \u003ca href=\"#skills/card-handoff\" data-book-route=\"skills/card-handoff\">handoff\u003c/a>，重点引用已有事实源；完整对话不是必需输入。\u003c/p>\n\u003cdetails>\u003csummary>同事只说“打不开”，应该怎样补资料？\u003c/summary>\u003cp>让他写：哪个安装包/提交、Windows 具体版本和架构、普通用户还是管理员、从哪一步开始、期待什么、实际出现什么、能否重复。截图或日志先隐藏账号、密钥和客户内容。你的诊断任务读这些证据，必要时再请同事执行一项安全检查；没有在目标电脑复现就直说未复现，不反复猜改。\u003c/p>\u003c/details>\n\u003c/section>\n\n\u003csection id=\"team-boundaries\">\n\u003ch2>文件没有冲突，还要检查接口、数据和目标电脑是否兼容\u003c/h2>\n\u003cdetails open=\"\">\u003csummary>什么可以并行，什么先排队？\u003c/summary>\u003cp>只有依赖满足、目标可独立验收、共享约定已明确的票，才值得考虑并行。初期每人至多一张执行中的票；公共配置、依赖升级、数据库结构、权限和发布由指定负责人协调，不能多人各自改一套。\u003c/p>\u003cp>同一功能里“甲做所有界面、乙以后再接所有接口”容易到最后才发现接不上。优先拆成可独立使用的小功能；确需两人分工，先约定字段含义、输入输出、失败状态、权限和模拟边界，再各做自己的部分，最后仍共同走通真实路径。\u003c/p>\u003cp>这些条件用于判断将来是否适合并行；本册的起步示例仍按串行方式安排。团队另行确认后才改用并行，独立目录本身不能解决业务分歧。\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>数据库与共享测试环境：不能靠分支隔离\u003c/summary>\u003cp>每人优先用独立测试数据库/数据空间和模拟样例；共享集成环境由指定人管理。代码分支不同，但连着同一个数据库，写入仍会互相影响。\u003c/p>\u003cp>改表结构、迁移、权限、备份恢复按高风险任务处理：写清执行顺序、旧新版本兼容、备份与真实恢复办法，经批准由指定人执行。不要为修复测试随便清空共享库；Git 回退代码不等于数据已经恢复。\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>Win10 安装包与 computer use：一定要在现场验证\u003c/summary>\u003cp>第二位同事应在目标 Windows 环境验证安装、启动、读写权限、升级/卸载、异常恢复及本票涉及的原生能力。记录具体系统版本、架构、显示缩放和安装包；“我的开发机能跑”或网页测试通过都不能替代它。\u003c/p>\u003cp>如果项目涉及让智能体操作同事电脑，应先在独立测试环境、模拟文档和受限测试账号上验证。明确可操作的应用与目录、何时需本人确认、暂停或停止办法、脱敏记录和误操作恢复；不能让测试直接点击真实客户设计文件，也不能未经同意控制他人电脑。\u003c/p>\u003c/details>\n\u003cdetails>\u003csummary>要不要马上搭 CI 自动测试？\u003c/summary>\u003cp>CI 就是“每次改动后，由指定环境自动跑已经写好的检查”。先把项目启动与检查脚本跑通，再自动化最常用的一组；不是先造一套庞大流水线。它能减少漏跑，但不会自动替你想出所有测试。\u003c/p>\u003cp>核对目标提交、系统、触发条件及跳过项；绿色图标不等于全部实际运行。不要把不可信改动的自动执行接到有生产权限或日常办公资料的电脑。费用、权限与 Windows 运行环境需另行确认。\u003c/p>\u003cp class=\"source\">参考：\u003ca href=\"https://docs.github.com/en/actions/get-started/continuous-integration\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">GitHub：持续集成\u003c/a> · \u003ca href=\"https://docs.github.com/en/actions/concepts/billing-and-usage\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">运行额度与费用\u003c/a> · \u003ca href=\"https://docs.github.com/en/actions/reference/security/secure-use\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">安全使用\u003c/a>\u003c/p>\u003c/details>\n\u003c/section>\n\n\u003csection id=\"team-skills\">\n\u003ch2>仍用 Matt 主链，只增加协作信息\u003c/h2>\n\u003cp>不需要专门找一个“多人协作万能 Skill”。票、版本、责任和权限先说清，现有方法各干一件事。技能名可点开具体教程；这是方法分工，不是自动安装或已生效的调用。\u003c/p>\n\u003ctable class=\"team-skill-table\">\u003cthead>\u003ctr>\u003cth>遇到什么\u003c/th>\u003cth>用哪个 Skill\u003c/th>\u003cth>协作时多交代什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>两个人理解不同\u003c/td>\u003ctd>\u003ca href=\"#skills/card-grill-with-docs\" data-book-route=\"skills/card-grill-with-docs\">grill-with-docs\u003c/a>；词义用 \u003ca href=\"#skills/card-domain-modeling\" data-book-route=\"skills/card-domain-modeling\">domain-modeling\u003c/a>\u003c/td>\u003ctd>只问真实分歧，指定谁拍板；澄清后写回原事实源\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>能力/兼容性不明\u003c/td>\u003ctd>\u003ca href=\"#skills/card-research\" data-book-route=\"skills/card-research\">research\u003c/a>\u003c/td>\u003ctd>给待核实的问题与目标环境，不为观点争论虚构结论\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>形成共同规格\u003c/td>\u003ctd>\u003ca href=\"#skills/card-to-spec\" data-book-route=\"skills/card-to-spec\">to-spec\u003c/a>\u003c/td>\u003ctd>引用同一原型与决定，确认共享接口、验收和不做项\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>分票与认领\u003c/td>\u003ctd>\u003ca href=\"#skills/card-to-tickets\" data-book-route=\"skills/card-to-tickets\">to-tickets\u003c/a>\u003c/td>\u003ctd>每票一个负责人、真实依赖、共享部分的协调者；人确认粒度\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>各自施工\u003c/td>\u003ctd>\u003ca href=\"#skills/card-implement\" data-book-route=\"skills/card-implement\">implement\u003c/a>；约定测试驱动时用 \u003ca href=\"#skills/card-tdd\" data-book-route=\"skills/card-tdd\">tdd\u003c/a>\u003c/td>\u003ctd>本人真实目录、固定票、允许范围和明确验证环境\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>跨同事交接\u003c/td>\u003ctd>\u003ca href=\"#skills/card-handoff\" data-book-route=\"skills/card-handoff\">handoff\u003c/a>\u003c/td>\u003ctd>引用票/PR/具体提交与脱敏证据，不复制全聊天或个人路径\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>另一人复核\u003c/td>\u003ctd>\u003ca href=\"#skills/card-code-review\" data-book-route=\"skills/card-code-review\">code-review\u003c/a>\u003c/td>\u003ctd>给共同基线和审查提交；未存档改动必须另查，空差异不代表通过\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>已发生 Git 合并冲突\u003c/td>\u003ctd>\u003ca href=\"#skills/card-resolving-merge-conflicts\" data-book-route=\"skills/card-resolving-merge-conflicts\">resolving-merge-conflicts\u003c/a>\u003c/td>\u003ctd>已有冲突与授权范围；业务选择由相关负责人确认，不能盲选一边\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>合起来行为不对\u003c/td>\u003ctd>\u003ca href=\"#skills/card-diagnosing-bugs\" data-book-route=\"skills/card-diagnosing-bugs\">diagnosing-bugs\u003c/a>\u003c/td>\u003ctd>明确合并后的具体版本、复现方法、两边预期；诊断与修复授权分开\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>隔离和交验\u003c/td>\u003ctd>\u003ca href=\"#skills/support-worktrees\" data-book-route=\"skills/support-worktrees\">using-git-worktrees\u003c/a> / \u003ca href=\"#skills/support-webapp-testing\" data-book-route=\"skills/support-webapp-testing\">webapp-testing\u003c/a> / \u003ca href=\"#skills/support-verification\" data-book-route=\"skills/support-verification\">verification-before-completion\u003c/a>\u003c/td>\u003ctd>分别在确需额外目录、网页实测、声称完成前使用；不另启动第二套管理流程\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Karpathy 的“只改必要部分、先说假设、拿证据”在多人协作里更重要，但已有规则就落实，不为每个人重复加一轮流程。你不会读代码时，复核者应解释具体影响与验证缺口；权限、真实数据和原生自动化等高风险部分，必要时请有相关经验的工程师独立复核，不能只靠两位新手接受 AI 给出的通过结论。\u003c/p>\n\u003c/section>\n\n\u003csection id=\"team-trouble\">\n\u003ch2>协作卡住时，先识别是哪种问题\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>现象\u003c/th>\u003cth>安全的下一步\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Git 提示冲突\u003c/td>\u003ctd>暂停合并，保留双方改动；读取差异和意图，再按获准范围解决、验证。不要整份覆盖或强推“以我为准”\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>没有冲突，但程序坏了\u003c/td>\u003ctd>查字段、接口、权限或环境是否理解不同；对组合版本复现。文本合并成功不证明逻辑相容\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>同事想做另一套设计\u003c/td>\u003ctd>回到批准基线；有新证据就提变更，由产品负责人决定，不在施工分支偷偷改方向\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>同事离开或任务停滞\u003c/td>\u003ctd>先交已授权共享的差异与未存档情况，明确换负责人；不能指望接手者读到上一人的本地未提交文件\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>测试失败，不知道谁改坏\u003c/td>\u003ctd>绑定提交和环境，比较最后可用版本，再做最小复现；不要轮流凭猜测修改或频繁重装依赖\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>凭证误上传\u003c/td>\u003ctd>立即通知负责人，按紧急授权吊销/轮换，再协调历史与副本清理；只删当前文件或加 .gitignore 不足以消除泄露\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp class=\"source\">参考：\u003ca href=\"https://docs.github.com/en/pull-requests/reference/merge-conflicts\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">GitHub：合并冲突\u003c/a> · \u003ca href=\"https://git-scm.com/docs/gitignore\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Git：ignore 不影响已跟踪文件\u003c/a> · \u003ca href=\"https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/removing-sensitive-data-from-a-repository\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">GitHub：敏感数据处置\u003c/a>\u003c/p>\n\u003cdetails>\u003csummary>怎样防止别人直接把不合格改动合进去？\u003c/summary>\u003cp>在平台与套餐支持时，配置默认分支须经 PR、需要他人审查、指定检查通过；核对管理员/角色绕过权，以及新提交后旧批准是否失效。规则必须实际配置、验证，写进手册不会自动生效。\u003c/p>\u003cp>GitHub 私有仓库的分支保护取决于仓库归属和适用套餐，不能推定免费组织仓库因为某成员买了个人 Pro 就有同样能力。平台不支持强制检查时，先由人工把关并说明缺少哪些保护，\u003cstrong>不能为了获得免费保护把客户项目改公开\u003c/strong>。通过状态还可能包含跳过项，要看实际运行记录。\u003c/p>\u003cp class=\"source\">参考：\u003ca href=\"https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">GitHub：分支保护、套餐范围与绕过/检查规则\u003c/a>\u003c/p>\u003c/details>\n\u003c/section>\n\n\u003csection id=\"team-prompts\">\n\u003ch2>复制给你或同事的 AI\u003c/h2>\n\u003cp>方括号填真实信息。这里是对话用的开工/复核说法，不是脚本；实际调用仍按\u003ca href=\"#skills/invoke-and-check\" data-book-route=\"skills/invoke-and-check\">技能调用核对\u003c/a>执行，入口不可用要说明，不能假装已调用。\u003c/p>\n\u003cdetails open=\"\">\u003csummary>第一次加入：先只读检查环境与缺口\u003c/summary>\u003cdiv class=\"prompt team-onboard-prompt\">\u003cpre>我要以同事身份参与【项目】，现在只做入场检查，不施工。\n仓库/当前基线：【位置与提交】；本地拟用目录：【我电脑的目录】；我的职责：【范围】。\n请先读项目现有入场说明、规则、当前票据入口和允许使用的样例数据说明。\n报告：实际目录与已有文件、所需工具版本、项目启动/验证入口、这类任务需要的Skill及当前环境是否可用。\n说明哪些可共享、哪些含秘密或客户资料不能上传。\n先列缺口和建议，不安装、不覆盖、不复制他人账号配置，不连接生产数据，不创建远端或修改权限。\n等确认入场操作范围后，再逐项配置和验证；不要把检查完成说成环境已配置好。\u003c/pre>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>接一张批准的票：范围与证据一起带上\u003c/summary>\u003cdiv class=\"prompt\">\u003cpre>本提示仅用于当前票专属的新任务；若当前是冻结主控，只准备开工包，不施工。\n我是【姓名】，负责已批准票【仓库内路径或链接】。请使用 Matt implement。\n必要输入：【Spec/术语/ADR/原型基线】；共同基线：【提交编号】。\n当前环境真实根目录：【路径】；分支/隔离目录：【实际值】；已有未存档改动：【清单】。\n允许改动：【范围】；不得改动：【共享接口/其他同事范围】；依赖与协调人：【说明】。\n验收和验证环境：【原票条目/Windows目标环境/命令与操作】。\n先核对并指出矛盾，保留已有改动。超出范围或共享约定变化，先回主控请求人类负责人确认。\n交付时给实际差异、命令/操作结果、模拟与未验证部分，并按六项回报格式整理。\n不得自行提交、推送、创建PR、关票、合并或部署；这些操作分别等明确授权。\u003c/pre>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>复核同事成果：查看实际改动和验证证据\u003c/summary>\u003cdiv class=\"prompt\">\u003cpre>请在独立复核任务使用 Matt code-review，只读检查【票/PR】。\n审查基线：【提交A】；待审版本：【提交B】；未存档改动：【无/另附说明】。\n读取实际差异和原票/Spec；分别核对需求与项目标准，并检查共享接口、数据与Windows目标能力的影响。\n逐条区分：代码里可以确认、已有证据确实证明、仍需真实运行、仍需人工决定。\n证据要对应本次版本；链接打不开就报告缺口，不能默认已读。\n这里只授权只读复核，不运行未知代码或写入测试；如需执行，先说明隔离环境与风险再请求授权。\n不修改、不合并、不部署；给具体问题和建议，待负责人决定下一步。\u003c/pre>\u003c/div>\u003c/details>\n\u003cdetails>\u003csummary>向主控汇报：提供简短摘要和原始记录入口\u003c/summary>\u003cdiv class=\"prompt\">\u003cpre>请使用 Matt handoff，按以下六项向主控整理【票】的跨人员交接。\n1. 票号、负责人、准确状态。\n2. 仓库/分支/提交编号；未存档与未推送内容单列。\n3. 做了什么/没做什么，引用实际差异和原票。\n4. 验证环境、时间、命令或操作及结果，提供脱敏证据位置。\n5. 演示/安装包的版本、取得方式和已知限制。\n6. 风险、回退与待拍板问题。\n不复制整段聊天，不写秘密，不把只在当前环境能读的路径当共享入口。\n优先在原票/PR留记录和引用，跨人员确需独立文件才生成一份；不再维护第二套项目状态。\n说清主控已经读取了什么、只是待他读取的又是什么。\u003c/pre>\u003c/div>\u003c/details>\n\u003c/section>\n\n\u003csection id=\"first-pilot\">\n\u003ch2>你们的第一次协作，做到这些就够了\u003c/h2>\n\u003cp>建议选\u003cstrong>不改真实数据、不动登录权限的低风险票\u003c/strong>试点，例如资料列表的空结果提示。若连环境基线都没在第二台电脑跑通，就先只做共同验收，不急着分代码任务。\u003c/p>\n\u003col>\u003cli>你给同事看真实使用场景和已批准页面，请他复述想完成什么。\u003c/li>\u003cli>同事在自己的电脑复现安全样例，记录相同基线。\u003c/li>\u003cli>批准一张范围明确的票，按本册路线交接、复核、合并和回归；暂不自动部署。\u003c/li>\u003cli>回顾这次哪里等人、哪里因信息缺失返工；只补暴露出来的一条规则。\u003c/li>\u003c/ol>\n\u003cdiv class=\"note\">\u003cp>\u003cstrong>成功标准：\u003c/strong>另一台电脑能复现；两人的改动没有互相覆盖；你说得清每项决定由谁批准；主控能从票与版本证据判断进度；没有秘密误上传。\u003c/p>\u003cp>跑通几次再讨论并行、CI 和更复杂权限。协作效率来自减少等待与返工，不承诺“多一个人就快一倍”。\u003c/p>\u003c/div>\n\u003cp class=\"source\">参考：\u003ca href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Matt Pocock 作者仓库\u003c/a>\u003c/p>\n\u003c/section>\n\u003cnav class=\"book-end\" aria-label=\"前后章节\">\u003ca href=\"#glossary\" data-book-route=\"glossary\">\u003cspan>上一册\u003c/span>← 行话使用指南\u003c/a>\u003ca class=\"next\" href=\"#index\" data-book-route=\"index\">\u003cspan>回到入口\u003c/span>选择这次的路线 →\u003c/a>\u003c/nav>\u003c/article>\u003caside class=\"toc\" aria-label=\"本页目录\">\u003cstrong>本页内容\u003c/strong>\u003ca href=\"#team/team-start\" data-book-route=\"team/team-start\">先和一位同事试着合作，再考虑多人同时开发\u003c/a>\u003ca href=\"#team/team-roles\" data-book-route=\"team/team-roles\">四种职责，可以由两个人兼任\u003c/a>\u003ca href=\"#team/team-shared\" data-book-route=\"team/team-shared\">共享项目约定，不共享同一个施工文件夹\u003c/a>\u003ca href=\"#team/team-onboarding\" data-book-route=\"team/team-onboarding\">同事第一次加入，完成这六件事\u003c/a>\u003ca href=\"#team/team-flow\" data-book-route=\"team/team-flow\">同事完成一张票后，怎样合入项目\u003c/a>\u003ca href=\"#team/team-feedback\" data-book-route=\"team/team-feedback\">主控 AI 如何知道同事电脑上发生了什么？\u003c/a>\u003ca href=\"#team/team-boundaries\" data-book-route=\"team/team-boundaries\">文件没有冲突，还要检查接口、数据和目标电脑是否兼容\u003c/a>\u003ca href=\"#team/team-skills\" data-book-route=\"team/team-skills\">仍用 Matt 主链，只增加协作信息\u003c/a>\u003ca href=\"#team/team-trouble\" data-book-route=\"team/team-trouble\">协作卡住时，先识别是哪种问题\u003c/a>\u003ca href=\"#team/team-prompts\" data-book-route=\"team/team-prompts\">复制给你或同事的 AI\u003c/a>\u003ca href=\"#team/first-pilot\" data-book-route=\"team/first-pilot\">你们的第一次协作，做到这些就够了\u003c/a>\u003c/aside>\u003c/div>\u003cfooter>建筑师的 AI 开发手册 · 分享版\u003cbr>独立整理的实践教程，非相关作者或 AI 厂商官方手册。方法出处见各工具链接；团队规则需另行确认。\u003cbr>静态单文件，无账号、无分析追踪；外部作者页面需要联网。\u003c/footer>\u003c/main>\u003c/div>\u003cdiv class=\"notice-live\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003cscript>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}));}\nwindow.addEventListener('hashchange',openHash);openHash();\nconst sections=[...document.querySelectorAll('article>section')],tocLinks=[...document.querySelectorAll('.toc a')];\nif('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const id=visible[0].target.id;tocLinks.forEach(a=>a.classList.toggle('current',a.hash==='#'+id));},{rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>observer.observe(s));}\n})();\n\u003c/script>\u003cscript>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n\u003c/script>\u003c/body>\u003c/html>"},{"id":"resources","nav":"前端设计资源","html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003cmeta name=\"description\" content=\"面向建筑师 AI 开发流程的前端设计案例、视觉素材、动效与组件资源导航。\">\n\ var(--line);padding:18px;text-decoration:none}.bookmark:hover,.bookmark:focus-visible{border-color:var(--clay);outline:0}.bookmark code{font:11px Consolas,monospace;color:var(--clay)}.bookmark b{display:block;margin:8px 0 4px}.bookmark span{font-size:12px;color:var(--muted)}\n.rules{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.rule-card{background:var(--card);border:1px solid var(--line);padding:24px}.rule-card.warning{background:var(--clay-soft);border-color:#d9ae9d}.rule-card ul{margin:14px 0 0;padding-left:20px}.rule-card li{margin:8px 0;color:var(--ink-2);font-size:14px}.rule-card p{color:var(--ink-2);font-size:14px}.stamp{display:inline-block;margin-top:14px;border:1px solid var(--clay);color:var(--clay-dark);padding:6px 9px;font:11px Consolas,monospace;letter-spacing:.06em}\n.pager{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}.pager a{text-decoration:none;padding:28px 0}.pager a:last-child{text-align:right}.pager small{display:block;color:var(--muted)}.pager strong{color:var(--clay-dark)}footer{padding:26px 0 50px;color:var(--muted);font-size:12px}\n@media(max-width:900px){.hero-grid,.rules{grid-template-columns:1fr}.route-grid,.bookmark-grid{grid-template-columns:repeat(2,1fr)}.category{grid-template-columns:150px 1fr}.resource{grid-template-columns:42px 1fr 44px}.meta{grid-column:2}.go{grid-column:3;grid-row:1 / span 2}}\n@media(max-width:620px){.shell{width:min(100% - 26px,1120px)}.brand{display:none}.book-nav .shell{justify-content:center}.tabs a{padding:7px 9px}.hero{padding-top:40px}h1{font-size:39px}.route-grid,.bookmark-grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.category{display:block}.category-label{position:static;padding:22px 0 12px}.resource-list{border-left:0;border-top:1px solid var(--line)}.resource{grid-template-columns:34px 1fr 40px;gap:12px;padding:18px 10px}.pager{grid-template-columns:1fr}.pager a:last-child{text-align:left;border-top:1px solid var(--line)}}\n@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.go{transition:none}}\n\u003c/style>\n\u003cstyle>.hero{padding-top:36px}.category-label{top:20px}@media(max-width:620px){.section-head{grid-template-columns:1fr;gap:12px}}\u003c/style>\u003c/head>\n\u003cbody>\n\n\n\u003cmain class=\"shell\">\n  \u003cheader class=\"hero\">\n    \u003cdiv class=\"hero-grid\">\n      \u003cdiv>\n        \u003cdiv class=\"eyebrow\">第二阶段 · 外部资源库\u003c/div>\n        \u003ch1>先找对参考，\u003cbr>再开始画页面\u003c/h1>\n        \u003cp class=\"lead\">这不是第四套开发流程，而是概念设计阶段的“材料样本室”：用案例确定方向，用真实产品核对流线，用素材与组件快速搭出可评审原型。\u003c/p>\n        \u003cp class=\"hero-note\">\u003cstrong>最小使用法：\u003c/strong>2 个案例库 + 1 个真实流程库 + 1 套组件基线 + 1 个动效引擎，足够开始概念方案。\u003c/p>\n      \u003c/div>\n      \u003caside class=\"index-board\" aria-label=\"资源选用顺序\">\n        \u003cdiv class=\"index-row\">\u003ccode>01\u003c/code>\u003cb>CASE / 案例\u003c/b>\u003cspan>找气质\u003c/span>\u003c/div>\n        \u003cdiv class=\"index-row\">\u003ccode>02\u003c/code>\u003cb>FLOW / 流线\u003c/b>\u003cspan>找结构\u003c/span>\u003c/div>\n        \u003cdiv class=\"index-row\">\u003ccode>03\u003c/code>\u003cb>ASSET / 素材\u003c/b>\u003cspan>搭画面\u003c/span>\u003c/div>\n        \u003cdiv class=\"index-row\">\u003ccode>04\u003c/code>\u003cb>MOTION / 动效\u003c/b>\u003cspan>定手感\u003c/span>\u003c/div>\n        \u003cdiv class=\"index-row\">\u003ccode>05\u003c/code>\u003cb>BUILD / 组件\u003c/b>\u003cspan>可实施\u003c/span>\u003c/div>\n      \u003c/aside>\n    \u003c/div>\n  \u003c/header>\n\n  \u003csection id=\"routes\">\n    \u003cdiv class=\"section-head\">\u003cdiv class=\"section-index\">快速选路\u003c/div>\u003cdiv>\u003ch2>我现在需要解决什么？\u003c/h2>\u003cp>不要从 18 个网站逐个浏览。先选择当前设计问题，页面会替你筛出对应资源。\u003c/p>\u003c/div>\u003c/div>\n    \u003cdiv class=\"route-grid\">\n      \u003cbutton class=\"route\" type=\"button\" data-route=\"case\">\u003ccode>ROUTE A\u003c/code>\u003cb>还不知道长什么样\u003c/b>\u003cspan>先看行业外案例、页面气质与成熟构图。\u003c/span>\u003c/button>\n      \u003cbutton class=\"route\" type=\"button\" data-route=\"flow\">\u003ccode>ROUTE B\u003c/code>\u003cb>功能很多，不会排\u003c/b>\u003cspan>研究真实产品屏幕、任务路径和落地页结构。\u003c/span>\u003c/button>\n      \u003cbutton class=\"route\" type=\"button\" data-route=\"asset\">\u003ccode>ROUTE C\u003c/code>\u003cb>页面缺少视觉素材\u003c/b>\u003cspan>找摄影、插图、图标和可控动画资产。\u003c/span>\u003c/button>\n      \u003cbutton class=\"route\" type=\"button\" data-route=\"motion\">\u003ccode>ROUTE D\u003c/code>\u003cb>原型缺少动效手感\u003c/b>\u003cspan>先借鉴动效模式，再选择一种实现体系。\u003c/span>\u003c/button>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"catalogue\">\n    \u003cdiv class=\"section-head\">\u003cdiv class=\"section-index\">资源目录 · 18\u003c/div>\u003cdiv>\u003ch2>按用途选材，不按热度堆网站\u003c/h2>\u003cp>资源已按 2026-08-14 可用入口核验。价格、授权和维护状态会变化，正式采用前仍需查看各站最新条款。\u003c/p>\u003c/div>\u003c/div>\n    \u003cdiv class=\"toolbar\">\n      \u003cdiv class=\"search-wrap\">\u003clabel for=\"resource-search\">搜索名称、用途或标签\u003c/label>\u003cinput id=\"resource-search\" type=\"search\" placeholder=\"例如：落地页、流程、图标、React、滚动动效\">\u003c/div>\n      \u003cdiv class=\"count\" aria-live=\"polite\">显示 \u003cstrong id=\"visible-count\">18\u003c/strong> / 18\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"filters\" aria-label=\"资源类别筛选\">\n      \u003cbutton class=\"filter active\" type=\"button\" data-filter=\"all\">全部 18\u003c/button>\n      \u003cbutton class=\"filter\" type=\"button\" data-filter=\"case\">案例与方向\u003c/button>\n      \u003cbutton class=\"filter\" type=\"button\" data-filter=\"flow\">结构与流线\u003c/button>\n      \u003cbutton class=\"filter\" type=\"button\" data-filter=\"asset\">视觉素材\u003c/button>\n      \u003cbutton class=\"filter\" type=\"button\" data-filter=\"motion\">动效参考\u003c/button>\n      \u003cbutton class=\"filter\" type=\"button\" data-filter=\"build\">组件与实施\u003c/button>\n    \u003c/div>\n\n    \u003cdiv class=\"catalog\" id=\"resource-catalog\">\n      \u003csection class=\"category\" data-category-section=\"\">\n        \u003cdiv class=\"category-label\">\u003ccode>A / 01—07\u003c/code>\u003ch3>案例与页面结构\u003c/h3>\u003cp>先借鉴解题方式，不复制成品。\u003c/p>\u003c/div>\n        \u003cdiv class=\"resource-list\">\n          \u003carticle class=\"resource\" data-categories=\"case motion\" data-search=\"MotionSites AI 动效 网站 提示词 灵感 原型\">\u003cspan class=\"resource-num\">01\u003c/span>\u003cdiv class=\"resource-main\">\u003ch3>MotionSites AI\u003c/h3>\u003cp>高动效网站案例与提示词，适合确定“页面如何动”的概念方向。\u003c/p>\u003c/div>\u003cdiv class=\"meta\">\u003cspan class=\"pill\">动效案例\u003c/span>\u003cspan class=\"pill\">付费为主\u003c/span>\u003c/div>\u003ca class=\"go\" href=\"https://motionsites.ai/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 MotionSites AI\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">↗\u003c/a>\u003c/article>\n          \u003carticle class=\"resource\" data-categories=\"case asset\" data-search=\"Craftwork Curated curated.design 网站 视觉 情绪板\">\u003cspan class=\"resource-num\">02\u003c/span>\u003cdiv class=\"resource-main\">\u003ch3>Craftwork Curated\u003c/h3>\u003cp>原 curated.design 已转入 Craftwork；适合收集风格、配色与构图情绪板。\u003c/p>\u003c/div>\u003cdiv class=\"meta\">\u003cspan class=\"pill\">视觉案例\u003c/span>\u003cspan class=\"pill\">免费浏览\u003c/span>\u003c/div>\u003ca class=\"go\" href=\"https://craftwork.design/curated/websites\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 Craftwork Curated\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">↗\u003c/a>\u003c/article>\n          \u003carticle class=\"resource\" data-categories=\"case flow\" data-search=\"Landing.Gallery 落地页 结构 技术栈 页面\">\u003cspan class=\"resource-num\">03\u003c/span>\u003cdiv class=\"resource-main\">\u003ch3>Landing.Gallery\u003c/h3>\u003cp>聚焦真实落地页，可按版块与技术筛选，适合拆解首屏到转化的结构。\u003c/p>\u003c/div>\u003cdiv class=\"meta\">\u003cspan class=\"pill\">落地页结构\u003c/span>\u003cspan class=\"pill\">免费浏览\u003c/span>\u003c/div>\u003ca class=\"go\" href=\"https://www.landing.gallery/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 Landing.Gallery\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">↗\u003c/a>\u003c/article>\n          \u003carticle class=\"resource\" data-categories=\"case flow\" data-search=\"Landbook 网站 部分 移动端 动效 页面 灵感\">\u003cspan class=\"resource-num\">04\u003c/span>\u003cdiv class=\"resource-main\">\u003ch3>Landbook\u003c/h3>\u003cp>覆盖整站、页面区段、移动端和动效，是概念比选阶段最均衡的案例库。\u003c/p>\u003c/div>\u003cdiv class=\"meta\">\u003cspan class=\"pill\">综合案例\u003c/span>\u003cspan class=\"pill\">Freemium\u003c/span>\u003c/div>\u003ca class=\"go\" href=\"https://land-book.com/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 Landbook\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">↗\u003c/a>\u003c/article>\n          \u003carticle class=\"resource\" data-categories=\"case motion\" data-search=\"Awwwards 获奖 实验 视觉 动效 网站\">\u003cspan class=\"resource-num\">05\u003c/span>\u003cdiv class=\"resource-main\">\u003ch3>Awwwards\u003c/h3>\u003cp>观察视觉与交互上限。适合找概念张力，不适合直接照搬到后台和高频工具。\u003c/p>\u003c/div>\u003cdiv class=\"meta\">\u003cspan class=\"pill\">审美上限\u003c/span>\u003cspan class=\"pill\">免费浏览\u003c/span>\u003c/div>\u003ca class=\"go\" href=\"https://www.awwwards.com/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 Awwwards\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">↗\u003c/a>\u003c/article>\n          \u003carticle class=\"resource\" data-categories=\"case\" data-search=\"Recent.design Godly 每日 网站 灵感 视觉\">\u003cspan class=\"resource-num\">06\u003c/span>\u003cdiv class=\"resource-main\">\u003ch3>Recent.design\u003c/h3>\u003cp>持续更新的多风格网站精选；旧 Godly 入口已转向此站，适合快速收集不同风格的视觉参考。\u003c/p>\u003c/div>\u003cdiv class=\"meta\">\u003cspan class=\"pill\">每日精选\u003c/span>\u003cspan class=\"pill\">免费浏览\u003c/span>\u003c/div>\u003ca class=\"go\" href=\"https://recent.design/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 Recent.design\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">↗\u003c/a>\u003c/article>\n          \u003carticle class=\"resource\" data-categories=\"flow case\" data-search=\"Mobbin 产品 真实 屏幕 流程 Web App 用户流\">\u003cspan class=\"resource-num\">07\u003c/span>\u003cdiv class=\"resource-main\">\u003ch3>Mobbin\u003c/h3>\u003cp>真实 App 与 Web 产品屏幕及流程，适合参考登录、搜索、录入、审批等操作流程。\u003c/p>\u003c/div>\u003cdiv class=\"meta\">\u003cspan class=\"pill\">真实产品流\u003c/span>\u003cspan class=\"pill\">Freemium\u003c/span>\u003c/div>\u003ca class=\"go\" href=\"https://mobbin.com/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 Mobbin\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">↗\u003c/a>\u003c/article>\n        \u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"category\" data-category-section=\"\">\n        \u003cdiv class=\"category-label\">\u003ccode>B / 08—12\u003c/code>\u003ch3>视觉与动画素材\u003c/h3>\u003cp>做逼真原型，也要保留授权意识。\u003c/p>\u003c/div>\n        \u003cdiv class=\"resource-list\">\n          \u003carticle class=\"resource\" data-categories=\"asset\" data-search=\"Unsplash 摄影 图片 纹理 照片\">\u003cspan class=\"resource-num\">08\u003c/span>\u003cdiv class=\"resource-main\">\u003ch3>Unsplash\u003c/h3>\u003cp>高质量摄影与纹理，适合情绪板和原型占位；正式发布前复核具体使用范围。\u003c/p>\u003c/div>\u003cdiv class=\"meta\">\u003cspan class=\"pill\">摄影素材\u003c/span>\u003cspan class=\"pill license\">Unsplash License\u003c/span>\u003c/div>\u003ca class=\"go\" href=\"https://unsplash.com/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 Unsplash\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">↗\u003c/a>\u003c/article>\n          \u003carticle class=\"resource\" data-categories=\"asset\" data-search=\"unDraw SVG 插图 可改色 空状态\">\u003cspan class=\"resource-num\">09\u003c/span>\u003cdiv class=\"resource-main\">\u003ch3>unDraw\u003c/h3>\u003cp>可改色 SVG 插图，适合空状态与概念原型；授权不允许将素材用于训练 AI。\u003c/p>\u003c/div>\u003cdiv class=\"meta\">\u003cspan class=\"pill\">矢量插图\u003c/span>\u003cspan class=\"pill license\">自定义许可\u003c/span>\u003c/div>\u003ca class=\"go\" href=\"https://undraw.co/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 unDraw\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">↗\u003c/a>\u003c/article>\n          \u003carticle class=\"resource\" data-categories=\"asset motion\" data-search=\"LottieFiles Lottie 动画 JSON 素材\">\u003cspan class=\"resource-num\">10\u003c/span>\u003cdiv class=\"resource-main\">\u003ch3>LottieFiles\u003c/h3>\u003cp>Lottie 动画库与托管工具；素材作者授权可能不同，下载前逐项确认。\u003c/p>\u003c/div>\u003cdiv class=\"meta\">\u003cspan class=\"pill\">轻量动画\u003c/span>\u003cspan class=\"pill\">混合授权\u003c/span>\u003c/div>\u003ca class=\"go\" href=\"https://lottiefiles.com/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 LottieFiles\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">↗\u003c/a>\u003c/article>\n          \u003carticle class=\"resource\" data-categories=\"asset build\" data-search=\"Phosphor Icons 图标 SVG React MIT\">\u003cspan class=\"resource-num\">11\u003c/span>\u003cdiv class=\"resource-main\">\u003ch3>Phosphor Icons\u003c/h3>\u003cp>风格统一、粗细完整的图标家族，适合从原型延续到正式界面。\u003c/p>\u003c/div>\u003cdiv class=\"meta\">\u003cspan class=\"pill\">图标系统\u003c/span>\u003cspan class=\"pill license\">MIT\u003c/span>\u003c/div>\u003ca class=\"go\" href=\"https://phosphoricons.com/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 Phosphor Icons\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">↗\u003c/a>\u003c/article>\n          \u003carticle class=\"resource\" data-categories=\"asset motion build\" data-search=\"Rive 交互 矢量 状态机 动画\">\u003cspan class=\"resource-num\">12\u003c/span>\u003cdiv class=\"resource-main\">\u003ch3>Rive\u003c/h3>\u003cp>用状态机制作可交互矢量动画，适合产品引导、数据反馈与复杂品牌动效。\u003c/p>\u003c/div>\u003cdiv class=\"meta\">\u003cspan class=\"pill\">交互动效\u003c/span>\u003cspan class=\"pill\">Freemium\u003c/span>\u003c/div>\u003ca class=\"go\" href=\"https://rive.app/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 Rive\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">↗\u003c/a>\u003c/article>\n        \u003c/div>\n      \u003c/section>\n\n      \u003csection class=\"category\" data-category-section=\"\">\n        \u003cdiv class=\"category-label\">\u003ccode>C / 13—18\u003c/code>\u003ch3>动效与可复制组件\u003c/h3>\u003cp>可以先在原型中试用，正式开发时选择一套主要方案。\u003c/p>\u003c/div>\n        \u003cdiv class=\"resource-list\">\n          \u003carticle class=\"resource\" data-categories=\"motion build\" data-search=\"React Bits 动画 组件 React 特效\">\u003cspan class=\"resource-num\">13\u003c/span>\u003cdiv class=\"resource-main\">\u003ch3>React Bits\u003c/h3>\u003cp>可复制的 React 动画组件与视觉特效，适合快速试探动效方向。\u003c/p>\u003c/div>\u003cdiv class=\"meta\">\u003cspan class=\"pill\">动画组件\u003c/span>\u003cspan class=\"pill\">MIT + Commons Clause\u003c/span>\u003c/div>\u003ca class=\"go\" href=\"https://reactbits.dev/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 React Bits\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">↗\u003c/a>\u003c/article>\n          \u003carticle class=\"resource\" data-categories=\"motion build\" data-search=\"Motion Primitives React Tailwind 动效 原语\">\u003cspan class=\"resource-num\">14\u003c/span>\u003cdiv class=\"resource-main\">\u003ch3>Motion Primitives\u003c/h3>\u003cp>基于 React、Tailwind 与 Motion 的基础动效组件，适合制作风格统一、不过度抢眼的交互效果。\u003c/p>\u003c/div>\u003cdiv class=\"meta\">\u003cspan class=\"pill\">动效原语\u003c/span>\u003cspan class=\"pill license\">核心 MIT\u003c/span>\u003c/div>\u003ca class=\"go\" href=\"https://motion-primitives.com/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 Motion Primitives\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">↗\u003c/a>\u003c/article>\n          \u003carticle class=\"resource\" data-categories=\"motion build\" data-search=\"Motion Framer Motion React 动画 手势 布局\">\u003cspan class=\"resource-num\">15\u003c/span>\u003cdiv class=\"resource-main\">\u003ch3>Motion（原 Framer Motion）\u003c/h3>\u003cp>成熟的 React 动效引擎，覆盖布局、手势、滚动和过渡，适合正式实现。\u003c/p>\u003c/div>\u003cdiv class=\"meta\">\u003cspan class=\"pill\">主动画引擎\u003c/span>\u003cspan class=\"pill license\">核心 MIT\u003c/span>\u003c/div>\u003ca class=\"go\" href=\"https://motion.dev/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 Motion\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">↗\u003c/a>\u003c/article>\n          \u003carticle class=\"resource\" data-categories=\"motion build\" data-search=\"GSAP 时间轴 滚动 SVG 动画 ScrollTrigger\">\u003cspan class=\"resource-num\">16\u003c/span>\u003cdiv class=\"resource-main\">\u003ch3>GSAP\u003c/h3>\u003cp>复杂时间轴、滚动与 SVG 动效能力强；免费商业使用，但不是 MIT 授权。\u003c/p>\u003c/div>\u003cdiv class=\"meta\">\u003cspan class=\"pill\">复杂动效\u003c/span>\u003cspan class=\"pill\">No-Charge License\u003c/span>\u003c/div>\u003ca class=\"go\" href=\"https://gsap.com/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 GSAP\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">↗\u003c/a>\u003c/article>\n          \u003carticle class=\"resource\" data-categories=\"build flow\" data-search=\"shadcn ui React Tailwind 组件 无障碍 MIT\">\u003cspan class=\"resource-num\">17\u003c/span>\u003cdiv class=\"resource-main\">\u003ch3>shadcn/ui\u003c/h3>\u003cp>代码归项目所有的可访问组件基线，适合把已定稿原型转入正式开发。\u003c/p>\u003c/div>\u003cdiv class=\"meta\">\u003cspan class=\"pill\">组件基线\u003c/span>\u003cspan class=\"pill license\">MIT\u003c/span>\u003c/div>\u003ca class=\"go\" href=\"https://ui.shadcn.com/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 shadcn/ui\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">↗\u003c/a>\u003c/article>\n          \u003carticle class=\"resource\" data-categories=\"motion build\" data-search=\"Magic UI shadcn 动画 组件 营销 页面\">\u003cspan class=\"resource-num\">18\u003c/span>\u003cdiv class=\"resource-main\">\u003ch3>Magic UI\u003c/h3>\u003cp>面向 shadcn/ui 的动画组件，适合营销页和概念原型；避免为了炫技堆叠特效。\u003c/p>\u003c/div>\u003cdiv class=\"meta\">\u003cspan class=\"pill\">原型组件\u003c/span>\u003cspan class=\"pill license\">基础 MIT\u003c/span>\u003c/div>\u003ca class=\"go\" href=\"https://magicui.design/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 Magic UI\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">↗\u003c/a>\u003c/article>\n        \u003c/div>\n      \u003c/section>\n      \u003cdiv class=\"empty\" id=\"empty-state\">没有匹配的资源。可以缩短关键词，或切回“全部”。\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"bookmarks\">\n    \u003cdiv class=\"section-head\">\u003cdiv class=\"section-index\">核心书签 · 8\u003c/div>\u003cdiv>\u003ch2>只收藏这一组，也足够完成多数项目\u003c/h2>\u003cp>先从这些常用网站中挑选，需要其他案例或素材时再查完整目录。\u003c/p>\u003c/div>\u003c/div>\n    \u003cdiv class=\"bookmark-grid\">\n      \u003ca class=\"bookmark\" href=\"https://land-book.com/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">\u003ccode>CASE\u003c/code>\u003cb>Landbook\u003c/b>\u003cspan>综合方向\u003c/span>\u003c/a>\n      \u003ca class=\"bookmark\" href=\"https://www.landing.gallery/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">\u003ccode>STRUCTURE\u003c/code>\u003cb>Landing.Gallery\u003c/b>\u003cspan>页面结构\u003c/span>\u003c/a>\n      \u003ca class=\"bookmark\" href=\"https://mobbin.com/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">\u003ccode>FLOW\u003c/code>\u003cb>Mobbin\u003c/b>\u003cspan>真实产品流\u003c/span>\u003c/a>\n      \u003ca class=\"bookmark\" href=\"https://recent.design/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">\u003ccode>MOOD\u003c/code>\u003cb>Recent.design\u003c/b>\u003cspan>快速情绪板\u003c/span>\u003c/a>\n      \u003ca class=\"bookmark\" href=\"https://phosphoricons.com/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">\u003ccode>ASSET\u003c/code>\u003cb>Phosphor Icons\u003c/b>\u003cspan>统一图标\u003c/span>\u003c/a>\n      \u003ca class=\"bookmark\" href=\"https://ui.shadcn.com/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">\u003ccode>BASE\u003c/code>\u003cb>shadcn/ui\u003c/b>\u003cspan>组件基线\u003c/span>\u003c/a>\n      \u003ca class=\"bookmark\" href=\"https://motion.dev/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">\u003ccode>ENGINE\u003c/code>\u003cb>Motion\u003c/b>\u003cspan>正式动效\u003c/span>\u003c/a>\n      \u003ca class=\"bookmark\" href=\"https://motion-primitives.com/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"作者或公开资料入口，需联网\" data-external=\"true\">\u003ccode>PATTERN\u003c/code>\u003cb>Motion Primitives\u003c/b>\u003cspan>动效模式\u003c/span>\u003c/a>\n    \u003c/div>\n  \u003c/section>\n\n  \u003csection id=\"rules\">\n    \u003cdiv class=\"section-head\">\u003cdiv class=\"section-index\">使用边界\u003c/div>\u003cdiv>\u003ch2>看案例是研究，不是复制\u003c/h2>\u003cp>把参考拆成结构、节奏、层级和交互规律；品牌、文案、摄影、插图和完整布局不得直接搬运。\u003c/p>\u003c/div>\u003c/div>\n    \u003cdiv class=\"rules\">\n      \u003carticle class=\"rule-card warning\">\u003ch3>采用前的四条红线\u003c/h3>\u003cul>\u003cli>截图只用于内部研究，不把别人的品牌与页面当成自己的成品。\u003c/li>\u003cli>每项素材、图标和组件分别核对最新授权；“能下载”不等于“可商用”。\u003c/li>\u003cli>一个项目只设一套组件基线和一个主动画引擎，避免系统互相打架。\u003c/li>\u003cli>所有关键动效提供减少动效方案，并尊重 \u003ccode>prefers-reduced-motion\u003c/code>。\u003c/li>\u003c/ul>\u003c/article>\n      \u003carticle class=\"rule-card\">\u003ch3>季度维护清单\u003c/h3>\u003cul>\u003cli>检查 18 个入口是否仍可访问或已重定向。\u003c/li>\u003cli>复核付费规则、免费额度和核心授权。\u003c/li>\u003cli>查看组件仓库近期维护与框架兼容性。\u003c/li>\u003cli>淘汰不再服务当前流程的重复资源。\u003c/li>\u003c/ul>\u003cspan class=\"stamp\">LAST VERIFIED · 2026-08-14\u003c/span>\u003c/article>\n    \u003c/div>\n  \u003c/section>\n\n  \u003cnav class=\"pager\" aria-label=\"页面导航\">\u003ca href=\"#concept\" data-book-route=\"concept\">\u003csmall>← 返回第二册\u003c/small>\u003cstrong>产品概念设计与原型定稿\u003c/strong>\u003c/a>\u003ca href=\"#resources/routes\" data-book-route=\"resources/routes\">\u003csmall>开始选材 ↑\u003c/small>\u003cstrong>回到快速选路\u003c/strong>\u003c/a>\u003c/nav>\n\u003c/main>\n\u003cfooter class=\"shell\">建筑师的 AI 开发手册 · 分享版\u003cbr>独立整理的实践教程，非相关作者或 AI 厂商官方手册。方法出处见各工具链接；团队规则需另行确认。\u003cbr>静态单文件，无账号、无分析追踪；外部作者页面需要联网。\u003c/footer>\n\u003cscript>\nconst resources=[...document.querySelectorAll('.resource')];\nconst filterButtons=[...document.querySelectorAll('.filter')];\nconst search=document.getElementById('resource-search');\nconst count=document.getElementById('visible-count');\nconst empty=document.getElementById('empty-state');\nlet active='all';\nfunction applyFilters(){\n  const term=search.value.trim().toLocaleLowerCase('zh-CN');\n  let visible=0;\n  resources.forEach(item=>{\n    const categories=item.dataset.categories.split(' ');\n    const categoryMatch=active==='all'||categories.includes(active);\n    const text=(item.dataset.search+' '+item.innerText).toLocaleLowerCase('zh-CN');\n    const searchMatch=!term||text.includes(term);\n    const show=categoryMatch&&searchMatch;\n    item.hidden=!show;if(show)visible++;\n  });\n  document.querySelectorAll('[data-category-section]').forEach(section=>{\n    section.hidden=!section.querySelector('.resource:not([hidden])');\n  });\n  count.textContent=visible;empty.classList.toggle('show',visible===0);\n}\nfilterButtons.forEach(button=>button.addEventListener('click',()=>{\n  active=button.dataset.filter;filterButtons.forEach(item=>item.classList.toggle('active',item===button));applyFilters();\n}));\ndocument.querySelectorAll('[data-route]').forEach(button=>button.addEventListener('click',()=>{\n  const target=filterButtons.find(item=>item.dataset.filter===button.dataset.route);if(target)target.click();\n  document.getElementById('catalogue').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});\n}));\nsearch.addEventListener('input',applyFilters);\n\u003c/script>\n\n\n\u003cscript>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n\u003c/script>\u003c/body>\u003c/html>"}],"attachments":{}}</script><script>(() => {
 const data=JSON.parse(document.getElementById('book-data').textContent),tabs=[...document.querySelectorAll('[role=tab]')],frame=document.getElementById('book-frame'),panel=document.getElementById('book-panel');
 const pages=new Map(data.pages.map(p=>[p.id,p]));let current=null,anchor='';
 function render(){
  let route;try{route=decodeURIComponent(location.hash.slice(1)).split('/');}catch{route=['index'];}
  const id=pages.has(route[0])?route[0]:'index';anchor=route.slice(1).join('/');
  tabs.forEach(tab=>{const selected=tab.dataset.page===id;tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1;});
  panel.setAttribute('aria-labelledby','tab-'+id);document.title=pages.get(id).nav+' · 建筑师的 AI 开发手册（分享版）';
  if(current===id){frame.contentWindow?.openBookSection?.(anchor);return;}
  current=id;frame.title=pages.get(id).nav;frame.srcdoc=pages.get(id).html;
  document.getElementById('portable-live').textContent='已切换到'+pages.get(id).nav;
 }
 function routeTo(route){if(!pages.has(route.split('/')[0]))return;if(location.hash==='#'+route)render();else location.hash=route;}
 frame.addEventListener('load',()=>frame.contentWindow?.openBookSection?.(anchor));
 tabs.forEach((tab,i)=>{
  tab.addEventListener('click',()=>routeTo(tab.dataset.page));
  tab.addEventListener('keydown',event=>{
   let index;if(event.key==='ArrowRight')index=(i+1)%tabs.length;else if(event.key==='ArrowLeft')index=(i-1+tabs.length)%tabs.length;else if(event.key==='Home')index=0;else if(event.key==='End')index=tabs.length-1;
   if(index!==undefined){event.preventDefault();tabs[index].focus();}
  });
 });
 window.addEventListener('message',event=>{if(event.source===frame.contentWindow&&event.data?.portableBook===true&&typeof event.data.route==='string')routeTo(event.data.route);});
 window.addEventListener('hashchange',render);
 new ResizeObserver(entries=>document.documentElement.style.setProperty('--header-height',entries[0].target.getBoundingClientRect().height+'px')).observe(document.querySelector('.portable-header'));
 render();
})();
</script></body></html>
