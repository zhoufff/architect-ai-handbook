d)}.term-walk li{margin:18px 0}.term-walk strong{color:#79543b}\n@media(max-width:760px){.term-body{padding-left:15px;padding-right:0}.term-name{font-size:16px}.term-plain{font-size:13px}.term-filter label{flex-basis:100%}}\n@media print{body{font-size:11pt;background:#fff}.layout{display:block}.sidebar,.toc,.topline,.copy-btn,.book-end,.notice-live{display:none}.page{padding:0}.reading-grid{display:block}.hero{padding:10px 0 20px}h1{font-size:26pt}h2{font-size:18pt}article>section{break-inside:auto}a{color:#222}.prompt,.example,table{break-inside:avoid}details:not([open]){display:block}footer{margin-top:25px}}\n\u003c/style>\u003cstyle>.layout{display:block;max-width:1240px}.page{padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}\u003c/style>\u003c/head>\u003cbody>\u003ca class=\"skip\" href=\"#delivery/main\" data-book-route=\"delivery/main\">跳到正文\u003c/a>\u003cdiv class=\"layout\">\u003cmain class=\"page\" id=\"main\">\u003cheader class=\"hero\">\u003cp class=\"eyebrow\">阶段 04 · 做到可用\u003c/p>\u003ch1>逐项完成开发，验证后再由你验收。\u003c/h1>\u003cp class=\"lead\">主控负责决策和调度，专属任务负责实现。完成测试后，还需要你实际试用并确认。\u003c/p>\u003c/header>\u003cdiv class=\"reading-grid\">\u003carticle>\u003csection id=\"stage-skill-route\">\u003ch2>这个阶段，先用哪个 Skill？\u003c/h2>\u003cdiv class=\"stage-start\">\u003cp>在当前票的专属任务里用 implement；它组织测试与 code-review，不再重复启动另一条施工链。\u003c/p>\u003cp class=\"stage-chain\">implement 当前票 → 按约定测试与 code-review → 真实使用检查 → 你人工验收\u003c/p>\u003c/div>\u003cp>首次建立或需要修正 AI 的工作约定时，看 \u003ca href=\"#agents/agent-stages\" data-book-route=\"agents/agent-stages\">writing-for-agents 在四阶段的用途\u003c/a>；不是本阶段每次都要多跑一道流程。\u003c/p>\u003ctable class=\"stage-skill-table\">\u003cthead>\u003ctr>\u003cth>Skill\u003c/th>\u003cth>什么时候接手\u003c/th>\u003cth>解决什么 / 交出什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/card-implement\" data-book-route=\"skills/card-implement\">implement\u003c/a>\u003c/td>\u003ctd>正式票和开工包已经批准，在票专属任务执行。\u003c/td>\u003ctd>只实现本票，核对实际改动、测试与限制；不能在冻结主控下场施工。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/card-code-review\" data-book-route=\"skills/card-code-review\">code-review\u003c/a>\u003c/td>\u003ctd>本票实现可供审查时；通常由 implement 发起。\u003c/td>\u003ctd>分别审 Spec 和项目标准，覆盖实际未提交改动；已有有效审查不机械再来一轮。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdetails>\u003csummary>只有遇到这些情况，才加用其他 Skill\u003c/summary>\u003ctable class=\"stage-skill-table\">\u003cthead>\u003ctr>\u003cth>Skill\u003c/th>\u003cth>什么时候接手\u003c/th>\u003cth>解决什么 / 交出什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/card-tdd\" data-book-route=\"skills/card-tdd\">tdd\u003c/a>\u003c/td>\u003ctd>票约定测试驱动，H 类采用严格 TDD。\u003c/td>\u003ctd>公共边界红→绿小循环；普通功能仍需风险相称的测试，不等于不测试。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/card-diagnosing-bugs\" data-book-route=\"skills/card-diagnosing-bugs\">diagnosing-bugs\u003c/a>\u003c/td>\u003ctd>真实故障或性能问题原因还不清。\u003c/td>\u003ctd>先复现定位再按授权修复；Superpowers 调试只作备用，同一问题不双跑。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/support-webapp-testing\" data-book-route=\"skills/support-webapp-testing\">webapp-testing\u003c/a>\u003c/td>\u003ctd>网页或浏览器可测页面到了实际验证环节。\u003c/td>\u003ctd>实走用户任务；原生 Windows exe 仍要在目标系统另验，不能以浏览器冒充。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/support-verification\" data-book-route=\"skills/support-verification\">superpowers:verification-before-completion\u003c/a>\u003c/td>\u003ctd>准备声称完成、修复或通过之前。\u003c/td>\u003ctd>核对实际新证据，不另建计划、不为代理层数无意义重复同一测试。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/support-worktrees\" data-book-route=\"skills/support-worktrees\">superpowers:using-git-worktrees\u003c/a>\u003c/td>\u003ctd>真实 Git 项目需要独立工作目录隔离改动。\u003c/td>\u003ctd>核对并创建/复用正确隔离目录；不是新会话，也不在无 Git 项目强建。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/card-handoff\" data-book-route=\"skills/card-handoff\">handoff\u003c/a>\u003c/td>\u003ctd>跨工具、目录、协作者，或中途分叉任务。\u003c/td>\u003ctd>引用票与事实源，交出当前焦点、失败尝试、下一步；普通票的开工包和验收摘要直接沿用现有记录，不另造 handoff 文件。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/details>\u003cp class=\"note\">implement 已经组织的 TDD/code-review 不再手动重跑一套。普通修改不自动调 Superpowers 全套编排；安全型技能仍服从当前环境规则。人工验收、提交/部署授权是你的关口，不存在替你批准的 Skill。\u003c/p>\u003cdiv class=\"prompt stage-entry\">\u003cpre>本轮是已批准票【票路径】的专属施工任务；主控只调度。\n请实际使用 Matt implement，先核对开工包、真实目录/分支、已有改动、范围和验证命令。\n按票约定的测试边界执行；采用 TDD 时使用 Matt tdd。实现后由 implement 发起 code-review，分别核对 Spec 与标准，并覆盖未提交内容。\n出现未定位故障时使用 diagnosing-bugs。网页用 webapp-testing 实走任务，Windows 原生能力在目标环境另外验证。\n声称完成前按 verification-before-completion 核证；已有证据不因重复调技能而无意义重跑。交我人工验收，不自行关票、提交、推送或部署。\n调用要求：优先使用当前应用的真实技能入口；入口未暴露时，从当前环境已装插件或 Skill 目录找到对应 SKILL.md，完整读取本步及所需引用后执行，报告实际使用的名称与路径。读不到就说明缺口，不能把普通回答冒充已调用；只加载本步需要的技能，按规则在各批准关口停止。\u003c/pre>\u003c/div>\u003cp class=\"source\">参考：\u003ca href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Matt Pocock 作者仓库\u003c/a>\u003c/p>\u003c/section>\u003cp class=\"glossary-strip\">\u003cstrong>本阶段行话：\u003c/strong>\u003ca href=\"#glossary/term-tdd\" title=\"先运行一条确实失败的测试，再写最少实现让它通过。\" data-book-route=\"glossary/term-tdd\">TDD · 测试驱动开发\u003c/a> · \u003ca href=\"#glossary/term-smoke-test\" title=\"用少量关键检查快速发现版本是否存在明显不可用问题。\" data-book-route=\"glossary/term-smoke-test\">Smoke test · 冒烟测试\u003c/a> · \u003ca href=\"#glossary/term-qa\" title=\"通过过程检查和成果检查降低质量风险，用户最终批准是其中单独一道关口。\" data-book-route=\"glossary/term-qa\">QA · 质量保障\u003c/a> · \u003ca href=\"#glossary/term-worktree\" title=\"让同一 Git 仓库拥有另一份可单独操作的工作目录。\" data-book-route=\"glossary/term-worktree\">Worktree · 独立工作目录\u003c/a> · \u003ca href=\"#glossary/term-deploy\" title=\"把软件及必要配置放到目标运行环境，让目标使用者能够使用。\" data-book-route=\"glossary/term-deploy\">部署\u003c/a>\u003cbr>\u003cspan>点词查：白话、阶段、产物、Skill 和你要问的问题。\u003c/span>\u003c/p>\u003csection id=\"ticket-workspace\">\n  \u003ch2>每张施工票都要经过实现、验证和人工验收\u003c/h2>\n  \u003cp class=\"glossary-entry\">同事在另一台电脑施工时，使用\u003ca href=\"#team/team-feedback\" data-book-route=\"team/team-feedback\">跨人员回报格式\u003c/a>与\u003ca href=\"#team/team-flow\" data-book-route=\"team/team-flow\">复核合并路线\u003c/a>；不要把他人的 AI 当成自动互通的内部子代理。\u003c/p>\n  \u003cp>票序确认后，规划主线转为决策与调度会话：只接收短结论、处理范围变化和创建下一张可开工票；不修改项目文件，不运行实现与调试命令，也不堆施工日志。\u003c/p>\n  \u003ctable>\u003cthead>\u003ctr>\u003cth>隔离方式\u003c/th>\u003cth>解决什么\u003c/th>\u003cth>不能替代什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n    \u003ctr>\u003ctd>用户可见的票专属新任务\u003c/td>\u003ctd>把当前票的讨论、实现和验收留在独立会话\u003c/td>\u003ctd>不会自动隔离磁盘文件\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>内部子代理\u003c/td>\u003ctd>给窄任务独立上下文，回传证据\u003c/td>\u003ctd>不替代票专属任务或用户验收\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>Git 分支／worktree\u003c/td>\u003ctd>管理版本；worktree另有工作目录\u003c/td>\u003ctd>不等于新会话，也不是系统安全沙盒\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\n  \u003cp class=\"note\">每票 fresh context 有 Matt 依据；用户可见新任务、冻结主线、一次只开当前可施工票，是 \u003cstrong>本手册的补充约定\u003c/strong>。上一票由你验收且依赖满足后，才创建下一票。工具不能创建新任务时，给出开工包并等待你新建，不能用子代理冒充。\u003c/p>\n\u003c/section>\n\n\u003csection id=\"start-package\">\n  \u003ch2>开工包只包含本次任务需要的信息，并核实实际环境\u003c/h2>\n  \u003cp>先核对实际工作目录、真实 Git 根、当前分支或 worktree、当前票和未存档改动。已有改动属于用户：保全、绕开无关内容；与当前任务重叠且不能安全处理时停下来说明，不用重置或全量覆盖解决。\u003c/p>\n  \u003cdiv class=\"prompt\">\u003cpre>请在票专属任务实际使用 Matt implement；由它按约定组织 tdd 与 code-review，不再重复启动另一条施工链。\n当前票：[票路径]；必要输入：[Spec]、[CONTEXT]、[相关 ADR]、[原型批准版本]。\n真实 Git 根：[路径]；分支／worktree：[实际值]；已有未存档改动：[清单]。\n允许改动：[范围]；不做：[边界]；验收标准：[引用票据]。\n验证：[定向命令]、[票末全套命令]、[真实操作场景]；风险与回退：[说明]。\n先核对以上信息，再按当前票 implement。不得自行提交、关票、push、merge 或部署。\u003c/pre>\u003c/div>\n  \u003cp>\u003cstrong>模型按风险与预算选，不把品牌写成开工条件：\u003c/strong>边界清楚的页面、接口和局部修改，可先选能够完成任务的常规推理档；跨模块、桌面集成、权限与恢复等高风险任务，选更强模型或更高推理档并加强复核。原型视觉可单独试其他模型，但不代替真实验收。\u003c/p>\n  \u003cp>主控、施工任务和内部子代理的模型与速度可能分别设置。创建前查实际工具支持的模型、档位和额度；不支持就报告限制，不把主控设置当子任务已生效。团队采用哪套模型配置，应另行约定。\u003c/p>\n\u003c/section>\n\n\u003csection id=\"build-verify\">\n  \u003ch2>先把当前行为做对，再独立检查要求与规范\u003c/h2>\n  \u003cp>先根据风险确定需要哪些验证：H 类和明确要求测试驱动的票采用严格 TDD；普通功能按实际风险做针对性检查，适合时采用 Matt 的小步循环，不必为每次样式或文案修改建立复杂测试。采用 TDD 时，先在约定的公共接口上写一个能够暴露问题的失败测试，再写刚好使它通过的实现，然后检查结果。不要先生成全部测试再一次性实现，也不要求测试每个内部函数。重构放在审查阶段，始终只处理当前票的范围。\u003c/p>\n  \u003cp>循环内针对当次变更运行类型检查和相关测试；票末按当前 Matt 默认运行一次全套测试，再独立做两轴审查：Spec——是否满足故事、验收与不做项；Standards——是否符合项目约定、可维护性和安全要求。审查发现问题，修复后验证受影响行为，必要时重跑相关全套。\u003c/p>\n  \u003cdiv class=\"warning\">\u003cp>全套跑不了就记原因、未覆盖范围与替代证据，不能把定向通过说成全部通过。同一代码状态、相同环境下，不为“多一层代理”无意义重复相同检查；新改动、新失败或新风险则重新验证。\u003c/p>\u003c/div>\n  \u003cp>人工验收前尚未提交的改动也必须纳入审查。当前 Matt 的固定点到 HEAD 差异不自动包含工作区内容；空 diff 不能证明没有问题。审查者要明确基线，并读取本票实际改动。\u003c/p>\n  \u003cdetails>\u003csummary>为什么自动测试通过还不能交付？\u003c/summary>\u003cp>举例：自动测试验证了接口返回数据，但页面可能把收入显示成了错误标签；组件单测通过，图表仍可能没有曲线。检查程序、代码审查与真实使用验收各有盲区，所以要按实际用户任务走一遍。这个例子用于说明分工，不是声称你的项目已经出现这些问题。\u003c/p>\u003c/details>\n\u003c/section>\n\n\u003csection id=\"real-acceptance\">\n  \u003ch2>验收真实操作，不只看启动成功和截图\u003c/h2>\n  \u003cp>逐条用真实场景验收：谁从哪里进入、使用什么数据、完成什么任务、取消或失败后如何恢复。截图配一句“操作—预期—实际”，记录复现步骤、软件版本和必要日志，让你能看懂；截图好看不证明保存、权限和恢复都有效。\u003c/p>\n  \u003cul>\u003cli>网页：浏览器实走关键流程，检查加载、空数据、错误、权限与结果持久化。\u003c/li>\u003cli>目标为 Windows 10 的 exe：在目标环境验证首次安装、普通用户启动、更新、权限拒绝、卸载或回退。开发机能运行不代表安装包可交付。\u003c/li>\u003cli>含 computer-use：先说明可操作应用与数据范围；验证停止后不再继续操作、需批准的动作确实等待批准，并留下可审计的动作与结果。工具不可用就记录未验证，不宣称已控制桌面。\u003c/li>\u003cli>涉及真实数据：先在约定测试副本检查；不得为了“真实验收”擅自写生产或试删文件。\u003c/li>\u003c/ul>\n  \u003cp>AI 给出机器验证与审查结果，再请你亲自查看或使用。\u003cstrong>本手册 闸门：\u003c/strong>你确认前不关票、不开始下一票、不做本地 Git 提交。确认后才按约定存档；push、merge、部署仍需单独授权。\u003c/p>\n\u003c/section>\n\n\u003csection id=\"bugs-risk\">\n  \u003ch2>遇到故障先复现问题，高风险修改必须有恢复办法\u003c/h2>\n  \u003cp>遇到 Bug 时，先用 Matt diagnosing-bugs 复现用户描述的问题，提出可能原因，再通过检查逐一证实或排除；一次只改变一个变量，定位后再按授权修复并验证。只有它不可用或当前票明确指定，才用 Superpowers systematic-debugging 作为备用；同一故障不同时执行两套诊断流程。要求诊断问题，不等于已经授权修改代码。\u003c/p>\n  \u003cp>数据库写入、权限、永久删除、密钥、迁移和生产部署默认 H 类。施工前说清影响对象、最小权限、备份与回滚步骤；对恢复能力做适用的实际验证。仅写了“有备份”不算恢复成功，涉及生产切换仍等你批准。\u003c/p>\n  \u003cp class=\"warning\">不要照抄课程的云端标签自动执行、自动提交或无沙盒示例。工作流可能持有写权限和认证环境；“只读 Token”不代表整个运行环境只读。尤其不要把不可信任务直接接入日常办公电脑或内网。详见\u003ca href=\"#governance\" data-book-route=\"governance\">工具与安全治理\u003c/a>。\u003c/p>\n\u003c/section>\n\n\u003csection id=\"close-deliver\">\n  \u003ch2>详细记录保存在施工票中，向主控汇报结论和证据位置\u003c/h2>\n  \u003cp>当前票是本票状态的唯一事实源，追加验收标准逐项结果、验证命令与结果、截图／日志路径、限制、你的确认及存档信息。主线只收到“完成了什么、证据在哪、还有什么风险、下一票是否可开工”的短摘要；CONTEXT 不变成进度日志。\u003c/p>\n  \u003cp>全部票人工验收后，另开“整体回归与交付”任务，读取 Spec、ADR 和票据结果，做跨票真实流程与交付检查。发现新想法进入下一期，不借收尾扩张范围；历史规格与验收记录保留可追溯性，不因关票永久删除。\u003c/p>\n  \u003cp>明确局部小修走\u003ca href=\"#index\" data-book-route=\"index\">轻量路线\u003c/a>；一旦跨会话或变为高风险，就升级相应闸门。要改产品方向，回到\u003ca href=\"#engineering\" data-book-route=\"engineering\">施工准备\u003c/a>及已批准设计处理变更，不能在施工中暗改需求。\u003c/p>\n  \u003cp class=\"source\">参考：\u003ca href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Matt 技能仓库\u003c/a> · \u003ca href=\"https://docs.github.com/en/actions/reference/security/secure-use\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">GitHub 工作流安全说明\u003c/a>\u003c/p>\n\u003c/section>\n\u003cnav class=\"book-end\" aria-label=\"前后章节\">\u003ca href=\"#engineering\" data-book-route=\"engineering\">\u003cspan>上一册\u003c/span>← 施工准备\u003c/a>\u003ca class=\"next\" href=\"#agents\" data-book-route=\"agents\">\u003cspan>下一册\u003c/span>Agent 执行手册 →\u003c/a>\u003c/nav>\u003c/article>\u003caside class=\"toc\" aria-label=\"本页目录\">\u003cstrong>本页内容\u003c/strong>\u003ca href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">这个阶段，先用哪个 Skill？\u003c/a>\u003ca href=\"#delivery/ticket-workspace\" data-book-route=\"delivery/ticket-workspace\">每张施工票都要经过实现、验证和人工验收\u003c/a>\u003ca href=\"#delivery/start-package\" data-book-route=\"delivery/start-package\">开工包只包含本次任务需要的信息，并核实实际环境\u003c/a>\u003ca href=\"#delivery/build-verify\" data-book-route=\"delivery/build-verify\">先把当前行为做对，再独立检查要求与规范\u003c/a>\u003ca href=\"#delivery/real-acceptance\" data-book-route=\"delivery/real-acceptance\">验收真实操作，不只看启动成功和截图\u003c/a>\u003ca href=\"#delivery/bugs-risk\" data-book-route=\"delivery/bugs-risk\">遇到故障先复现问题，高风险修改必须有恢复办法\u003c/a>\u003ca href=\"#delivery/close-deliver\" data-book-route=\"delivery/close-deliver\">详细记录保存在施工票中，向主控汇报结论和证据位置\u003c/a>\u003c/aside>\u003c/div>\u003cfooter>建筑师的 AI 开发手册 · 分享版\u003cbr>独立整理的实践教程，非相关作者或 AI 厂商官方手册。方法出处见各工具链接；团队规则需另行确认。\u003cbr>静态单文件，无账号、无分析追踪；外部作者页面需要联网。\u003c/footer>\u003c/main>\u003c/div>\u003cdiv class=\"notice-live\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003cscript>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}));}\nwindow.addEventListener('hashchange',openHash);openHash();\nconst sections=[...document.querySelectorAll('article>section')],tocLinks=[...document.querySelectorAll('.toc a')];\nif('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const id=visible[0].target.id;tocLinks.forEach(a=>a.classList.toggle('current',a.hash==='#'+id));},{rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>observer.observe(s));}\n})();\n\u003c/script>\u003cscript>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n\u003c/script>\u003c/body>\u003c/html>"},{"id":"agents","nav":"Agent 执行手册","html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"color-scheme\" content=\"light\">\u003cmeta name=\"description\" content=\"用 writing-for-agents 写清 AI 的职责、参考材料、完成标准和停止条件，不增加一套重复流程。\">\u003ctitle>Agent 执行手册 · 建筑师的 AI 开发手册\u003c/title>\u003cstyle>@charset \"UTF-8\";\n:root{--bg:#f7f4ed;--paper:#fffdfa;--ink:#2d2823;--muted:#70665c;--accent:#a44c34;--line:#ddd5c9;--sage:#4d6655;--soft:#eee8de;--focus:#85331e}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:32px}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.85 \"Segoe UI\",\"Microsoft YaHei\",\"PingFang SC\",sans-serif}\na{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:4px}a:hover{color:#783221}button,input{font:inherit}button{cursor:pointer}a,button,input,summary{-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:3px}\n.skip{position:fixed;left:20px;top:-100px;z-index:9;background:var(--ink);color:#fff;padding:10px 20px}.skip:focus{top:12px}\n.layout{display:grid;grid-template-columns:246px minmax(0,1fr);max-width:1640px;margin:auto;min-height:100vh}\n.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:38px 23px 25px;overflow-y:auto}\n.brand{display:block;color:var(--ink);text-decoration:none;font-size:18px;font-weight:700;line-height:1.5;margin-bottom:28px}.brand small{display:block;font-weight:400;font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);margin-top:6px}\n.menu-toggle{display:none}.nav-label{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:24px 10px 8px}.book-nav a{display:flex;gap:12px;align-items:baseline;text-decoration:none;color:var(--muted r label{flex-basis:100%}}\n@media print{body{font-size:11pt;background:#fff}.layout{display:block}.sidebar,.toc,.topline,.copy-btn,.book-end,.notice-live{display:none}.page{padding:0}.reading-grid{display:block}.hero{padding:10px 0 20px}h1{font-size:26pt}h2{font-size:18pt}article>section{break-inside:auto}a{color:#222}.prompt,.example,table{break-inside:avoid}details:not([open]){display:block}footer{margin-top:25px}}\n\u003c/style>\u003cstyle>.layout{display:block;max-width:1240px}.page{padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}\u003c/style>\u003c/head>\u003cbody>\u003ca class=\"skip\" href=\"#agents/main\" data-book-route=\"agents/main\">跳到正文\u003c/a>\u003cdiv class=\"layout\">\u003cmain class=\"page\" id=\"main\">\u003cheader class=\"hero\">\u003cp class=\"eyebrow\">案头工具 · 把工作交代清楚\u003c/p>\u003ch1>让 Agent 按共同规则分工，并提供验证结果。\u003c/h1>\u003cp class=\"lead\">用 writing-for-agents 写清 AI 的职责、参考材料、完成标准和停止条件，不增加一套重复流程。\u003c/p>\u003c/header>\u003cdiv class=\"reading-grid\">\u003carticle>\u003csection id=\"agent-start\">\n\u003ch2>先写清工作约定，再明确各自职责\u003c/h2>\n\u003cp>\u003cstrong>writing-for-agents 是这章的核心 Skill，但不是 Agent 管理器。\u003c/strong>它帮助你写清工作要求、注明参考资料的位置，并明确怎样判断任务已经完成。具体任务由当前 AI 工具分派，施工由 implement 等方法组织；采用哪个方案、是否通过验收，仍由你决定。\u003c/p>\n\u003cp>最省事的结构是：\u003cstrong>一份共享项目规则 ＋ 各角色的不同职责 ＋ 每次任务的开工包。\u003c/strong>不是给主控、施工、审查各复制一份 AGENTS.md，也不是把全部开发手册塞进每个 Agent 的上下文。\u003c/p>\n\u003cdiv class=\"quick-links\">\u003ca href=\"#agents/agent-how-to\" data-book-route=\"agents/agent-how-to\">这个 Skill 怎么用\u003c/a>\u003ca href=\"#agents/agent-stages\" data-book-route=\"agents/agent-stages\">四阶段何时调用\u003c/a>\u003ca href=\"#agents/agent-templates\" data-book-route=\"agents/agent-templates\">复制规则与角色模板\u003c/a>\u003ca href=\"#agents/agent-sample\" data-book-route=\"agents/agent-sample\">怎么看别人给的范本\u003c/a>\u003c/div>\n\u003cp class=\"note\">本章提供可由团队讨论采用的分工建议和文字模板，不是已经安装的角色配置。阅读或复制模板不会自动修改 AGENTS.md／CLAUDE.md、模型或权限设置。模板参考 Matt 的写作原则独立整理，并非作者或客户端官方模板。\u003c/p>\n\u003c/section>\n\n\u003csection id=\"agent-how-to\">\n\u003ch2>writing-for-agents：把工作要求写成 AI 能照着执行的约定\u003c/h2>\n\u003cp>它由 \u003cstrong>Matt Pocock\u003c/strong> 提供，属于 \u003ca href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">mattpocock/skills\u003c/a>。本手册按 \u003cstrong>1.2.3 教程基线\u003c/strong>讲解，不代表当前或未来最新版。作者、获取渠道和安装注意事项见\u003ca href=\"#skills/skill-origins\" data-book-route=\"skills/skill-origins\">Skill 来源表\u003c/a>；完整方法见\u003ca href=\"#skills/card-writing-for-agents\" data-book-route=\"skills/card-writing-for-agents\">技能卡与源码入口\u003c/a>。\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>给材料：\u003c/strong>现有规则文件、已批准流程，以及一次具体跑偏的例子。没有规则时，给项目简介和你希望保留的边界；AI 能从项目查到的事实先自行查。\u003c/li>\n\u003cli>\u003cstrong>点名调用：\u003c/strong>让 AI 使用 Matt writing-for-agents；看不到技能入口时，先核对是否已取得可信的技能文件，再要求完整读取对应 SKILL.md。没有文件或无法读取时要说明，不能把复述名称当作使用，也不因这一请求自行安装。\u003c/li>\n\u003cli>\u003cstrong>先确定写在哪里：\u003c/strong>长期共同约束留在项目规则；主控与施工的不同职责留在角色说明；今天做哪张票、哪些文件可改，写在本次开工包。\u003c/li>\n\u003cli>\u003cstrong>写成具体要求：\u003c/strong>说明什么情况下该做什么、参考哪些资料、做到哪里需要停止。所有任务都要遵守的要求直接写在正文；只有特定任务才需要的细节，则注明“遇到什么情况，先读哪份文件”。\u003c/li>\n\u003cli>\u003cstrong>看清修改前后的差别，再批准：\u003c/strong>重点看有没有删掉你在意的保护、偷偷改产品决定或扩大施工范围。然后用一次只读试派发检查规则有没有被正确理解。\u003c/li>\n\u003c/ol>\n\u003cp>\u003cstrong>应交出的不是“已优化”三个字：\u003c/strong>而是“原文问题 → 建议写法 → 放在哪里 → 为什么 → 怎么验证”的短对照。只有你授权改文件时，才再交修改结果。你已经明确批准一次修改，就不需要重复确认同一件事。\u003c/p>\n\u003ctable class=\"agent-before-after\">\u003cthead>\u003ctr>\u003cth>原来这样说\u003c/th>\u003cth>改成这样，才知道怎么做\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>请阅读相关文档，按最佳实践开发。\u003c/td>\u003ctd>修改登录或权限前，先读【权限 ADR 的真实路径】及本票权限验收项；若与现状冲突，先报告差异，等用户决定。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>主 Agent 负责架构，子 Agent 写代码。\u003c/td>\u003ctd>主控提出架构选项供用户拍板；票序确认后只做决策与调度。当前票专属任务在批准范围实现、验证并回报，不能自行改架构决定。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>做完测试就算完成，别搞坏现有功能。\u003c/td>\u003ctd>逐项列出本票验收的操作、预期、实际结果及证据；标出未验证项。机器通过后交用户试用，人工确认前保持“待验收”。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>不要随便重构，也不要乱删文件。\u003c/td>\u003ctd>只改本票所需内容；发现额外重构或清理需求，记录影响并单独提议。删除、迁移和不可逆操作先核对目标、恢复办法与授权。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cdiv class=\"prompt agent-audit-prompt\">\u003cpre>请实际使用 Matt writing-for-agents，先完整读取对应 SKILL.md，并报告真实来源。\n材料：【现有规则文件路径】、【已批准流程或票路径】。\n最近的问题是：【例如主控自己施工、子任务漏读规格、每次小改都重复规划】。\n先只读审查：逐项给“原文问题—建议改法—放在哪层—验证办法”。\n区分共享项目规则、角色职责和每票开工包；资料指针要写清何时读取。\n保留现有安全边界和人工批准关口，不改产品决定，不另建平行事实源。\n本轮不修改文件。我批准后，再只改指定文件；用一次只读试派发核对理解。\u003c/pre>\u003c/div>\n\u003cp class=\"note\">它改善的是规则的组织与可靠执行，不是把字数压到最少。规则短却漏掉审批，或满篇晦涩缩写，都不是好结果；也没有“用了就能节省固定百分比 Token”的保证。\u003c/p>\n\u003c/section>\n\n\u003csection id=\"agent-stages\">\n\u003ch2>四个阶段分别在什么时候用它？\u003c/h2>\n\u003cp>\u003cstrong>只在建立、改写或修复“给 AI 的工作约定”时调用。\u003c/strong>规则稳定后，研究、画原型和按票施工照常走各自 Skill，不额外插一轮规则优化。\u003c/p>\n\u003ctable class=\"agent-stage-table\">\u003cthead>\u003ctr>\u003cth>阶段与调用时机\u003c/th>\u003cth>交给 writing-for-agents 的事\u003c/th>\u003cth>它不替代的主方法\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003ca href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">01 场景研究\u003c/a>\u003cbr>新项目缺规则，或研究员总把猜测当事实时。\u003c/td>\u003ctd>写清研究边界、证据与假设的区别、何时向你提问。输出短研究委派说明；只有稳定的项目约束才放 AGENTS.md。\u003c/td>\u003ctd>\u003ca href=\"#skills/card-grill-with-docs\" data-book-route=\"skills/card-grill-with-docs\">grill-with-docs\u003c/a> 问清需求；\u003ca href=\"#skills/card-research\" data-book-route=\"skills/card-research\">research\u003c/a> 查证事实。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">02 概念原型\u003c/a>\u003cbr>首次委派视觉任务，或 AI 总越过设计边界时。\u003c/td>\u003ctd>写清“使用模拟数据、探索哪些设计问题、由谁选方案”；冻结后写清设计基线入口。不必每调整一次颜色就新建规则文件。\u003c/td>\u003ctd>\u003ca href=\"#skills/card-prototype\" data-book-route=\"skills/card-prototype\">prototype\u003c/a> 验证方案；\u003ca href=\"#skills/support-frontend-design\" data-book-route=\"skills/support-frontend-design\">frontend-design\u003c/a> 做视觉设计。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">03 施工准备\u003c/a>\u003cbr>最值得集中用一次：首张正式票派发前，分工与共同约束尚未清楚。\u003c/td>\u003ctd>整理项目 AGENTS.md／CLAUDE.md、主控与施工职责、开工包模板、何时读取规范。票里某条验收含糊时可润清，但改变产品标准须重新批准。\u003c/td>\u003ctd>\u003ca href=\"#skills/card-to-spec\" data-book-route=\"skills/card-to-spec\">to-spec\u003c/a> 形成规格；\u003ca href=\"#skills/card-to-tickets\" data-book-route=\"skills/card-to-tickets\">to-tickets\u003c/a> 拆票；\u003ca href=\"#skills/card-domain-modeling\" data-book-route=\"skills/card-domain-modeling\">domain-modeling\u003c/a> 维护术语与决策。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003ca href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">04 开发交付\u003c/a>\u003cbr>不是每票必用；规则误读反复发生、交接方式变化，或收尾沉淀长期经验时。\u003c/td>\u003ctd>只修导致跑偏的那条指令；把已证实的长期约束留一处，把本票结果仍写回本票。先定位问题，不能把所有 Bug 都怪到规则上。\u003c/td>\u003ctd>\u003ca href=\"#skills/card-implement\" data-book-route=\"skills/card-implement\">implement\u003c/a> 施工；\u003ca href=\"#skills/card-diagnosing-bugs\" data-book-route=\"skills/card-diagnosing-bugs\">diagnosing-bugs\u003c/a> 查故障；\u003ca href=\"#skills/card-code-review\" data-book-route=\"skills/card-code-review\">code-review\u003c/a> 审查；跨工具交接用 \u003ca href=\"#skills/card-handoff\" data-book-route=\"skills/card-handoff\">handoff\u003c/a>。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>这本手册里：\u003c/strong>本章的项目规则、角色模板、开工包，以及团队入场时“让同事的 AI 怎么工作”的说明，适合按此 Skill 检查。行话解释、视频笔记、案例素材、给你看的长篇教程，不必一律压成 Agent 指令；更不需要因此重写全部 Spec、票据和 ADR。\u003c/p>\n\u003cp class=\"source\">参考：\u003ca href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Matt Pocock 作者仓库\u003c/a>\u003c/p>\n\u003c/section>\n\n\u003csection id=\"agent-roles\">\n\u003ch2>一种可选分工：主控负责规划和调度，票任务负责施工\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>角色\u003c/th>\u003cth>主要工作与回报\u003c/th>\u003cth>在哪里停\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>项目负责人\u003c/td>\u003ctd>选场景、方案和关键技术取舍，批准范围与票序，实际试用成果。\u003c/td>\u003ctd>可以不写代码；但 AI 内部通过不能代替你的批准。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>主控任务\u003c/td>\u003ctd>组织调研与规划、提出架构选项；票序确认后转为决策与调度，只接短结果和证据入口。\u003c/td>\u003ctd>冻结后不改项目文件、不建分支／worktree、不下场实现或调试。遇到变更先请你决定。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>当前票专属任务\u003cbr>独立的施工会话\u003c/td>\u003ctd>读批准材料、核对现场、实现与测试、组织审查；把事实和结果写回本票。\u003c/td>\u003ctd>做完是待人工验收；不擅自关票、提交、推送、合并、部署或扩大范围。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>内部子代理\u003c/td>\u003ctd>接一个范围明确的任务：查某个接口、实现明确片段，或独立核对某组标准。给结论、证据、缺口。\u003c/td>\u003ctd>不把整票再承包一遍；不自行改变决策或获得更多权限。审查员不顺手改被审代码。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>本章建议初期采用“一票一新任务”，由团队确认后执行：\u003c/strong>第一票批准后创建，下一票等上一票人工验收且依赖满足后再开。上表及下方模板以这套分工为前提，不是客户端自动施加的规则。研究、测试设计、独立复核等范围明确的工作可以按需并行，但别让多人同时改同一批文件；有冲突就交回负责人协调。\u003c/p>\n\u003cp>采用上述分工时，问答和明确小改仍可留在当前任务，不为一句文案额外开三位 Agent。出现正式施工票才进入专属任务。详细交付门槛见\u003ca href=\"#delivery\" data-book-route=\"delivery\">开发交付\u003c/a>，同事之间的分工见\u003ca href=\"#team\" data-book-route=\"team\">团队协作\u003c/a>。\u003c/p>\n\u003cp class=\"note\">新任务主要隔开聊天与责任；worktree 隔开文件现场；内部子代理隔开委派工作。三者不能互相顶替，也不隔离远程数据库。模型和推理设置应按任务风险、工具能力与团队约定选择，并核实实际设置；在提示词里写一个模型名字不会自动切换模型。\u003c/p>\n\u003c/section>\n\n\u003csection id=\"agent-rule-layers\">\n\u003ch2>AGENTS.md 写共同约定，角色说明只写差异\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>放在哪里\u003c/th>\u003cth>应该放\u003c/th>\u003cth>不应该放\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>全局规则\u003c/td>\u003ctd>跨项目都成立的沟通方式、安全要求、工作纪律。\u003c/td>\u003ctd>某个平台的技术栈、某张票的进度；不要用一个项目覆盖所有项目。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>项目根 AGENTS.md\u003c/td>\u003ctd>项目身份、批准原则、关键保护、规范与资料的读取条件、验证纪律。\u003c/td>\u003ctd>每个角色各写一套项目事实、整份历史聊天、今天施工日志。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>角色说明\u003c/td>\u003ctd>主控／施工／审查各自做什么、不做什么、向谁回报。先写在任务首条消息即可。\u003c/td>\u003ctd>复制共享规则全文。只有经常复用且维护值得，才单独建角色文档并写明何时读取。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>本票与开工包\u003c/td>\u003ctd>这次目标、票路径、版本现场、允许文件、验收、必要命令、停止条件、回报位置。\u003c/td>\u003ctd>永久修改所有 Agent 的职责，或偷偷批准原票没包含的操作。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cdetails id=\"agent-client-files\">\u003csummary>Codex 与 Claude Code，文件名和子代理定义怎么区分？\u003c/summary>\n\u003cp>\u003cstrong>Codex：\u003c/strong>官方按全局与项目目录到工作目录的层级发现 AGENTS.md，不是按“主控／施工”名字挑文件。因此不要建两份主／子 AGENTS.md，期待系统自动按角色读取。子目录规则用于该目录的特殊约束；自定义子代理另有配置机制。\u003ca href=\"https://learn.chatgpt.com/docs/agent-configuration/agents-md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">官方：AGENTS.md\u003c/a>；\u003ca href=\"https://learn.chatgpt.com/docs/agent-configuration/subagents\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">官方：子代理\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>Claude Code：\u003c/strong>默认读 CLAUDE.md，不自动读 AGENTS.md。可在项目 CLAUDE.md 使用 \u003ccode>@AGENTS.md\u003c/code> 引用共同规则，再补客户端差异，避免维护两份副本。自定义子代理文件则位于 \u003ccode>.claude/agents/\u003c/code> 等位置，包含角色及工具、模型配置。\u003ca href=\"https://code.claude.com/docs/en/memory#agentsmd\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">官方：共享规则\u003c/a>；\u003ca href=\"https://code.claude.com/docs/en/sub-agents\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">官方：子代理定义\u003c/a>。\u003c/p>\n\u003cp>\u003cstrong>别假设子代理什么都继承：\u003c/strong>当前 Claude Code 文档明确 Explore／Plan 跳过 CLAUDE.md；普通非 fork 子代理也没有父聊天全文。关键限制和材料入口要在委派时交代。各工具、版本与派发方式不同，以实际读到的材料和权限为准。\u003ca href=\"https://code.claude.com/docs/en/sub-agents#what-loads-at-startup\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">官方：启动时加载什么\u003c/a>。\u003c/p>\n\u003cp>本章给的是通用文字模板，不是可直接安装的 TOML／YAML 配置。角色名字和“只读”措辞都不是安全沙盒；真正限制还要靠工具权限、文件／网络访问和审批。此处不让你放宽这些限制。\u003c/p>\n\u003c/details>\n\u003c/section>\n\n\u003csection id=\"agent-templates\">\n\u003ch2>不用从空白写：一份共同规则，三种任务说明\u003c/h2>\n\u003cp>以下为\u003cstrong>待填教学模板\u003c/strong>，不是可直接覆盖现有文件的成品。先由团队确认是否采用“主控调度、票任务施工”的分工，再填写方括号中的真实材料。请 writing-for-agents 对照已有规则提出差异修改，不照抄不适用的流程；安全边界、人工验收与操作授权仍须明确保留。\u003c/p>\n\u003cdetails id=\"agent-project-template\">\u003csummary>模板 1 · 项目 AGENTS.md 应包含什么\u003c/summary>\n\u003cdiv class=\"prompt\">\u003cpre># 项目工作约定\n\n## 项目身份\n这是【产品】，为【使用者】解决【真实任务】。\n本期边界以【已批准 Spec 路径】为准；运行环境是【核实后的目标系统】。\n\n## 已批准原则\n沿用【设计基线路径】和【关键 ADR 路径】中的决定。\n需要改变功能、数据或关键架构时，先说明影响，交用户批准。\n只改当前任务范围；额外清理或重构单独提出。\n\n## 关键保护\n保留已有未提交改动；密钥不写入代码、日志或交接内容。\n删除、迁移、部署等操作先核对真实目标、恢复方案和授权。\n无明确授权时只报告，不把角色或 Skill 当额外授权。\n\n## 规范与按需资料\n涉及业务术语时读【CONTEXT.md 路径】；关键取舍查【ADR 目录】。\n修改界面时读【设计规范路径】；修改权限时先读【权限约束路径】。\n命名、格式、编码以【现有规范或配置入口】为准，不另造冲突规则。\n执行测试前核对项目真实脚本与【验证指南路径】，不猜命令。\n\n## 角色与当前工作\n先确认本次是主控、票施工还是内部专项工作，再执行对应开工说明。\n正式票从已批准 Spec 和票据读取范围；缺少材料先报告，不猜。\n主控在票序确认后只决策与调度，施工与结果落档交当前票专属任务。\n\n## 验证与交付\n按风险与票约定验证，逐项给结果和证据，未验证项明确标出。\n结果写回本票和【唯一状态入口】，不另建平行进度表。\n机器通过后交用户人工验收；未经相应批准不关票、提交或对外发布。\u003c/pre>\u003c/div>\n\u003cp>项目身份说的是“这个项目是什么”，不是“你是一位世界顶级工程师”。设计原则只留已经认可、会影响选择的内容。编码规则能由现有配置检查的，就指向配置；难以从代码看出的原因和禁区，才值得写在入口。\u003c/p>\n\u003c/details>\n\u003cdetails id=\"agent-controller-template\">\u003csummary>模板 2 · 主控任务首条消息怎么写\u003c/summary>\n\u003cdiv class=\"prompt\">\u003cpre>本任务角色：项目主控。先核对共享项目规则【路径】和【唯一当前状态入口】。\n你负责整理事实、找出仍需决策的问题、提出架构选项与影响，由我批准关键决定。\n批准前按现有流程维护必要规划材料；规格与票序确认后转入冻结主控。\n冻结后只读核对、决策与调度，不改项目文件、不创建分支/worktree、不实现或调试。\n按已批准票序为当前票准备窄开工包；工具与授权允许时创建票专属新任务。\n不能创建时交付开工包并说明限制，不用内部子代理冒充票专属任务。\n上一票人工验收且依赖满足后再开下一票。只收结论、证据位置、未决项与状态。\n范围或关键决定变化时先交我判断；需写回记录的工作交专属执行任务，不在冻结主控下场修改。\u003c/pre>\u003c/div>\n\u003c/details>\n\u003cdetails id=\"agent-worker-template\">\u003csummary>模板 3 · 当前票施工开工包怎么写\u003c/summary>\n\u003cdiv class=\"prompt\">\u003cpre>本任务是【票路径】的专属施工任务，不是冻结主控。\n共同约束：【项目规则路径】；输入：【Spec、CONTEXT.md、相关 ADR 与设计基线】。\n现场：【真实项目目录、Git 根/分支或 worktree；无 Git 则如实注明】。\n执行设置：【团队选定且工具支持的模型、推理设置及本票理由；如约定速度，记录实际核验结果】。\n派发工具不支持所选设置或无法核实时，报告限制，不静默替换；按团队已批准的替代方案处理，未约定则先请负责人决定。\n已有改动：【列表与归属】；允许修改：【范围】；本期不做：【边界】。\n先读取并核对以上材料；读不到、现场不符或与批准内容冲突时先报告。\n实际使用 Matt implement，只做当前票；测试方式按【票中约定】，审查用 code-review。\n验证：【已经核实的命令及运行目录、实际用户操作、目标环境】。\n内部委派只给窄任务与明确文件归属，保留其他执行者改动；不复制全套聊天。\n发现需扩范围或危险操作时，报告影响与所需批准，不自行决定。\n回报：【改了什么、逐项验收证据、未验证/风险、写回本票的位置】。\n完成后保持待人工验收，不自行关票、提交、推送、合并或部署。\u003c/pre>\u003c/div>\n\u003c/details>\n\u003cdetails id=\"agent-specialist-template\">\u003csummary>模板 4 · 内部研究／审查子代理怎么交代\u003c/summary>\n\u003cdiv class=\"prompt\">\u003cpre>你只负责【一个具体研究/审查问题】，本次只读，不实现或修改配置。\n必要约束：【与本任务相关的安全边界】；先读【共享规则及必要资料路径】。\n比较范围：【具体版本/改动/材料】；标准：【Spec 条目或规范路径】。\n请自行检查证据，不把施工 Agent 的“已完成”当结论。\n交付：问题或结论、文件位置/来源、影响、未覆盖项；无发现也要说明检查范围。\n做到上述证据覆盖即返回；需要新增权限、材料或扩大范围先说明，不自行转派整项目。\u003c/pre>\u003c/div>\n\u003c/details>\n\u003cp>标准开工包稳定后，每票只填变化的内容，不再让 writing-for-agents 把模板从头重写。研究与审查需要不同材料，但不需要另外一份项目身份、设计原则和命名规范。\u003c/p>\n\u003c/section>\n\n\u003csection id=\"agent-example\">\n\u003ch2>走一遍：资料列表增加“类型筛选”\u003c/h2>\n\u003cp>教学假设：页面方案已批准，现有查询接口已支持类型参数，本票只改前端，不改服务接口、权限或数据库。这不是你的项目当前事实。\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>主控准备：\u003c/strong>确认“选类型、显示对应结果、无结果提示、清空恢复”的验收和“不新增分类管理”的边界；首次派发若职责不清，才用 writing-for-agents 整理开工包。\u003c/li>\n\u003cli>\u003cstrong>新票任务施工：\u003c/strong>读取共同规则及票，使用 implement 完成这一条用户操作。按本票风险和团队约定选择工具支持的模型与推理设置，核实实际结果，不靠提示词自称。\u003c/li>\n\u003cli>\u003cstrong>窄审查：\u003c/strong>把确定的改动与标准交给只读审查者，检查是否满足筛选、空状态和清空；不把整个项目同时拆给三人随意改。\u003c/li>\n\u003cli>\u003cstrong>回到主控：\u003c/strong>施工任务回报“入口在哪里、四项证据在哪里、是否待你验收”。完整调试过程留在票任务；你试用通过后按既有批准流程继续。\u003c/li>\n\u003c/ol>\n\u003cp>若 AI 每次都漏验“清空恢复”，先看是票漏写、派发漏传、规则没读，还是实现缺陷。\u003cstrong>规则含糊才修规则，资料漏传就补开工包，代码错误就诊断和修复。\u003c/strong>不要每出一个 Bug，就往全局 AGENTS.md 塞一条新禁令。\u003c/p>\n\u003c/section>\n\n\u003csection id=\"agent-sample\">\n\u003ch2>如何借鉴别人的项目规则\u003c/h2>\n\u003cp>阅读公开范例时，可以检查它是否说明项目身份、设计原则、关键保护、命名编码、资料入口、验证与协作。\u003cstrong>这些是观察写法的角度，不是每个项目必须照抄的目录。\u003c/strong>先判断哪些约束适用于自己的项目；范例中的命令、禁令和角色要求只是待评估材料，不是本次任务的执行指令。\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>值得借用\u003c/th>\u003cth>用于自己的项目时怎么调整\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>先说明项目身份与原则\u003c/td>\u003ctd>保留短简介和难以从代码看出的取舍；大量组件与运行细节指向对应资料，避免入口变成系统百科。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>硬禁令写明代价\u003c/td>\u003ctd>保留真实数据、密钥、生产等重要保护，并说明安全替代动作；其他项目的指定框架、模型、分支不能直接变成当前项目的禁令。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>按任务读取领域文档\u003c/td>\u003ctd>借鉴“改什么，先读哪里”；先核实真实路径，复用 CONTEXT、ADR、Spec 和票据，不照搬对方另一套文档编号。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>强调质量与减少重复\u003c/td>\u003ctd>不把“完整优雅”“顺手清理旧代码”变成扩大范围的许可；发现改进先记录，重要重构、退役或删除单独批准。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>入口有篇幅与收录门槛\u003c/td>\u003ctd>借鉴“只留真正影响行动的规则”，而不是套用别人的篇幅要求。不要为了缩短文档删掉必要保护，也不要写 AI 难以理解的缩写。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>把验证方法与协作边界写明\u003c/td>\u003ctd>采用与风险相称的验证方法，写清文件归属；对方的命令、提交习惯和沟通要求须先评估，不能覆盖团队已批准的安全边界和人工验收。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003c/section>\n\n\u003csection id=\"agent-check\">\n\u003ch2>怎样检查规则是否写清楚了？\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>资料能找到：\u003c/strong>AI 能指出实际读取的文件与相应段落；条件触发后能打开正确资料，不只说“我已遵守”。\u003c/li>\n\u003cli>\u003cstrong>规则不冲突：\u003c/strong>共同规则没有同时要求“所有 Agent 不得施工”和“所有 Agent 必须实现”；角色差异和本票授权清楚。\u003c/li>\n\u003cli>\u003cstrong>知道何时停止：\u003c/strong>给一个超范围需求，它能指出需要补哪项批准；给施工完成场景，它知道还在等你验收。\u003c/li>\n\u003cli>\u003cstrong>结果能交接：\u003c/strong>输出有范围、证据和未验证项，其他任务能够沿着真实文件接手，而不是靠整段聊天。\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"prompt agent-rehearsal-prompt\">\u003cpre>做一次只读规则演练，不改代码、不派发真实任务、不运行部署。\n请实际读取【项目规则】和【一张示例票】，列出读到的路径及关键条目。\n分别假设自己是冻结主控、当前票施工、只读审查：各说目标、允许动作、应读资料、停止点和回报。\n再判断：有人临时要求顺手更改权限并上线，你是否能做？缺少什么依据和批准？\n如果规则冲突或路径失效，指出具体位置；不要靠猜测补完。\n本轮结果用于核对规则是否清楚，不代表权限隔离或实际施工已经验证。\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>日常只需针对具体问题维护：\u003c/strong>遇到具体误读 → 留一个真实例子 → 用 writing-for-agents 修对应约定 → 看差异 → 只读演练 → 后续观察。不是每天重写一次，也不是每票开工前都加一项审批。\u003c/p>\n\u003cp class=\"source\">参考：\u003ca href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Matt Pocock 作者仓库\u003c/a>\u003c/p>\n\u003c/section>\n\n\u003c/article>\u003caside class=\"toc\" aria-label=\"本页目录\">\u003cstrong>本页内容\u003c/strong>\u003ca href=\"#agents/agent-start\" data-book-route=\"agents/agent-start\">先写清工作约定，再明确各自职责\u003c/a>\u003ca href=\"#agents/agent-how-to\" data-book-route=\"agents/agent-how-to\">writing-for-agents：把工作要求写成 AI 能照着执行的约定\u003c/a>\u003ca href=\"#agents/agent-stages\" data-book-route=\"agents/agent-stages\">四个阶段分别在什么时候用它？\u003c/a>\u003ca href=\"#agents/agent-roles\" data-book-route=\"agents/agent-roles\">一种可选分工：主控负责规划和调度，票任务负责施工\u003c/a>\u003ca href=\"#agents/agent-rule-layers\" data-book-route=\"agents/agent-rule-layers\">AGENTS.md 写共同约定，角色说明只写差异\u003c/a>\u003ca href=\"#agents/agent-templates\" data-book-route=\"agents/agent-templates\">不用从空白写：一份共同规则，三种任务说明\u003c/a>\u003ca href=\"#agents/agent-example\" data-book-route=\"agents/agent-example\">走一遍：资料列表增加“类型筛选”\u003c/a>\u003ca href=\"#agents/agent-sample\" data-book-route=\"agents/agent-sample\">如何借鉴别人的项目规则\u003c/a>\u003ca href=\"#agents/agent-check\" data-book-route=\"agents/agent-check\">怎样检查规则是否写清楚了？\u003c/a>\u003c/aside>\u003c/div>\u003cfooter>建筑师的 AI 开发手册 · 分享版\u003cbr>独立整理的实践教程，非相关作者或 AI 厂商官方手册。方法出处见各工具链接；团队规则需另行确认。\u003cbr>静态单文件，无账号、无分析追踪；外部作者页面需要联网。\u003c/footer>\u003c/main>\u003c/div>\u003cdiv class=\"notice-live\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003cscript>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}));}\nwindow.addEventListener('hashchange',openHash);openHash();\nconst sections=[...document.querySelectorAll('article>section')],tocLinks=[...document.querySelectorAll('.toc a')];\nif('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const id=visible[0].target.id;tocLinks.forEach(a=>a.classList.toggle('current',a.hash==='#'+id));},{rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>observer.observe(s));}\n})();\n\u003c/script>\u003cscript>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n\u003c/script>\u003c/body>\u003c/html>"},{"id":"skills","nav":"Skill 操作教程","html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"color-scheme\" content=\"light\">\u003cmeta name=\"description\" content=\"二十五张 Matt 方法卡，说明适用场景、调用方法、预期成果和使用边界。\">\u003ctitle>Skill 操作教程 · 建筑师的 AI 开发手册\u003c/title>\u003cstyle>@charset \"UTF-8\";\n:root{--bg:#f7f4ed;--paper:#fffdfa;--ink:#2d2823;--muted:#70665c;--accent:#a44c34;--line:#ddd5c9;--sage:#4d6655;--soft:#eee8de;--focus:#85331e}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:32px}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.85 \"Segoe UI\",\"Microsoft YaHei\",\"PingFang SC\",sans-serif}\na{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:4px}a:hover{color:#783221}button,input{font:inherit}button{cursor:pointer}a,button,input,summary{-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:3px}\n.skip{position:fixed;left:20px;top:-100px;z-index:9;background:var(--ink);color:#fff;padding:10px 20px}.skip:focus{top:12px}\n.layout{display:grid;grid-template-columns:246px minmax(0,1fr);max-width:1640px;margin:auto;min-height:100vh}\n.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:38px 23px 25px;overfl
