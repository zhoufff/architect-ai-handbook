ize:17px;overflow-wrap:anywhere}.term-plain{font-size:14px;font-weight:400;color:var(--muted)}.term-body{padding:6px 22px 6px;border-left:2px solid #c8aa91;margin-top:18px}.term-analogy{color:#79543b;font-size:14px}.term-card dl{margin:20px 0}.term-card dt{font-size:12px;color:var(--accent);margin:18px 0 4px}.term-card dd{margin:0;font-size:15px;overflow-wrap:anywhere}.term-card dd p{margin:0 0 9px}.term-check{padding:15px 18px;background:#eee7db}.term-pitfall{font-size:13px!important;color:var(--muted)}.term-walk li{margin:18px 0}.term-walk strong{color:#79543b}\n@media(max-width:760px){.term-body{padding-left:15px;padding-right:0}.term-name{font-size:16px}.term-plain{font-size:13px}.term-filter label{flex-basis:100%}}\n@media print{body{font-size:11pt;background:#fff}.layout{display:block}.sidebar,.toc,.topline,.copy-btn,.book-end,.notice-live{display:none}.page{padding:0}.reading-grid{display:block}.hero{padding:10px 0 20px}h1{font-size:26pt}h2{font-size:18pt}article>section{break-inside:auto}a{color:#222}.prompt,.example,table{break-inside:avoid}details:not([open]){display:block}footer{margin-top:25px}}\n</style><style>.layout{display:block;max-width:1240px}.page{padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}</style></head><body><a class=\"skip\" href=\"#skills/main\" data-book-route=\"skills/main\">跳到正文</a><div class=\"layout\"><main class=\"page\" id=\"main\"><header class=\"hero\"><p class=\"eyebrow\">案头工具 · 具体怎么说</p><h1>按任务选择 Skill，不必记住所有名称。</h1><p class=\"lead\">先从八个实际问题看如何选择和使用技能，再查二十五张 Matt 方法卡；每个例子都有步骤、提示和验收方法。</p></header><div class=\"reading-grid\"><article><section id=\"start-with-the-job\">\n<h2>Skill 提供做事的方法，不会代替你自动完成任务</h2>\n<p>复杂目标需要跨会话研究、看原型和作决定？看<a href=\"#wayfinder/start\" data-book-route=\"wayfinder/start\">Wayfinder 使用说明</a>：完整步骤、Windows 设计助手例子和两条视频学习笔记，都已合并在本手册里。</p>\n<p>已经有项目记录，想每轮拿到一页决策简报、平时直接问？看<a href=\"#wayfinder/visualization\" data-book-route=\"wayfinder/visualization\">每轮一页简报与决策问答</a>；要配架构图，看<a href=\"#skills/card-decision-map\" data-book-route=\"skills/card-decision-map\">Archify 技能卡</a>。两者都配合 Wayfinder，也可用于已有项目，不需要每次重新规划。</p>\n<p>想直接照着做？看<a href=\"#skills/case-entry\" data-book-route=\"skills/case-entry\">八个实际问题的完整案例</a>：资料散乱、规则过重、需求不清、页面返工、架构取舍、正式施工、故障排查和新 Agent 接手。每个案例都说明先做什么、何时用技能、应看到什么结果。</p>\n<p>想用好 <code>writing-for-agents</code>？看<a href=\"#agents/agent-how-to\" data-book-route=\"agents/agent-how-to\">完整使用课</a>与<a href=\"#agents/agent-stages\" data-book-route=\"agents/agent-stages\">四阶段调用时机</a>，再看<a href=\"#agents/agent-templates\" data-book-route=\"agents/agent-templates\">项目规则和主控／施工模板</a>；不用自己从短卡猜该怎么写。</p>\n<p>与同事合作时，不必让每个人复制你的全套插件。看<a href=\"#team/team-skills\" data-book-route=\"team/team-skills\">协作环节与 Skill 对照</a>及<a href=\"#team/team-onboarding\" data-book-route=\"team/team-onboarding\">同事入场说明</a>。</p>\n<p class=\"glossary-entry\">知道技能名，却不懂它交出的 Spec、ADR 或 Ticket？看<a href=\"#glossary/term-lookup\" data-book-route=\"glossary/term-lookup\">行话与 Skill 对照</a>；这里的方法卡教你怎么调用，那里的词条教你怎么判断产物。</p>\n<p>普通提示告诉 AI“做什么”；Skill 额外提供“按什么步骤做、注意什么、交出什么”。装好只代表文件可用，不保证每个任务都触发，更不保证结果正确。先选要解决的问题，再选一张主方法卡。</p>\n<p>不用自己从 25 张卡拼流程：先到<a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">场景研究</a>、<a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型</a>、<a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a>或<a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a>看本阶段推荐。那里有直接点名技能的启动提示；本页供你了解每张卡的细节。</p>\n<aside class=\"note\"><p>Matt 插件发布了 25 项，其中 14 项明确设为手动，不会因为聊天“像这个任务”就自动载入。另 11 项可以按描述匹配，实际入口仍取决于应用是否提供。目录里另有开发中材料，不等于已发布功能。</p></aside>\n<p class=\"source\">作者电脑上的 manifest、SKILL.md 与 agents/openai.yaml 已核对；<a href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Matt 原仓库</a>；<a href=\"https://learn.chatgpt.com/docs/build-skills\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">OpenAI：显式与隐式调用</a>。</p>\n</section>\n<section id=\"invoke-and-check\">\n<h2>怎样调用 Skill，并检查它是否发挥了作用</h2>\n<ol>\n<li>优先在当前应用的技能入口搜索完整名称，如 <code>mattpocock-skills:grill-with-docs</code>，选择后补本次目标和文件。</li>\n<li>客户端用法不同。下面的 <code>/to-spec</code> 等是便于阅读的短称，不保证直接敲进每个桌面输入框都能注册成命令。</li>\n<li>入口没有时，让 AI 明确读取本机对应 <code>SKILL.md</code> 全文并按它执行，报告读取路径与适用步骤。读不到就回报，不能只说“已调用”。</li>\n<li>验收看输出：盘问有没有找出真实分歧？规格有没有检查标准？实现有没有证据？“加载了技能”本身不是成功。</li>\n</ol>\n<div class=\"prompt\"><pre>请使用 Matt 的 grill-with-docs 梳理【本次功能】。\n如果没有对应命令入口，请完整读取：\n【本机插件缓存中的 SKILL.md 完整路径，形如 …/mattpocock-skills/&lt;版本&gt;/skills/engineering/grill-with-docs/SKILL.md】\n报告实际读到的路径，并按内容执行；不要假装命令已注册。\n先读现有批准材料和代码中可确认的事实，只问仍需我拍板的问题。暂不实现。</pre></div>\n<details><summary>为什么名字与视频不一样？</summary>\n<p>视频是当时版本：write-a-prd、prd-to-plan、prd-to-issues、to-issues 等历史说法，要按当前版本核对对应的规格与票据用途，不能只机械替换字符串。如今主链为 <code>grill-with-docs → to-spec → to-tickets → implement</code>。Prototype 的组织方式和 Superpowers 版本也有变化。</p>\n<p>以下方法以作者核对时的版本为准；升级后复核路径和调用字段。</p>\n</details>\n</section>\n<section id=\"case-entry\">\n<h2>遇到实际问题时，从这里选一条做法</h2>\n<p>以下都是教学情境，不表示真实项目已经存在这些问题或批准这些方案。读一个符合当前情况的案例就够了，不必把八个案例依次执行。技能名可以点开看方法卡；提示中的【内容】需换成真实材料。</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>你遇到的情况</th>\n<th>先用什么</th>\n<th>完整案例</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>文档散落，新 Agent 不知道读哪份</td>\n<td>先只读盘点；入口规则需要整理时用 writing-for-agents</td>\n<td><a href=\"#skills/case-documents\" data-book-route=\"skills/case-documents\">整理资料入口</a></td>\n</tr>\n<tr>\n<td>改几个字也被要求规划、拆票</td>\n<td>先确认实际风险；检查规则时用 writing-for-agents</td>\n<td><a href=\"#skills/case-rules\" data-book-route=\"skills/case-rules\">修正规则，不删安全要求</a></td>\n</tr>\n<tr>\n<td>想做资料库，但第一期做什么不清楚</td>\n<td>grill-with-docs；缺外部事实才加 research</td>\n<td><a href=\"#skills/case-research\" data-book-route=\"skills/case-research\">把想法变成可确认的问题</a></td>\n</tr>\n<tr>\n<td>页面越改越乱，大家意见不一致</td>\n<td>prototype 回答具体设计问题</td>\n<td><a href=\"#skills/case-prototype\" data-book-route=\"skills/case-prototype\">用原型比较操作流程</a></td>\n</tr>\n<tr>\n<td>模块边界和重要技术取舍迟迟未定</td>\n<td>codebase-design 帮助分析；domain-modeling 记录词义和重要决定</td>\n<td><a href=\"#skills/case-decision\" data-book-route=\"skills/case-decision\">分清方案分析与决策记录</a></td>\n</tr>\n<tr>\n<td>规格、方案和施工票都已批准</td>\n<td>在专属施工任务中用 implement</td>\n<td><a href=\"#skills/case-implementation\" data-book-route=\"skills/case-implementation\">按票施工到验收</a></td>\n</tr>\n<tr>\n<td>功能报错，AI 反复尝试却没找到原因</td>\n<td>diagnosing-bugs</td>\n<td><a href=\"#skills/case-bug\" data-book-route=\"skills/case-bug\">先找到原因，再授权修复</a></td>\n</tr>\n<tr>\n<td>换任务或换同事，之前的判断接不上</td>\n<td>先核对项目导航和票；现有材料不足以接手才补 handoff</td>\n<td><a href=\"#skills/case-handoff\" data-book-route=\"skills/case-handoff\">用现有资料完成接手</a></td>\n</tr>\n</tbody></table></div>\n<aside class=\"note\"><p>这些组合是本手册把 Matt 方法与现有工作约定结合后的示例，不是作者要求每次执行的固定清单。Skill 提供方法，读取文件、操作浏览器和实际运行仍要靠相应工具；技能名本身不是完成证据。</p></aside>\n</section>\n<section id=\"case-walkthroughs\">\n<h2>展开一个案例，看看从开口到验收的全过程</h2>\n<details id=\"case-documents\"><summary>01 · 文档很多，但不知道哪个版本有效</summary>\n<p><strong>情境：</strong>项目里有“需求初稿”“接口新版”和几份聊天总结，新 Agent 把旧方案当成当前要求。目标是让它找对依据，不是把每份文件都读入上下文。</p>\n<p><strong>先准备：</strong>指定项目目录、允许盘点的文档范围，以及你已知的批准记录。找不到批准记录就标待核实，不让 AI 猜。</p>\n<ol>\n<li>先按<a href=\"#knowledge/knowledge-first-pass\" data-book-route=\"knowledge/knowledge-first-pass\">只读盘点流程</a>找用途、引用与矛盾；这个步骤不需要强行调用写作技能。</li>\n<li>选出需要你确认的权威版本，确定哪些正文集中存放、哪些保留原位。先展示整理建议，不自动搬迁。</li>\n<li>批准后，在规则入口和条件指针的改写上用 <a href=\"#skills/card-writing-for-agents\" data-book-route=\"skills/card-writing-for-agents\">writing-for-agents</a>。只有还没约定词典、决策和票据位置时，才补 <a href=\"#skills/card-setup-matt-pocock-skills\" data-book-route=\"skills/card-setup-matt-pocock-skills\">setup-matt-pocock-skills</a>；已有约定就复用。</li>\n<li>在获准的整理任务中修改，修复受影响引用，再用新任务只读检查能否找到依据。</li>\n</ol>\n<div class=\"prompt\"><pre>请只读盘点【项目目录】内的【文档范围】，先不要移动或改写。\n我要解决的是：新 Agent 不知道应该读哪份、哪些已经批准。\n列出重复、冲突、来源不明和失效引用；给出最小导航建议。\n如果现有 AGENTS.md 或 CLAUDE.md 的读取条件不清楚，请完整读取并使用 writing-for-agents 给出差异建议，先不修改。\n没有约定票据、词典和决策位置时，再说明 setup-matt-pocock-skills 能补什么；已有位置不要另建一套。\n让我确认权威文件和整理范围后，再安排实际改动。</pre></div>\n<p><strong>应看到：</strong>一份带来源的盘点清单，以及“遇到什么任务 → 读哪份文件”的导航建议。例如“修改下载权限前读权限 ADR 和当前票”，而不是“开工前读完所有 Markdown”。</p>\n<p><strong>怎么验收：</strong>让新 Agent 只凭入口回答“权限要求依据哪份、下一步能做什么”，并列出实际路径与版本。答对且没有依赖原聊天，才说明入口有用。完整方法见<a href=\"#knowledge/knowledge-recovery\" data-book-route=\"knowledge/knowledge-recovery\">接手演练</a>。</p>\n</details>\n<details id=\"case-rules\"><summary>02 · 只改按钮文字，AI 却要求重新规划和拆票</summary>\n<p><strong>情境：</strong>你明确要求将“收藏”改成“加入收藏”，行为、权限和数据均不变，AI 却把它当成新功能。先核对改动是否真的局部：如果同时改变收藏归属或访问权限，就不能按文案处理。</p>\n<ol>\n<li>让 AI 指出触发重流程的具体规则或缺失信息，不要先怪罪某个插件。</li>\n<li>若规则写成“所有任务都必须完整规划”，用 <a href=\"#skills/card-writing-for-agents\" data-book-route=\"skills/card-writing-for-agents\">writing-for-agents</a> 审查适用范围、重复与冲突；查清是全局规则、项目规则还是本次要求造成的。</li>\n<li>建议把范围写准确：目标明确、无需改变行为且可单独验证的文案改动可走短链；数据、权限或正式施工票仍按原流程。先给差异，获准后才改规则。</li>\n<li>分别用“按钮改字”和“增加管理员权限”演练，检查是否能正确分流。</li>\n</ol>\n<div class=\"prompt\"><pre>请只读检查【实际规则文件】与【本次任务要求】，使用 writing-for-agents 分析为什么局部文案修改被要求重走全流程。\n指出具体条款、适用范围和冲突；先判断本次是否真的不改变行为、权限或数据。\n给最小差异建议，不自动修改全局或项目规则，不删除授权与验收要求。\n用“改按钮文案”和“修改管理员权限”各演练一次，说明两者应该走哪条路线及原因。</pre></div>\n<p><strong>应看到：</strong>具体的规则前后对照、修改理由、两种情境的分流结果。若原因是需求本身不清，应补需求，不硬改规则。</p>\n<p><strong>怎么验收：</strong>小改能直接进入范围明确的执行与检查，高风险任务仍保留必要审批和验证。无需再调用一套 brainstorming 或另写 Spec。更多写法见<a href=\"#agents/agent-how-to\" data-book-route=\"agents/agent-how-to\">规则使用课</a>；<a href=\"#governance/karpathy-role\" data-book-route=\"governance/karpathy-role\">Karpathy</a> 在这里作为“小范围修改”的行为底线，不是额外审批环节。</p>\n</details>\n<details id=\"case-research\"><summary>03 · 我想做一个资料库，但说不清第一期要解决什么</summary>\n<p><strong>情境：</strong>你有同事访谈和几次找案例的记录，却还没有确认最需要解决的问题。此时需要澄清用途，不急着选框架、建数据库。</p>\n<ol>\n<li>有项目材料时从 <a href=\"#skills/card-grill-with-docs\" data-book-route=\"skills/card-grill-with-docs\">grill-with-docs</a> 开始，让 AI 先读已有证据，区分事实、推测和需要你决定的取舍。</li>\n<li>目标复杂、多个决定互相影响且预计需要跨会话推进，又不清楚从哪里开始时，可先选 <a href=\"#skills/card-wayfinder\" data-book-route=\"skills/card-wayfinder\">wayfinder</a> 帮助找方向；简单想法尚未说清，不必用它，也不用与已充分进行的盘问重复一轮。</li>\n<li>只有需要核实外部能力、许可或技术事实时，才把具体问题交给 <a href=\"#skills/card-research\" data-book-route=\"skills/card-research\">research</a>。同事真正需要什么仍要看真实工作证据，网络文章不能代答。</li>\n<li>形成第一期目标和不做清单，经你确认后进入概念原型；正式规格在相应准备阶段形成，不提前把猜测写死。</li>\n</ol>\n<div class=\"prompt\"><pre>请使用 grill-with-docs，基于【访谈/工作记录/已有策划】梳理资料库第一期的目标。\n先还原一次真实任务：谁在什么情况下找什么，现有方法哪里卡住，造成什么后果。\n标清已知事实、待验证假设和需要我决定的问题；材料能回答的不要重复问。\n确实缺外部资料时，提出一个可交给 research 的具体问题，并说明会影响哪个决定。\n这轮不做页面、不选技术栈、不写实现；给我确认目标与第一期边界。</pre></div>\n<p><strong>应看到：</strong>一个有出处的具体问题描述，例如“同事难以确认某案例的来源与适用条件”，以及是否纳入第一期的理由；不是直接生成几十个功能。</p>\n<p><strong>怎么验收：</strong>你能用自己的话说清谁会受益、改善哪一步、如何判断改善了；缺证据的内容仍明确标注。可接着看<a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">场景研究的技能安排</a>。</p>\n</details>\n<details id=\"case-prototype\"><summary>04 · 页面反复修改，大家却说不清哪个好用</summary>\n<p><strong>情境：</strong>目标已明确，但“在列表旁预览”与“点进详情查看”哪种更适合比较案例，还没有结论。先比较操作方式，再细调颜色和动效。</p>\n<ol>\n<li>用 <a href=\"#skills/card-prototype\" data-book-route=\"skills/card-prototype\">prototype</a> 围绕这一个问题做最小可点击样例，沿用同一组逼真但非敏感的模拟数据。</li>\n<li>让你或同事完成同一任务，如“比较两个案例并找到来源”，记录实际困难，不把 AI 的审美判断当作用户结论。</li>\n<li>选定方向后，需要视觉细化才用 <a href=\"#skills/support-frontend-design\" data-book-route=\"skills/support-frontend-design\">frontend-design</a>；只需完善具体组件反馈时用 <a href=\"#skills/support-emil\" data-book-route=\"skills/support-emil\">emil-design-eng</a>。不要同时让多个设计技能重选方向。</li>\n<li>用 <a href=\"#skills/support-webapp-testing\" data-book-route=\"skills/support-webapp-testing\">webapp-testing</a> 检查页面能否走通。若方案涉及原生窗口或电脑控制，需要在目标 Windows 环境另验。</li>\n</ol>\n<div class=\"prompt\"><pre>请用 prototype 回答【设计问题】，依据【已批准目标】制作【需要比较的方案】。\n这是可抛弃原型，不连接生产数据、不扩充功能；使用同一组脱敏模拟数据。\n把需要体验的操作和观察标准列清，让我实际比较后再确定方向。\n若随后需要视觉精修，再选择 frontend-design；仅有局部交互问题才加 emil-design-eng。\n用 webapp-testing 实际检查浏览器内的关键操作，明确尚未验证的原生桌面能力。</pre></div>\n<p><strong>应看到：</strong>可打开的样例、相同的体验任务、操作记录与未解决问题。原型通过不代表后端、权限或桌面能力已完成。</p>\n<p><strong>怎么验收：</strong>你亲自完成任务后能说出选择理由，选定方案有明确记录，再作为<a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型阶段</a>的后续依据。</p>\n</details>\n<details id=\"case-decision\"><summary>05 · 几个项目共用登录服务，重要决定应该怎么讨论和记录？</summary>\n<p><strong>情境：</strong>团队对“用户”“业务管理员”“身份服务管理员”的理解不同，同时要决定哪些权限由公共服务负责、哪些留在产品里。这既有词义问题，也有真实的架构取舍。</p>\n<ol>\n<li>先读现有代码、契约和批准材料，分别说明当前行为与期望要求，避免从名字猜权限。</li>\n<li>用 <a href=\"#skills/card-domain-modeling\" data-book-route=\"skills/card-domain-modeling\">domain-modeling</a> 澄清术语；用 <a href=\"#skills/card-codebase-design\" data-book-route=\"skills/card-codebase-design\">codebase-design</a> 分析模块职责和接口边界。需要外部能力证据时再加 research。</li>\n<li>把可行方案的影响讲清楚，由你确认重要取舍。涉及权限的正式实现按高风险流程准备，讨论不等于授权修改。</li>\n<li>Matt 建议三个条件同时满足才提议写 ADR：以后改回去代价较大、没有背景的人会疑惑为何这样做、确实在不同方案之间作了取舍。获准后用 domain-modeling 记录；术语归词典，进度归票据，不为每次讨论新建 ADR。</li>\n</ol>\n<div class=\"prompt\"><pre>请先只读分析【公共服务契约/现有代码/批准材料】。\n用 domain-modeling 澄清【冲突术语】；需要分析模块职责时使用 codebase-design。\n区分当前实现和已批准要求，说明可行方案对权限、接口、迁移与维护的影响。\n先给建议，不修改实现、不替我作重要决定。\n我确认后，在既有位置记录必要的词义或 ADR；不要新建第二套架构百科。\n公共契约由其维护方负责，项目导航引用适用版本，不复制成几份独立标准。</pre></div>\n<p><strong>应看到：</strong>清楚的词义、带依据的方案比较，以及批准后记录的“为什么选这个、接受什么代价”。ADR 是决定的凭据，不是一篇笼统架构介绍。</p>\n<p><strong>怎么验收：</strong>后来接手的人能解释方案的适用条件与边界，不把公共登录成功当成所有业务权限都具备。资料归属见<a href=\"#knowledge/knowledge-scope\" data-book-route=\"knowledge/knowledge-scope\">全局、项目与公共服务的分层</a>。</p>\n</details>\n<details id=\"case-implementation\"><summary>06 · 规格和施工票都批准了，接下来怎样让 AI 真正交付？</summary>\n<p><strong>情境：</strong>“案例筛选结果增加来源展示”已有批准的 Spec、设计和当前票。这里不再重新盘问整套产品，而是按票实现并给出证据。</p>\n<ol>\n<li>主控先查现有票及批准记录；后续票确认上一票已人工验收、前置成果的真实版本与位置已留存、获批接续方式及负责执行者明确，再提供必要入口、已知环境、允许范围与验收方法，创建专属施工任务。尚未创建的目录不要求提前实测；主控保持决策与调度。</li>\n<li>施工任务核对开工包及实际目录中的前置成果；缺少时先完成已授权接续，新的合并或覆盖授权缺口只暂停受影响实施。就绪后使用 <a href=\"#skills/card-implement\" data-book-route=\"skills/card-implement\">implement</a>；普通功能按风险验证，高风险或票据明确要求时严格 TDD。发现要求与现状冲突，先回报，不静默改规格。</li>\n<li>完成实现后运行适用检查，使用 <a href=\"#skills/card-code-review\" data-book-route=\"skills/card-code-review\">code-review</a> 核对完整变更范围与原规格。网页操作按需要用 webapp-testing；不要把构建成功当作真实可用。</li>\n<li>用 <a href=\"#skills/support-verification\" data-book-route=\"skills/support-verification\">verification-before-completion</a> 核对证据是否足够、新鲜。施工任务更新获准的记录，主控收短摘要，再由你试用验收。</li>\n</ol>\n<div class=\"prompt\"><pre>这是已批准的【施工票路径】，依据为【Spec、设计和必要 ADR 路径】。\n如果当前是主控，只准备开工包让我新开施工票会话，不在主控实现。\n派工前先查现有票及批准记录：引用【上一票人工验收证据】、【前置成果的真实提交标识及仓库，或非 Git 版本及文件位置】和【已批准接续方式、负责执行者及批准记录】；无前置依赖则说明，不重复询问已有批准。\n施工任务再核对真实 Git 根、分支或隔离目录、已有改动，并确认前置成果已进入实际工作目录。缺少时先按既有授权接续；需要新增合并、覆盖权限时暂停受影响实施并报告。\n使用 implement，只改获准范围，按【验收标准及适用检查】验证。\n随后用 code-review 核对规格与完整变更范围，完成前检查实际证据。\n把验证、未验证事项和人工体验入口写回当前票；未经我确认，不关票、合并或部署。</pre></div>\n<p><strong>应看到：</strong>与票对应的实现、实际检查结果、审查结论和可体验入口；不是一份新的规划书。模型与隔离要求沿用<a href=\"#delivery\" data-book-route=\"delivery\">开发交付</a>的既有约定。</p>\n<p><strong>怎么验收：</strong>按原票逐条体验并确认，必要的异常状态也有证据。未授权 push、merge、部署仍不能做；辅助技能的默认步骤不能扩大权限。</p>\n</details>\n<details id=\"case-bug\"><summary>07 · AI 反复改配置，错误却一直重复出现</summary>\n<p><strong>情境：</strong>导出功能在同事的 Windows 上报错，AI 不断更换命令写法，却没有确认错误究竟发生在本地脚本、服务端还是程序内部。</p>\n<ol>\n<li>先提供错误原文、复现操作、环境与相关票，使用 <a href=\"#skills/card-diagnosing-bugs\" data-book-route=\"skills/card-diagnosing-bugs\">diagnosing-bugs</a>。日志里的密钥和客户数据先脱敏。</li>\n<li>每轮说明假设、用什么证据区分原因、实际结果和下一步。只读诊断在回复中提供已排除原因和失败尝试；已有写票授权的执行任务才把记录及时写回原票，避免压缩后重来。</li>\n<li>若只是请求排查，就交出原因与最小修复建议，先不修改。得到修复授权后，在对应施工任务处理，必要时补能暴露问题的测试。</li>\n<li>在原来失败的环境复验，并按受影响范围检查其他路径；疑难 Bug 默认用这一套诊断流程，不再同时启动 Superpowers 的第二套调试循环。</li>\n</ol>\n<div class=\"prompt\"><pre>请用 diagnosing-bugs 排查【错误与复现步骤】，现有记录在【票或日志路径】。\n这轮只诊断，不修改配置或实现，不重启应用。\n先核对错误发生在哪一层；每次检查说明要验证的假设、证据和结论。\n已排除项不要无依据重试，确需运行有写入风险的检查先说明并等授权。\n给出最小修复建议和应在何种环境验证；缺资料就明确指出，不宣称修好了。</pre></div>\n<p><strong>应看到：</strong>可复查的原因链、已排除项和有针对性的修复方案；无法确定时明确剩余假设，而不是假装唯一原因已经找到。</p>\n<p><strong>怎么验收：</strong>诊断结论有真实证据支撑；修复后能通过原先失败的操作。不能用“我已改代码”或另一台电脑通过来替代目标环境验证。</p>\n</details>\n<details id=\"case-handoff\"><summary>08 · 对话太长，换一个 Agent 后又开始问同样的问题</summary>\n<p><strong>情境：</strong>之前已经讨论过失败方案和禁止事项，但只留在聊天里；新的施工任务只拿到一句“接着做”。问题首先是交代和记录缺失，不一定要装更大的记忆插件。</p>\n<ol>\n<li>先让原执行任务在允许范围内更新对应票和归属资料，记录当前状态、证据、未完成事项、失败尝试和下一步；不把整段聊天粘贴成新百科。</li>\n<li>主控给新任务项目导航、当前票和必要决策的路径。新任务先按<a href=\"#knowledge/knowledge-recovery\" data-book-route=\"knowledge/knowledge-recovery\">只读接手演练</a>核对，不直接施工。</li>\n<li>跨 AI 工具、目录、同事或中途分叉时，先补齐或引用既有票；现有材料仍不足以接手，才使用 <a href=\"#skills/card-handoff\" data-book-route=\"skills/card-handoff\">handoff</a> 引用既有文件，并检查收件方能否访问、是否需要脱敏。</li>\n<li>若导航的“何时读哪份”不清，才用 writing-for-agents 修入口；若是链接失效就修链接，不把一切问题都归于上下文压缩。</li>\n</ol>\n<div class=\"prompt\"><pre>我要让【接手者/新任务】继续【具体票】，先只读核对，不施工。\n项目导航是【路径】，当前票是【路径】，请列出实际读到的必要资料。\n说明已批准要求、实际完成情况、失败尝试、下一步和停止条件；未知项不要猜。\n跨工具、目录、协作者或中途分叉时，优先补齐或引用既有票；仅当现有材料仍不足以接手，才用 handoff 补最小独立交接，引用状态事实源，不另记一套进度。\n如果接手者打不开路径，说明缺少什么；不包含密钥，不把整份聊天当作必要输入。</pre></div>\n<p><strong>应看到：</strong>能定位的引用、准确的状态说明和清楚的下一步；独立交接只在需要时出现。客户端压缩、新任务和 handoff 是不同动作，不能相互冒充。</p>\n<p><strong>怎么验收：</strong>接手者能指出本次范围、依据和不能重复的失败尝试；若有矛盾先回报。演练通过不等于功能验收，也不保证以后所有细节都不会遗漏。</p>\n</details>\n</section>\n<section id=\"method-cards\">\n<h2>按需要展开：二十五张方法卡</h2>\n<p>把提示中的方括号换成真实目标或路径。不要把所有卡串成必经流水线，也不要重新盘问已批准的内容。卡中的作者默认路径不是项目强制目录；调用时明确项目规则约定的输出位置，复用有效材料。若 Skill 固定默认路径与项目约定冲突，先说明差异，按授权适配或归位并更新受影响索引；已有材料不自动迁移，也不另建重复台账。</p>\n<label class=\"search-label\" for=\"skill-search\">查找用途或名称</label><input id=\"skill-search\" type=\"search\" placeholder=\"例如：故障、规格、原型、wayfinder\" autocomplete=\"off\"><p id=\"skill-count\" class=\"muted\" aria-live=\"polite\"></p>\n<details class=\"skill-card\" id=\"card-grill-with-docs\"><summary><span class=\"skill-name\">grill-with-docs<span class=\"tag\">手动</span></span><span class=\"skill-title\">问清项目需求，并把结论写入项目文档</span></summary><dl><dt>什么时候用</dt><dd>项目需求或重要取舍仍有未知。</dd><dt>它做什么</dt><dd>先了解现状，只追问尚未明确的问题；术语写入 CONTEXT.md，符合条件的重要决策写入 ADR。</dd><dt>应交出什么</dt><dd>已确认的结论、尚存的分歧和必要记录，不是具体代码实现计划。</dd></dl><div class=\"prompt\"><pre>请用 grill-with-docs 梳理【需求】，读取【批准材料】。能查到的不要问我，只问改变范围和方案的事；确认前不施工。</pre></div><p class=\"muted\">边界：已经明确的小改动不必重复追问；此技能也不能代替真实用户研究。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/grill-with-docs/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p><p class=\"case-related\">完整情境：<a href=\"#skills/case-research\" data-book-route=\"skills/case-research\">把想法与证据梳理清楚</a></p></details>\n<details class=\"skill-card\" id=\"card-to-spec\"><summary><span class=\"skill-name\">to-spec<span class=\"tag\">手动</span></span><span class=\"skill-title\">把已有共识写成施工规格</span></summary><dl><dt>什么时候用</dt><dd>工作将跨任务推进，需要别人不读整段聊天也能理解。</dd><dt>它做什么</dt><dd>综合共识，写用户故事、验收、不做项和测试边界，不重开盘问。</dd><dt>应交出什么</dt><dd>可逐条检查的 Spec；.scratch/功能/spec.md 是作者默认路径的示例，项目位置按自身规则确定。</dd></dl><div class=\"prompt\"><pre>请用 to-spec 整理【功能】，复用【现有有效材料】，引用适用的已批准依据；涉及界面或交互且已有合格原型时引用其基线，仅在缺少合格依据并确有待验证的设计问题时补原型，不要求所有任务都有原型；项目约定输出位置为【真实路径】，先核对与 Skill 默认是否冲突。写验收、不做项和未解决缺口；交我确认，不自行实现。</pre></div><p class=\"muted\">边界：不是预写未来每行代码；小改可以没有 Spec。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/to-spec/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p></details>\n<details class=\"skill-card\" id=\"card-to-tickets\"><summary><span class=\"skill-name\">to-tickets<span class=\"tag\">手动</span></span><span class=\"skill-title\">拆成可独立演示的施工票</span></summary><dl><dt>什么时候用</dt><dd>规格已批准，工作不适合一个短任务完成。</dd><dt>它做什么</dt><dd>按可独立使用的功能拆分任务，说明依赖、验收标准和风险，优先完成核心 MVP。</dd><dt>应交出什么</dt><dd>施工票及其执行顺序；.scratch/功能/issues/ 是作者默认目录的示例，不要求项目另建同名目录。</dd></dl><div class=\"prompt\"><pre>请用 to-tickets 拆【Spec路径】，复用【已有有效票据】；项目约定输出位置为【真实路径】，先核对与 Skill 默认是否冲突。每票可演示一段完整价值，写依赖和验收。先给粒度、顺序让我确认，不批量开工。</pre></div><p class=\"muted\">边界：不要按全部数据库、全部后端、全部前端横着拆。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/to-tickets/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p></details>\n<details class=\"skill-card\" id=\"card-implement\"><summary><span class=\"skill-name\">implement<span class=\"tag\">手动</span></span><span class=\"skill-title\">只把当前这张票做好</span></summary><dl><dt>什么时候用</dt><dd>票与开工条件已批准，正式票在专属新任务中执行。</dd><dt>它做什么</dt><dd>核对现场与范围，按测试边界逐步实现，实际验证并审查。</dd><dt>应交出什么</dt><dd>实现、证据、未验证项和试用入口，不只是完成宣言。</dd></dl><div class=\"prompt\"><pre>请用 implement 执行【当前票】，先读取开工包中的前置成果版本与位置、获批接续方式及负责人，核对分支、已有改动、范围、验证命令，并确认所需成果已进入实际目录；缺少时按授权接续，有新权限缺口就报告。只做本票；我确认前不关票、提交或部署。</pre></div><p class=\"muted\">边界：技能默认提交动作不覆盖你的人工验收关口。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/implement/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p><p class=\"case-related\">完整情境：<a href=\"#skills/case-implementation\" data-book-route=\"skills/case-implementation\">从施工到验收</a></p></details>\n<details class=\"skill-card\" id=\"card-diagnosing-bugs\"><summary><span class=\"skill-name\">diagnosing-bugs<span class=\"tag\">按需匹配</span></span><span class=\"skill-title\">先查清故障原因，再选择修复办法</span></summary><dl><dt>什么时候用</dt><dd>报错、行为异常或变慢，原因还不清楚。</dd><dt>它做什么</dt><dd>先复现用户遇到的问题，列出可能原因并逐项验证，一次只改变一个变量。</dd><dt>应交出什么</dt><dd>解释现象的证据、排除过的假设和下一步。</dd></dl><div class=\"prompt\"><pre>请用 diagnosing-bugs 排查【症状】，先只读确认复现与证据，脱敏日志。没定位前不批量改代码；修复另按授权范围执行。</pre></div><p class=\"muted\">边界：诊断不自动授权生产埋点或修复；不要叠第二套调试流程。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/diagnosing-bugs/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p><p class=\"case-related\">完整情境：<a href=\"#skills/case-bug\" data-book-route=\"skills/case-bug\">反复报错怎样排查</a></p></details>\n<details class=\"skill-card\" id=\"card-prototype\"><summary><span class=\"skill-name\">prototype<span class=\"tag\">按需匹配</span></span><span class=\"skill-title\">用临时原型验证尚未确定的设计</span></summary><dl><dt>什么时候用</dt><dd>页面结构或某套状态逻辑是否好用还不确定。</dd><dt>它做什么</dt><dd>选 UI 或逻辑原型，按需比较方案，模拟写入，保留探索证据。</dd><dt>应交出什么</dt><dd>能亲自试的原型与采用理由，不是生产系统。</dd></dl><div class=\"prompt\"><pre>请用 prototype 验证【问题】，只做最小可交互样例，真实写操作改模拟。有真分歧再比选，给路线、结论和证据，不发布。</pre></div><p class=\"muted\">边界：当前版已有方案比选，不必再装同名技能；探索也要检查能否打开。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/prototype/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p><p class=\"case-related\">完整情境：<a href=\"#skills/case-prototype\" data-book-route=\"skills/case-prototype\">用原型比较操作方式</a></p></details>\n<details class=\"skill-card\" id=\"card-research\"><summary><span class=\"skill-name\">research<span class=\"tag\">按需匹配</span></span><span class=\"skill-title\">查一手资料并留下出处</span></summary><dl><dt>什么时候用</dt><dd>接口、技术限制或方法事实尚不确定。</dd><dt>它做什么</dt><dd>围绕决策问题查原始来源，标事实、推断、日期和版本。</dd><dt>应交出什么</dt><dd>有明确结论和来源、可以核对的研究笔记，而不只是一串链接。</dd></dl><div class=\"prompt\"><pre>请用 research 查【问题】，优先官方/原作者，列适用版本、结论、反证与未知，写入现有研究位置，不只看搜索摘要。</pre></div><p class=\"muted\">边界：查到案例不等于用户需求已验证。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/research/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p><p class=\"case-related\">完整情境：<a href=\"#skills/case-research\" data-book-route=\"skills/case-research\">何时需要外部研究</a></p></details>\n<details class=\"skill-card\" id=\"card-wayfinder\"><summary><span class=\"skill-name\">wayfinder<span class=\"tag\">手动</span></span><span class=\"skill-title\">给跨会话决策画路线图</span></summary><dl><dt>什么时候用</dt><dd>目标复杂，还不清楚应该先解决哪些问题。</dd><dt>它做什么</dt><dd>保留问题树与决定，按依赖推进，把当前上下文用于当前决策。</dd><dt>应交出什么</dt><dd>可跨会话接续的决策地图，不是代码依赖图工具。</dd></dl><div class=\"prompt\"><pre>请用 wayfinder 梳理【复杂目标】，默认只规划。识别问题和依赖，沿用事实源，给当前最重要的下一问，不把笔记扩成施工。</pre></div><p class=\"muted\">边界：小任务不用；已有 Spec/票时不再制造第二套调度系统。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/wayfinder/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p><p class=\"case-related\">完整教程：<a href=\"#wayfinder/first\" data-book-route=\"wayfinder/first\">第一次使用</a> · <a href=\"#wayfinder/ticket\" data-book-route=\"wayfinder/ticket\">走完一张决策票</a> · <a href=\"#wayfinder/example\" data-book-route=\"wayfinder/example\">完整例子</a></p></details>\n<details class=\"skill-card\" id=\"card-ask-matt\"><summary><span class=\"skill-name\">ask-matt<span class=\"tag\">手动</span></span><span class=\"skill-title\">不确定该用哪个 Skill 时，先请它判断</span></summary><dl><dt>什么时候用</dt><dd>目标已经清楚，但不确定下一步该查资料、澄清需求还是制作原型。</dd><dt>它做什么</dt><dd>按阶段边界建议下一方法；不是联系 Matt 本人。</dd><dt>应交出什么</dt><dd>下一步选择，你仍决定真实取舍。</dd></dl><div class=\"prompt\"><pre>请用 ask-matt 判断【现状】下一步，已有【材料】不重走；说明推荐方法与理由，不默认启动大流程。</pre></div><p class=\"muted\">边界：默认偏向先规格再施工；低风险短链不必因此升级。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/ask-matt/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p></details>\n<details class=\"skill-card\" id=\"card-domain-modeling\"><summary><span class=\"skill-name\">domain-modeling<span class=\"tag\">按需匹配</span></span><span class=\"skill-title\">统一项目术语的含义</span></summary><dl><dt>什么时候用</dt><dd>案例、项目、版本、资产等词混用。</dd><dt>它做什么</dt><dd>术语进 CONTEXT.md；重大决定符合条件才写 ADR。</dd><dt>应交出什么</dt><dd>统一的术语说明，以及必要的决策理由。</dd></dl><div class=\"prompt\"><pre>请用 domain-modeling 核对【概念冲突】，给中文解释和代码对应词，沿用 CONTEXT.md，不把进度塞成术语文件。</pre></div><p class=\"muted\">边界：ADR 要同时满足难撤回、离开上下文令人意外、有真实取舍，不是任一条件。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/domain-modeling/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p><p class=\"case-related\">完整情境：<a href=\"#skills/case-decision\" data-book-route=\"skills/case-decision\">术语与重要架构决定</a></p></details>\n<details class=\"skill-card\" id=\"card-tdd\"><summary><span class=\"skill-name\">tdd<span class=\"tag\">按需匹配</span></span><span class=\"skill-title\">先写一个失败测试，再逐步实现功能</span></summary><dl><dt>什么时候用</dt><dd>票约定测试驱动，尤其高风险逻辑。</dd><dt>它做什么</dt><dd>在约定的公共边界先写一个失败测试，再用最少实现使其通过，反复进行红→绿循环。</dd><dt>应交出什么</dt><dd>与用户行为对应的持续反馈。</dd></dl><div class=\"prompt\"><pre>请按 Matt tdd 在【公共边界】施工，一次一个失败测试和最少实现；说明红灯确因缺失行为失败，不先批量实现再补证据。</pre></div><p class=\"muted\">边界：不是每个私有函数都测试；通过仍不等于人工验收。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/tdd/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p></details>\n<details class=\"skill-card\" id=\"card-code-review\"><summary><span class=\"skill-name\">code-review<span class=\"tag\">按需匹配</span></span><span class=\"skill-title\">分别看规格和项目标准</span></summary><dl><dt>什么时候用</dt><dd>票已实现或需要审一段分支变化。</dd><dt>它做什么</dt><dd>固定起点，沿规格/标准两轴审查，报告位置与影响。</dd><dt>应交出什么</dt><dd>规格和项目标准两方面的具体审查结论，以及尚未覆盖的内容。</dd></dl><div class=\"prompt\"><pre>请用 code-review 审【固定起点】以来本票变化，同时明确覆盖未提交内容。分别检查 Spec 与标准，不用空 diff 宣称通过。</pre></div><p class=\"muted\">边界：提交比较会漏工作区改动；多次提交不要默认只审最后一次。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/code-review/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p><p class=\"case-related\">完整情境：<a href=\"#skills/case-implementation\" data-book-route=\"skills/case-implementation\">审查与交付</a></p></details>\n<details class=\"skill-card\" id=\"card-codebase-design\"><summary><span class=\"skill-name\">codebase-design<span class=\"tag\">按需匹配</span></span><span class=\"skill-title\">讨论模块边界，减少理解负担</span></summary><dl><dt>什么时候用</dt><dd>模块接口复杂、测试困难，需要重新考虑模块如何划分职责。</dd><dt>它做什么</dt><dd>比较对外接口成本和内部封装，依据真实使用需要。</dd><dt>应交出什么</dt><dd>可讨论的接口与取舍，不是立即全仓重构。</dd></dl><div class=\"prompt\"><pre>请用 codebase-design 解释【模块】的边界问题，给使用案例和测试入口；说明现状阻力，不为想象扩展加层。</pre></div><p class=\"muted\">边界：深模块不是巨型文件，也不是每个功能抽一个接口。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/codebase-design/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p><p class=\"case-related\">完整情境：<a href=\"#skills/case-decision\" data-book-route=\"skills/case-decision\">分析模块边界</a></p></details>\n<details class=\"skill-card\" id=\"card-improve-codebase-architecture\"><summary><span class=\"skill-name\">improve-codebase-architecture<span class=\"tag\">手动</span></span><span class=\"skill-title\">找最值得改进的一处架构</span></summary><dl><dt>什么时候用</dt><dd>开发反复卡在同一片代码。</dd><dt>它做什么</dt><dd>从经常修改、难以理解或测试的代码中提出改进方向，由你选定后再深入分析。</dd><dt>应交出什么</dt><dd>少量有依据的改进方向。</dd></dl><div class=\"prompt\"><pre>请用 improve-codebase-architecture 只读评估【仓库】，找近期热点与实际阻力，给候选和成本，不自行重构。</pre></div><p class=\"muted\">边界：评估不授权改文件；保留已有未存档工作。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/improve-codebase-architecture/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p></details>\n<details class=\"skill-card\" id=\"card-triage\"><summary><span class=\"skill-name\">triage<span class=\"tag\">手动</span></span><span class=\"skill-title\">整理新收到的问题和改动请求</span></summary><dl><dt>什么时候用</dt><dd>项目收到了未梳理的 issue 或按 tracker 约定纳入的外部 PR。</dd><dt>它做什么</dt><dd>读已有记录，核对是否真实、重复或曾被拒绝，再建议类别、状态与需要补的证据。</dd><dt>应交出什么</dt><dd>清楚的问题状态与接手者可执行的要求。</dd></dl><div class=\"prompt\"><pre>请用 triage 检查【指定 issue/PR】，先只读现状与历史，给类别、状态建议和依据；不要重复分流已由 to-tickets 准备好的票，不自动评论、关票或开工。</pre></div><p class=\"muted\">边界：不是整理任意聊天或每张施工票的必经步骤；远程改标签、评论、关闭要按授权执行。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/triage/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p></details>\n<details class=\"skill-card\" id=\"card-setup-matt-pocock-skills\"><summary><span class=\"skill-name\">setup-matt-pocock-skills<span class=\"tag\">手动</span></span><span class=\"skill-title\">为项目建立使用 Matt 技能所需的基本约定</span></summary><dl><dt>什么时候用</dt><dd>新项目还没有明确如何记录任务、在哪里保存规则等基本约定。</dd><dt>它做什么</dt><dd>先检查现状，再补齐必要的规则和文档入口，让后续技能知道到哪里读取或保存材料。</dd><dt>应交出什么</dt><dd>规则、规格和票据有明确位置。</dd></dl><div class=\"prompt\"><pre>请先检查本项目是否缺 Matt 接线；需要 setup-matt-pocock-skills 时列拟改文件和理由，保留已有约定，批准后改。</pre></div><p class=\"muted\">边界：不是每票重装，也不覆盖全局或迁走所有现有资料。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/setup-matt-pocock-skills/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p><p class=\"case-related\">完整情境：<a href=\"#skills/case-documents\" data-book-route=\"skills/case-documents\">已有项目怎样整理入口</a></p></details>\n<details class=\"skill-card\" id=\"card-resolving-merge-conflicts\"><summary><span class=\"skill-name\">resolving-merge-conflicts<span class=\"tag\">按需匹配</span></span><span class=\"skill-title\">处理已发生的代码合并冲突</span></summary><dl><dt>什么时候用</dt><dd>真实 Git 合并或变基正在冲突。</dd><dt>它做什么</dt><dd>理解两侧意图、解决冲突、验证；重要行为分歧交人决定。</dd><dt>应交出什么</dt><dd>冲突解决说明和验证证据。</dd></dl><div class=\"prompt\"><pre>先核对合并状态与未提交改动，再用 resolving-merge-conflicts 处理【范围】。保留两侧意图，不为消红字创造新行为。</pre></div><p class=\"muted\">边界：默认全部暂存/提交不覆盖授权；不强行新建 Git 流程。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/resolving-merge-conflicts/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p></details>\n<details class=\"skill-card\" id=\"card-wizard\"><summary><span class=\"skill-name\">wizard<span class=\"tag\">按需匹配</span></span><span class=\"skill-title\">带人完成 AI 不能代办的步骤</span></summary><dl><dt>什么时候用</dt><dd>本人必须登录、授权、输入秘密或操作外部控制台。</dd><dt>它做什么</dt><dd>生成分步 Bash 向导，先确认脚本运行环境和敏感信息的处理位置；AI 能完成的步骤仍由 AI 执行。</dd><dt>应交出什么</dt><dd>确实需要你亲自完成的步骤，以及中断后继续操作的办法。</dd></dl><div class=\"prompt\"><pre>先说哪些必须由我操作；必要时用 wizard。确认 Windows Bash 环境，静态检查脚本，秘密不进日志，不把只读排查转给我。</pre></div><p class=\"muted\">边界：Bash 不能当 PowerShell 或普通 sh 运行，也不能绕过认证限制。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/wizard/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p></details>\n<details class=\"skill-card\" id=\"card-grill-me\"><summary><span class=\"skill-name\">grill-me<span class=\"tag\">手动</span></span><span class=\"skill-title\">不依附项目文件的想法盘问</span></summary><dl><dt>什么时候用</dt><dd>独立讨论一个想法，还无需项目留档。</dd><dt>它做什么</dt><dd>通过 grilling 问清假设和取舍。</dd><dt>应交出什么</dt><dd>思路清楚，正式采用再进入项目文档。</dd></dl><div class=\"prompt\"><pre>请用 grill-me 检视【想法】，本次独立讨论不写项目文件，先问最影响判断的一个问题。</pre></div><p class=\"muted\">边界：需要留项目决定时优先 grill-with-docs。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/grill-me/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p></details>\n<details class=\"skill-card\" id=\"card-grilling\"><summary><span class=\"skill-name\">grilling<span class=\"tag\">按需匹配</span></span><span class=\"skill-title\">盘问的共用方法</span></summary><dl><dt>什么时候用</dt><dd>明确要挑战一个方案的假设与薄弱点。</dd><dt>它做什么</dt><dd>深入真实分歧，不拿一串术语代替判断。</dd><dt>应交出什么</dt><dd>被澄清或推翻的假设。</dd></dl><div class=\"prompt\"><pre>请对【方案】做 grilling，先复述理解，只问改变决定的未知，每次一个重点，用中文具体例子。</pre></div><p class=\"muted\">边界：它与两个 grill 入口是底层方法/入口关系，不是三遍盘问。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/grilling/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p></details>\n<details class=\"skill-card\" id=\"card-handoff\"><summary><span class=\"skill-name\">handoff<span class=\"tag\">手动</span></span><span class=\"skill-title\">为接手任务提供简明、必要的交接信息</span></summary><dl><dt>什么时候用</dt><dd>跨工具、目录、协作者或任务分叉，且既有票和材料不足以接手。</dd><dt>它做什么</dt><dd>引用现有事实文件，写焦点、决定、失败尝试、下一步，脱敏。</dd><dt>应交出什么</dt><dd>足以让接手者继续工作的简明交接说明，并确认对方已读到必要材料。</dd></dl><div class=\"prompt\"><pre>请先核对【下一任务】能否凭现有票和材料接手，优先补齐或引用既有票；仍不足时才用 handoff 补窄交接包。引用 Spec/ADR/票及状态事实源，补必要失败尝试、未决问题与验证，不复制聊天或另记进度。</pre></div><p class=\"muted\">边界：不等于系统压缩、移动代码或已经创建新任务。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/handoff/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p><p class=\"case-related\">完整情境：<a href=\"#skills/case-handoff\" data-book-route=\"skills/case-handoff\">让新 Agent 接得上</a></p></details>\n<details class=\"skill-card\" id=\"card-teach\"><summary><span class=\"skill-name\">teach<span class=\"tag\">手动</span></span><span class=\"skill-title\">教到你能作判断</span></summary><dl><dt>什么时候用</dt><dd>需要理解概念，不只是让 AI 代做。</dd><dt>它做什么</dt><dd>设学习目标，查资料，用短课、例子、回顾和小练习检查理解。</dd><dt>应交出什么</dt><dd>可回看教程与学习记录，不是施工规格。</dd></dl><div class=\"prompt\"><pre>请用 teach 教【概念】，我是建筑师不手写代码，要能判断【取舍】。中文短 HTML 加建筑例子，一次少量，用小题检验理解。</pre></div><p class=\"muted\">边界：不以一句懂了当证据，也不为简单解释建设全课程。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/teach/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p></details>\n<details class=\"skill-card\" id=\"card-to-questionnaire\"><summary><span class=\"skill-name\">to-questionnaire<span class=\"tag\">手动</span></span><span class=\"skill-title\">向真正知道答案的人收集材料</span></summary><dl><dt>什么时候用</dt><dd>需要同事、用户、专家提供你不知道的信息。</dd><dt>它做什么</dt><dd>明确收件人与决定，拟具体可回答问题。</dd><dt>应交出什么</dt><dd>支撑决定的问卷。</dd></dl><div class=\"prompt\"><pre>请用 to-questionnaire 给【对象】做短问卷，用于决定【问题】。问最近真实操作，说明要回收的证据，不诱导赞成方案。</pre></div><p class=\"muted\">边界：AI 编的回答不能当访谈，不能让你代答同事经历。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/to-questionnaire/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p></details>\n<details class=\"skill-card\" id=\"card-wait-what\"><summary><span class=\"skill-name\">wait-what<span class=\"tag\">手动</span></span><span class=\"skill-title\">暂停黑话，重新讲到听得懂</span></summary><dl><dt>什么时候用</dt><dd>不知道 AI 在做什么，或到底要你选什么。</dd><dt>它做什么</dt><dd>重述情境、术语和选择，把理解缺口说清。</dd><dt>应交出什么</dt><dd>能指导判断的一段解释。</dd></dl><div class=\"prompt\"><pre>wait-what。请用中文解释现在卡在哪、为何重要、我需要决定什么，举建筑例子；先别继续写代码。</pre></div><p class=\"muted\">边界：不必每次完整教学，也不要求你先学会写代码。</p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/wait-what/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p></details>\n<details class=\"skill-card\" id=\"card-writing-for-agents\"><summary><span class=\"skill-name\">writing-for-agents<span class=\"tag\">按需匹配</span></span><span class=\"skill-title\">把工作约定写成 AI 能执行的规则</span></summary><dl><dt>什么时候用</dt><dd>创建或维护 AGENTS.md、CLAUDE.md、Skill 时使用；角色说明含糊、规则冲突或开工包经常遗漏信息时也可使用。不需要每张票都调用。</dd><dt>它做什么</dt><dd>先读现有约束和真实例子；分清共同规则、角色差异和本次任务；写清何时读哪份资料、做什么、何时算完成，删重复而不删安全边界。</dd><dt>应交出什么</dt><dd>具体问题清单、规则修改对照、准确资料入口，以及验证办法；若已批准实施，再给更新文件与差异。</dd></dl><div class=\"prompt\"><pre>请实际使用 Matt writing-for-agents，先完整读取其 SKILL.md。材料是【规则文件】、【已批准流程】与【一次执行跑偏的例子】。先给问题与前后对照，标明哪些应留在共享规则、哪些属于角色说明或本票开工包；资料引用要写清触发条件，完成条件要可检查。不要改产品决定或降低权限/验收要求。本轮先只读给建议；我批准后仅修改指定规则文件，并用一次只读试派发检查是否理解一致。</pre></div><p class=\"muted\">边界：它不负责自动派发、配置模型、设计产品或替代 implement。不能以省 Token 为由删除批准关口，也不追求固定字数。详细用法见 Agent 执行手册。</p><p class=\"note\"><a href=\"#agents/agent-how-to\" data-book-route=\"agents/agent-how-to\">完整使用课</a> · <a href=\"#agents/agent-stages\" data-book-route=\"agents/agent-stages\">四阶段调用时机</a> · <a href=\"#agents/agent-templates\" data-book-route=\"agents/agent-templates\">项目规则与角色模板</a></p><p class=\"source\"><a href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/writing-for-agents/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者当前源码</a></p><p class=\"case-related\">完整情境：<a href=\"#skills/case-documents\" data-book-route=\"skills/case-documents\">整理资料入口</a> · <a href=\"#skills/case-rules\" data-book-route=\"skills/case-rules\">纠正规则过重</a></p></details>\n</section>\n<section id=\"supporting-skills\">\n<h2>根据具体需要，使用 Matt 之外的辅助技能</h2>\n<p>以下是已装辅助能力在本流程里的位置，不是要求全部开启的新套装。Matt 负责把问题、规格和施工组织起来；辅助技能处理阅读图册、视觉、实际验证或安全隔离。</p>\n<details class=\"support-card\" id=\"card-decision-map\"><summary>Archify：把项目的架构和流程画成可交互的独立 HTML 图</summary><p class=\"source\">来源：上游开源技能 Archify（作者 tt-a1i，MIT 许可），由作者维护，2026-09-27 起取代本人的 decision-map；决策阅读仍用决策简报。作者电脑上的入口已核对；其他电脑或客户端仍需确认实际可用性。</p><dl><dt>什么时候用</dt><dd>用户要配架构、流程等图时；本轮改了架构，现场会在轮末确认清单里问你要不要。已有项目进入实施、验收阶段，也能按新记录出图，不必重跑 Wayfinder。</dd><dt>需要什么</dt><dd>已落盘的项目 MD：决策卡、架构资料与相关依据。AI 从这些资料写图的 JSON 规格，你不需要手填，也不另建一套平行台账。</dd><dt>交出什么</dt><dd>一张图一个独立 HTML，不需要服务就能打开：可缩放、搜索、看上下游和两点之间的路径，有明暗两套主题，可导出 PNG、SVG 等图片；另附校验结果。架构有前后两份规格时，还能出 Before / Delta / After 对比页。</dd><dt>怎样更新</dt><dd>架构变了才重出：AI 改 JSON 规格，校验通过后用 <code>deliver</code> 重新出图；要看改了什么，拿上一版和本版两份规格跑 <code>compare</code>。图和同名规格放在 <code>项目总览/html/</code>，在相关决策卡的“依据”里链上，简报随卡带出。</dd><dt>主要边界</dt><dd>它只画图，不记决策、不存决策历史，决定仍只住在决策卡里。有依据、决定采用、已实施、验证通过分别表达；示例不当项目事实；图不批准施工或验收；导出效果要在实际浏览器核验。</dd></dl><div class=\"prompt\"><pre>请用 Archify 技能，依据【项目 MD 入口与架构资料】为【专题】出一张【架构／流程／时序／数据流／状态】图。\n只画已落盘的事实，不改决定或状态；图、同名 JSON 规格和对比页都写在【项目总览/html/】下。\n图出好后在【相关决策卡】的“依据”里加一行它的相对链接；你不是决策现场，就把链接交给现场写。\n架构改过时，拿上一版和本版规格用 compare 出前后对比。\n说明哪些是 Archify 的校验、哪些在浏览器实际看过、哪些没验证。这次请求不授权安装、后台预览、发布或施工。</pre></div><p class=\"muted\">当前边界：五类图（architecture、workflow、sequence、dataflow、lifecycle）各有一种 JSON 规格；<code>validate</code> 只校验，<code>deliver</code> 全部校验通过才替换输出、失败时保留上一版；<code>compare</code> 目前只比较 architecture，另在旁边写一份回执 JSON。Mermaid 或口头描述由 AI 先转成规格。详见<a href=\"#wayfinder/visualization-limits\" data-book-route=\"wayfinder/visualization-limits\">按需出图的资料与输出位置</a>。</p><p class=\"source\">权威入口：已装 Archify 技能的 <code>SKILL.md</code>（安装位置与版本见<a href=\"#governance/version-and-rules\" data-book-route=\"governance/version-and-rules\">工具治理的版本核验记录</a>）· <a href=\"https://github.com/tt-a1i/archify\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">上游仓库</a>。</p></details>\n<details class=\"support-card\" id=\"support-frontend-design\"><summary>frontend-design：细化已选方案的视觉设计</summary><p>用于<a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念阶段</a>的视觉定稿，也用于施工中落实已批准视觉。prototype 回答“这个方案行不行”；它处理信息层级、字体、颜色、空间与组件，不能私自改功能边界。</p><div class=\"prompt\"><pre>请实际使用 frontend-design，基于【选定原型/设计基线】处理【页面】的视觉设计。先说清设计方向，再给可查看结果；保留已确认功能与交互，不同时启动 Taste 重选方向。</pre></div><p class=\"source\"><a href=\"https://github.com/anthropics/skills/tree/main/skills/frontend-design\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者源码</a></p></details>\n<details class=\"support-card\" id=\"support-emil\"><summary>emil-design-eng：完善组件和动效细节</summary><p>结构与视觉方向已选定后，处理一个具体问题，例如筛选反馈不清、弹窗关闭生硬、频繁动画拖慢操作。不负责整站前期研究，也不强制所有元素动起来。</p><div class=\"prompt\"><pre>请实际使用 emil-design-eng 精修【具体组件/交互问题】，说明改动帮助使用者理解了什么。沿用已选布局和视觉，考虑高频操作、键盘与减少动态偏好，不扩为全站重设计。</pre></div><p class=\"source\"><a href=\"https://emilkowal.ski/skill\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Emil 官方技能说明</a></p></details>\n<details class=\"support-card\" id=\"support-webapp-testing\"><summary>webapp-testing：让 AI 真的操作页面</summary><p>概念阶段检查原型是否走通；交付阶段检查实现是否满足场景。它负责实际浏览器操作、截图与结果，不只是读取 HTML。原生 Windows 程序需要目标环境另验。</p><div class=\"prompt\"><pre>请使用 webapp-testing，在【入口】实际走【用户任务】，逐项给操作、预期与实际结果，覆盖本任务必要的异常状态。标明模拟与真实边界；浏览器测试不能当 Windows 原生功能已验证。</pre></div></details>\n<details class=\"support-card\" id=\"support-web-design-guidelines\"><summary>web-design-guidelines：检查界面规范，而非替你选风格</summary><p>有真实界面代码后，读取当前规范并审查可访问性、交互与界面实现问题。它与“点开按钮真的能用”是两份不同证据，不和 webapp-testing 重复计功。</p><div class=\"prompt\"><pre>请用 web-design-guidelines 只读审查【界面文件】，实际读取适用规范，指出具体位置、影响和建议。保留既定设计方向；未经授权先不修改，也不因审查通过就说用户任务全部可用。</pre></div><p class=\"source\"><a href=\"https://github.com/vercel-labs/web-interface-guidelines\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">规范原仓库</a></p></details>\n<details class=\"support-card\" id=\"support-verification\"><summary>Superpowers verification-before-completion：完成前看证据</summary><p>准备说“修好了、通过了、完成了”时核对真实命令与结果。它不是第二轮实现，不产生第二本计划；同一代码和环境已有适用的新证据，不为技能数量机械重复测试。</p><div class=\"prompt\"><pre>请按 verification-before-completion 核对本票验收与实际证据。区分已验证、未验证和人工待验收，不把代理口头结论当证据；只补缺失或已经失效的检查。</pre></div><p class=\"source\"><a href=\"https://github.com/obra/superpowers/tree/main/skills/verification-before-completion\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者方法卡</a></p></details>\n<details class=\"support-card\" id=\"support-worktrees\"><summary>Superpowers using-git-worktrees：隔开磁盘上的施工现场</summary><p>真实 Git 项目确实需要文件隔离时用，优先核对是否已有正确隔离目录。新任务隔离聊天，worktree 隔离工作目录，两者不能替代。没有 Git 的资料任务不用它。</p><div class=\"prompt\"><pre>请先核对当前 Git 根、工作目录和未提交改动。确需隔离且已有授权时使用 using-git-worktrees，复用合适的已有隔离目录或安全建立新目录；保留用户改动，不把普通分支当文件隔离。</pre></div><p class=\"source\"><a href=\"https://github.com/obra/superpowers/tree/main/skills/using-git-worktrees\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">作者方法卡</a></p></details>\n<p>Karpathy 的价值、重复与保留建议见<a href=\"#governance/karpathy-role\" data-book-route=\"governance/karpathy-role\">跨阶段底线</a>；Taste 仅按适用场景选择，不作为每个产品界面的默认主导。</p>\n</section>\n<section id=\"one-worked-example\">\n<h2>同一件事怎样接起来：资料库“收藏案例”</h2>\n<p>以下为教学示例，不是项目已批准规格。假设页面已定，要让同事收藏并再次找到案例。</p>\n<ol>\n<li><strong>盘问：</strong>有用户身份吗？收藏归个人还是团队？重复点击怎么办？读取现状能回答的不要再问你；产品取舍由你定。</li>\n<li><strong>规格：</strong>“收藏后在我的收藏能看到；取消后消失；不能看他人的私人收藏。”本期不做共享收藏夹。</li>\n<li><strong>拆票：</strong>第一票让一人从案例页收藏、在列表找回、再取消；不是先做全部数据表、再做全部按钮。写入和权限按风险补控制。</li>\n<li><strong>施工：</strong>派工前查明必要前置成果的真实版本与位置、获批接续方式及负责人；新票任务收到这些依据、范围和验收，在实际目录确认成果已落地，再从一个失败测试到最少实现，逐条推进。</li>\n<li><strong>交付：</strong>测试审查后给你入口，用两个示例用户检查可见性，再批准关闭。主控只收短结果和证据位置。</li>\n</ol>\n<p>如果只把“收藏”改成“加入收藏”，不用重跑全套；保留行为，确认文案布局即可。真正改变个人/团队权限就不是文案小改。</p>\n\n</section>\n<section id=\"watch-for-fake-use\">\n<h2>遇到这些情况，需要及时纠正</h2>\n<ul>\n<li>说“用 TDD”，却先批量写完实现才补测试：报告偏差，不能伪装做过红灯。</li>\n<li>说“审查没问题”，比较范围却没包括未提交改动：补正确范围再下结论。</li>\n<li>说“已交付”，只有构建成功：分清机器检查、真实运行和你的验收。</li>\n<li>已有票又建第二份 Superpowers 状态表：沿用唯一事实源，不重复管理。</li>\n<li>技能默认包括提交、发布或删除：仍受授权约束，不能借技能扩大权限。</li>\n</ul>\n<p>最常用的流程是澄清需求 → 编写规格 → 拆分任务 → 实现 → 验收。其他技能只在遇到相应问题时使用。维护与去重见<a href=\"#governance\" data-book-route=\"governance\">工具治理</a>。</p>\n\n</section>\n<nav class=\"book-end\" aria-label=\"前后章节\"><a href=\"#knowledge\" data-book-route=\"knowledge\"><span>上一册</span>← 项目知识库与上下文维护</a><a class=\"next\" href=\"#wayfinder\" data-book-route=\"wayfinder\"><span>下一册</span>Wayfinder 使用 →</a></nav></article><aside class=\"toc\" aria-label=\"本页目录\"><p>这一页</p><a href=\"#skills/start-with-the-job\" data-book-route=\"skills/start-with-the-job\">Skill 提供做事的方法，不会代替你自动完成任务</a><a href=\"#skills/invoke-and-check\" data-book-route=\"skills/invoke-and-check\">怎样调用 Skill，并检查它是否发挥了作用</a><a href=\"#skills/case-entry\" data-book-route=\"skills/case-entry\">遇到实际问题时，从这里选一条做法</a><a href=\"#skills/case-walkthroughs\" data-book-route=\"skills/case-walkthroughs\">展开一个案例，看看从开口到验收的全过程</a><a href=\"#skills/method-cards\" data-book-route=\"skills/method-cards\">按需要展开：二十五张方法卡</a><a href=\"#skills/supporting-skills\" data-book-route=\"skills/supporting-skills\">根据具体需要，使用 Matt 之外的辅助技能</a><a href=\"#skills/one-worked-example\" data-book-route=\"skills/one-worked-example\">同一件事怎样接起来：资料库“收藏案例”</a><a href=\"#skills/watch-for-fake-use\" data-book-route=\"skills/watch-for-fake-use\">遇到这些情况，需要及时纠正</a></aside></div></main></div><div class=\"notice-live\" role=\"status\" aria-live=\"polite\"></div><script>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}));}\nwindow.addEventListener('hashchange',openHash);openHash();\nconst sections=[...document.querySelectorAll('article>section')],tocLinks=[...document.querySelectorAll('.toc a')];\nif('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const id=visible[0].target.id;tocLinks.forEach(a=>a.classList.toggle('current',a.hash==='#'+id));},{rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>observer.observe(s));}\n})();\n<\/script><script>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n<\/script>\n</body></html>"},{"id":"wayfinder","nav":"Wayfinder 使用","html":"<!doctype html><html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"color-scheme\" content=\"light\"><meta name=\"description\" content=\"从使用时机、建图和逐票推进，到与你现有开发流程衔接。完整例子也在这一栏，不需要另开说明文件。\"><title>Wayfinder 使用 · 建筑师的 AI 开发手册</title><style>@charset \"UTF-8\";\n:root{--bg:#f7f4ed;--paper:#fffdfa;--ink:#2d2823;--muted:#70665c;--accent:#a44c34;--line:#ddd5c9;--sage:#4d6655;--soft:#eee8de;--focus:#85331e}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:32px}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.85 \"Segoe UI\",\"Microsoft YaHei\",\"PingFang SC\",sans-serif}\na{color:var(--accent);text-
