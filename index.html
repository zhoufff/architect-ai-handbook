ef=\"#agents/agent-start\" data-book-route=\"agents/agent-start\">Agent 执行手册\u003c/a>：以 writing-for-agents 为核心，教你写项目规则、分清角色、交代每次任务。\u003c/p>\n\u003cp>准备与同事一起开发？看\u003ca href=\"#team/team-start\" data-book-route=\"team/team-start\">团队协作教程\u003c/a>：从第一次小交接开始，讲清分工、共享版本、异机验证与合并。\u003c/p>\n\u003cp class=\"glossary-entry\">遇到 Spec、ADR、施工票这些词？打开\u003ca href=\"#glossary/term-lookup\" data-book-route=\"glossary/term-lookup\">行话使用指南\u003c/a>：不只翻译，还告诉你在哪一步用、谁来做、对应哪个 Skill、你要检查什么。\u003c/p>\n\u003cp>你负责判断“值不值得做、方案是否合适、成果能不能用”；AI 负责查证、提出选择、实现和拿出验证依据。手册不是让你学一整套软件术语，而是让你知道：现在该说什么，接着该看到什么，哪里必须由你拍板。\u003c/p>\n\u003cdiv class=\"route-picker\">\n\u003ca href=\"#research\" data-book-route=\"research\">\u003cspan>从零做 / 大改版\u003c/span>\u003cstrong>从场景研究开始\u003c/strong>\u003csmall>问题和使用者还没确定，先别写代码。\u003c/small>\u003c/a>\n\u003ca href=\"#concept\" data-book-route=\"concept\">\u003cspan>方向清楚 / 页面未定\u003c/span>\u003cstrong>先做概念原型\u003c/strong>\u003csmall>用模拟数据走通任务，再决定长什么样。\u003c/small>\u003c/a>\n\u003ca href=\"#engineering\" data-book-route=\"engineering\">\u003cspan>方案已批 / 要正式做\u003c/span>\u003cstrong>进入施工准备\u003c/strong>\u003csmall>讲清规格、风险和第一张可验收的票。\u003c/small>\u003c/a>\n\u003ca href=\"#index/short-route\" data-book-route=\"index/short-route\">\u003cspan>明确小改 / 日常问题\u003c/span>\u003cstrong>走短链或只读路线\u003c/strong>\u003csmall>不为一句文案造一整套文件。\u003c/small>\u003c/a>\n\u003c/div>\n\u003caside class=\"note\">\u003cp>\u003cstrong>给第一次拿到手册的人：\u003c/strong>这是面向不手写代码、但需要负责成果的使用者的实践指南。可用于能读取项目、调用工具的 AI 开发环境，不要求购买某个固定模型。\u003c/p>\u003cp>还没认识这些工具？先到 \u003ca href=\"#skills/skill-origins\" data-book-route=\"skills/skill-origins\">Skill 来源与用途\u003c/a> 和 \u003ca href=\"#skills/first-install\" data-book-route=\"skills/first-install\">第一次使用步骤\u003c/a>。本册不会安装软件或改变你的配置。\u003c/p>\u003c/aside>\n\u003c/section>\n\u003csection id=\"four-phases\">\n\u003ch2>四个阶段：页面方案确定后，还需要做好开发准备\u003c/h2>\n\u003col class=\"phase-map\">\n\u003cli>\u003cspan class=\"phase-no\">01\u003c/span>\u003cdiv>\u003ca href=\"#research\" data-book-route=\"research\">场景研究\u003c/a>\u003cp>为什么做、给谁用、第一期解决什么。\u003c/p>\u003csmall>交出：批准的策划任务书\u003c/small>\u003c/div>\u003c/li>\n\u003cli>\u003cspan class=\"phase-no\">02\u003c/span>\u003cdiv>\u003ca href=\"#concept\" data-book-route=\"concept\">概念原型\u003c/a>\u003cp>功能如何安排、用户如何操作、页面如何呈现。\u003c/p>\u003csmall>成果：经过试用并确认的原型与设计方案\u003c/small>\u003c/div>\u003c/li>\n\u003cli>\u003cspan class=\"phase-no\">03\u003c/span>\u003cdiv>\u003ca href=\"#engineering\" data-book-route=\"engineering\">施工准备\u003c/a>\u003cp>真实数据、技术、权限、风险和施工次序。\u003c/p>\u003csmall>交出：批准的 Spec、必要决策与施工票\u003c/small>\u003c/div>\u003c/li>\n\u003cli>\u003cspan class=\"phase-no\">04\u003c/span>\u003cdiv>\u003ca href=\"#delivery\" data-book-route=\"delivery\">开发交付\u003c/a>\u003cp>逐票实现、验证、人工验收，最后整体回归。\u003c/p>\u003csmall>交出：可用成果、证据和当前状态\u003c/small>\u003c/div>\u003c/li>\n\u003c/ol>\n\u003cp>可以把这四步理解为“策划—方案设计—开发准备—实施与验收”。单独设置开发准备阶段，是因为原型确定了页面和操作方式，却未必说明数据如何存储、权限如何管理、功能分几次完成。如果等到写代码时才讨论这些问题，就容易反复修改方案。验收是开发交付中的必要步骤，不必为它再增加一个阶段和一套记录。\u003c/p>\n\u003cdetails>\u003csummary>为什么分四个阶段，而不是三个阶段或 Matt 的七步方法？\u003c/summary>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>结构\u003c/th>\u003cth>怎样使用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>三阶段\u003c/td>\u003ctd>适合概括整个过程；但“深化开发”同时包含开发准备和实际实施，新手容易忽略开始写代码前需要确认的事项。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>本册四阶段\u003c/td>\u003ctd>把不同决策与交付物分开；这是面向非程序员小团队的整理，不是 Matt 官方规定。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>五阶段以上\u003c/td>\u003ctd>有多人运营、发布审批时可另列运营/发布；当前不必为阶段数增加表格。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Matt 七步操作\u003c/td>\u003ctd>盘问、研究、原型、规格、拆票、实现、人工审查；根据尚未解决的问题决定是否需要研究或原型，不要求每个任务都完整执行七步。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/details>\n\u003cp class=\"source\">参考：\u003ca href=\"https://www.designcouncil.org.uk/resources/framework-for-innovation/\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">双钻的探索与收敛\u003c/a> · \u003ca href=\"https://basecamp.com/shapeup/4.1-appendix-02\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Shape Up：小团队删减仪式\u003c/a>\u003c/p>\n\u003c/section>\n\u003csection id=\"stage-skill-overview\">\u003ch2>四阶段与主力 Skill，放在一起看\u003c/h2>\u003cp>阶段告诉你现在解决什么，Skill 告诉 AI 用哪套方法。先用当前那一个，只有碰到明确缺口才加辅助；不是把一行名字一次全部载入。\u003c/p>\u003ctable>\u003cthead>\u003ctr>\u003cth>阶段\u003c/th>\u003cth>推荐主路\u003c/th>\u003cth>打开即用\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>场景研究\u003c/td>\u003ctd>grill-with-docs 问清场景 → 有事实缺口才用 research → 你批准策划任务书\u003c/td>\u003ctd>\u003ca href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">本阶段技能与提示\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>概念原型\u003c/td>\u003ctd>有结构分歧用 prototype → 你选方向 → 视觉还未达标才用 frontend-design → 实际操作验收\u003c/td>\u003ctd>\u003ca href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">本阶段技能与提示\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>施工准备\u003c/td>\u003ctd>to-spec 固定要求 → 你确认规格与技术取舍 → to-tickets 拆票 → 你确认开工次序\u003c/td>\u003ctd>\u003ca href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">本阶段技能与提示\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>开发交付\u003c/td>\u003ctd>implement 当前票 → 按约定测试与 code-review → 真实使用检查 → 你人工验收\u003c/td>\u003ctd>\u003ca href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">本阶段技能与提示\u003c/a>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>\u003cstrong>Karpathy 不另占一个阶段：\u003c/strong>四条原则作为做事底线贯穿全过程，已有全局规则就贯彻，不人为反复贴同样正文；详见\u003ca href=\"#governance/karpathy-role\" data-book-route=\"governance/karpathy-role\">价值与保留建议\u003c/a>。\u003c/p>\u003c/section>\n\u003csection id=\"short-route\">\n\u003ch2>一个小修改，可以没有 Spec，也可以不拆票\u003c/h2>\n\u003cp>关键不是改几行，而是边界是否清楚、是否影响真实数据和多人使用、能否容易撤回。AI 先复述目标与验收标准；你确认后，在普通执行任务中直接实施并验证，不强制再盘问或生成多个计划文件。若当前已经是冻结的主控任务，则另开普通执行任务处理，主控不因“小改”重新下场施工。\u003c/p>\n\u003cdiv class=\"example\">\u003ch3>适合短链\u003c/h3>\u003cp>现有搜索页按钮文案改名、修正已明确的间距，或已定位且可安全验证的局部展示问题。先引用现有设计基线，再给前后对比和定向检查。\u003c/p>\u003ch3>要升级\u003c/h3>\u003cp>“只加一个删除按钮”可能永久删资料；“只加一个管理员”可能改变权限。这类任务不能因为界面小就省略故障和回滚验证。出现新方案争议、跨会话施工或正式施工票，也应升级。\u003c/p>\u003c/div>\n\u003cdiv class=\"prompt\">\u003cpre>这次先按小任务分流评估：我要【具体修改】，沿用【现有页面/规则】。\n先用几句话复述目标、只改哪里、不改哪里、我怎样确认它做好了。\n检查权限、真实数据、生产和难撤销操作；有风险就说明，不能硬走短链。\n若边界清楚且低风险，我确认后在普通执行任务实现并做定向验证；若这里是冻结主控，则另开执行任务，不让主控施工。不额外生成 Spec、施工票或平行计划。\n完成给入口、前后变化、实际验证结果和未验证项；不要自行部署。\u003c/pre>\u003c/div>\n\u003cp>\u003cstrong>只是问答或诊断：\u003c/strong>先查证并解释，不因此开始修代码。\u003cstrong>只是探索：\u003c/strong>用最小可抛弃样例证明或否定假设，被采用后再按正式要求建设。\u003c/p>\n\u003c/section>\n\u003csection id=\"who-decides\">\n\u003ch2>主控像总建筑师，施工任务像专项团队\u003c/h2>\n\u003cp>本册推荐主控负责目标、决策和任务安排，每张正式施工票在专属新任务中完成，详细日志和调试过程也留在那里。这样可以减少主控需要阅读的内容，但不能自动保证质量：施工任务必须收到准确的开工信息，完成后交回验证证据，而不只是一句“做好了”。团队决定采用后，再将这些要求写入项目规则。\u003c/p>\n\u003cp>默认按依赖一次施工一票，上一票经你验收后再开始下一票。独立查资料和审查可以并行，但不要同时改同一份当前状态。内部子代理隔离被委派的执行上下文，新任务隔离聊天；Git 分支管理版本，真正分开文件工作目录需 worktree 或独立 checkout。它们不能互相替代。详见\u003ca href=\"#delivery\" data-book-route=\"delivery\">开发交付\u003c/a>与\u003ca href=\"#context\" data-book-route=\"context\">上下文小册\u003c/a>。\u003c/p>\n\u003cdiv class=\"prompt\">\u003cpre>先定位本次阶段与路线，引用现有批准材料，不重复已经拍板的内容。\n我负责价值、方案和最终验收；把需要我决定的真实取舍说清。\n主控不承载施工细节。正式票开工时给专属新任务窄开工包，完成只回传验收证据、未决问题与状态。\n不要把“测试通过”直接等同于我验收，不静默推送、合并或部署。\u003c/pre>\u003c/div>\n\u003c/section>\n\u003csection id=\"how-to-use\">\n\u003ch2>遇到具体问题时查阅，不必从头记住整本手册\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>不知道下一步：\u003c/strong>先选路线，再进入对应阶段，复制提示并替换括号内容。\u003c/li>\n\u003cli>\u003cstrong>知道要做什么，却不确定用哪个 Skill：\u003c/strong>打开\u003ca href=\"#skills\" data-book-route=\"skills\">Skill 操作教程\u003c/a>，按用途查找，不必记住二十五个名字。\u003c/li>\n\u003cli>\u003cstrong>插件太多：\u003c/strong>看\u003ca href=\"#governance\" data-book-route=\"governance\">工具治理\u003c/a>，明确谁主导、谁辅助；改变设置前先核对影响。\u003c/li>\n\u003cli>\u003cstrong>对话越来越长或卡住：\u003c/strong>看\u003ca href=\"#context\" data-book-route=\"context\">上下文与日常技巧\u003c/a>，先区分容量、服务故障和本地环境。\u003c/li>\n\u003cli>\u003cstrong>想核对方法来处：\u003c/strong>看 \u003ca href=\"#skills/skill-origins\" data-book-route=\"skills/skill-origins\">作者与 Skill 来源\u003c/a>，每张方法卡下方也有原仓库链接。\u003c/li>\u003c/ul>\n\u003cp>数据库等已接近交付的项目不必推倒重来。先核对现有成果与眼下问题，补缺失的设计依据、真实验收和下一期清单；不要给过去没做过的调研补一段“已经验证”的故事。\u003c/p>\n\u003c/section>\n\u003cnav class=\"book-end\" aria-label=\"前后章节\">\u003cspan>从需要的页面开始读\u003c/span>\u003ca class=\"next\" href=\"#research\" data-book-route=\"research\">\u003cspan>下一册\u003c/span>场景研究 →\u003c/a>\u003c/nav>\u003c/article>\u003caside class=\"toc\" aria-label=\"本页目录\">\u003cstrong>本页内容\u003c/strong>\u003ca href=\"#index/begin\" data-book-route=\"index/begin\">先判断任务类型，再选择合适的开发流程\u003c/a>\u003ca href=\"#index/four-phases\" data-book-route=\"index/four-phases\">四个阶段：页面方案确定后，还需要做好开发准备\u003c/a>\u003ca href=\"#index/stage-skill-overview\" data-book-route=\"index/stage-skill-overview\">四阶段与主力 Skill，放在一起看\u003c/a>\u003ca href=\"#index/short-route\" data-book-route=\"index/short-route\">一个小修改，可以没有 Spec，也可以不拆票\u003c/a>\u003ca href=\"#index/who-decides\" data-book-route=\"index/who-decides\">主控像总建筑师，施工任务像专项团队\u003c/a>\u003ca href=\"#index/how-to-use\" data-book-route=\"index/how-to-use\">遇到具体问题时查阅，不必从头记住整本手册\u003c/a>\u003c/aside>\u003c/div>\u003cfooter>建筑师的 AI 开发手册 · 分享版\u003cbr>独立整理的实践教程，非相关作者或 AI 厂商官方手册。方法出处见各工具链接；团队规则需另行确认。\u003cbr>静态单文件，无账号、无分析追踪；外部作者页面需要联网。\u003c/footer>\u003c/main>\u003c/div>\u003cdiv class=\"notice-live\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003cscript>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}));}\nwindow.addEventListener('hashchange',openHash);openHash();\nconst sections=[...document.querySelectorAll('article>section')],tocLinks=[...document.querySelectorAll('.toc a')];\nif('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const id=visible[0].target.id;tocLinks.forEach(a=>a.classList.toggle('current',a.hash==='#'+id));},{rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>observer.observe(s));}\n})();\n\u003c/script>\u003cscript>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n\u003c/script>\u003c/body>\u003c/html>"},{"id":"research","nav":"场景研究","html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"color-scheme\" content=\"light\">\u003cmeta name=\"description\" content=\"从同事的一次真实工作出发，形成有证据、边界清楚的策划任务书。\">\u003ctitle>场景研究 · 建筑师的 AI 开发手册\u003c/title>\u003cstyle>@charset \"UTF-8\";\n:root{--bg:#f7f4ed;--paper:#fffdfa;--ink:#2d2823;--muted:#70665c;--accent:#a44c34;--line:#ddd5c9;--sage:#4d6655;--soft:#eee8de;--focus:#85331e}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:32px}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.85 \"Segoe UI\",\"Microsoft YaHei\",\"PingFang SC\",sans-serif}\na{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:4px}a:hover{color:#783221}button,input{font:inherit}button{cursor:pointer}a,button,input,summary{-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:3px}\n.skip{position:fixed;left:20px;top:-100px;z-index:9;background:var(--ink);color:#fff;padding:10px 20px}.skip:focus{top:12px}\n.layout{display:grid;grid-template-columns:246px minmax(0,1fr);max-width:1640px;margin:auto;min-height:100vh}\n.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:38px 23px :14px}.term-card dl{margin:20px 0}.term-card dt{font-size:12px;color:var(--accent);margin:18px 0 4px}.term-card dd{margin:0;font-size:15px;overflow-wrap:anywhere}.term-card dd p{margin:0 0 9px}.term-check{padding:15px 18px;background:#eee7db}.term-pitfall{font-size:13px!important;color:var(--muted)}.term-walk li{margin:18px 0}.term-walk strong{color:#79543b}\n@media(max-width:760px){.term-body{padding-left:15px;padding-right:0}.term-name{font-size:16px}.term-plain{font-size:13px}.term-filter label{flex-basis:100%}}\n@media print{body{font-size:11pt;background:#fff}.layout{display:block}.sidebar,.toc,.topline,.copy-btn,.book-end,.notice-live{display:none}.page{padding:0}.reading-grid{display:block}.hero{padding:10px 0 20px}h1{font-size:26pt}h2{font-size:18pt}article>section{break-inside:auto}a{color:#222}.prompt,.example,table{break-inside:avoid}details:not([open]){display:block}footer{margin-top:25px}}\n\u003c/style>\u003cstyle>.layout{display:block;max-width:1240px}.page{padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}\u003c/style>\u003c/head>\u003cbody>\u003ca class=\"skip\" href=\"#research/main\" data-book-route=\"research/main\">跳到正文\u003c/a>\u003cdiv class=\"layout\">\u003cmain class=\"page\" id=\"main\">\u003cheader class=\"hero\">\u003cp class=\"eyebrow\">阶段 01 · 为什么做\u003c/p>\u003ch1>先看清问题，再决定做什么。\u003c/h1>\u003cp class=\"lead\">从同事的一次真实工作出发，形成有证据、边界清楚的策划任务书。\u003c/p>\u003c/header>\u003cdiv class=\"reading-grid\">\u003carticle>\u003csection id=\"stage-skill-route\">\u003ch2>这个阶段，先用哪个 Skill？\u003c/h2>\u003cdiv class=\"stage-start\">\u003cp>通常先用 grill-with-docs，把要解决的场景问清。\u003c/p>\u003cp class=\"stage-chain\">grill-with-docs 问清场景 → 有事实缺口才用 research → 你批准策划任务书\u003c/p>\u003c/div>\u003cp>首次建立或需要修正 AI 的工作约定时，看 \u003ca href=\"#agents/agent-stages\" data-book-route=\"agents/agent-stages\">writing-for-agents 在四阶段的用途\u003c/a>；不是本阶段每次都要多跑一道流程。\u003c/p>\u003ctable class=\"stage-skill-table\">\u003cthead>\u003ctr>\u003cth>Skill\u003c/th>\u003cth>什么时候接手\u003c/th>\u003cth>解决什么 / 交出什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/card-grill-with-docs\" data-book-route=\"skills/card-grill-with-docs\">grill-with-docs\u003c/a>\u003c/td>\u003ctd>项目资料目录已经确定，需求还有分歧时的默认入口。\u003c/td>\u003ctd>产出确认过的使用者、关键场景、范围；它已包含 grilling 和 domain-modeling，不再另盘问一遍。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdetails>\u003csummary>只有遇到这些情况，才加用其他 Skill\u003c/summary>\u003ctable class=\"stage-skill-table\">\u003cthead>\u003ctr>\u003cth>Skill\u003c/th>\u003cth>什么时候接手\u003c/th>\u003cth>解决什么 / 交出什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/card-research\" data-book-route=\"skills/card-research\">research\u003c/a>\u003c/td>\u003ctd>缺少案例、官方事实、技术或行业限制时。\u003c/td>\u003ctd>查阅一手资料，整理有出处的证据和仍待确认的问题；不替同事编造答案。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/card-wayfinder\" data-book-route=\"skills/card-wayfinder\">wayfinder\u003c/a>\u003c/td>\u003ctd>目标很大，关键问题互相依赖，预计多会话才能规划清楚时；取代普通盘问入口。\u003c/td>\u003ctd>先建决策地图，再逐项用研究/盘问/原型解开未知。它的决策票不是正式施工票。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/card-grill-me\" data-book-route=\"skills/card-grill-me\">grill-me\u003c/a>\u003c/td>\u003ctd>完全独立、暂不依附项目文件的想法讨论。\u003c/td>\u003ctd>轻量盘问；形成正式研究项目后改用有文档入口。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/card-to-questionnaire\" data-book-route=\"skills/card-to-questionnaire\">to-questionnaire\u003c/a>\u003c/td>\u003ctd>答案在同事或专家那里，需要对方参与。\u003c/td>\u003ctd>产出针对真实经历的访谈问题；等待真人回答。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/details>\u003cp class=\"note\">已有批准任务书就读它，不重跑盘问。只查一个明确事实可直接 research。Wayfinder 内部已有盘问，不先跑完 grill-with-docs 再重复建一张地图。本阶段的策划任务书是人工可读成果，不借 to-spec 提前生成技术规格。\u003c/p>\u003cdiv class=\"prompt stage-entry\">\u003cpre>这次进入“场景研究”，现有资料在【目录】，目标是【想法或具体受阻场景】。\n默认请实际使用 Matt 的 grill-with-docs；先读已有材料，只问影响第一期的未知，不重复已批准结论。\n若目标跨多会话且决策依赖很多，请先说明理由，由我选择用 wayfinder 替代普通盘问入口。\n需要外部事实时才用 research；需要同事回答时用 to-questionnaire，不能自己编回答。\n把事实、判断、假设分开，最后整理策划任务书让我批准；本阶段不生成施工 Spec 或写产品代码。\n调用要求：优先使用当前应用的真实技能入口；入口未暴露时，从当前环境已装插件或 Skill 目录找到对应 SKILL.md，完整读取本步及所需引用后执行，报告实际使用的名称与路径。读不到就说明缺口，不能把普通回答冒充已调用；只加载本步需要的技能，按规则在各批准关口停止。\u003c/pre>\u003c/div>\u003cp class=\"source\">参考：\u003ca href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Matt Pocock 作者仓库\u003c/a>\u003c/p>\u003c/section>\u003cp class=\"glossary-strip\">\u003cstrong>本阶段行话：\u003c/strong>\u003ca href=\"#glossary/term-prd\" title=\"说清给谁用、解决什么问题和做到哪里，各团队对这个名字的范围并不统一。\" data-book-route=\"glossary/term-prd\">PRD · 产品需求文档\u003c/a> · \u003ca href=\"#glossary/term-user-story\" title=\"从使用者角度说明想做什么以及为什么有价值。\" data-book-route=\"glossary/term-user-story\">User story · 用户故事\u003c/a> · \u003ca href=\"#glossary/term-mvp\" title=\"用最小真实闭环提供价值并检验方向，而非一次做完愿望清单。\" data-book-route=\"glossary/term-mvp\">MVP · 最小可行产品\u003c/a> · \u003ca href=\"#glossary/term-context-file\" title=\"统一本项目的业务词义及名称，避免双方说的不是同一件事。\" data-book-route=\"glossary/term-context-file\">CONTEXT.md · 项目领域词典\u003c/a>\u003cbr>\u003cspan>点词查：白话、阶段、产物、Skill 和你要问的问题。\u003c/span>\u003c/p>\u003csection id=\"start-from-a-scene\">\n  \u003ch2>先了解工作中遇到的实际困难，再讨论做什么产品\u003c/h2>\n  \u003cp>这一阶段像建筑策划：先弄清谁来用、在哪儿用、为什么现有办法不够，再画房间。输入可以很朴素：一段最近的工作经历、现有表格或文件夹、同事的操作过程、你愿意投入的时间。不要先让 AI 列二十个功能，再替它寻找需求。\u003c/p>\n  \u003cp>例如“做建筑资料库”太宽。可以从“上周准备汇报，找不到那个屋顶节点的原始出处”开始，追问当时找了哪里、怎样确认版本、找不到有什么后果。观察一段实际操作，比问“你想要智能搜索吗”更容易得到有用信息。\u003c/p>\n  \u003csmall class=\"source\">参考：\u003ca href=\"https://www.gov.uk/service-manual/agile-delivery/how-the-discovery-phase-works\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">GOV.UK：先理解用户与约束\u003c/a> · \u003ca href=\"https://basecamp.com/shapeup/1.2-chapter-03\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Shape Up：从具体问题设边界\u003c/a>\u003c/small>\n\u003c/section>\n\n\u003csection id=\"collect-evidence\">\n  \u003ch2>让 AI 帮你整理证据，不替同事编答案\u003c/h2>\n  \u003cp>选几个确实会使用的人，请他们带着最近一次任务演示旧办法。记录触发原因、操作顺序、卡住位置、补救办法，以及能否找到原文件。录音、截图或上传材料前先取得同意，隐去客户名、账号和项目秘密。AI 可以整理访谈、查官方资料；没有访问到的现场，必须明确说没看见。\u003c/p>\n  \u003cdiv class=\"prompt\">\u003cpre>请实际使用 Matt grill-with-docs 梳理本项目场景；有外部事实缺口再用 research。已有共识不重新盘问。\n这次只做场景研究，不画正式页面、不写实现代码。\n对象是【谁】，最近一次受阻经历是【具体事件】。\n已有材料：【脱敏文件、操作记录或访谈】。\n请先还原“触发→现有做法→卡点→后果”，标明每条证据出处和日期。\n把亲眼看到的事实、我的判断、待验证假设分开。\n只问影响第一期范围的未知问题，不替受访者回答；最后提出下一次最省事的核实方法。\u003c/pre>\u003c/div>\n  \u003cdiv class=\"example\">\n    \u003ch3>应得到什么：一份注明信息来源的场景记录\u003c/h3>\n    \u003cp>以下是假设教学例，不是真实调研结果：“设计师准备节点汇报时，从多个文件夹找案例；现有记录显示文件名无法辨认原始项目。需要核实：这是命名问题，还是缺少来源字段？”证据栏应链接到具体演示记录，而不是写“行业普遍如此”。\u003c/p>\n  \u003c/div>\n  \u003cdetails>\u003csummary>怎样避免把一句抱怨变成功能需求？\u003c/summary>\u003cp>“搜索不好用”还不是结论。可能是资料根本没收录，也可能是词不一致、权限不可见，或搜索结果没有预览。先核对实际失败案例，再决定是补数据、调整流程还是开发功能。记录反例：有人靠现有目录很快找到了，原因是什么？\u003c/p>\u003c/details>\n\u003c/section>\n\n\u003csection id=\"choose-a-first-scope\">\n  \u003ch2>第一期先解决一个有价值、能验证效果的问题\u003c/h2>\n  \u003cp>把收集到的场景放在一起比较：谁经常遇到、后果有多大、现在怎样应付、改善后怎样观察。不要让 AI 凭空打分再宣布“市场验证通过”。由你决定优先服务谁、先解决哪一件事，以及这轮愿意花多少精力；愿意投入的上限不是保证完工的估算。\u003c/p>\n  \u003cdiv class=\"example\">\u003cp>建筑资料库第一期可以暂定为“在一批已获授权的样例中，按设计问题查找案例，打开详情并回到原始出处”。先不做自动抓取全网、团队计费或跨库迁移。这个边界是否有价值，仍要带回实际使用者确认，而不是因为功能少就天然正确。\u003c/p>\u003c/div>\n  \u003cp>若连关键问题都谈不完，可请 AI 帮你分次查证；只有决策本身跨会话、路线仍不清楚时才考虑 \u003ca href=\"#skills\" data-book-route=\"skills\">Wayfinder 等方法卡\u003c/a>。不必为了显得专业先铺满一张大计划表。\u003c/p>\n  \u003csmall class=\"source\">参考：\u003ca href=\"https://basecamp.com/shapeup/1.5-chapter-06\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Shape Up：问题、投入、解法与排除项\u003c/a> · \u003ca href=\"https://basecamp.com/shapeup/4.1-appendix-02\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">按团队规模删减仪式\u003c/a>\u003c/small>\n\u003c/section>\n\n\u003csection id=\"test-the-dangerous-assumption\">\n  \u003ch2>提前验证可能导致方案无法实施的关键假设\u003c/h2>\n  \u003cp>研究不只是访谈。资料能否合法使用、同事电脑有什么限制、文件格式是否能读取，都可能影响方案。先问“哪条假设如果不成立，这个方案就无法继续？”再做必要的小范围验证，不要等页面设计完成后才发现关键功能无法实现。\u003c/p>\n  \u003caside class=\"warning\">\u003cp>如果目标是同事的 Win10 设计助手，并计划以后让 AI 操作电脑，应尽早安排单独的技术小验证：核对目标系统、软件版本、权限、可控范围与紧急停止方式。先用模拟窗口、样例文件或隔离环境回答问题。本阶段不实际接管同事电脑，不输入凭证，不操作真实设计文件；真实控制需要另行授权和高风险验证。\u003c/p>\u003c/aside>\n  \u003cp>验证结果可以是“可继续”“要换路线”“先别做”。停止一个证据不足的方向也是成果。一次小测试只能证明测试条件下的结果，不能保证所有同事电脑都能运行。\u003c/p>\n  \u003csmall class=\"source\">参考：\u003ca href=\"https://www.gov.uk/service-manual/agile-delivery/how-the-alpha-phase-works\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">GOV.UK：用低复杂度原型检验危险假设\u003c/a> · \u003ca href=\"https://basecamp.com/shapeup/1.4-chapter-05\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Shape Up：提前检查风险与难估依赖\u003c/a>\u003c/small>\n\u003c/section>\n\n\u003csection id=\"approve-the-brief\">\n  \u003ch2>交给你拍板的是策划任务书，不是一堆研究摘要\u003c/h2>\n  \u003cp>请 AI 把材料整理成一份简明的任务书，包括目标使用者、关键场景、现有做法、第一期价值、开发范围、本期不做的内容、证据链接，以及尚未验证的假设、风险和验证办法。它说明“为什么做、做到什么程度”，不是后续开发使用的 Spec，也不需要提前决定每个按钮的位置。\u003c/p>\n  \u003cdiv class=\"prompt\">\u003cpre>承接已完成的 Matt grill-with-docs 共识与 research 证据，整理项目策划任务书草案。\n此步是汇总已批准结论，不再重复调用盘问，也不提前用 to-spec 生成技术规格。\n用一个真实任务说明第一期价值；附证据出处，保留待验证假设。\n明确第一期做什么、不做什么，以及我怎样观察它是否有帮助。\n列出需要我拍板的取舍，不替我默认批准。\n暂不写技术架构或施工票，批准后交给概念原型阶段。\u003c/pre>\u003c/div>\n  \u003cp>\u003cstrong>通过：\u003c/strong>你能用自己的话说明给谁用、解决哪次困难、怎样知道改善了，并接受第一期边界；重要未知已有验证结果或明确处理安排。\u003cstrong>退回：\u003c/strong>只有功能愿望、证据无法追溯、受访者结论由 AI 编造，或关键限制仍可能推翻整条路线。\u003c/p>\n\u003c/section>\n\n\u003csection id=\"reuse-and-move-on\">\n  \u003ch2>任务书确认后开始设计原型，已有项目不必从头调研\u003c/h2>\n  \u003cp>把批准版任务书、证据与未决问题交给\u003ca href=\"#concept\" data-book-route=\"concept\">概念原型\u003c/a>。后面发现新事实可以回来改，但要说清改了哪个判断、影响什么，而不是悄悄换目标。\u003c/p>\n  \u003cp>已有页面的明确小改，若使用者、场景和设计基线都清楚，可直接引用现有依据走\u003ca href=\"#delivery\" data-book-route=\"delivery\">短链\u003c/a>；新风险仍要识别。已上线或接近完成的项目，先围绕当前真实问题补证据和下一期范围，不推倒代码、不伪造过去的调研。\u003c/p>\n  \u003caside class=\"note\">\u003cp>本页结合公开研究方法整理了场景研究的操作建议，帮助团队从真实问题中确定第一期范围。它不是 Matt 技能的完整替代，也不代表一套完整的市场研究或专业设计体系。\u003c/p>\u003c/aside>\n  \u003csmall class=\"source\">参考：\u003ca href=\"https://www.designcouncil.org.uk/resources/framework-for-innovation/\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Design Council：问题与解法都需要探索、收敛和迭代\u003c/a>\u003c/small>\n\u003c/section>\n\u003cnav class=\"book-end\" aria-label=\"前后章节\">\u003ca href=\"#index\" data-book-route=\"index\">\u003cspan>上一册\u003c/span>← 使用入口\u003c/a>\u003ca class=\"next\" href=\"#concept\" data-book-route=\"concept\">\u003cspan>下一册\u003c/span>概念原型 →\u003c/a>\u003c/nav>\u003c/article>\u003caside class=\"toc\" aria-label=\"本页目录\">\u003cstrong>本页内容\u003c/strong>\u003ca href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">这个阶段，先用哪个 Skill？\u003c/a>\u003ca href=\"#research/start-from-a-scene\" data-book-route=\"research/start-from-a-scene\">先了解工作中遇到的实际困难，再讨论做什么产品\u003c/a>\u003ca href=\"#research/collect-evidence\" data-book-route=\"research/collect-evidence\">让 AI 帮你整理证据，不替同事编答案\u003c/a>\u003ca href=\"#research/choose-a-first-scope\" data-book-route=\"research/choose-a-first-scope\">第一期先解决一个有价值、能验证效果的问题\u003c/a>\u003ca href=\"#research/test-the-dangerous-assumption\" data-book-route=\"research/test-the-dangerous-assumption\">提前验证可能导致方案无法实施的关键假设\u003c/a>\u003ca href=\"#research/approve-the-brief\" data-book-route=\"research/approve-the-brief\">交给你拍板的是策划任务书，不是一堆研究摘要\u003c/a>\u003ca href=\"#research/reuse-and-move-on\" data-book-route=\"research/reuse-and-move-on\">任务书确认后开始设计原型，已有项目不必从头调研\u003c/a>\u003c/aside>\u003c/div>\u003cfooter>建筑师的 AI 开发手册 · 分享版\u003cbr>独立整理的实践教程，非相关作者或 AI 厂商官方手册。方法出处见各工具链接；团队规则需另行确认。\u003cbr>静态单文件，无账号、无分析追踪；外部作者页面需要联网。\u003c/footer>\u003c/main>\u003c/div>\u003cdiv class=\"notice-live\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003cscript>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}));}\nwindow.addEventListener('hashchange',openHash);openHash();\nconst sections=[...document.querySelectorAll('article>section')],tocLinks=[...document.querySelectorAll('.toc a')];\nif('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const id=visible[0].target.id;tocLinks.forEach(a=>a.classList.toggle('current',a.hash==='#'+id));},{rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>observer.observe(s));}\n})();\n\u003c/script>\u003cscript>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n\u003c/script>\u003c/body>\u003c/html>"},{"id":"concept","nav":"概念原型","html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"color-scheme\" content=\"light\">\u003cmeta name=\"description\" content=\"先安排功能和页面，再细化外观。通过可点击原型确认方案，为后续开发提供依据。\">\u003ctitle>概念原型 · 建筑师的 AI 开发手册\u003c/title>\u003cstyle>@charset \"UTF-8\";\n:root{--bg:#f7f4ed;--paper:#fffdfa;--ink:#2d2823;--muted:#70665c;--accent:#a44c34;--line:#ddd5c9;--sage:#4d6655;--soft:#eee8de;--focus:#85331e}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top: 6b7a4;border-radius:4px;padding:8px 10px;min-height:40px;max-width:100%}.term-filter select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}\n.term-card{margin:0;border-top:0;border-bottom:1px solid var(--line);padding:20px 0;scroll-margin-top:20px}.term-card summary{display:grid;grid-template-columns:minmax(0,1fr) 24px;gap:7px 14px;list-style:none}.term-card summary::-webkit-details-marker{display:none}.term-card summary::after{content:'＋';grid-column:2;grid-row:1/3;align-self:center;color:var(--accent);font-weight:400;font-size:22px}.term-card[open] summary::after{content:'－'}.term-name{font-size:17px;overflow-wrap:anywhere}.term-plain{font-size:14px;font-weight:400;color:var(--muted)}.term-body{padding:6px 22px 6px;border-left:2px solid #c8aa91;margin-top:18px}.term-analogy{color:#79543b;font-size:14px}.term-card dl{margin:20px 0}.term-card dt{font-size:12px;color:var(--accent);margin:18px 0 4px}.term-card dd{margin:0;font-size:15px;overflow-wrap:anywhere}.term-card dd p{margin:0 0 9px}.term-check{padding:15px 18px;background:#eee7db}.term-pitfall{font-size:13px!important;color:var(--muted)}.term-walk li{margin:18px 0}.term-walk strong{color:#79543b}\n@media(max-width:760px){.term-body{padding-left:15px;padding-right:0}.term-name{font-size:16px}.term-plain{font-size:13px}.term-filter label{flex-basis:100%}}\n@media print{body{font-size:11pt;background:#fff}.layout{display:block}.sidebar,.toc,.topline,.copy-btn,.book-end,.notice-live{display:none}.page{padding:0}.reading-grid{display:block}.hero{padding:10px 0 20px}h1{font-size:26pt}h2{font-size:18pt}article>section{break-inside:auto}a{color:#222}.prompt,.example,table{break-inside:avoid}details:not([open]){display:block}footer{margin-top:25px}}\n\u003c/style>\u003cstyle>.layout{display:block;max-width:1240px}.page{padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}\u003c/style>\u003c/head>\u003cbody>\u003ca class=\"skip\" href=\"#concept/main\" data-book-route=\"concept/main\">跳到正文\u003c/a>\u003cdiv class=\"layout\">\u003cmain class=\"page\" id=\"main\">\u003cheader class=\"hero\">\u003cp class=\"eyebrow\">阶段 02 · 怎样用\u003c/p>\u003ch1>先设计页面和操作流程，再用原型验证。\u003c/h1>\u003cp class=\"lead\">先安排功能和页面，再细化外观。通过可点击原型确认方案，为后续开发提供依据。\u003c/p>\u003c/header>\u003cdiv class=\"reading-grid\">\u003carticle>\u003csection id=\"stage-skill-route\">\u003ch2>这个阶段，先用哪个 Skill？\u003c/h2>\u003cdiv class=\"stage-start\">\u003cp>页面结构和操作方式还没确定时，用 Matt prototype；如果只需要完善视觉设计，用 frontend-design。已有符合要求的方案，就直接沿用。\u003c/p>\u003cp class=\"stage-chain\">有结构分歧用 prototype → 你选方向 → 视觉还未达标才用 frontend-design → 实际操作验收\u003c/p>\u003c/div>\u003cp>首次建立或需要修正 AI 的工作约定时，看 \u003ca href=\"#agents/agent-stages\" data-book-route=\"agents/agent-stages\">writing-for-agents 在四阶段的用途\u003c/a>；不是本阶段每次都要多跑一道流程。\u003c/p>\u003ctable class=\"stage-skill-table\">\u003cthead>\u003ctr>\u003cth>Skill\u003c/th>\u003cth>什么时候接手\u003c/th>\u003cth>解决什么 / 交出什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/card-prototype\" data-book-route=\"skills/card-prototype\">prototype\u003c/a>\u003c/td>\u003ctd>页面排布、任务流程或交互方向不确定时先用。\u003c/td>\u003ctd>交出可点击的探索原型、需要比较的真正差异及结论，也可比较视觉方向；若已达到评审要求，不为用另一个技能再做一稿。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/support-frontend-design\" data-book-route=\"skills/support-frontend-design\">frontend-design\u003c/a>\u003c/td>\u003ctd>结构方向明确，但视觉还未满足要求时使用；已有合格视觉就沿用。\u003c/td>\u003ctd>根据任务书设计信息层级、颜色、字体与组件，提供可以查看的方案；不重新改变已确认的产品方向。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdetails>\u003csummary>只有遇到这些情况，才加用其他 Skill\u003c/summary>\u003ctable class=\"stage-skill-table\">\u003cthead>\u003ctr>\u003cth>Skill\u003c/th>\u003cth>什么时候接手\u003c/th>\u003cth>解决什么 / 交出什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/card-grill-with-docs\" data-book-route=\"skills/card-grill-with-docs\">grill-with-docs\u003c/a>\u003c/td>\u003ctd>真正的产品取舍尚未确认。\u003c/td>\u003ctd>只盘问那一个分歧；已批准的场景不重问。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/card-research\" data-book-route=\"skills/card-research\">research\u003c/a>\u003c/td>\u003ctd>需要设计案例、平台规范或可行性事实。\u003c/td>\u003ctd>查原始案例/官方来源并说明可借鉴什么，案例不是功能清单。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/support-emil\" data-book-route=\"skills/support-emil\">emil-design-eng\u003c/a>\u003c/td>\u003ctd>方向已选定，具体组件、过渡或高频操作手感不够好。\u003c/td>\u003ctd>精修被点名的细节；不推翻布局，不给每个动作加动画。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/support-webapp-testing\" data-book-route=\"skills/support-webapp-testing\">webapp-testing\u003c/a>\u003c/td>\u003ctd>原型能打开之后。\u003c/td>\u003ctd>实际点击关键任务，核对返回、取消、空态、错误和模拟边界。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/support-web-design-guidelines\" data-book-route=\"skills/support-web-design-guidelines\">web-design-guidelines\u003c/a>\u003c/td>\u003ctd>有实际界面代码，需要做可访问性与界面规范检查。\u003c/td>\u003ctd>找出具体可修改的问题；不能替代真实操作，也不能替你决定审美。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/details>\u003cp class=\"note\">不需要同时使用多套视觉设计技能，也不要求固定做两轮：设计问题尚未确定时用 prototype，需要完善视觉时用 frontend-design，Emil 只处理特定细节。宣传页、作品集等适合 Taste 的场景，可以用它替代 frontend-design，不让两者在同一轮同时主导设计；数据库界面不默认使用 Taste。\u003c/p>\u003cdiv class=\"prompt stage-entry\">\u003cpre>这次进入“概念原型”，请读取【批准任务书】和【现有界面/样例】。\n结构或交互有分歧时，实际使用 Matt prototype 验证【关键任务或页面分歧】，用模拟数据和模拟写入，给能点的方案让我选；已有明确结构就不重做。\n只有选中方案的视觉仍未满足要求，才实际使用 frontend-design 定视觉；已有合格视觉直接沿用。仅需精修某个组件或动效时用 emil-design-eng，不一起堆上。\n原型做好用 webapp-testing 实际走关键任务；有界面代码后按需用 web-design-guidelines 做规范审查。\n分开报告结构选择、视觉选择、机器操作证据与仍是假功能的部分，等我确认设计基线；不直接发布原型。\n调用要求：优先使用当前应用的真实技能入口；入口未暴露时，从当前环境已装插件或 Skill 目录找到对应 SKILL.md，完整读取本步及所需引用后执行，报告实际使用的名称与路径。读不到就说明缺口，不能把普通回答冒充已调用；只加载本步需要的技能，按规则在各批准关口停止。\u003c/pre>\u003c/div>\u003cp class=\"source\">参考：\u003ca href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Matt Pocock 作者仓库\u003c/a>\u003c/p>\u003c/section>\u003cp class=\"glossary-strip\">\u003cstrong>本阶段行话：\u003c/strong>\u003ca href=\"#glossary/term-prototype\" title=\"用最小可抛弃样例回答布局、交互或逻辑问题。\" data-book-route=\"glossary/term-prototype\">Prototype · 原型\u003c/a> · \u003ca href=\"#glossary/term-acceptance\" title=\"明确满足哪些可观察条件，才算这项要求做到了。\" data-book-route=\"glossary/term-acceptance\">Acceptance criteria · 验收标准\u003c/a> · \u003ca href=\"#glossary/term-iteration\" title=\"根据实际反馈做下一轮有边界的改进。\" data-book-route=\"glossary/term-iteration\">迭代\u003c/a>\u003cbr>\u003cspan>点词查：白话、阶段、产物、Skill 和你要问的问题。\u003c/span>\u003c/p>\u003csection id=\"bring-the-approved-brief\">\n  \u003ch2>根据已确认的使用场景，设计页面和操作流程\u003c/h2>\n  \u003cp>这一阶段类似建筑方案设计：先考虑功能如何安排、使用者如何完成任务，再评价外观。需要参考已批准的策划任务书、关键场景、已有界面、数据样例和已知技术限制；最终提供可亲自操作的概念原型，并说明哪些功能只是模拟。\u003c/p>\n  \u003cp>以建筑资料库为例，先走“找一个节点案例→判断是否适用→查看出处→回到结果”这条路径。写清每一步在哪里发生、能做什么、下一步去哪里。不要一开场就设计管理后台所有页面，也不要重问上一阶段已经批准的用户与价值。\u003c/p>\n  \u003csmall class=\"source\">参考：\u003ca href=\"https://basecamp.com/shapeup/1.3-chapter-04\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Shape Up：先找位置、动作与连接关系\u003c/a>\u003c/small>\n\u003c/section>\n\n\u003csection id=\"match-the-prototype-to-the-question\">\n  \u003ch2>先确定要验证的问题，再决定原型需要做到多细\u003c/h2>\n  \u003cp>一句文字能讲清的问题，不必做三套界面；文字说不清空间关系时画粗线框；涉及交互手感、筛选流程或错误恢复时，做可点击原型。越像成品，制作和修改成本通常越高，要让每次增加细节都回答一个问题。\u003c/p>\n  \u003cp>真正有分歧时比较两到三个方向。例如资料库可比较“搜索优先”和“按设计问题浏览优先”；差别应在信息组织与任务路径，不是只换三种颜色。先由你选方向，再深入字体、密度、间距和组件细节。不要让 AI 做完几稿后自行宣布胜者。\u003c/p>\n  \u003cdetails>\u003csummary>漂亮与好用分别怎样看？\u003c/summary>\u003cp>先看关键动作是否找得到、重要信息是否排在前面，再看视觉是否一致。示例列表可能需要突出出处与缩略图，而不是把所有字段做成同等大小的卡片。涉及动效时只处理具体目的：帮助理解变化、提示完成或减少等待感；不要为了“高级”让高频操作反复播放动画。\u003c/p>\u003c/details>\n  \u003csmall class=\"source\">参考：\u003ca href=\"https://emilkowal.ski/skill\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Emil 的组件与交互细节方法\u003c/a>\u003c/small>\n\u003c/section>\n\n\u003csection id=\"make-a-testable-sample\">\n  \u003ch2>用模拟数据制作可操作原型，不影响真实业务\u003c/h2>\n  \u003cdiv class=\"prompt\">\u003cpre>请实际使用 Matt prototype，根据批准的任务书制作建筑资料库的概念原型。\n先验证尚未确定的结构与交互；只有选中方案的视觉仍未达标，才使用 frontend-design 定视觉，已有合格设计直接沿用。\n本轮只验证：查找案例→看详情→回到原始出处→返回结果。\n先给关键页面关系；有真实分歧的地方提出2–3个不同方向供我选，不为所有细节强做三稿。\n使用明确标为模拟的数据，不接生产数据库、不上传真实文件、不执行删除或外部发送。\n关键动作要可点击，返回、取消、筛选和反馈要真实响应。\n覆盖正常、空结果、加载、失败、无权限、长文本等必要状态。\n交付可打开的入口、演示路线、假功能清单和待我拍板的问题；先不要写正式产品实现。\u003c/pre>\u003c/div>\n  \u003cdiv class=\"example\">\n    \u003ch3>应看到的成果，不止首页截图\u003c/h3>\n    \u003cp>打开后能查“木屋架节点”，看到几条标明模拟的结果；进入详情能看适用说明与来源占位；返回仍保留筛选。切换到“没有结果”能清除条件；模拟无权限时说明原因与下一步，不假装点击按钮已获得真实访问。\u003c/p>\n  \u003c/div>\n  \u003cp>按钮可以模拟保存或提交，但必须明示“仅演示，未写入”。一个看似真实、其实无法走完任务的静态截图，只能当视觉材料，不能算交互方案已通过。\u003c/p>\n\u003c/section>\n\n\u003csection id=\"walk-through-the-unhappy-paths\">\n  \u003ch2>按真实任务试用原型，同时检查失败和异常情况\u003c/h2>\n  \u003cp>评审时先别让 AI 讲解每个按钮。你或未来使用者按场景自己走一遍，边做边说“我以为这里会发生什么”。记录哪里找不到、误解了什么、哪一步要靠作者提示。再看修订是否解决了具体问题，而不是只问“这版好不好看”。\u003c/p>\n  \u003ctable>\n    \u003cthead>\u003ctr>\u003cth>要检查的状态\u003c/th>\u003cth>资料库中的例子\u003c/th>\u003c/tr>\u003c/thead>\n    \u003ctbody>\n      \u003ctr>\u003ctd>正常与长内容\u003c/td>\u003ctd>短标题和很长的项目名都能辨认，详情不会把返回入口挤走。\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>空与等待\u003c/td>\u003ctd>没有资料和筛选无结果能分清；加载时知道正在等什么。\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>失败与恢复\u003c/td>\u003ctd>来源打不开时仍能返回、重试或复制线索，不只显示“错误”。\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>权限与取消\u003c/td>\u003ctd>不可访问有解释；退出操作不会让人误以为已经保存。\u003c/td>\u003c/tr>\n    \u003c/tbody>\n  \u003c/table>\n  \u003cp>状态按任务挑选，不给每个标签都堆一套样例。也要在未来常用窗口大小、缩放和键盘操作下试用；原型在浏览器通过，不等于 Windows 客户端已验证。\u003c/p>\n  \u003csmall class=\"source\">参考：\u003ca href=\"https://www.joshwcomeau.com/career/effective-collaboration/\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Josh Comeau：设计与实现持续协作，考虑真实数据及交互\u003c/a> · \u003ca href=\"https://www.gov.uk/service-manual/agile-delivery/how-the-alpha-phase-works\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">GOV.UK：用原型验证假设\u003c/a>\u003c/small>\n\u003c/section>\n\n\u003csection id=\"approve-a-baseline\">\n  \u003ch2>确认一版方案作为开发依据，后续仍可按流程调整\u003c/h2>\n  \u003cp>由你拍板关键页面与任务流、方案方向、信息层级、哪些反馈必须修改、哪些暂缓。请 AI 把获选原型、演示数据、决定理由、未解决问题及不做项放在可追溯的位置；已有项目沿用既定设计，不另造一套无关视觉系统。\u003c/p>\n  \u003cdiv class=\"prompt\">\u003cpre>请基于现有获选原型与视觉，以及 webapp-testing 的实际操作证据整理本轮评审；注明 Matt prototype / frontend-design 哪些实际用过，哪些因沿用合格成果而没用，不为凑齐技能补做一稿。\n缺实际操作证据就先使用 webapp-testing 检查，不把截图或技能加载当验证通过。\n记录获选方案、关键任务、已确认状态、仍是假功能的部分；无需重新盘问或另开一条设计流程。\n把我的批准和你的建议分开，列出必须修正与可后置事项。\n保留原型和比较依据的路径，不自行删除未选方案。\n我确认后，将这个版本作为工程准备的设计基线；后续变化须说明原因、影响与需要重新确认的内容。\u003c/pre>\u003c/div>\n  \u003cp>\u003cstrong>通过：\u003c/strong>关键任务无需额外解释就能走通；重要正常与异常状态已看过；模拟与真实边界清楚；你明确选择方案，剩余未知不推翻核心路径。\u003cstrong>退回：\u003c/strong>只好看不能操作、靠讲解才会用、关键错误或权限状态缺失，或技术限制可能令整个交互失效。\u003c/p>\n  \u003caside class=\"note\">\u003cp>冻结的意思是“施工从这一版开始，不擅自重设计”。新证据可以触发受控修改：说明变更原因、影响的页面与验收，再由你确认。发现核心场景不成立，要回到\u003ca href=\"#research\" data-book-route=\"research\">场景研究\u003c/a>，不是靠加按钮掩盖。\u003c/p>\u003c/aside>\n\u003c/section>\n\n\u003csection id=\"hand-off-without-overbuilding\">\n  \u003ch2>原型确认后进入开发准备，不能直接当成正式产品发布\u003c/h2>\n  \u003cp>把任务书、获选原型、评审记录、模拟数据说明和技术未知交给\u003ca href=\"#engineering\" data-book-route=\"engineering\">施工准备\u003c/a>。正式开发仍要设计真实数据、权限、测试和部署；原型代码是否可复用需重新评估，不能因为能打开就原样发布。\u003c/p>\n  \u003caside class=\"warning\">\u003cp>同事 Win10 设计助手若未来涉及 computer use，界面原型只能模拟“准备操作→确认→执行状态→停止”。系统与软件兼容、失败停止、权限隔离需要尽早做独立技术小验证；未经批准不控制真实电脑，不把模拟成功说成真实操作安全。\u003c/p>\u003c/aside>\n  \u003cp>已有基线的文案调整或明确局部样式，可直接在原页面定向预览，不强制两三稿或重做全站。旧项目只补这次变更涉及的流程和状态，保留能用的代码与已批准设计；小任务可走\u003ca href=\"#delivery\" data-book-route=\"delivery\">短链\u003c/a>，但不能跳过实际查看与风险判断。\u003c/p>\n\u003c/section>\n\u003cnav class=\"book-end\" aria-label=\"前后章节\">\u003ca href=\"#research\" data-book-route=\"research\">\u003cspan>上一册\u003c/span>← 场景研究\u003c/a>\u003ca class=\"next\" href=\"#engineering\" data-book-route=\"engineering\">\u003cspan>下一册\u003c/span>施工准备 →\u003c/a>\u003c/nav>\u003c/article>\u003caside class=\"toc\" aria-label=\"本页目录\">\u003cstrong>本页内容\u003c/strong>\u003ca href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">这个阶段，先用哪个 Skill？\u003c/a>\u003ca href=\"#concept/bring-the-approved-brief\" data-book-route=\"concept/bring-the-approved-brief\">根据已确认的使用场景，设计页面和操作流程\u003c/a>\u003ca href=\"#concept/match-the-prototype-to-the-question\" data-book-route=\"concept/match-the-prototype-to-the-question\">先确定要验证的问题，再决定原型需要做到多细\u003c/a>\u003ca href=\"#concept/make-a-testable-sample\" data-book-route=\"concept/make-a-testable-sample\">用模拟数据制作可操作原型，不影响真实业务\u003c/a>\u003ca href=\"#concept/walk-through-the-unhappy-paths\" data-book-route=\"concept/walk-through-the-unhappy-paths\">按真实任务试用原型，同时检查失败和异常情况\u003c/a>\u003ca href=\"#concept/approve-a-baseline\" data-book-route=\"concept/approve-a-baseline\">确认一版方案作为开发依据，后续仍可按流程调整\u003c/a>\u003ca href=\"#concept/hand-off-without-overbuilding\" data-book-route=\"concept/hand-off-without-overbuilding\">原型确认后进入开发准备，不能直接当成正式产品发布\u003c/a>\u003c/aside>\u003c/div>\u003cfooter>建筑师的 AI 开发手册 · 分享版\u003cbr>独立整理的实践教程，非相关作者或 AI 厂商官方手册。方法出处见各工具链接；团队规则需另行确认。\u003cbr>静态单文件，无账号、无分析追踪；外部作者页面需要联网。\u003c/footer>\u003c/main>\u003c/div>\u003cdiv class=\"notice-live\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003cscript>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}));}\nwindow.addEventListener('hashchange',openHash);openHash();\nconst sections=[...document.querySelectorAll('article>section')],tocLinks=[...document.querySelectorAll('.toc a')];\nif('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const id=visible[0].target.id;tocLinks.forEach(a=>a.classList.toggle('current',a.hash==='#'+id));},{rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>observer.observe(s));}\n})();\n\u003c/script>\u003cscript>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n\u003c/script>\u003c/body>\u003c/html>"},{"id":"engineering","nav":"施工准备","html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"color-scheme\" content=\"light\">\u003cmeta name=\"description\" content=\"这一阶段确认规格、技术方案和施工票。准备是否充分，要看要求是否清楚，而不是文档有多少。\">\u003ctitle>施工准备 · 建筑师的 AI 开发手册\u003c/title>\u003cstyle>@charset \"UTF-8\";\n:root{--bg:#f7f4ed;--paper:#fffdfa;--ink:#2d2823;--muted:#70665c;--accent:#a44c34;--line:#ddd5c9;--sage:#4d6655;--soft:#eee8de;--focus:#85331e}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:32px}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.85 \"Segoe UI\",\"Microsoft YaHei\",\"PingFang SC\",sans-serif}\na{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:4px}a:hover{color:#783221}button,input{font:inherit}button{cursor:pointer}a,button,input,summary{-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:3px}\n.skip{position:fixed;left:20px;top:-100px;z-index:9;background:var(--ink);color:#fff;padding:10px 20px}.skip:focus{top:12px}\n.l 17px;overflow-wrap:anywhere}.term-plain{font-size:14px;font-weight:400;color:var(--muted)}.term-body{padding:6px 22px 6px;border-left:2px solid #c8aa91;margin-top:18px}.term-analogy{color:#79543b;font-size:14px}.term-card dl{margin:20px 0}.term-card dt{font-size:12px;color:var(--accent);margin:18px 0 4px}.term-card dd{margin:0;font-size:15px;overflow-wrap:anywhere}.term-card dd p{margin:0 0 9px}.term-check{padding:15px 18px;background:#eee7db}.term-pitfall{font-size:13px!important;color:var(--muted)}.term-walk li{margin:18px 0}.term-walk strong{color:#79543b}\n@media(max-width:760px){.term-body{padding-left:15px;padding-right:0}.term-name{font-size:16px}.term-plain{font-size:13px}.term-filter label{flex-basis:100%}}\n@media print{body{font-size:11pt;background:#fff}.layout{display:block}.sidebar,.toc,.topline,.copy-btn,.book-end,.notice-live{display:none}.page{padding:0}.reading-grid{display:block}.hero{padding:10px 0 20px}h1{font-size:26pt}h2{font-size:18pt}article>section{break-inside:auto}a{color:#222}.prompt,.example,table{break-inside:avoid}details:not([open]){display:block}footer{margin-top:25px}}\n\u003c/style>\u003cstyle>.layout{display:block;max-width:1240px}.page{padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}\u003c/style>\u003c/head>\u003cbody>\u003ca class=\"skip\" href=\"#engineering/main\" data-book-route=\"engineering/main\">跳到正文\u003c/a>\u003cdiv class=\"layout\">\u003cmain class=\"page\" id=\"main\">\u003cheader class=\"hero\">\u003cp class=\"eyebrow\">阶段 03 · 怎样建\u003c/p>\u003ch1>方案确认后，写清开发要求和任务安排。\u003c/h1>\u003cp class=\"lead\">这一阶段确认规格、技术方案和施工票。准备是否充分，要看要求是否清楚，而不是文档有多少。\u003c/p>\u003c/header>\u003cdiv class=\"reading-grid\">\u003carticle>\u003csection id=\"stage-skill-route\">\u003ch2>这个阶段，先用哪个 Skill？\u003c/h2>\u003cdiv class=\"stage-start\">\u003cp>从批准材料开始用 to-spec，规格与技术取舍确定后再用 to-tickets。\u003c/p>\u003cp class=\"stage-chain\">to-spec 固定要求 → 你确认规格与技术取舍 → to-tickets 拆票 → 你确认开工次序\u003c/p>\u003c/div>\u003cp>首次建立或需要修正 AI 的工作约定时，看 \u003ca href=\"#agents/agent-stages\" data-book-route=\"agents/agent-stages\">writing-for-agents 在四阶段的用途\u003c/a>；不是本阶段每次都要多跑一道流程。\u003c/p>\u003ctable class=\"stage-skill-table\">\u003cthead>\u003ctr>\u003cth>Skill\u003c/th>\u003cth>什么时候接手\u003c/th>\u003cth>解决什么 / 交出什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/card-to-spec\" data-book-route=\"skills/card-to-spec\">to-spec\u003c/a>\u003c/td>\u003ctd>任务书与原型已批准，准备形成正式规格。\u003c/td>\u003ctd>综合用户故事、可检查验收、不做项和测试边界；不是从头再访谈。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/card-to-tickets\" data-book-route=\"skills/card-to-tickets\">to-tickets\u003c/a>\u003c/td>\u003ctd>规格和会影响切片的技术取舍已确认。\u003c/td>\u003ctd>交出纵向切片票、依赖和第一张 MVP；先让你审票序，不立即批量施工。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cdetails>\u003csummary>只有遇到这些情况，才加用其他 Skill\u003c/summary>\u003ctable class=\"stage-skill-table\">\u003cthead>\u003ctr>\u003cth>Skill\u003c/th>\u003cth>什么时候接手\u003c/th>\u003cth>解决什么 / 交出什么\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/card-domain-modeling\" data-book-route=\"skills/card-domain-modeling\">domain-modeling\u003c/a>\u003c/td>\u003ctd>术语冲突或需要记录真正重要的架构选择。\u003c/td>\u003ctd>维护 CONTEXT.md/必要 ADR；只是读取已有词典不用重新启动它。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/card-codebase-design\" data-book-route=\"skills/card-codebase-design\">codebase-design\u003c/a>\u003c/td>\u003ctd>模块边界或测试入口需要判断。\u003c/td>\u003ctd>用真实案例比较接口和封装，不为猜想的扩展加层。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/card-research\" data-book-route=\"skills/card-research\">research\u003c/a>\u003c/td>\u003ctd>选型仍卡在外部事实。\u003c/td>\u003ctd>带来源回答那个问题，不重新做全项目调研。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/card-prototype\" data-book-route=\"skills/card-prototype\">prototype\u003c/a>\u003c/td>\u003ctd>状态转换或业务逻辑是否合理，光靠文字无法判断。\u003c/td>\u003ctd>用逻辑原型验证具体问题，不重新设计已批准的页面。Windows 兼容性、系统权限和真实接口能力，需要获得授权后在目标环境中单独验证；模拟成功不等于实际验证通过。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca class=\"skill-link\" href=\"#skills/card-setup-matt-pocock-skills\" data-book-route=\"skills/card-setup-matt-pocock-skills\">setup-matt-pocock-skills\u003c/a>\u003c/td>\u003ctd>项目尚无 tracker/规则与文档位置约定。\u003c/td>\u003ctd>首次建立项目所需的技能和文档约定，先说明要修改哪里并取得授权；不是每次任务都重新安装。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/details>\u003cp class=\"note\">已经澄清的场景不重复追问，也不再增加一套 Superpowers brainstorming / writing-plans 流程。只有材料中缺少必要的产品决定时，才回到上一阶段。小任务不必因为本页介绍了 to-spec，就改走完整流程。\u003c/p>\u003cdiv class=\"prompt stage-entry\">\u003cpre>这次进入“施工准备”，输入是【批准任务书】、【原型与评审记录】。\n先实际使用 Matt to-spec 综合既有决定，明确故事、验收、不做项和公共测试边界；交我确认，不重开整轮盘问。\n术语冲突或重要取舍才用 domain-modeling，接口边界问题用 codebase-design，缺事实再用 research；必须验证的逻辑未知才用 prototype 的逻辑路线。\n规格与技术取舍经我确认后，再实际使用 to-tickets 生成纵向施工票、依赖和 MVP，票序再由我确认。\n所有输出沿用本项目事实源，不再生成一套 Superpowers Spec 或计划。本轮只准备，不施工。\n调用要求：优先使用当前应用的真实技能入口；入口未暴露时，从当前环境已装插件或 Skill 目录找到对应 SKILL.md，完整读取本步及所需引用后执行，报告实际使用的名称与路径。读不到就说明缺口，不能把普通回答冒充已调用；只加载本步需要的技能，按规则在各批准关口停止。\u003c/pre>\u003c/div>\u003cp class=\"source\">参考：\u003ca href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Matt Pocock 作者仓库\u003c/a>\u003c/p>\u003c/section>\u003cp class=\"glossary-strip\">\u003cstrong>本阶段行话：\u003c/strong>\u003ca href=\"#glossary/term-spec\" title=\"把已有共识写成故事、验收、不做项及已定的实施与测试要求。\" data-book-route=\"glossary/term-spec\">Spec · 规格书\u003c/a> · \u003ca href=\"#glossary/term-adr\" title=\"记下重要取舍为什么这样选，以及接受了什么代价。\" data-book-route=\"glossary/term-adr\">ADR · 架构决策记录\u003c/a> · \u003ca href=\"#glossary/term-ticket\" title=\"从规格中拆出的具体任务，说明要完成什么、如何验收，以及开始前需要满足哪些条件。\" data-book-route=\"glossary/term-ticket\">Ticket · 施工票\u003c/a> · \u003ca href=\"#glossary/term-tracer-bullet\" title=\"先完成一个具体功能所需的数据、逻辑和界面，让这个功能能够单独演示或验证。\" data-book-route=\"glossary/term-tracer-bullet\">Tracer bullet · 纵向贯通切片\u003c/a> · \u003ca href=\"#glossary/term-seam\" title=\"设计中指可替换行为的位置，测试中常指从外部调用并观察行为的入口。\" data-book-route=\"glossary/term-seam\">Seam · 接缝与测试入口\u003c/a>\u003cbr>\u003cspan>点词查：白话、阶段、产物、Skill 和你要问的问题。\u003c/span>\u003c/p>\u003csection id=\"ready-inputs\">\n  \u003ch2>施工准备：把已定稿的方案变成可验收的施工票\u003c/h2>\n  \u003cp class=\"glossary-entry\">多人参与时，在拆票前明确负责人、共同基线与共享接口；看\u003ca href=\"#team/team-flow\" data-book-route=\"team/team-flow\">同事协作的票据流转\u003c/a>。本册不自动启用多人并行。\u003c/p>\n  \u003cp>进入这一页时，应已有你批准的项目策划任务书、概念方案与可点击原型。先确认它们的路径、版本、批准日期和第一期边界。这里不重新设计产品，也不把前面已经回答的问题再盘问一遍；只补会影响施工的缺口。\u003c/p>\n  \u003cp>像建筑施工图阶段：先接收已定稿方案，再讲清材料、接口、验收与施工顺序。原型证明“这个方案值得采用”，不证明代码已经安全、稳定、可安装。原型中的假数据、模拟写入和临时页面，都要明确标出。\u003c/p>\n  \u003cdiv class=\"warning\">\u003cp>缺少真实场景证据，回到\u003ca href=\"#research\" data-book-route=\"research\">场景研究\u003c/a>；关键页面和任务流还没确定，回到\u003ca href=\"#concept\" data-book-route=\"concept\">概念原型\u003c/a>。不是用一份很长的 Spec 把尚未决定的问题掩盖过去。\u003c/p>\u003c/div>\n  \u003cdiv class=\"prompt\">\u003cpre>这是 Matt to-spec 的输入核对：读取已批准的策划任务书与概念方案，先复述施工输入和不做范围。\n沿用现有共识；只有出现新的产品分歧才回到 grill-with-docs，不能整轮重问。\n不要重新盘问已确定的内容，不写实现代码。\n只列出会阻碍规格、技术选择或验收的缺口；能查资料和仓库回答的，先自行查证。\u003c/pre>\u003c/div>\n\u003c/section>\n\n\u003csection id=\"terms-decisions\">\n  \u003ch2>先统一项目术语，再用 ADR 记录重要决策\u003c/h2>\n  \u003cp>\u003ccode>CONTEXT.md\u003c/code> 是项目领域词典：例如“场景”“方案版本”“发布版”各指什么，代码里对应什么名称。它不是一般编程教材，也不放实施计划、每日进度或待办。共同语言让你和 AI 说的是同一件事。\u003c/p>\n  \u003cp>ADR 是“当时为什么这样选”的决策记录。按当前 Matt 的领域建模规则，三个条件同时成立才值得写：决定难以撤销；未来接手者没有上下文会觉得意外；确实存在需要解释的取舍。不要给每个按钮和变量都建 ADR。\u003c/p>\n  \u003ctable>\u003cthead>\u003ctr>\u003cth>内容\u003c/th>\u003cth>放在哪里\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n    \u003ctr>\u003ctd>项目领域词汇、名称对应\u003c/td>\u003ctd>\u003ccode>CONTEXT.md\u003c/code>\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>重要选择、替代方案、为什么接受代价\u003c/td>\u003ctd>\u003ccode>docs/adr/\u003c/code>\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>用户要求与验收边界\u003c/td>\u003ctd>当前功能的 Spec\u003c/td>\u003c/tr>\n    \u003ctr>\u003ctd>当前票做到哪里、验证与人工验收\u003c/td>\u003ctd>当前施工票\u003c/td>\u003c/tr>\n  \u003c/tbody>\u003c/table>\n  \u003cp class=\"note\">“唯一事实源”不是把所有信息放进一个文件，而是每类信息只在一处维护，其他页面引用它，避免多个版本互相矛盾。详见\u003ca href=\"#context\" data-book-route=\"context\">上下文与交接\u003c/a>。\u003c/p>\n\u003c/section>\n\n\u003csection id=\"write-spec\">\n  \u003ch2>用 /to-spec 写清开发要求，不必提前设计每一处代码\u003c/h2>\n  \u003cp>在保留已有讨论的规划主线中调用 \u003ccode>/to-spec\u003c/code>，综合现成共识，而不是从零再做访谈。先读\u003ca href=\"#skills\" data-book-route=\"skills\">技能调用说明\u003c/a>：菜单没有出现不等于技能已失效；没有原生入口时，明确使用等价步骤，不谎称已成功调用。\u003c/p>\n  \u003cp>Spec 至少写清用户故事、可观察的验收标准、明确不做什么，以及已知约束和仍待验证的风险。测试应放在哪个公共边界，也要在施工前说明。采用本地票据时，可放在 \u003ccode>.scratch/功能名/spec.md\u003c/code>。\u003c/p>\n  \u003cdiv class=\"example\">\u003cp>不要只写“支持导出”。应写：“策划人员选择一个方案版本，导出包含该版本内容的文件；取消导出不留下半成品；目标目录不可写时给出可理解的提示；第一期不做批量导出。”\u003c/p>\u003c/div>\n  \u003cdetails>\u003csummary>我审 Spec 时，只需要看懂这四件事\u003c/summary>\n    \u003cul>\u003cli>谁在什么场景做什么，结果是不是我想要的？\u003c/li>\u003cli>成功、空数据、失败或取消时，分别应该看到什么？\u003c/li>\u003cli>哪些原型细节已经冻结，哪些仍是模拟或待验证？\u003c/li>\u003cli>明确排除什么，避免 AI 顺手扩展功能？\u003c/li>\u003c/ul>\n    \u003cp>Spec 应说明目标、范围和限制，不必提前列出每个函数、文件路径和伪代码。必要的架构决定可以引用 ADR；会在实现过程中调整的细节，由当前施工票处理。\u003c/p>\n  \u003c/details>\n\u003c/section>\n\n\u003csection id=\"choose-technology\">\n  \u003ch2>技术选择由 AI 解释，由你拍板\u003c/h2>\n  \u003cp>需要选数据库、部署方式、桌面打包或系统集成时，AI 提供两到三套确实可行的方案。比较重点不是术语数量，而是你会得到什么、要多维护什么、离线能否用、数据在哪里、以后更换难不难，以及失败时能否退回。\u003c/p>\n  \u003cdiv class=\"prompt\">\u003cpre>针对当前规格给出 2–3 套确实可行的技术方案，并推荐一套。\n外部事实不明时实际使用 Matt research；模块边界有取舍时用 codebase-design；重大决定经我选择后由 domain-modeling 记录适用的 ADR。\n用用户影响解释：安装使用、离线与数据、维护成本、扩展限制、迁移和回退。\n指出尚未验证的假设及最小验证办法。等我选择后，再记录符合条件的 ADR；不要静默替我决定。\u003c/pre>\u003c/div>\n  \u003cp>可以先做窄范围的可行性验证，例如确认目标 Windows 版本能否安装某组件。验证结果写回对应风险或决策；不能把“演示能运行”升级为整套产品通过，也不借研究之名接入生产数据。\u003c/p>\n  \u003cp class=\"note\">比较方案、由负责人确认重要取舍，以及沿用已批准的设计，是本手册建议团队采用的约定，并非 Matt 对所有项目统一规定的审批流程。\u003c/p>\n\u003c/section>\n\n\u003csection id=\"slice-tickets\">\n  \u003ch2>用 /to-tickets 拆分任务，让每张施工票都能单独验收\u003c/h2>\n  \u003cp>规格审阅和技术选择完成后再拆票。普通功能按纵向切片：一张票贯通必要的数据、逻辑与界面，让你能独立演示和验收；不要先写完全部数据库，再写全部接口，最后才第一次看到产品。\u003c/p>\n  \u003cp>每张票都要说明目标、开发范围、本期不做的内容、依赖、风险、验收标准、验证命令、相关 Spec／ADR，以及哪些步骤必须由人参与（HITL）。新任务应能根据票据和引用材料理解要求；如果还要翻阅大量历史聊天，就需要补齐开工信息，或进一步拆小任务。\u003c/p>\n  \u003cp>\u003cstrong>本手册的补充约定：\u003c/strong>第一票优先是可演示的最小闭环 MVP，票序由你确认。数据库写入、权限、永久删除、生产部署、密钥与迁移等按 H 类高风险处理，必须写恢复或回滚办法。大范围重构可能需要准备性改造或先扩展后收缩，Matt 并非禁止这种例外；但 AI 必须解释原因，请你批准，不能偷偷改成横向拆票。\u003c/p>\n  \u003cdetails>\u003csummary>什么时候应该继续拆小？\u003c/summary>\u003cp>一票横跨多个独立子系统、无法独立回退、人工验收过长，或需要跨多个会话才能讲清，都应停下来重新切分。按用户影响和可恢复性判断，不按代码行数判断风险。新想法先留下一期，不把当前票越写越大。\u003c/p>\u003c/details>\n\u003c/section>\n\n\u003csection id=\"ready-handoff\">\n  \u003ch2>开发前最后检查：哪些内容已批准，施工任务需要哪些材料\u003c/h2>\n  \u003cul>\u003cli>策划与原型的批准版本可访问，模拟内容已标出。\u003c/li>\u003cli>Spec 的故事、验收和不做项已确认，技术取舍有结论。\u003c/li>\u003cli>票的粒度、依赖、风险和顺序已确认，第一张可开工票明确。\u003c/li>\u003cli>开工包包含真实仓库、分支或 worktree、未存档改动、允许范围和验证命令。\u003c/li>\u003c/ul>\n  \u003cp>满足这些条件，再进入\u003ca href=\"#delivery\" data-book-route=\"delivery\">开发交付\u003c/a>。主线从此负责决策与调度，不承担实现日志。轻量小修走\u003ca href=\"#index\" data-book-route=\"index\">入口的短路线\u003c/a>，不机械重走四阶段；一旦跨会话或风险升级，应补齐对应规格、票据与安全闸门。\u003c/p>\n  \u003cp class=\"source\">参考：\u003ca href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">技能仓库\u003c/a>\u003c/p>\n\u003c/section>\n\u003cnav class=\"book-end\" aria-label=\"前后章节\">\u003ca href=\"#concept\" data-book-route=\"concept\">\u003cspan>上一册\u003c/span>← 概念原型\u003c/a>\u003ca class=\"next\" href=\"#delivery\" data-book-route=\"delivery\">\u003cspan>下一册\u003c/span>开发交付 →\u003c/a>\u003c/nav>\u003c/article>\u003caside class=\"toc\" aria-label=\"本页目录\">\u003cstrong>本页内容\u003c/strong>\u003ca href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">这个阶段，先用哪个 Skill？\u003c/a>\u003ca href=\"#engineering/ready-inputs\" data-book-route=\"engineering/ready-inputs\">施工准备：把已定稿的方案变成可验收的施工票\u003c/a>\u003ca href=\"#engineering/terms-decisions\" data-book-route=\"engineering/terms-decisions\">先统一项目术语，再用 ADR 记录重要决策\u003c/a>\u003ca href=\"#engineering/write-spec\" data-book-route=\"engineering/write-spec\">用 /to-spec 写清开发要求，不必提前设计每一处代码\u003c/a>\u003ca href=\"#engineering/choose-technology\" data-book-route=\"engineering/choose-technology\">技术选择由 AI 解释，由你拍板\u003c/a>\u003ca href=\"#engineering/slice-tickets\" data-book-route=\"engineering/slice-tickets\">用 /to-tickets 拆分任务，让每张施工票都能单独验收\u003c/a>\u003ca href=\"#engineering/ready-handoff\" data-book-route=\"engineering/ready-handoff\">开发前最后检查：哪些内容已批准，施工任务需要哪些材料\u003c/a>\u003c/aside>\u003c/div>\u003cfooter>建筑师的 AI 开发手册 · 分享版\u003cbr>独立整理的实践教程，非相关作者或 AI 厂商官方手册。方法出处见各工具链接；团队规则需另行确认。\u003cbr>静态单文件，无账号、无分析追踪；外部作者页面需要联网。\u003c/footer>\u003c/main>\u003c/div>\u003cdiv class=\"notice-live\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003cscript>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}));}\nwindow.addEventListener('hashchange',openHash);openHash();\nconst sections=[...document.querySelectorAll('article>section')],tocLinks=[...document.querySelectorAll('.toc a')];\nif('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const id=visible[0].target.id;tocLinks.forEach(a=>a.classList.toggle('current',a.hash==='#'+id));},{rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>observer.observe(s));}\n})();\n\u003c/script>\u003cscript>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n\u003c/script>\u003c/body>\u003c/html>"},{"id":"delivery","nav":"开发交付","html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"color-scheme\" content=\"light\">\u003cmeta name=\"description\" content=\"主控负责决策和调度，专属任务负责实现。完成测试后，还需要你实际试用并确认。\">\u003ctitle>开发交付 · 建筑师的 AI 开发手册\u003c/title>\u003cstyle>@charset \"UTF-8\";\n:root{--bg:#f7f4ed;--paper:#fffdfa;--ink:#2d2823;--muted:#70665c;--accent:#a44c34;--line:#ddd5c9;--sage:#4d6655;--soft:#eee8de;--focus:#85331e}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:32px}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.85 \"Segoe UI\",\"Microsoft YaHei\",\"PingFang SC\",sans-serif}\na{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:4px}a:hover{color:#783221}button,input{font:inherit}button{cursor:pointer}a,button,input,summary{-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:3px}\n.skip{position:fixed;left:20px;top:-100px;z-index:9;background:var(--ink);color:#fff;padding:10px 20px}.skip:focus{top:12px}\n.layout{display:grid;grid-template-columns:246px minmax(0,1fr);max-width:1640px;margin:auto;min-height:100vh}\n.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:38px 23px 25px;overflow-y:auto}\n.brand{display:block;color:var(--ink);text-decoration:none;font-size:18px;font-weight:700;line-height:1.5;margin-bottom:28px}.brand small{display:block;font-weight:400;font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);margin-top:6px}\n.menu-to
