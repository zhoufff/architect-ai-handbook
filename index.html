m-chain li:last-child{border-bottom:0}.team-chain strong,.team-chain span{display:block}.team-chain span{font-size:14px;color:var(--muted);margin-top:5px}.team-workflow li{padding:7px 0 7px 7px;margin:12px 0}.team-workflow strong{display:block;color:#79543b;margin-bottom:6px}.team-skill-table{font-size:13px}.team-skill-table td:first-child{width:20%}.team-skill-table td:nth-child(2){width:33%}\n.glossary-entry,.glossary-strip{font-size:14px;padding:16px 20px;background:var(--soft);border-left:3px solid #b98c6c}.glossary-strip{margin:26px 0}.glossary-strip span{font-size:12px;color:var(--muted)}\n.term-filter{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0 15px;font-size:13px}.term-filter select,.term-filter button{font:inherit;color:var(--ink);background:var(--paper);border:1px solid #c6b7a4;border-radius:4px;padding:8px 10px;min-height:40px;max-width:100%}.term-filter select:focus-visible{outline:3px solid var(--focus);outline-offset:3px}\n.term-card{margin:0;border-top:0;border-bottom:1px solid var(--line);padding:20px 0;scroll-margin-top:20px}.term-card summary{display:grid;grid-template-columns:minmax(0,1fr) 24px;gap:7px 14px;list-style:none}.term-card summary::-webkit-details-marker{display:none}.term-card summary::after{content:'＋';grid-column:2;grid-row:1/3;align-self:center;color:var(--accent);font-weight:400;font-size:22px}.term-card[open] summary::after{content:'－'}.term-name{font-size:17px;overflow-wrap:anywhere}.term-plain{font-size:14px;font-weight:400;color:var(--muted)}.term-body{padding:6px 22px 6px;border-left:2px solid #c8aa91;margin-top:18px}.term-analogy{color:#79543b;font-size:14px}.term-card dl{margin:20px 0}.term-card dt{font-size:12px;color:var(--accent);margin:18px 0 4px}.term-card dd{margin:0;font-size:15px;overflow-wrap:anywhere}.term-card dd p{margin:0 0 9px}.term-check{padding:15px 18px;background:#eee7db}.term-pitfall{font-size:13px!important;color:var(--muted)}.term-walk li{margin:18px 0}.term-walk strong{color:#79543b}\n@media(max-width:760px){.term-body{padding-left:15px;padding-right:0}.term-name{font-size:16px}.term-plain{font-size:13px}.term-filter label{flex-basis:100%}}\n@media print{body{font-size:11pt;background:#fff}.layout{display:block}.sidebar,.toc,.topline,.copy-btn,.book-end,.notice-live{display:none}.page{padding:0}.reading-grid{display:block}.hero{padding:10px 0 20px}h1{font-size:26pt}h2{font-size:18pt}article>section{break-inside:auto}a{color:#222}.prompt,.example,table{break-inside:avoid}details:not([open]){display:block}footer{margin-top:25px}}\n</style><style>.layout{display:block;max-width:1240px}.page{padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}</style></head><body><a class=\"skip\" href=\"#delivery/main\" data-book-route=\"delivery/main\">跳到正文</a><div class=\"layout\"><main class=\"page\" id=\"main\"><header class=\"hero\"><p class=\"eyebrow\">阶段 04 · 做到可用</p><h1>逐项完成开发，验证后再由你验收。</h1><p class=\"lead\">主控写记录不写产品，施工票会话实现，审查会话审，你按验收单确认。</p></header><div class=\"reading-grid\"><article><section id=\"stage-skill-route\">\n<h2>这个阶段，先用哪个 Skill？</h2>\n<div class=\"stage-start\"><p>在当前票的施工票会话里用 implement；它组织测试与 code-review，不再重复启动另一条施工链。</p><p class=\"stage-chain\">implement 当前票 → 按约定测试与 code-review → 真实使用检查 → 你人工验收</p></div>\n<p>首次建立或需要修正 AI 的工作约定时，看 <a href=\"#agents/agent-stages\" data-book-route=\"agents/agent-stages\">writing-for-agents 在四阶段的用途</a>；不是本阶段每次都要多跑一道流程。</p>\n<table class=\"stage-skill-table\">\n<thead>\n<tr>\n<th>Skill</th>\n<th>什么时候接手</th>\n<th>解决什么 / 交出什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><a class=\"skill-link\" href=\"#skills/card-implement\" data-book-route=\"skills/card-implement\">implement</a></td>\n<td>正式票和开工包已经批准，在施工票会话执行。</td>\n<td>只实现本票，核对实际改动、测试与限制。</td>\n</tr>\n<tr>\n<td><a class=\"skill-link\" href=\"#skills/card-code-review\" data-book-route=\"skills/card-code-review\">code-review</a></td>\n<td>本票实现可供审查时，在独立的审查会话里用。</td>\n<td>分别审 Spec 和项目标准，覆盖实际未提交改动；已有有效审查不机械再来一轮。</td>\n</tr>\n</tbody></table>\n<details><summary>只有遇到这些情况，才加用其他 Skill</summary><table class=\"stage-skill-table\">\n<thead>\n<tr>\n<th>Skill</th>\n<th>什么时候接手</th>\n<th>解决什么 / 交出什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><a class=\"skill-link\" href=\"#skills/card-tdd\" data-book-route=\"skills/card-tdd\">tdd</a></td>\n<td>票约定测试驱动，高风险票采用严格 TDD。</td>\n<td>公共边界红→绿小循环；普通功能仍需风险相称的测试，不等于不测试。</td>\n</tr>\n<tr>\n<td><a class=\"skill-link\" href=\"#skills/card-diagnosing-bugs\" data-book-route=\"skills/card-diagnosing-bugs\">diagnosing-bugs</a></td>\n<td>真实故障或性能问题原因还不清。</td>\n<td>先复现定位再按授权修复；同一问题不双跑两套诊断。</td>\n</tr>\n<tr>\n<td><a class=\"skill-link\" href=\"#skills/support-webapp-testing\" data-book-route=\"skills/support-webapp-testing\">webapp-testing</a></td>\n<td>网页或浏览器可测页面到了实际验证环节。</td>\n<td>实走用户任务；原生 Windows exe 仍要在目标系统另验，不能以浏览器冒充。</td>\n</tr>\n<tr>\n<td><a class=\"skill-link\" href=\"#skills/support-verification\" data-book-route=\"skills/support-verification\">superpowers:verification-before-completion</a></td>\n<td>装了 Superpowers 的电脑上，准备声称完成之前。</td>\n<td>核对实际新证据；没装时按 01 第 3 节自行核对，效果相同。</td>\n</tr>\n<tr>\n<td><a class=\"skill-link\" href=\"#skills/support-worktrees\" data-book-route=\"skills/support-worktrees\">superpowers:using-git-worktrees</a></td>\n<td>装了 Superpowers 的电脑上，真实 Git 项目需要独立工作目录时。</td>\n<td>核对并创建隔离目录；Claude Code 自带 worktree 能力时不需要它。</td>\n</tr>\n<tr>\n<td><a class=\"skill-link\" href=\"#skills/card-handoff\" data-book-route=\"skills/card-handoff\">handoff</a></td>\n<td>跨工具、目录、协作者接续，且现有票和施工日志仍不足以接手时。</td>\n<td>引用票与事实源，交出当前焦点、失败尝试、下一步；普通票不另造 handoff 文件。</td>\n</tr>\n</tbody></table></details>\n<p class=\"note\">implement 已经组织的 TDD 不再手动重跑一套。人工验收、提交和部署授权是你的关口，不存在替你批准的 Skill。</p>\n<div class=\"prompt stage-entry\"><pre>本轮是已批准票【票路径】的施工票会话。\n请实际使用 Matt implement，先按开工包核对前置成果已在真实目录、分支、已有改动、范围和验证命令。\n按票约定的验证强度执行；采用 TDD 时使用 Matt tdd。出现未定位故障时使用 diagnosing-bugs。网页用 webapp-testing 实走任务，Windows 原生能力在目标环境另外验证。\n收工按三态之一：完成待验收、部分完成并列未达项、阻塞并说明要我决定的事。交验收单，附审查会话的开工包。Spec 或票本身有错，交联系单，不自己改。\n不自行关票、提交、推送或部署。</pre></div>\n<p class=\"source\">技能名可点击查看用法。以上是结合 Matt 技能与辅助技能整理的本手册分工，不是自动触发配置。<a href=\"#governance/karpathy-role\" data-book-route=\"governance/karpathy-role\">Karpathy 的跨阶段底线</a>；<a href=\"#skills/invoke-and-check\" data-book-route=\"skills/invoke-and-check\">怎样确认真正调用</a>。</p>\n<p class=\"glossary-strip\"><strong>本阶段行话：</strong><a href=\"#glossary/term-tdd\" data-book-route=\"glossary/term-tdd\">TDD · 测试驱动开发</a> · <a href=\"#glossary/term-smoke-test\" data-book-route=\"glossary/term-smoke-test\">Smoke test · 冒烟测试</a> · <a href=\"#glossary/term-qa\" data-book-route=\"glossary/term-qa\">QA · 质量保障</a> · <a href=\"#glossary/term-worktree\" data-book-route=\"glossary/term-worktree\">Worktree · 独立工作目录</a> · <a href=\"#glossary/term-deploy\" data-book-route=\"glossary/term-deploy\">部署</a><br><span>点词查：白话、阶段、产物、Skill 和你要问的问题。</span></p>\n<p>想看完整过程？<a href=\"#skills/case-implementation\" data-book-route=\"skills/case-implementation\">本阶段的实际问题示例</a>。资料入口与更新责任见<a href=\"#knowledge/knowledge-maintenance\" data-book-route=\"knowledge/knowledge-maintenance\">项目知识库维护</a>。</p>\n\n</section>\n<section id=\"ticket-workspace\">\n<h2>每张施工票都要经过实现、审查和人工验收</h2>\n<p class=\"glossary-entry\">同事在另一台电脑施工时，使用<a href=\"#team/team-feedback\" data-book-route=\"team/team-feedback\">跨人员回报格式</a>与<a href=\"#team/team-flow\" data-book-route=\"team/team-flow\">复核合并路线</a>；不要把他人的 AI 当成自动互通的内部子代理。</p>\n<p>票序确认后主控进入冻结：写记录，不写产品。记录是施工日志、根路由、开工包、决策卡和 ADR，以及批准变更后的 Spec 和票；产品是代码和配置，由施工票会话写。主控不施工、不跑 Git、不运行实现或调试命令。</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>隔离方式</th>\n<th>解决什么</th>\n<th>不能替代什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>施工票会话</td>\n<td>把当前票的讨论、实现和验收单留在独立窗口</td>\n<td>不会自动隔离磁盘文件</td>\n</tr>\n<tr>\n<td>审查会话</td>\n<td>让审的人不是干活的人</td>\n<td>不替代你的验收</td>\n</tr>\n<tr>\n<td>内部子代理</td>\n<td>给窄任务独立上下文，回传证据</td>\n<td>不替代施工票会话或审查会话</td>\n</tr>\n<tr>\n<td>Git 分支／worktree</td>\n<td>管理版本；worktree 另有工作目录</td>\n<td>不等于新会话，也不是系统安全沙盒</td>\n</tr>\n</tbody></table></div>\n<aside class=\"note\"><p>每票 fresh context 有 Matt 依据；一票一会话、独立审查、一次只开当前可施工票，是<strong>本手册的补充约定</strong>。上一票由你验收、前置成果已留存后，主控才派下一票。AI 不能替你开窗口，主控只能交出开工包请你新建。</p></aside>\n</section>\n<section id=\"start-package\">\n<h2>开工包只包含本次任务需要的信息，并核实实际环境</h2>\n<p>派工前主控核对当前票、前置成果的真实版本与位置。新会话开工后，执行者先核实成果已进入实际目录，检查真实 Git 根、分支或 worktree 和未提交改动；无 Git 时如实说明，不强建仓库。已有改动属于你：保全、绕开无关内容；与当前任务重叠且不能安全处理时停下来说明，不用重置或全量覆盖解决。</p>\n<p>开工包按 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/05-任务开工包模板.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">05 模板</a>：核心九行加施工票变体。填好是这样，以虚构的建筑资料库为例：</p>\n<div class=\"prompt\"><pre>任务：建筑资料库，票 03 资料列表按类型筛选，做到选类型后列表只显示该类型\n角色：施工票执行者，边界按 04\n路线与关口：正式功能第 5 步；本轮结束于验收单交付\n入口：项目 AGENTS D:/项目/资料库/AGENTS.md；施工日志 D:/项目/资料库/项目总览/md/施工日志.md；共享规程 02 第 4 节\n批准来源：票序 2026-09-10 确认，见施工日志；本票范围已批准\n允许写：src/list/ 下文件、本票、专题索引；只读：其余；不做：不新增分类管理，不改接口\n需另行确认：无涉及真实数据的操作\n模型：期望按 01 的表；实测 Opus 5.5\n交还：主控；内容按 02 收工交还\n\n当前票：专题工作/资料检索/施工票/03-类型筛选.md；Spec：专题工作/资料检索/Spec.md 第 4 条；ADR 与基线：不涉及\n票序批准：施工日志 2026-09-10 条目；上一票验收与前置成果：票 02 已验收，提交 a1b2c3d\n现场：目录 D:/项目/资料库；Git 根同上；分支 main；未提交改动 无\n验证：强度 普通；自动检查 npm test 于项目根，预期全部通过；实际运行 打开列表页选“节点”，只显示节点类；故障与恢复 不适用\n收工：三态之一；交验收单；Spec 或票有错交联系单；附审查开工包</pre></div>\n<p>模型按 01 的表设置并报告；工具设不了或读不到的写“未确认”，用当前设置继续。</p>\n\n</section>\n<section id=\"build-verify\">\n<h2>先把当前行为做对，再独立检查要求与规范</h2>\n<p>验证强度在拆票时写进票，执行者可以提高，降低要报告。高风险票和明确要求测试驱动的票采用严格 TDD；普通功能按实际风险做针对性检查，适合时采用 Matt 的小步循环，不必为每次样式或文案修改建立复杂测试。采用 TDD 时，先在约定的公共接口上写一个能够暴露问题的失败测试，再写刚好使它通过的实现，然后检查结果。不要先生成全部测试再一次性实现，也不要求测试每个内部函数。重构放在审查阶段，始终只处理当前票的范围。</p>\n<p>循环内针对当次变更运行类型检查和相关测试；票末运行一次全套测试，再交审查会话做两轴审查：Spec——是否满足故事、验收与不做项；Standards——是否符合项目约定、可维护性和安全要求。审查发现问题，回到施工票会话修复后验证受影响行为，必要时重跑相关全套。</p>\n<aside class=\"warning\"><p>全套跑不了就记原因、未覆盖范围与替代证据，不能把定向通过说成全部通过。同一代码状态、相同环境下，不为“多一层代理”无意义重复相同检查；新改动、新失败或新风险则重新验证。</p></aside>\n<p>人工验收前尚未提交的改动也必须纳入审查。固定点到 HEAD 的差异不自动包含工作区内容；空 diff 不能证明没有问题。审查者要明确基线，并读取本票实际改动。</p>\n<details><summary>为什么自动测试通过还不能交付？</summary>\n<p>英文课 P04 第一片已有 12 个测试，画面仍出现收入显示成 Free；下一片图表也曾没有曲线。检查程序、AI 定性审查、真实使用验收解决的是不同问题。自动审查说“ship it”不等于你已经确认产品可用。</p>\n</details>\n</section>\n<section id=\"real-acceptance\">\n<h2>验收真实操作，不只看启动成功和截图</h2>\n<p>施工票收工时交一张<strong>验收单</strong>：每条验收标准一行，写你做什么操作、应该看到什么、机器验证的结果、待你确认。你逐行照做、逐行勾。以类型筛选票为例：</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>验收标准</th>\n<th>你的操作</th>\n<th>应看到</th>\n<th>机器验证</th>\n<th>待你确认</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>选类型后只显示该类型</td>\n<td>列表页选“节点”</td>\n<td>只剩节点类条目</td>\n<td><code>npm test</code> 12 项全过；截图 03-筛选-节点.png</td>\n<td>待确认</td>\n</tr>\n<tr>\n<td>无结果有提示</td>\n<td>选一个没有条目的类型</td>\n<td>“没有该类型的资料”提示</td>\n<td>截图 03-筛选-空.png</td>\n<td>待确认</td>\n</tr>\n<tr>\n<td>清空恢复全部</td>\n<td>点“清空筛选”</td>\n<td>回到全部条目</td>\n<td>截图 03-筛选-清空.png</td>\n<td>待确认</td>\n</tr>\n<tr>\n<td>不新增分类管理</td>\n<td>找分类管理入口</td>\n<td>没有</td>\n<td>审查会话问题清单：无发现</td>\n<td>待确认</td>\n</tr>\n</tbody></table></div>\n<p>机器验证一栏写实际跑的命令和结果，或截图、日志的路径；只写“通过”或留空视为未验证。截图配一句“操作—预期—实际”，记录复现步骤、软件版本和必要日志，让你能看懂；截图好看不证明保存、权限和恢复都有效。</p>\n<ul>\n<li>网页：浏览器实走关键流程，检查加载、空数据、错误、权限与结果持久化。</li>\n<li>目标为 Windows 10 的 exe：在目标环境验证首次安装、普通用户启动、更新、权限拒绝、卸载或回退。开发机能运行不代表安装包可交付。</li>\n<li>含 computer-use：先说明可操作应用与数据范围；验证停止后不再继续操作、需批准的动作确实等待批准，并留下可审计的动作与结果。工具不可用就记录未验证，不宣称已控制桌面。</li>\n<li>涉及真实数据：先在约定测试副本检查；不得为了“真实验收”擅自写生产或试删文件。</li>\n</ul>\n<p>机器验证和审查结果先出，再请你亲自查看或使用。<strong>本手册的关口：</strong>你确认前不关票、不开始下一票、不做本地 Git 提交。确认后才按约定存档；push、merge、部署仍需单独授权。</p>\n\n</section>\n<section id=\"bugs-risk\">\n<h2>遇到故障先复现问题，高风险修改必须有恢复办法</h2>\n<p>遇到 Bug 时，先用 Matt diagnosing-bugs 复现用户描述的问题，提出可能原因，再通过检查逐一证实或排除；一次只改变一个变量，定位后再按授权修复并验证。只有它不可用或当前票明确指定，才用 Superpowers systematic-debugging 作为备用；同一故障不同时执行两套诊断流程。要求诊断问题，不等于已经授权修改代码。</p>\n<p>数据库写入、权限、永久删除、密钥、迁移和生产部署默认高风险。施工前说清影响对象、最小权限、备份与回滚步骤；对恢复能力做适用的实际验证。仅写了“有备份”不算恢复成功，涉及生产切换仍等你批准。</p>\n<aside class=\"warning\"><p>不要照抄课程的云端标签自动执行、自动提交或无沙盒示例。工作流可能持有写权限和认证环境；“只读 Token”不代表整个运行环境只读。尤其不要把不可信任务直接接入日常办公电脑或内网。详见<a href=\"#governance\" data-book-route=\"governance\">工具与安全治理</a>。</p></aside>\n</section>\n<section id=\"close-deliver\">\n<h2>收工只有三种状态，详细记录留在票里</h2>\n<p>一张票只能以三种状态收工：<strong>完成待验收</strong>、<strong>部分完成</strong>并列出没做到的、<strong>阻塞</strong>并说明原因和要你决定的事。“基本做好了”不是状态。执行者发现 Spec 或票本身有错，交一张<strong>联系单</strong>：哪里错、影响什么、建议怎么改。它不自己改 Spec，由你决定。</p>\n<p>收工时交给主控五样：改了什么、证据在哪、没验证什么、待你决定什么、施工日志更新到哪。外加审查会话的开工包，你转手开审查会话；审查意见回到施工票会话处理，验收单和审查结果一起交主控。当前票是本票记录的唯一事实源，追加验收标准逐项结果、验证命令与结果、截图或日志路径、限制、你的确认及存档信息。主控只更新施工日志，不复制施工细节。</p>\n<p>全部票人工验收后，主控派一个<strong>回归交付</strong>会话，读取 Spec、ADR 和票据结果，走通跨票的真实使用路径。发现新想法进入下一期，不借收尾扩张范围；历史规格与验收记录保留可追溯性，不因关票永久删除。</p>\n<p>明确局部小修走<a href=\"#index/short-route\" data-book-route=\"index/short-route\">轻量路线</a>，在施工日志记一行；成为正式功能或变为高风险时，补相应依据与安全检查。要改产品方向，回到<a href=\"#engineering\" data-book-route=\"engineering\">施工准备</a>及已批准设计处理变更，不能在施工中暗改需求。</p>\n<p class=\"source\">依据：当前 <a href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Matt 技能仓库</a> implement、tdd、code-review、diagnosing-bugs；英文 P08 2:52:19 起：检查、审查、人审三层及3:19:46：仍保留人的检查点；<a href=\"https://docs.github.com/en/actions/reference/security/secure-use\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">GitHub 工作流安全说明</a>。</p>\n</section>\n<nav class=\"book-end\" aria-label=\"前后章节\"><a href=\"#engineering\" data-book-route=\"engineering\"><span>上一册</span>← 施工准备</a><a class=\"next\" href=\"#agents\" data-book-route=\"agents\"><span>下一册</span>Agent 执行手册 →</a></nav></article><aside class=\"toc\" aria-label=\"本页目录\"><p>这一页</p><a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">这个阶段，先用哪个 Skill？</a><a href=\"#delivery/ticket-workspace\" data-book-route=\"delivery/ticket-workspace\">每张施工票都要经过实现、审查和人工验收</a><a href=\"#delivery/start-package\" data-book-route=\"delivery/start-package\">开工包只包含本次任务需要的信息，并核实实际环境</a><a href=\"#delivery/build-verify\" data-book-route=\"delivery/build-verify\">先把当前行为做对，再独立检查要求与规范</a><a href=\"#delivery/real-acceptance\" data-book-route=\"delivery/real-acceptance\">验收真实操作，不只看启动成功和截图</a><a href=\"#delivery/bugs-risk\" data-book-route=\"delivery/bugs-risk\">遇到故障先复现问题，高风险修改必须有恢复办法</a><a href=\"#delivery/close-deliver\" data-book-route=\"delivery/close-deliver\">收工只有三种状态，详细记录留在票里</a></aside></div></main></div><div class=\"notice-live\" role=\"status\" aria-live=\"polite\"></div><script>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement; t-size:26pt}h2{font-size:18pt}article>section{break-inside:auto}a{color:#222}.prompt,.example,table{break-inside:avoid}details:not([open]){display:block}footer{margin-top:25px}}\n</style><style>.layout{display:block;max-width:1240px}.page{padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}</style></head><body><a class=\"skip\" href=\"#agents/main\" data-book-route=\"agents/main\">跳到正文</a><div class=\"layout\"><main class=\"page\" id=\"main\"><header class=\"hero\"><p class=\"eyebrow\">案头工具 · 把工作交代清楚</p><h1>让 Agent 按共同规则分工，并提供验证结果。</h1><p class=\"lead\">用 writing-for-agents 写清 AI 的职责、参考材料、完成标准和停止条件；用开工包把每个会话交代清楚。</p></header><div class=\"reading-grid\"><article><section id=\"agent-start\">\n<h2>先写清工作约定，再明确各自职责</h2>\n<p><strong>writing-for-agents 是这章的核心 Skill，但不是 Agent 管理器。</strong>它帮助你写清工作要求、注明参考资料的位置，并明确怎样判断任务已经完成。具体任务由你开会话、贴开工包分派，施工由 implement 等方法组织；采用哪个方案、是否通过验收，仍由你决定。</p>\n<p>最省事的结构是：<strong>一份共享项目规则 ＋ 各角色的不同职责 ＋ 每次任务的开工包。</strong>规则在 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/03-项目规则模板.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">03 项目规则模板</a>，角色在 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/04-Agent角色说明.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">04 角色说明</a>，开工包在 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/05-任务开工包模板.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">05 开工包模板</a>。不是给主控、施工、审查各复制一份 AGENTS.md，也不是把全部开发手册塞进每个 Agent 的上下文。</p>\n\n</section>\n<section id=\"agent-project-start\">\n<h2>新项目先建一个能继续工作的资料入口</h2>\n<p class=\"source\">这是我们的启动教学，不是 Matt 原文，也不是第五个开发阶段。执行要求以 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/02-通用开发规程.md#project-startup\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">02 新项目启动与最少建档</a> 为唯一依据。</p>\n<p><strong>为什么先建档：</strong>像建筑项目先给资料一个项目编号和图纸目录，研究结论才有归处，下一位 Agent 才知道从哪里接手。此时不必已经选定完整产品范围、技术栈或架构。</p>\n<p><strong>何时、由谁做：</strong>你已明确要建立真实新项目，项目目录、当次范围与写入授权能够确定时，由承担项目建立的 Agent，在首份需要保留的研究资料或代码写入前，用 writing-for-agents 按 03 做最小建档。普通问答、一次性演示不触发；已有项目复用原规则与资料，只在权限内补缺。</p>\n<p><strong>完成看什么：</strong>根 AGENTS.md 写明项目身份、已批准原则、边界与资料路由；README.md 给人一个入口；施工日志建好，六项按实际填，未定的写“待确认”；决策台账的位置已登记。目录只随实际内容建立，不预造 Spec、施工票或空文件夹。建档完成后继续当前已授权阶段；建档不等于批准施工。</p>\n<div class=\"example\"><h3>例子：设计案例资料库，先做场景研究</h3>\n<p>你确认“在指定目录建立设计案例资料库，本轮只研究建筑师如何找案例，并授权保存研究资料”。Agent 先写根规则、README 和施工日志，再把首份研究放入实际需要的专题目录。搜索方式、数据模型和第一期完整功能仍可待确认；不用等到施工准备才补入口，也不能把研究授权理解成可以开始开发。</p></div>\n<div class=\"prompt\"><pre>请在【项目真实目录】建立【项目名称】，本轮已授权范围是【例如场景研究与保存资料】，允许写入【明确目录／边界】。\n请使用 writing-for-agents，先读 02 的 project-startup 与 03 项目规则模板，在首份需保留的研究资料或代码前做最小建档。\n根 AGENTS.md 写项目身份、已批准原则、边界和资料路由；README.md 作人类入口；施工日志六项按实际填，未定写待确认；登记决策台账位置。\n只按实际内容建立目录，复用已有材料；不预造 Spec、票或空目录。\n已有明确授权的普通建档直接执行，不逐文件重复询问；仅材料冲突、范围实质变化或缺少授权时暂停相关部分。\n核对入口可用后继续【当前已授权阶段】，报告建档位置及仍待确认的事项。</pre></div>\n<p>目录示意见<a href=\"#knowledge/knowledge-layout\" data-book-route=\"knowledge/knowledge-layout\">项目知识库布局</a>。旧规则下运行的项目改按新规程，不重建，见 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/02-通用开发规程.md#project-adopt\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">02 已有项目接入</a>。</p>\n</section>\n<section id=\"agent-how-to\">\n<h2>writing-for-agents：把工作要求写成 AI 能照着执行的约定</h2>\n<p>它由 <strong>Matt Pocock</strong> 提供，属于 <a href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">mattpocock/skills</a>。完整方法见<a href=\"#skills/card-writing-for-agents\" data-book-route=\"skills/card-writing-for-agents\">技能卡与源码入口</a>。</p>\n<ol>\n<li><strong>给材料：</strong>现有规则文件、已批准流程，以及一次具体跑偏的例子。没有规则时，给项目简介和你希望保留的边界；AI 能从项目查到的事实先自行查。</li>\n<li><strong>点名调用：</strong>让 AI 使用 Matt writing-for-agents；看不到技能入口时，要求找到并完整读取对应 SKILL.md。仅复述名字不算使用，读不到要说明。</li>\n<li><strong>先确定写在哪里：</strong>个人习惯与硬停留全局；共同流程与角色职责引用共享规程；项目规则只留本项目长期差异与资料路由；今天做哪张票、哪些文件可改，写在开工包。</li>\n<li><strong>写成具体要求：</strong>说明什么情况下该做什么、参考哪些资料、做到哪里需要停止。所有任务都要遵守的要求直接写在正文；只有特定任务才需要的细节，则注明“遇到什么情况，先读哪份文件”。</li>\n<li><strong>看清修改前后的差别，再批准：</strong>重点看有没有删掉你在意的保护、偷偷改产品决定或扩大施工范围。然后用一次只读演练检查规则有没有被正确理解。</li>\n</ol>\n<p><strong>应交出的不是“已优化”三个字：</strong>而是“原文问题 → 建议写法 → 放在哪里 → 为什么 → 怎么验证”的短对照。只有你授权改文件时，才再交修改结果。你已经明确批准一次修改，就不需要重复确认同一件事。</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>原来这样说</th>\n<th>改成这样，才知道怎么做</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>请阅读相关文档，按最佳实践开发。</td>\n<td>修改登录或权限前，先读【权限 ADR 的真实路径】及本票权限验收项；若与现状冲突，先报告差异，等用户决定。</td>\n</tr>\n<tr>\n<td>主 Agent 负责架构，子 Agent 写代码。</td>\n<td>主控提出架构选项供用户拍板；票序批准后写记录不写产品。施工票会话在批准范围实现、验证并交验收单，发现架构要变交联系单，不自行改。</td>\n</tr>\n<tr>\n<td>做完测试就算完成，别搞坏现有功能。</td>\n<td>交验收单：每条验收标准写操作、预期、机器验证结果、待确认；标出未验证项。机器通过后保持“待验收”，等用户确认。</td>\n</tr>\n<tr>\n<td>不要随便重构，也不要乱删文件。</td>\n<td>只改本票所需内容；发现额外重构或清理需求，记录影响并单独提议。删除、迁移和不可逆操作按 01 硬停先取得同意。</td>\n</tr>\n</tbody></table></div>\n<div class=\"prompt\"><pre>请实际使用 Matt writing-for-agents，先完整读取对应 SKILL.md，并报告真实来源。\n材料：【现有规则文件路径】、【已批准流程或票路径】。\n最近的问题是：【例如主控自己施工、施工票漏读规格、每次小改都重复规划】。\n先只读审查：逐项给“原文问题—建议改法—放在哪层—验证办法”。\n区分共享项目规则、角色职责和每票开工包；资料指针要写清何时读取。\n保留现有硬停和人工关口，不改产品决定，不另建平行事实源。\n本轮不修改文件。我批准后，再只改指定文件；用一次只读演练核对理解。</pre></div>\n<aside class=\"note\"><p>它改善的是规则的组织与可靠执行，不是把字数压到最少。规则短却漏掉审批，或满篇晦涩缩写，都不是好结果；也没有“用了就能节省固定百分比 Token”的保证。</p></aside>\n</section>\n<section id=\"agent-stages\">\n<h2>四个阶段分别在什么时候用它？</h2>\n<p><strong>只在建立、改写或修复“给 AI 的工作约定”时调用。</strong>规则稳定后，研究、画原型和按票施工照常走各自 Skill，不额外插一轮规则优化。</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>阶段与调用时机</th>\n<th>交给 writing-for-agents 的事</th>\n<th>它不替代的主方法</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">01 场景研究</a><br>真实新项目满足启动条件，或研究员总把猜测当事实时。</td>\n<td>新项目先按<a href=\"#agents/agent-project-start\" data-book-route=\"agents/agent-project-start\">启动建档</a>建立根规则、施工日志与入口，再保存首份研究。研究边界留开工包，长期约束进 AGENTS.md。</td>\n<td><a href=\"#skills/card-grill-with-docs\" data-book-route=\"skills/card-grill-with-docs\">grill-with-docs</a> 问清需求；<a href=\"#skills/card-research\" data-book-route=\"skills/card-research\">research</a> 查证事实。</td>\n</tr>\n<tr>\n<td><a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">02 概念原型</a><br>首次委派视觉任务，或 AI 总越过设计边界时。</td>\n<td>写清“使用模拟数据、探索哪些设计问题、由谁选方案”；基线确认后写清设计基线入口。不必每调整一次颜色就新建规则文件。</td>\n<td><a href=\"#skills/card-prototype\" data-book-route=\"skills/card-prototype\">prototype</a> 验证方案；<a href=\"#skills/support-frontend-design\" data-book-route=\"skills/support-frontend-design\">frontend-design</a> 做视觉设计。</td>\n</tr>\n<tr>\n<td><a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">03 施工准备</a><br>首张正式票派发前，补齐仍不清楚的分工与共同约束。</td>\n<td>复用启动时已建的根规则，补开工包和规范入口。票里验收含糊时可润清，但改变产品标准须批准。</td>\n<td><a href=\"#skills/card-to-spec\" data-book-route=\"skills/card-to-spec\">to-spec</a> 形成规格；<a href=\"#skills/card-to-tickets\" data-book-route=\"skills/card-to-tickets\">to-tickets</a> 拆票；<a href=\"#skills/card-domain-modeling\" data-book-route=\"skills/card-domain-modeling\">domain-modeling</a> 维护术语与决策。</td>\n</tr>\n<tr>\n<td><a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">04 开发交付</a><br>不是每票必用；规则误读反复发生、交接方式变化，或收尾沉淀长期经验时。</td>\n<td>只修导致跑偏的那条指令；把已证实的长期约束留一处，把本票结果仍写回本票。先定位问题，不能把所有 Bug 都怪到规则上。</td>\n<td><a href=\"#skills/card-implement\" data-book-route=\"skills/card-implement\">implement</a> 施工；<a href=\"#skills/card-diagnosing-bugs\" data-book-route=\"skills/card-diagnosing-bugs\">diagnosing-bugs</a> 查故障；<a href=\"#skills/card-code-review\" data-book-route=\"skills/card-code-review\">code-review</a> 审查。</td>\n</tr>\n</tbody></table></div>\n<p class=\"source\">以上阶段分配是结合 Matt 方法形成的本手册适配，不是 Matt 规定每个项目都必须增加四轮规则审查。</p>\n</section>\n<section id=\"agent-roles\">\n<h2>会话怎么开、怎么管：主控像项目经理，每种会话像一个班组</h2>\n<p>角色的正式定义在 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/04-Agent角色说明.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">04</a>。这里讲你实际会经历的事。</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>会话</th>\n<th>谁开</th>\n<th>干什么</th>\n<th>交回什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>主控</td>\n<td>你，每个项目同一时间一个，窗口按关口换</td>\n<td>冻结前规划：写 Spec、拆票。冻结后写记录不写产品：施工日志、根路由、开工包、偏好节、决策卡和 ADR</td>\n<td>向你提关口，没有别人可交</td>\n</tr>\n<tr>\n<td>建图</td>\n<td>你，按主控给的开工包</td>\n<td>探索期和你一起定，记决策卡和地图，轮末出简报；施工期只读记录出简报</td>\n<td>本轮简报、待你定的问题</td>\n</tr>\n<tr>\n<td>施工票</td>\n<td>你，按主控给的开工包，一票一个</td>\n<td>implement 这一票</td>\n<td>收工三态之一、验收单、联系单、审查开工包</td>\n</tr>\n<tr>\n<td>审查</td>\n<td>你，按施工票收工时附的开工包，一票一个</td>\n<td>只读审 Spec 轴和规范轴</td>\n<td>问题清单和严重程度</td>\n</tr>\n<tr>\n<td>回归交付</td>\n<td>你，按主控给的开工包，一个功能一次</td>\n<td>读 Spec 和全部票，走通跨票真实路径</td>\n<td>回归结果、发布与恢复说明</td>\n</tr>\n<tr>\n<td>普通执行</td>\n<td>你，直接开，不用开工包</td>\n<td>小改动</td>\n<td>改动、证据、施工日志一行</td>\n</tr>\n</tbody></table></div>\n<p>问答在任何窗口都行，不记录。内部子代理由会话自己派，你看不到窗口，比如 code-review 派出的两个审查子代理。</p>\n<p><strong>AI 不能替你开窗口。</strong>主控每次派工，回复末尾会写“请新开会话，贴入以下开工包”。你新建一个聊天，把那段贴进去，那个窗口就成了对应的角色。Codex 和 Claude Code 都是“新建聊天、贴第一条消息”这一个动作，菜单叫法以当前版本界面为准。开工包的写法在 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/05-任务开工包模板.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">05</a>：核心九行加各会话的变体，填好的施工票例子见<a href=\"#delivery/start-package\" data-book-route=\"delivery/start-package\">开发交付</a>。</p>\n<p><strong>一张票怎么走：</strong>主控写开工包 → 你开施工票会话 → 它先交开工报告，核对现场 → implement → 收工，交验收单，附审查开工包 → 你开审查会话 → 审查意见回施工票会话处理 → 验收单和审查结果交主控 → 你按验收单逐行确认 → 主控更新施工日志 → 下一票。一次只开一张票。</p>\n<p><strong>一轮决策怎么走：</strong>问题出现，可能来自新需求、联系单、阶段回退或 Wayfinder 的未知 → 在决策现场和你定 → 现场写进决策卡或 ADR → 轮末现场用编号清单逐条复述本轮决定，你按编号确认 → 主控更新施工日志 → 建图会话用程序从卡出一页简报 → 主控审阅。探索期按轮出，施工期并入该票关票后的那一轮；架构图只在你要时出，本轮改了架构，现场会在轮末问你。</p>\n<p><strong>决策现场在哪：</strong>项目前期你和建图会话坐在一起定，它写台账，主控只在轮末接收、核方向。地图上没有未定问题挡住第一份 Spec 时，建图会话交地图，主控在施工日志把决策现场改成“主控”，此后新决定在主控定、主控记。施工中冒出一片互相牵连的新未知，主控会提议开一轮建图，把现场改回去，轮末再改回来。你在不是现场的窗口问“选 A 还是 B”，它会记下并让你去现场，不替你定。</p>\n<p><strong>你亲手做的只有三件事：</strong>开窗口贴开工包、在关口拍板、按验收单逐行确认。模型按 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/01-全局准则-模板.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">01</a> 的表设置，工具设不了会写“未确认”。</p>\n\n</section>\n<section id=\"agent-rule-layers\">\n<h2>AGENTS.md 写共同约定，角色说明只写差异</h2>\n<p>规则入口和项目资料不是同一种文件。如何集中正文、标清来源，并让新 Agent 按任务查阅，见<a href=\"#knowledge/knowledge-layout\" data-book-route=\"knowledge/knowledge-layout\">项目知识库布局</a>；如果文档已经散落，先看<a href=\"#skills/case-documents\" data-book-route=\"skills/case-documents\">整理入口的完整案例</a>。</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>放在哪里</th>\n<th>应该放</th>\n<th>不应该放</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>全局规则 01</td>\n<td>硬停、跨项目都成立的沟通方式、模型偏好、路由表。</td>\n<td>某个平台的技术栈、某张票的进度。</td>\n</tr>\n<tr>\n<td>项目根 AGENTS.md</td>\n<td>项目身份、批准原则、关键保护、资料目录和读取条件、验证入口。</td>\n<td>每个角色各写一套项目事实、整份历史聊天、实时进度。进度在施工日志。</td>\n</tr>\n<tr>\n<td>角色说明 04</td>\n<td>八个角色各自读什么、写什么、交回什么。</td>\n<td>复制共享规则全文。</td>\n</tr>\n<tr>\n<td>开工包 05</td>\n<td>这次目标、票路径、现场、允许文件、验收、停止条件、交回对象。</td>\n<td>永久修改所有 Agent 的职责，或偷偷批准原票没包含的操作。</td>\n</tr>\n</tbody></table></div>\n<details id=\"agent-client-files\"><summary>Codex 与 Claude Code，文件名和子代理定义怎么区分？</summary>\n<p><strong>Codex：</strong>个人全局文件是 <code>~/.codex/AGENTS.md</code>，项目文件是项目根 <code>AGENTS.md</code>，按目录层级发现，不是按“主控／施工”名字挑文件。因此不要建两份主／子 AGENTS.md 期待系统按角色读取。<a href=\"https://learn.chatgpt.com/docs/agent-configuration/agents-md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">官方：AGENTS.md</a>；<a href=\"https://learn.chatgpt.com/docs/agent-configuration/subagents\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">官方：子代理</a>。</p>\n<p><strong>Claude Code：</strong>个人全局文件是 <code>~/.claude/CLAUDE.md</code>，默认读 CLAUDE.md，不自动读 AGENTS.md。项目里在 CLAUDE.md 写一行 <code>@AGENTS.md</code> 引入同一份项目规则，不维护两份正文。<a href=\"https://code.claude.com/docs/en/memory#agentsmd\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">官方：共享规则</a>；<a href=\"https://code.claude.com/docs/en/sub-agents\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">官方：子代理定义</a>。</p>\n<p>两个工具的接入都是同一件事：把仓库里的 01 复制成工具的全局文件，只改第 6 节路径。详见 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/06-规则维护与启用检查.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">06 规则维护</a>。</p>\n<p><strong>别假设子代理什么都继承：</strong>Claude Code 文档明确部分子代理跳过 CLAUDE.md，普通子代理也没有父聊天全文。新会话同样不继承派工者的聊天。关键限制和材料入口要写进开工包或委派消息。<a href=\"https://code.claude.com/docs/en/sub-agents#what-loads-at-startup\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">官方：启动时加载什么</a>。</p>\n<p>角色名字和“只读”措辞都不是安全沙盒；真正限制还要靠工具权限、文件／网络访问和审批。此处不让你放宽这些限制。</p>\n</details>\n</section>\n<section id=\"agent-templates\">\n<h2>模板都在规则库里，这里只放一个填好的例子</h2>\n<p><a id=\"agent-project-template\"></a></p>\n<p>项目 AGENTS.md 的模板是 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/03-项目规则模板.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">03</a>，含默认目录和写手。</p>\n<p><a id=\"agent-controller-template\"></a></p>\n<p><a id=\"agent-worker-template\"></a></p>\n<p><a id=\"agent-specialist-template\"></a></p>\n<p>五种会话的开工包都在 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/05-任务开工包模板.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">05</a>。施工票的填好例子在<a href=\"#delivery/start-package\" data-book-route=\"delivery/start-package\">开发交付</a>。这里放主控的，因为它是你自己写的第一条消息，以虚构的建筑资料库为例：</p>\n<div class=\"prompt\"><pre>任务：建筑资料库，项目主控\n角色：主控，边界按 04\n路线与关口：当前在施工准备；本轮结束于票序批准\n入口：项目 AGENTS D:/项目/资料库/AGENTS.md；施工日志 D:/项目/资料库/项目总览/md/施工日志.md；共享规程 02 全文\n批准来源：策划任务书和设计基线已批准，见施工日志\n允许写：施工日志、根路由、开工包、Spec、票、决策卡、ADR；只读：代码；不做：施工、Git 操作\n需另行确认：无\n模型：期望按 01 的表；实测 未确认\n交还：向我提关口\n\n当前阶段：施工准备；决策现场：主控\n你写记录不写产品：施工日志、根路由、开工包；施工期的决策卡和 ADR；批准变更后的 Spec 和票\n每次派工以“请新开会话，贴入以下开工包”结尾</pre></div>\n<p>标准开工包稳定后，每票只填变化的内容，不再让 writing-for-agents 把模板从头重写。</p>\n\n</section>\n<section id=\"agent-example\">\n<h2>走一遍：资料列表增加“类型筛选”</h2>\n<p>教学假设：页面方案已批准，现有查询接口已支持类型参数，本票只改前端，不改服务接口、权限或数据库。这不是你的项目当前事实。</p>\n<ol>\n<li><strong>主控准备：</strong>确认“选类型、显示对应结果、无结果提示、清空恢复”的验收和“不新增分类管理”的边界，写开工包，回复末尾让你新开会话。</li>\n<li><strong>施工票会话施工：</strong>你贴入开工包。它交开工报告，核对现场，用 implement 完成这一条用户操作，收工交验收单，附审查开工包。模型按 01 的表。</li>\n<li><strong>审查会话：</strong>你贴入审查开工包。它只读比较基线和待审版本，按 Spec 轴和规范轴给问题清单。意见回施工票会话处理。</li>\n<li><strong>回到主控：</strong>验收单和审查结果交主控。你按验收单逐行试用，确认后主控更新施工日志，派下一票。完整调试过程留在施工票会话。</li>\n</ol>\n<p>若 AI 每次都漏验“清空恢复”，先看是票漏写、开工包漏传、规则没读，还是实现缺陷。<strong>规则含糊才修规则，资料漏传就补开工包，代码错误就诊断和修复。</strong>不要每出一个 Bug，就往全局规则塞一条新禁令。</p>\n\n</section>\n<section id=\"agent-sample\">\n<h2>别人的 AGENTS.md，哪些值得借？</h2>\n<p>一份好的项目规则有这些部分：项目身份、设计原则、硬禁令、命名编码、按需资料入口、验证与协作。这可以作为检查清单，但不是每个项目必须照抄的章节。</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>值得借用</th>\n<th>放到我们这里怎么调整</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>先说明项目身份与原则</td>\n<td>保留短简介和难以从代码看出的取舍；大量组件与运行细节指向对应资料，避免入口变成系统百科。</td>\n</tr>\n<tr>\n<td>硬禁令写明代价</td>\n<td>保留真实数据、密钥、生产等重要保护；其他项目的指定框架、模型、分支不能直接变成我们的禁令。</td>\n</tr>\n<tr>\n<td>按任务读取领域文档</td>\n<td>借鉴“改什么，先读哪里”；先核实真实路径，复用 CONTEXT、ADR、Spec 和票据。</td>\n</tr>\n<tr>\n<td>入口有篇幅门槛</td>\n<td>学的是“只留真正影响行动的规则”，不是照搬固定行数。不要为了行数删保护。</td>\n</tr>\n</tbody></table></div>\n\n</section>\n<section id=\"agent-check\">\n<h2>怎样检查规则是否写清楚了？</h2>\n<ul>\n<li><strong>资料能找到：</strong>AI 能指出实际读取的文件与相应段落；条件触发后能打开正确资料，不只说“我已遵守”。</li>\n<li><strong>规则不冲突：</strong>共同规则没有同时要求“所有 Agent 不得施工”和“所有 Agent 必须实现”；角色差异和本票授权清楚。</li>\n<li><strong>知道何时停止：</strong>给一个超范围需求，它能指出需要补哪项批准；给施工完成场景，它知道还在等你验收。</li>\n<li><strong>结果能交接：</strong>输出有范围、证据和未验证项，其他会话能够沿着施工日志和票接手，而不是靠整段聊天。</li>\n</ul>\n<p>现成的题库在 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/06-规则维护与启用检查.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">06 规则维护的场景检验表</a>：新开会话，贴一个情境，看它的开工报告和后续动作。</p>\n<div class=\"prompt\"><pre>做一次只读规则演练，不改代码、不派发真实任务、不运行部署。\n请实际读取【项目规则】、【施工日志】和【一张示例票】，列出读到的路径及关键条目。\n分别假设自己是主控、施工票执行者、审查：各说目标、允许写什么、应读资料、停止点和交回什么。\n再判断：有人临时要求顺手更改权限并上线，你是否能做？缺少什么依据和批准？\n如果规则冲突或路径失效，指出具体位置；不要靠猜测补完。\n本轮结果用于核对规则是否清楚，不代表权限隔离或实际施工已经验证。</pre></div>\n<p><strong>日常只需针对具体问题维护：</strong>遇到具体误读 → 留一个真实例子 → 用 writing-for-agents 修对应约定 → 看差异 → 只读演练 → 后续观察。不是每天重写一次，也不是每票开工前都加一项审批。</p>\n<p class=\"source\">方法依据：<a href=\"#skills/card-writing-for-agents\" data-book-route=\"skills/card-writing-for-agents\">Matt writing-for-agents 已核读源码</a>。分工、模板及四阶段的使用安排是按本手册的协作纪律作的教学适配，非厂商强制流程。</p>\n</section>\n<nav class=\"book-end\" aria-label=\"前后章节\"><a href=\"#delivery\" data-book-route=\"delivery\"><span>上一册</span>← 开发交付</a><a class=\"next\" href=\"#knowledge\" data-book-route=\"knowledge\"><span>下一册</span>项目知识库与上下文维护 →</a></nav></article><aside class=\"toc\" aria-label=\"本页目录\"><p>这一页</p><a href=\"#agents/agent-start\" data-book-route=\"agents/agent-start\">先写清工作约定，再明确各自职责</a><a href=\"#agents/agent-project-start\" data-book-route=\"agents/agent-project-start\">新项目先建一个能继续工作的资料入口</a><a href=\"#agents/agent-how-to\" data-book-route=\"agents/agent-how-to\">writing-for-agents：把工作要求写成 AI 能照着执行的约定</a><a href=\"#agents/agent-stages\" data-book-route=\"agents/agent-stages\">四个阶段分别在什么时候用它？</a><a href=\"#agents/agent-roles\" data-book-route=\"agents/agent-roles\">会话怎么开、怎么管：主控像项目经理，每种会话像一个班组</a><a href=\"#agents/agent-rule-layers\" data-book-route=\"agents/agent-rule-layers\">AGENTS.md 写共同约定，角色说明只写差异</a><a href=\"#agents/agent-templates\" data-book-route=\"agents/agent-templates\">模板都在规则库里，这里只放一个填好的例子</a><a href=\"#agents/agent-example\" data-book-route=\"agents/agent-example\">走一遍：资料列表增加“类型筛选”</a><a href=\"#agents/agent-sample\" data-book-route=\"agents/agent-sample\">别人的 AGENTS.md，哪些值得借？</a><a href=\"#agents/agent-check\" data-book-route=\"agents/agent-check\">怎样检查规则是否写清楚了？</a></aside></div></main></div><div class=\"notice-live\" role=\"status\" aria-live=\"polite\"></div><script>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}));}\nwindow.addEventListener('hashchange',openHash);openHash();\nconst sections=[...document.querySelectorAll('article>section')],tocLinks=[...document.querySelectorAll('.toc a')];\nif('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const id=visible[0].target.id;tocLinks.forEach(a=>a.classList.toggle('current',a.hash==='#'+id));},{rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>observer.observe(s));}\n})();\n<\/script><script>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n<\/script>\n</body></html>"},{"id":"knowledge","nav":"项目知识库与上下文维护","html":"<!doctype html><html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"color-scheme\" content=\"light\"><meta name=\"description\" content=\"分清通用规则和项目事实，用一本施工日志记当前状态，用一个导航入口连接现有文档，并在开发中持续维护。\"><title>项目知识库与上下文维护 · 建筑师的 AI 开发手册</title><style>@charset \"UTF-8\";\n:root{--bg:#f7f4ed;--paper:#fffdfa;--ink:#2d2823;--muted:#70665c;--accent:#a44c34;--line:#ddd5c9;--sage:#4d6655;--soft:#eee8de;--focus:#85331e}\n*{box-sizing:border-box}ht padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}</style></head><body><a class=\"skip\" href=\"#knowledge/main\" data-book-route=\"knowledge/main\">跳到正文</a><div class=\"layout\"><main class=\"page\" id=\"main\"><header class=\"hero\"><p class=\"eyebrow\">案头工具 · 资料有出处，接手有依据</p><h1>把项目资料组织好，让新 Agent 找得到、接得上。</h1><p class=\"lead\">分清通用规则和项目事实，用一本施工日志记当前状态，用一个导航入口连接现有文档，并在开发中持续维护。</p></header><div class=\"reading-grid\"><article><section id=\"knowledge-start\">\n<h2>让项目资料找得到，也知道该信哪一份</h2>\n<p>项目做久了，规格、讨论、接口说明和故障记录会散在不同位置。整理知识库不是把所有 Markdown 搬到一起，而是让接手者能回答：现在做什么、依据哪版、哪些决定不能擅自改变，以及资料有冲突时找谁确认。</p>\n<p>可以像管理建筑项目档案一样，采用<strong>按资料归属存放正文，由根规则按任务指路</strong>。新项目的完整规则和路由写在根 AGENTS.md，README 作人类阅读入口，施工日志记当前状态，核心与专题资料按下方默认布局按需建立；已有合适目录和独立索引就沿用，不复制导航全文，也不要求把词典、ADR、施工票全部搬家。</p>\n<aside class=\"note\"><p>这是本手册的组织建议，不是 Matt 规定的目录。别人按编号整理的目录可以参考，但编号本身不决定资料的权威性。</p></aside>\n</section>\n<section id=\"knowledge-scope\">\n<h2>先分清：个人通用规则、项目资料和公共服务资料</h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>层次</th>\n<th>放什么</th>\n<th>怎样避免混用</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>全局</td>\n<td>跨项目都适用的沟通、硬停和模型偏好。</td>\n<td>不放某项目的技术栈、端口或当前进度。</td>\n</tr>\n<tr>\n<td>项目</td>\n<td>这个产品的目标、架构、规范、接口、决策与验收资料。</td>\n<td>以真实项目为范围，注明适用模块和版本。</td>\n</tr>\n<tr>\n<td>跨项目公共服务</td>\n<td>多个项目共同使用的服务契约、版本和维护约定。</td>\n<td>由服务负责人维护原文；使用方引用适用版本，并记录本项目的接入差异。</td>\n</tr>\n</tbody></table></div>\n<p>参考目录里常见的前四类，通常这样归属：“项目上下文说明”作项目导航；“概览与架构”放项目说明；“规范”拆清通用规则和项目特例；“接口与数据契约”按真正的服务归属维护。公共接口不因被三个项目使用，就分别复制三份。个人账号、电脑路径和密钥不属于公共契约。</p>\n\n</section>\n<section id=\"knowledge-layout\">\n<h2>新项目按实际内容建目录，已有权威文件不必搬家</h2>\n<p>以下是新项目的默认布局，和 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/03-项目规则模板.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">03 项目规则模板</a>一致。先看<a href=\"#agents/agent-project-start\" data-book-route=\"agents/agent-project-start\">新项目启动建档</a>判断何时开始；目录只随实际内容建立，不预建一排空文件夹。已有项目沿用实际约定，在根 AGENTS 登记真实位置，不因模板更新强制迁移。项目有多个仓库时，规则正文仍只在规划仓库的根 AGENTS；其他仓库根放一份入口 AGENTS，写清它是项目的哪一部分、正文和施工日志在哪、开工先读什么，加本仓库特有的边界与验证入口，写法见 03 的多仓库一段。</p>\n\n<div class=\"example knowledge-tree\"><pre tabindex=\"0\" role=\"region\" aria-label=\"项目目录示意，窄屏可左右滚动\">项目根/\n├─ AGENTS.md                    完整项目规则正文与资料路由        主控写\n├─ README.md                    项目介绍与人类阅读入口            主控写\n├─ 项目总览/\n│  ├─ md/\n│  │  ├─ 施工日志.md            当前状态唯一事实源，六项          主控写\n│  │  ├─ 决策地图.md            决策台账总表：问题、依赖、状态    决策现场写\n│  │  ├─ adr/                   难以回头的决定，各一页            决策现场写\n│  │  └─ 其余                   架构、术语等跨专题资料            主控写\n│  ├─ html/                     每轮一页决策简报，架构图按需      建图写\n│  └─ 历史/                     本资料区被替代的旧版本\n└─ 专题工作/\n   └─ 具体专题/\n      ├─ 决策卡/                每个问题一张卡，写法见 03         决策现场写\n      ├─ 其余                   策划书、Spec、施工票、证据、索引  Spec 和票主控写，票的记录和索引执行者写\n      └─ 历史/                  本专题被替代的旧版本</pre></div>\n<p>根 AGENTS.md 不是只有跳转的短入口：它保留项目身份、已批准原则、边界与按任务读取的路由，路由表第一行是“任何会话开工先读施工日志”。README 只介绍项目并指向阅读入口，不复制路由或进度。专题内新增资料由专题索引承接；只有核心入口、位置或职责变化才调整根路由。</p>\n<p>有效决定、已完成施工票仍在所属专题，只有被替代的规格和票进入所属历史，决策卡和 ADR 被替代时留在原位改状态；不因“做完了”而移走有效依据。MD 维护事实，HTML 是阅读副本；决策简报按 02 第 6 节的轮次由建图会话从卡生成，架构图只在你要配图时出（这一轮改了架构，现场会问你），其他 HTML 只在你要求时生成。已有 CONTEXT.md、分布词典、ADR 或 .scratch 票据保留真实位置，通过入口引用，不为套目录移动它们。</p>\n<p class=\"source\">Matt 的 <a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/domain-modeling/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">domain-modeling</a> 示例保留根词典和 ADR；多领域仓库可以由 CONTEXT-MAP.md 指向分布的词典。这不同于本节的通用项目导航。</p>\n</section>\n<section id=\"knowledge-provenance\">\n<h2>导航不只列文件名，还要说明何时读、谁维护</h2>\n<p>一份好导航像图纸目录：能定位，也能辨认有效版本。以建筑资料库为例，可以这样写：</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>遇到什么事</th>\n<th>应该读取</th>\n<th>权威范围与维护者</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>任何会话开工</td>\n<td>施工日志</td>\n<td>六项；主控维护。</td>\n</tr>\n<tr>\n<td>不确定“案例”和“附件”的含义</td>\n<td>根目录 CONTEXT.md 的对应条目</td>\n<td>业务词义；由负责领域建模的会话维护。</td>\n</tr>\n<tr>\n<td>修改来源链接或访问权限</td>\n<td>相关接口契约、权限 ADR、当前票</td>\n<td>分别核对接口版本、批准决定和本次范围。</td>\n</tr>\n<tr>\n<td>想知道某个决定为什么这样定</td>\n<td>最新简报或决策地图.md 找到问题，再看决策卡或 ADR</td>\n<td>决策现场维护；每轮简报是它的阅读版。</td>\n</tr>\n</tbody></table></div>\n<p>正文顶部可用几行说明：<strong>适用项目／模块、状态、维护人、核验版本或日期、原始依据、替代关系。</strong>例如“资料库检索模块；已批准但待实现；维护人为本模块负责人；对应提交【编号】；依据【批准记录】；替代旧说明【链接】”。没有核实的字段就标待核，不编日期或负责人。</p>\n<p>特别分开三件事：用户批准的是要求，代码显示的是现状，尚未验证的是假设。要求与代码不一致时，不凭文件修改时间挑一个当真；应指出差异及影响，请负责人决定是修实现还是变更要求。</p>\n\n</section>\n<section id=\"knowledge-first-pass\">\n<h2>资料已经散落时，先盘点，再分批整理</h2>\n<ol>\n<li><strong>只读盘点：</strong>限定目录，找规则、规格、决策、接口和状态文件，记录引用关系；不递归扫描账号、媒体或无关资料。</li>\n<li><strong>核对冲突：</strong>比较批准记录、适用版本和实际代码。将重复、失效、互相矛盾与待核实分别列出，不按文件时间直接判定。</li>\n<li><strong>核对布局与授权：</strong>先选权威文件，再确定哪些保留原位、哪些适合集中、哪些只需加索引。复用已批准范围；新增搬迁、覆盖或重要取舍才补相应确认，已授权的普通路由校正不逐项重问。</li>\n<li><strong>按风险小批整理：</strong>普通路由校正局部修改，复读内容并检查受影响链接即可。真实搬迁、覆盖等存在丢失风险时，先核对 Git 历史或已有存档能否恢复本批资料；Git 不保护未跟踪文件或真实数据库，恢复依据不足时暂停风险操作。</li>\n<li><strong>按验收目标检查：</strong>局部校正由写手自己核对；入口重组或接手可靠性需要验证时，开一个不带原聊天历史的只读会话回答具体问题。</li>\n</ol>\n<div class=\"prompt\"><pre>本轮只读盘点【项目目录】内的【指定资料范围】，不迁移、改写或删除。\n列出资料用途、适用版本、依据、维护人是否明确，以及哪些文件引用它。\n区分重复内容、冲突、失效链接和待核事项；不要把修改时间最新当成权威。\n提出最小整理方案：保留原位、增加导航、需要核实、建议调整位置。\n不读取账号或无关数据，不新建第二套进度；给我确认后再安排修改。</pre></div>\n<details><summary>批准后，怎样把整理范围交给执行会话？</summary>\n<div class=\"prompt\"><pre>已批准整理【明确文件清单】，目标布局为【批准记录或路径】。\n主控只更新根路由和施工日志；资料搬迁或正文调整由你开的普通执行会话按本包做，不由主控动手。\n开始前核对本批现有改动与授权；普通路由校正做局部修改和相关链接检查。\n真实搬迁、覆盖等存在丢失风险时，先确认 Git 历史或已有存档能恢复本批资料。\n只执行【逐项获准操作】，保留未授权资料，不删除用户数据。\n同步修正本批变更影响的全部引用，包括规则入口、导航和其他文档。\n报告实际改动、受影响引用与验证结果；仅搬迁项列旧位置和新位置，无法确认时暂停受影响部分并报告。\n按本批验收目标检查；需要验证重组后的接手能力时再安排只读接手演练。保持已批准范围，不擅自扩大下一批。</pre></div>\n</details>\n</section>\n<section id=\"knowledge-maintenance\">\n<h2>谁改变了事实，谁负责更新对应资料</h2>\n<p>文档不必每天全量审查。由做了那件事的会话维护本次影响的资料：接口改变时更新契约；重要取舍经批准后写 ADR；术语澄清时更新词典；运行和故障结论写入当前票。纯只读会话在回复中给出待更新内容，不擅自写文件。收尾时检查本票影响的资料是否仍然准确，不顺手整理整个项目。</p>\n<p>写手按 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/04-Agent角色说明.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">04 的写回分工</a>：施工日志和根路由归主控；决策卡、ADR、地图 MD 归决策现场；代码、本票、专题索引归该票执行者；两个会话要动同一个共享文件时，主控指定一个写回者，另一个回传待更新项。</p>\n<p><strong>施工日志是整个项目的“现在到哪了”。</strong>主控写，固定六项，每过一个关口就更新，任何会话开工先读它。以建筑资料库为例：</p>\n<div class=\"prompt\"><pre># 施工日志\n\n当前阶段：开发交付\n决策现场：主控\n当前票：03 资料列表按类型筛选，施工票会话进行中\n上一票验收结果：02 详情页回到原始出处，2026-09-14 用户按验收单确认，提交 a1b2c3d\n待用户决定的事：联系单 L-02，详情页字段“来源”与 Spec 第 3 条冲突，等选 A 或 B\n下一步：票 03 收工后开审查会话；L-02 定了记 ADR，轮末更新地图</pre></div>\n<p>六项是现状不是历史：上一票只写最近一票，定了的事从“待用户决定”里删掉；历史进票和决策卡。所以日志永远一屏，第一个主控和第十个主控读它一样快。</p>\n<p>规格记“要求是什么”，ADR 记“为何这样决定”，票记“做了什么和证据”，日志记“现在到哪”。四者互相引用，不各写一套“已经完成”。你随口说的偏好、否决过的方案、答过两次的问题，进项目 AGENTS 的“偏好与不再问的事”：做法写条目，答过的问题只写话题和出处指针，两部分各二十行封顶，主控听到就写。这与<a href=\"#team/team-shared\" data-book-route=\"team/team-shared\">团队共享范围</a>配合使用。</p>\n\n</section>\n<section id=\"knowledge-recovery\">\n<h2>新 Agent 接手时，要用资料验证它能否继续</h2>\n<p>重要事实出现时就写回票和日志，不必等到压缩前才整理。压缩前或暂停故障排查时，再核对复现条件、已排除原因、失败尝试、实际改动、下一步和权限边界是否齐全。纯只读会话先提供待记录内容，不越权写票。不要只留一句“继续修复”。正式票仍用施工票会话，普通压缩不能代替它；具体判断见<a href=\"#context/choose-session\" data-book-route=\"context/choose-session\">何时继续、压缩或换任务</a>。</p>\n<p>可以安排一次不带原聊天历史的只读接手演练。它仍会加载工具的全局规则，不是完全没有输入；目标是检验项目资料能否独立支持理解，而非测试记忆力。</p>\n<div class=\"prompt\"><pre>本轮只读接手演练，不施工、不改文件、不运行未知脚本。\n入口是【项目 AGENTS 路径】，待接手的是【票路径或具体问题】。\n先读施工日志，再自行找到适用的规格、术语、决策卡，列出实际读过的路径与版本。\n说明哪些是用户批准的要求、哪些已由代码或验证证明、哪些仍未知。\n回答下一步允许做什么、必须先等什么，以及失败尝试是否应避免重复。\n发现冲突、过期链接或缺少授权就列出，不靠历史聊天或猜测补齐。\n只给接手结论与缺口，不把演练通过当作功能验收或权限隔离已经验证。</pre></div>\n<p>通过的标准是能找到依据、辨别状态、说明下一步和停止点。只复述导航标题，或把“已批准”理解成“已实现”，都应退回补资料。</p>\n\n</section>\n<section id=\"knowledge-skills\">\n<h2>不同问题用不同 Skill，不让一个技能包办整理</h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>具体问题</th>\n<th>方法与职责</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>规则含糊，AI 总漏读关键资料</td>\n<td><a href=\"#skills/card-writing-for-agents\" data-book-route=\"skills/card-writing-for-agents\">writing-for-agents</a> 改写规则与读取条件；先检查指针是否清楚，不直接把全部正文塞进入口。</td>\n</tr>\n<tr>\n<td>项目未约定任务、词典和决策放哪里</td>\n<td>先按 03 的默认位置；Matt 自己的约定用 <a href=\"#skills/card-setup-matt-pocock-skills\" data-book-route=\"skills/card-setup-matt-pocock-skills\">setup-matt-pocock-skills</a>，它不负责把整个知识库搬家。</td>\n</tr>\n<tr>\n<td>业务词义冲突，或重要决策需要记录</td>\n<td><a href=\"#skills/card-domain-modeling\" data-book-route=\"skills/card-domain-modeling\">domain-modeling</a> 维护词典和符合条件的 ADR，不把实施进度写进 CONTEXT.md。</td>\n</tr>\n<tr>\n<td>要跨工具、目录或交给同事继续</td>\n<td>先提供施工日志、既有票和事实文件，材料不足以接手时才用 <a href=\"#skills/card-handoff\" data-book-route=\"skills/card-handoff\">handoff</a> 补必要交接；摘要沿用原记录，不另记一套进度。handoff 默认把交接文档写到系统临时目录，不进工作区，且只能由人显式调用；要留在仓库，指定另存位置。它固定带“建议技能”一节，规矩是引用不复制、脱敏。</td>\n</tr>\n</tbody></table></div>\n<p>具体写法见<a href=\"#agents/agent-how-to\" data-book-route=\"agents/agent-how-to\">writing-for-agents 使用课</a>。这些技能不能凭名称获得搬迁、删除或改规则的授权；只读盘点也不必强行把每个技能都调用一遍。</p>\n<p class=\"source\">作者依据：<a href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/writing-for-agents/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">资料指针与单一事实源</a>、<a href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/setup-matt-pocock-skills/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">项目配置</a>、<a href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/handoff/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">交接引用与脱敏</a>。本章目录和维护分工是教学适配。</p>\n</section>\n<section id=\"knowledge-safety\">\n<h2>保留历史和访问边界，不让整理变成泄露或误删</h2>\n<p>知识库只放获准共享的资料。密钥、账号记录、真实客户图纸和数据库不因“便于 Agent 理解”就复制进去；需要举例时使用脱敏样例。公共服务索引注明访问要求，打不开就报告缺口，不能索要他人账号绕过。</p>\n<p>旧说明被替代后，标清“已退役”、替代文件和适用历史版本，再按批准方式归档。保留可追溯入口，但不要让旧内容继续被当成当前要求。先核对引用和恢复办法，不把“整理完了”理解为可以永久删除。</p>\n<p>一轮整理的成果应是：资料更容易定位、每类事实有明确出处、维护责任清楚、新会话能据此接手，而不是单纯少了多少文件。新的目录约定只有经批准并实际应用后才生效。</p>\n\n</section>\n<nav class=\"book-end\" aria-label=\"前后章节\"><a href=\"#agents\" data-book-route=\"agents\"><span>上一册</span>← Agent 执行手册</a><a class=\"next\" href=\"#skills\" data-book-route=\"skills\"><span>下一册</span>Skill 操作教程 →</a></nav></article><aside class=\"toc\" aria-label=\"本页目录\"><p>这一页</p><a href=\"#knowledge/knowledge-start\" data-book-route=\"knowledge/knowledge-start\">让项目资料找得到，也知道该信哪一份</a><a href=\"#knowledge/knowledge-scope\" data-book-route=\"knowledge/knowledge-scope\">先分清：个人通用规则、项目资料和公共服务资料</a><a href=\"#knowledge/knowledge-layout\" data-book-route=\"knowledge/knowledge-layout\">新项目按实际内容建目录，已有权威文件不必搬家</a><a href=\"#knowledge/knowledge-provenance\" data-book-route=\"knowledge/knowledge-provenance\">导航不只列文件名，还要说明何时读、谁维护</a><a href=\"#knowledge/knowledge-first-pass\" data-book-route=\"knowledge/knowledge-first-pass\">资料已经散落时，先盘点，再分批整理</a><a href=\"#knowledge/knowledge-maintenance\" data-book-route=\"knowledge/knowledge-maintenance\">谁改变了事实，谁负责更新对应资料</a><a href=\"#knowledge/knowledge-recovery\" data-book-route=\"knowledge/knowledge-recovery\">新 Agent 接手时，要用资料验证它能否继续</a><a href=\"#knowledge/knowledge-skills\" data-book-route=\"knowledge/knowledge-skills\">不同问题用不同 Skill，不让一个技能包办整理</a><a href=\"#knowledge/knowledge-safety\" data-book-route=\"knowledge/knowledge-safety\">保留历史和访问边界，不让整理变成泄露或误删</a></aside></div></main></div><div class=\"notice-live\" role=\"status\" aria-live=\"polite\"></div><script>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}));}\nwindow.addEventListener('hashchange',openHash);openHash();\nconst sections=[...document.querySelectorAll('article>section')],tocLinks=[...document.querySelectorAll('.toc a')];\nif('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const id=visible[0].target.id;tocLinks.forEach(a=>a.classList.toggle('current',a.hash==='#'+id));},{rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>observer.observe(s));}\n})();\n<\/script><script>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n<\/script>\n</body></html>"},{"id":"skills","nav":"Skill 操作教程","html":"<!doctype html><html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"color-scheme\" content=\"light\"><meta name=\"description\" content=\"先从八个实际问题看如何选择和使用技能，再查二十五张 Matt 方法卡；每个例子都有步骤、提示和验收方法。\"><title>Skill 操作教程 · 建筑师的 AI 开发手册</title><style>@charset \"UTF-8\";\n:root{--bg:#f7f4ed;--paper:#fffdfa;--ink:#2d2823;--muted:#70665c;--accent:#a44c34;--line:#ddd5c9;--sage:#4d6655;--soft:#eee8de;--focus:#85331e}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:32px}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.85 \"Segoe UI\",\"Microsoft YaHei\",\"PingFang SC\",sans-serif}\na{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:4px}a:hover{color:#783221}button,input{font:inherit}button{cursor:pointer}a,button,input,summary{-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:3px}\n.skip{position:fixed;left:20px;top:-100px;z-index:9;background:var(--ink);color:#fff;padding:10px 20px}.skip:focus{top:12px}\n.layout{display:grid;grid-template-columns:246px minmax(0,1fr);max-width:1640px;margin:auto;min-height:100vh}\n.sidebar{position:sticky;top:0;height: lid var(--line);padding-top:20px;font-size:11px;color:var(--muted);line-height:1.9;max-width:970px}.notice-live{position:fixed;bottom:23px;left:50%;transform:translateX(-50%);background:#2d2823;color:#fff;padding:9px 19px;border-radius:5px;font-size:13px;z-index:10;box-shadow:0 6px 24px #0002}.notice-live:empty{display:none}[hidden]{display:none!important}\n@media(min-width:1480px){.page{padding-left:65px;padding-right:65px}.reading-grid{gap:60px}}\n@media(min-width:761px){#stage-skill-overview th:first-child,#stage-skill-overview td:first-child{width:14%;white-space:nowrap}#stage-skill-overview th:last-child{width:19%}}\n@media(max-width:1220px){.layout{grid-template-columns:220px minmax(0,1fr)}.sidebar{padding:30px 17px}.page{padding:32px 35px}.reading-grid{grid-template-columns:minmax(0,760px)}.toc{display:none}.hero{padding-top:37px}h1{font-size:39px}}\n@media(max-width:760px){body{font-size:16px}.layout{display:block}.sidebar{position:static;height:auto;padding:20px 22px 14px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:16px;margin:0;padding-right:85px}.brand small{font-size:9px}.menu-toggle{display:block;position:absolute;right:22px;top:22px;border:1px solid #c8bba9;border-radius:4px;padding:5px 12px;min-height:40px;background:transparent;color:var(--ink);font-size:13px}.book-nav{display:none;margin-top:20px}.book-nav.is-open{display:block}.side-note{display:none}.page{padding:22px 23px 27px}.topline{font-size:10px}.hero{padding:31px 0 28px}h1{font-size:34px;line-height:1.5}h2{font-size:25px}.lead{font-size:15px}.eyebrow{font-size:11px}article>section{padding:28px 0 35px}.route-picker{gap:0 19px}.route-picker strong{font-size:17px}.route-picker small{font-size:12px}.prompt{padding:14px 16px 18px}.prompt pre{font-size:13px}.phase-map li{padding:18px;gap:20px}.phase-map small{font-size:11px}th,td{padding:11px 9px}.example{padding:18px}.note,.warning{padding:16px 18px}.skill-card{padding:16px}.book-end{font-size:13px}.video-table{min-width:
