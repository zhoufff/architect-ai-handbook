card dl{margin:20px 0}.term-card dt{font-size:12px;color:var(--accent);margin:18px 0 4px}.term-card dd{margin:0;font-size:15px;overflow-wrap:anywhere}.term-card dd p{margin:0 0 9px}.term-check{padding:15px 18px;background:#eee7db}.term-pitfall{font-size:13px!important;color:var(--muted)}.term-walk li{margin:18px 0}.term-walk strong{color:#79543b}\n@media(max-width:760px){.term-body{padding-left:15px;padding-right:0}.term-name{font-size:16px}.term-plain{font-size:13px}.term-filter label{flex-basis:100%}}\n@media print{body{font-size:11pt;background:#fff}.layout{display:block}.sidebar,.toc,.topline,.copy-btn,.book-end,.notice-live{display:none}.page{padding:0}.reading-grid{display:block}.hero{padding:10px 0 20px}h1{font-size:26pt}h2{font-size:18pt}article>section{break-inside:auto}a{color:#222}.prompt,.example,table{break-inside:avoid}details:not([open]){display:block}footer{margin-top:25px}}\n\u003c/style>\u003cstyle>.layout{display:block;max-width:1240px}.page{padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}\u003c/style>\u003c/head>\u003cbody>\u003ca class=\"skip\" href=\"#skills/main\" data-book-route=\"skills/main\">跳到正文\u003c/a>\u003cdiv class=\"layout\">\u003cmain class=\"page\" id=\"main\">\u003cheader class=\"hero\">\u003cp class=\"eyebrow\">案头工具 · 具体怎么说\u003c/p>\u003ch1>按任务选择 Skill，不必记住所有名称。\u003c/h1>\u003cp class=\"lead\">Matt Pocock 的工程方法与按需辅助工具：先认识作者和来源，再按场景选择、调用与验收。\u003c/p>\u003c/header>\u003cdiv class=\"reading-grid\">\u003carticle>\u003csection id=\"skill-origins\">\n\u003ch2>先认识这套工具：谁做的，从哪里来？\u003c/h2>\n\u003cp>\u003cstrong>Matt Pocock 是软件开发者和技术教育者。\u003c/strong>本册的二十五张方法卡介绍他发布的 \u003ca href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">mattpocock/skills\u003c/a>，不是二十五个模型，也不是阅读手册就自动拥有的功能。插件像工具箱，Skill 像其中的一张操作说明；AI 客户端负责读取说明，并使用它有权限使用的工具。\u003c/p>\n\u003cp>教程以 \u003cstrong>Matt Pocock Skills 1.2.3 的 25 项发布清单\u003c/strong>为讲解基线，核对日期为 2026-09-06。版本号用于说明“这本书讲的是哪一套”，不是要求你降级，也不是承诺现在或以后永远只有 25 项。安装新版后，核对名字、入口和行为变化。\u003c/p>\n\u003caside class=\"note\">\u003cp>\u003cstrong>三层来源要分开：\u003c/strong>Matt 提供盘问、规格、拆票、实现等方法；其他作者提供设计或验证能力；四阶段、主控与票任务分工、人工验收关口，是本手册面向非程序员整理的实践约定，不是 Matt 官方认证课程或所有作者共同发布的套装。\u003c/p>\u003c/aside>\n\u003ctable class=\"source-directory\">\u003cthead>\u003ctr>\u003cth>名称 / 作者与来源\u003c/th>\u003cth>用它做什么\u003c/th>\u003cth>什么时候加入\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>\u003cstrong>Matt Pocock Skills\u003c/strong>\u003cbr>Matt Pocock\u003cbr>\u003ca href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">源码与安装说明\u003c/a> · \u003ca href=\"https://www.aihero.dev/skills-wayfinder\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Wayfinder 作者教程\u003c/a>\u003c/td>\u003ctd>把想法问清、调查未知、试原型、写规格、拆票、实现与审查。\u003ccode>wayfinder\u003c/code> 也在这套工具里，不需另找同名插件。\u003c/td>\u003ctd>\u003cstrong>主工具箱。\u003c/strong>从当前问题选一张卡，不把 25 张全部依次跑完。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>Superpowers\u003c/strong>\u003cbr>Jesse Vincent（obra）\u003cbr>\u003ca href=\"https://github.com/obra/superpowers\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">源码与安装说明\u003c/a>\u003c/td>\u003ctd>包含自己的规划、测试、调试、审查和代理协作流程。本册主要借用完成前验证、必要的工作区隔离等辅助能力。\u003c/td>\u003ctd>\u003cstrong>按需。\u003c/strong>参考版本 6.3.0；采用 Matt 主链时，先明确谁主导，不让两套编排同时接管。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>karpathy-guidelines\u003c/strong>\u003cbr>Multica 社区整理项目\u003cbr>\u003ca href=\"https://github.com/multica-ai/andrej-karpathy-skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">源码与说明\u003c/a>\u003c/td>\u003ctd>根据 Andrej Karpathy 的观察，提醒 AI 先想清、少做、只改必要处、拿出验证。\u003c/td>\u003ctd>\u003cstrong>行为底线。\u003c/strong>参考版本 1.0.0；不是 Karpathy 本人发布的官方插件。已有同样规则，不必再增加一道启动仪式。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>frontend-design\u003c/strong>\u003cbr>Anthropic\u003cbr>\u003ca href=\"https://github.com/anthropics/skills/tree/main/skills/frontend-design\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">官方 Skill 原文\u003c/a> · \u003ca href=\"https://github.com/anthropics/skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">安装说明\u003c/a>\u003c/td>\u003ctd>设计页面的字体、层级、留白、色彩与整体视觉。它不是 Matt 的 Skill。\u003c/td>\u003ctd>\u003cstrong>做界面时加入。\u003c/strong>以已选功能与原型为边界，负责视觉主设计。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>emil-design-eng\u003c/strong>\u003cbr>Emil Kowalski\u003cbr>\u003ca href=\"https://emilkowal.ski/skill\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者入口\u003c/a> · \u003ca href=\"https://github.com/emilkowalski/skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">技能仓库\u003c/a>\u003c/td>\u003ctd>推敲组件、反馈、交互与动效细节，让界面更顺手。\u003c/td>\u003ctd>\u003cstrong>精修时用。\u003c/strong>先有清楚的布局和任务，再处理具体体验问题；不是整站重设计按钮。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>Design Taste / design-taste-frontend\u003c/strong>\u003cbr>Leonxlnx\u003cbr>\u003ca href=\"https://github.com/Leonxlnx/taste-skill\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">源码与说明\u003c/a> · \u003ca href=\"https://www.tasteskill.dev/\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">项目网站\u003c/a>\u003c/td>\u003ctd>另一套视觉设计取向，适合宣传页、作品集等方向探索；具体范围以所选技能说明为准。\u003c/td>\u003ctd>\u003cstrong>可选替代。\u003c/strong>先读实际入口说明，再决定是否适合；不要和 frontend-design 同时争当视觉主导。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>web-design-guidelines\u003c/strong>\u003cbr>Vercel Labs\u003cbr>\u003ca href=\"https://github.com/vercel-labs/agent-skills/tree/main/skills/web-design-guidelines\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Skill 入口\u003c/a> · \u003ca href=\"https://github.com/vercel-labs/web-interface-guidelines\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">界面规范\u003c/a>\u003c/td>\u003ctd>审查界面代码中的可访问性、交互和实现问题。Skill 是审查方法，规范仓库是它参考的规则。\u003c/td>\u003ctd>\u003cstrong>界面成形后。\u003c/strong>不负责选择审美方向，也不替代真实点击验证。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>webapp-testing\u003c/strong>\u003cbr>Anthropic\u003cbr>\u003ca href=\"https://github.com/anthropics/skills/tree/main/skills/webapp-testing\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">官方 Skill 原文\u003c/a>\u003c/td>\u003ctd>让 AI 借助 Playwright 操作浏览器，检查页面、截图、核对实际结果。\u003c/td>\u003ctd>\u003cstrong>原型与交付验证。\u003c/strong>还需要可运行的浏览器工具和相应权限；读到 Skill 不代表环境已装好。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>planning-with-files\u003c/strong>\u003cbr>Ahmad Othman Ammar Adi（OthmanAdi）\u003cbr>\u003ca href=\"https://github.com/OthmanAdi/planning-with-files\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">上游项目与说明\u003c/a>\u003c/td>\u003ctd>用文件记录长研究的计划、发现和进度，帮助中断后恢复。\u003c/td>\u003ctd>\u003cstrong>长研究可选。\u003c/strong>上游不是 Manus 官方工具。名为 planning-with-files-zh 的中文变体来源尚未核实，不能把上游链接当成该中文包的安装来源；正式工程已有 Spec 和票据时，不再维护第二份同内容计划。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>bili-note\u003c/strong>\u003cbr>Rimagination\u003cbr>\u003ca href=\"https://github.com/Rimagination/bili-note\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">源码与说明\u003c/a>\u003c/td>\u003ctd>提取或整理 B 站内容，按可用条件使用字幕或转写等方法。\u003c/td>\u003ctd>\u003cstrong>资料研究可选。\u003c/strong>不是普通开发必装项，效果与访问条件、字幕及转写依赖有关。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>mcp-builder\u003c/strong>\u003cbr>Anthropic\u003cbr>\u003ca href=\"https://github.com/anthropics/skills/tree/main/skills/mcp-builder\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">官方 Skill 原文\u003c/a>\u003c/td>\u003ctd>帮助构建让 AI 连接外部服务的 MCP 工具接口。\u003c/td>\u003ctd>\u003cstrong>开发工具连接时。\u003c/strong>普通页面和资料管理项目不必先做 MCP。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp class=\"source\">表内链接指向作者或项目发布渠道，需联网；只读本手册不需要安装任何插件。这里介绍的是工具职责，不是“一键安装清单”。第三方内容的使用和分发以各自许可为准，手册不打包插件代码、账号或完整技能原文。\u003c/p>\n\u003c/section>\n\u003csection id=\"first-install\">\n\u003ch2>第一次照着用：先安装和验证主工具，再按需增加\u003c/h2>\n\u003col>\u003cli>\u003cstrong>选开发客户端。\u003c/strong>使用能读取项目文件、执行授权命令的 AI 开发环境，例如 Codex 或 Claude Code。Claude 桌面里的普通聊天与 Code 开发入口不是一回事；先确认当前模式真的能访问项目。模型决定谁思考，Skill 决定参考什么方法，两者不是一件事。\u003c/li>\n\u003cli>\u003cstrong>先打开 Matt 仓库的 README。\u003c/strong>按你所用客户端对应的安装说明操作；不要把别人的缓存路径复制成自己的。插件市场只是分发渠道，核对作者和仓库，不能只凭名称相同就当成同一套。\u003c/li>\n\u003cli>\u003cstrong>核对入口。\u003c/strong>让 AI 列出实际发现的技能名称和版本，用一个无真实数据的小问题试验。能看到菜单、能读到正文、能按方法交出结果，是三个不同检查。\u003c/li>\n\u003cli>\u003cstrong>再按任务加工具。\u003c/strong>做视觉时加一种主设计 Skill；需要浏览器验收时接好验证工具。Superpowers、Emil、Taste 和研究辅助并非全部必装。每增加一套，写清它负责什么、不能接管什么。\u003c/li>\u003c/ol>\n\u003cdiv class=\"prompt\">\u003cpre>我准备使用这本分享版手册。请先只读核对当前开发环境：\n我使用的客户端/模式是【名称】；项目是【路径或尚未创建】。\n主工具来源：https://github.com/mattpocock/skills\n请读取作者对这个客户端的安装说明，区分已安装、未安装、已发现但不能调用。\n列出需要我做的步骤及风险；我批准前不安装、不修改设置。\n配置好后，用一个无真实数据的小问题验证 grill-with-docs 的真实调用，报告方法来源和输出，不执行正式施工。\n如当前入口不支持，不假装成功，也不绕过权限限制。\u003c/pre>\u003c/div>\n\u003cp>每张方法卡下方都有作者源码入口。下面的 \u003ccode>/名称\u003c/code> 是便于讲解的短称；Claude Code、Codex 和其他产品的菜单或显式调用写法可能不同，以当前客户端实际支持的入口为准。\u003c/p>\n\u003c/section>\n\u003csection id=\"start-with-the-job\">\n\u003ch2>Skill 提供做事的方法，不会代替你自动完成任务\u003c/h2>\n\u003cp>想用好 \u003ccode>writing-for-agents\u003c/code>？看\u003ca href=\"#agents/agent-how-to\" data-book-route=\"agents/agent-how-to\">完整使用课\u003c/a>与\u003ca href=\"#agents/agent-stages\" data-book-route=\"agents/agent-stages\">四阶段调用时机\u003c/a>，再看\u003ca href=\"#agents/agent-templates\" data-book-route=\"agents/agent-templates\">项目规则和主控／施工模板\u003c/a>；不用自己从短卡猜该怎么写。\u003c/p>\n\u003cp>与同事合作时，不必让每个人复制你的全套插件。看\u003ca href=\"#team/team-skills\" data-book-route=\"team/team-skills\">协作环节与 Skill 对照\u003c/a>及\u003ca href=\"#team/team-onboarding\" data-book-route=\"team/team-onboarding\">同事入场说明\u003c/a>。\u003c/p>\n\u003cp class=\"glossary-entry\">知道技能名，却不懂它交出的 Spec、ADR 或 Ticket？看\u003ca href=\"#glossary/term-lookup\" data-book-route=\"glossary/term-lookup\">行话与 Skill 对照\u003c/a>；这里的方法卡教你怎么调用，那里的词条教你怎么判断产物。\u003c/p>\n\u003cp>普通提示告诉 AI“做什么”；Skill 额外提供“按什么步骤做、注意什么、交出什么”。装好只代表文件可用，不保证每个任务都触发，更不保证结果正确。先选要解决的问题，再选一张主方法卡。\u003c/p>\n\u003cp>不用自己从 25 张卡拼流程：先到\u003ca href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">场景研究\u003c/a>、\u003ca href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型\u003c/a>、\u003ca href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备\u003c/a>或\u003ca href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付\u003c/a>看本阶段推荐。那里有直接点名技能的启动提示；本页供你了解每张卡的细节。\u003c/p>\n\u003cdiv class=\"quick-links\">\u003ca href=\"#skills/card-grill-with-docs\" data-book-route=\"skills/card-grill-with-docs\">把想法问清\u003c/a>\u003ca href=\"#skills/card-to-spec\" data-book-route=\"skills/card-to-spec\">写成规格\u003c/a>\u003ca href=\"#skills/card-to-tickets\" data-book-route=\"skills/card-to-tickets\">拆施工票\u003c/a>\u003ca href=\"#skills/card-implement\" data-book-route=\"skills/card-implement\">开始施工\u003c/a>\u003ca href=\"#skills/card-diagnosing-bugs\" data-book-route=\"skills/card-diagnosing-bugs\">排查故障\u003c/a>\u003ca href=\"#skills/card-wayfinder\" data-book-route=\"skills/card-wayfinder\">不知道从哪问\u003c/a>\u003ca href=\"#skills/card-wait-what\" data-book-route=\"skills/card-wait-what\">听不懂了\u003c/a>\u003c/div>\n\u003caside class=\"note\">\u003cp>本册讲解 Matt Pocock Skills 1.2.3 的 25 项发布能力，其中 14 项为明确发起的入口；另 11 项是否自动匹配，仍取决于客户端和所装版本。先看上方作者与来源表，不把教程里的版本当成你的安装状态。\u003c/p>\u003c/aside>\n\u003cp class=\"source\">参考：\u003ca href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Matt 原仓库\u003c/a> · \u003ca href=\"https://learn.chatgpt.com/docs/build-skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">OpenAI：显式与隐式调用\u003c/a>\u003c/p>\n\u003c/section>\n\u003csection id=\"invoke-and-check\">\n\u003ch2>怎样调用 Skill，并检查它是否发挥了作用\u003c/h2>\n\u003col>\u003cli>在当前应用支持的技能入口搜索 Matt 的完整名称，明确选择后补上本次目标与必要文件。\u003c/li>\u003cli>本册的 /to-spec 等写法是短称，不保证直接输入每个桌面客户端都能注册成命令。按客户端和作者说明核对入口。\u003c/li>\u003cli>如果没有入口，在客户端允许、使用者明确指定的前提下，可读取已安装的 SKILL.md 与必要资源作为参考；说明这是等价执行，不假称命令已经注册。若权限或客户端禁止调用，应停止并说明，不另找方式绕过。\u003c/li>\u003cli>验收看实际输出：有没有澄清分歧、规格能否检查、实现是否有证据。安装或加载成功本身不是任务成功。\u003c/li>\u003c/ol>\n\u003cdiv class=\"prompt\">\u003cpre>请使用 Matt Pocock 的 grill-with-docs 梳理【本次功能】。\n来源：https://github.com/mattpocock/skills\n先核对当前客户端支持的调用入口和已安装版本，再按实际方法执行。不要照抄他人的缓存路径。\n没有对应入口或权限时如实报告，给出需要我完成的步骤，不绕过限制。\n先读批准材料和代码能确认的事实，只问仍需我拍板的问题。暂不实现。\u003c/pre>\u003c/div>\n\u003cdetails>\u003csummary>为什么在别处看到的名字不一样？\u003c/summary>\u003cp>技能会随版本迭代。旧资料中的 write-a-prd、prd-to-plan、to-issues 等叫法，应按实际版本核对职责，不能机械改名。本册讲解的主链是 grill-with-docs → to-spec → to-tickets → implement。升级后复核入口、产物和权限，不长期硬编码安装路径。\u003c/p>\u003c/details>\n\u003c/section>\n\u003csection id=\"method-cards\">\n\u003ch2>按需要展开：二十五张方法卡\u003c/h2>\n\u003cp>把提示中的方括号换成真实目标或路径。不要把所有卡串成必经流水线，也不要重新盘问已批准的内容。\u003c/p>\n\u003clabel class=\"search-label\" for=\"skill-search\">查找用途或名称\u003c/label>\u003cinput id=\"skill-search\" type=\"search\" placeholder=\"例如：故障、规格、原型、wayfinder\" autocomplete=\"off\">\u003cp id=\"skill-count\" class=\"muted\" aria-live=\"polite\">\u003c/p>\n\u003cdetails class=\"skill-card\" id=\"card-grill-with-docs\">\u003csummary>\u003cspan class=\"skill-name\">grill-with-docs\u003cspan class=\"tag\">手动\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">问清项目需求，并把结论写入项目文档\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>项目需求或重要取舍仍有未知。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>先了解现状，只追问尚未明确的问题；术语写入 CONTEXT.md，符合条件的重要决策写入 ADR。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>已确认的结论、尚存的分歧和必要记录，不是具体代码实现计划。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请用 grill-with-docs 梳理【需求】，读取【批准材料】。能查到的不要问我，只问改变范围和方案的事；确认前不施工。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：已经明确的小改动不必重复追问；此技能也不能代替真实用户研究。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/grill-with-docs/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-to-spec\">\u003csummary>\u003cspan class=\"skill-name\">to-spec\u003cspan class=\"tag\">手动\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">把已有共识写成施工规格\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>工作将跨任务推进，需要别人不读整段聊天也能理解。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>综合共识，写用户故事、验收、不做项和测试边界，不重开盘问。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>可逐条检查的 Spec，本地沿用 .scratch/功能/spec.md。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请用 to-spec 整理【功能】，引用策划与原型基线，写验收、不做项和未解决缺口；交我确认，不自行实现。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：不是预写未来每行代码；小改可以没有 Spec。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/to-spec/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-to-tickets\">\u003csummary>\u003cspan class=\"skill-name\">to-tickets\u003cspan class=\"tag\">手动\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">拆成可独立演示的施工票\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>规格已批准，工作不适合一个短任务完成。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>按可独立使用的功能拆分任务，说明依赖、验收标准和风险，优先完成核心 MVP。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>施工票及其执行顺序，沿用 .scratch/功能/issues/ 目录。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请用 to-tickets 拆【Spec路径】，每票可演示一段完整价值，写依赖和验收。先给粒度、顺序让我确认，不批量开工。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：不要按全部数据库、全部后端、全部前端横着拆。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/to-tickets/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-implement\">\u003csummary>\u003cspan class=\"skill-name\">implement\u003cspan class=\"tag\">手动\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">只把当前这张票做好\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>票与开工条件已批准，正式票在专属新任务中执行。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>核对现场与范围，按测试边界逐步实现，实际验证并审查。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>实现、证据、未验证项和试用入口，不只是完成宣言。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请用 implement 执行【当前票】，先核对分支、已有改动、范围、验证命令。只做本票；我确认前不关票、提交或部署。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：技能默认提交动作不覆盖你的人工验收关口。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/implement/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-diagnosing-bugs\">\u003csummary>\u003cspan class=\"skill-name\">diagnosing-bugs\u003cspan class=\"tag\">按需匹配\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">先查清故障原因，再选择修复办法\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>报错、行为异常或变慢，原因还不清楚。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>先复现用户遇到的问题，列出可能原因并逐项验证，一次只改变一个变量。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>解释现象的证据、排除过的假设和下一步。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请用 diagnosing-bugs 排查【症状】，先只读确认复现与证据，脱敏日志。没定位前不批量改代码；修复另按授权范围执行。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：诊断不自动授权生产埋点或修复；不要叠第二套调试流程。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/diagnosing-bugs/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-prototype\">\u003csummary>\u003cspan class=\"skill-name\">prototype\u003cspan class=\"tag\">按需匹配\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">用临时原型验证尚未确定的设计\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>页面结构或某套状态逻辑是否好用还不确定。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>选 UI 或逻辑原型，按需比较方案，模拟写入，保留探索证据。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>能亲自试的原型与采用理由，不是生产系统。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请用 prototype 验证【问题】，只做最小可交互样例，真实写操作改模拟。有真分歧再比选，给路线、结论和证据，不发布。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：当前版已有方案比选，不必再装同名技能；探索也要检查能否打开。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/prototype/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-research\">\u003csummary>\u003cspan class=\"skill-name\">research\u003cspan class=\"tag\">按需匹配\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">查一手资料并留下出处\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>接口、技术限制或方法事实尚不确定。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>围绕决策问题查原始来源，标事实、推断、日期和版本。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>有明确结论和来源、可以核对的研究笔记，而不只是一串链接。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请用 research 查【问题】，优先官方/原作者，列适用版本、结论、反证与未知，写入现有研究位置，不只看搜索摘要。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：查到案例不等于用户需求已验证。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/research/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-wayfinder\">\u003csummary>\u003cspan class=\"skill-name\">wayfinder\u003cspan class=\"tag\">手动\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">给跨会话决策画路线图\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>目标复杂，还不清楚应该先解决哪些问题。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>保留问题树与决定，按依赖推进，把当前上下文用于当前决策。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>可跨会话接续的决策地图，不是代码依赖图工具。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请用 wayfinder 梳理【复杂目标】，默认只规划。识别问题和依赖，沿用事实源，给当前最重要的下一问，不把笔记扩成施工。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：小任务不用；已有 Spec/票时不再制造第二套调度系统。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/wayfinder/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-ask-matt\">\u003csummary>\u003cspan class=\"skill-name\">ask-matt\u003cspan class=\"tag\">手动\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">不确定该用哪个 Skill 时，先请它判断\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>目标已经清楚，但不确定下一步该查资料、澄清需求还是制作原型。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>按阶段边界建议下一方法；不是联系 Matt 本人。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>下一步选择，你仍决定真实取舍。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请用 ask-matt 判断【现状】下一步，已有【材料】不重走；说明推荐方法与理由，不默认启动大流程。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：默认偏向先规格再施工；低风险短链不必因此升级。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/ask-matt/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-domain-modeling\">\u003csummary>\u003cspan class=\"skill-name\">domain-modeling\u003cspan class=\"tag\">按需匹配\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">统一项目术语的含义\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>案例、项目、版本、资产等词混用。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>术语进 CONTEXT.md；重大决定符合条件才写 ADR。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>统一的术语说明，以及必要的决策理由。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请用 domain-modeling 核对【概念冲突】，给中文解释和代码对应词，沿用 CONTEXT.md，不把进度塞成术语文件。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：ADR 要同时满足难撤回、离开上下文令人意外、有真实取舍，不是任一条件。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/domain-modeling/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-tdd\">\u003csummary>\u003cspan class=\"skill-name\">tdd\u003cspan class=\"tag\">按需匹配\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">先写一个失败测试，再逐步实现功能\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>票约定测试驱动，尤其高风险逻辑。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>在约定的公共边界先写一个失败测试，再用最少实现使其通过，反复进行红→绿循环。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>与用户行为对应的持续反馈。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请按 Matt tdd 在【公共边界】施工，一次一个失败测试和最少实现；说明红灯确因缺失行为失败，不先批量实现再补证据。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：不是每个私有函数都测试；通过仍不等于人工验收。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/tdd/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-code-review\">\u003csummary>\u003cspan class=\"skill-name\">code-review\u003cspan class=\"tag\">按需匹配\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">分别看规格和项目标准\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>票已实现或需要审一段分支变化。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>固定起点，沿规格/标准两轴审查，报告位置与影响。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>规格和项目标准两方面的具体审查结论，以及尚未覆盖的内容。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请用 code-review 审【固定起点】以来本票变化，同时明确覆盖未提交内容。分别检查 Spec 与标准，不用空 diff 宣称通过。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：提交比较会漏工作区改动；多次提交不要默认只审最后一次。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/code-review/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-codebase-design\">\u003csummary>\u003cspan class=\"skill-name\">codebase-design\u003cspan class=\"tag\">按需匹配\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">讨论模块边界，减少理解负担\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>模块接口复杂、测试困难，需要重新考虑模块如何划分职责。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>比较对外接口成本和内部封装，依据真实使用需要。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>可讨论的接口与取舍，不是立即全仓重构。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请用 codebase-design 解释【模块】的边界问题，给使用案例和测试入口；说明现状阻力，不为想象扩展加层。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：深模块不是巨型文件，也不是每个功能抽一个接口。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/codebase-design/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-improve-codebase-architecture\">\u003csummary>\u003cspan class=\"skill-name\">improve-codebase-architecture\u003cspan class=\"tag\">手动\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">找最值得改进的一处架构\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>开发反复卡在同一片代码。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>从经常修改、难以理解或测试的代码中提出改进方向，由你选定后再深入分析。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>少量有依据的改进方向。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请用 improve-codebase-architecture 只读评估【仓库】，找近期热点与实际阻力，给候选和成本，不自行重构。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：评估不授权改文件；保留已有未存档工作。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/improve-codebase-architecture/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-triage\">\u003csummary>\u003cspan class=\"skill-name\">triage\u003cspan class=\"tag\">手动\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">整理新收到的问题和改动请求\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>项目收到了未梳理的 issue 或按 tracker 约定纳入的外部 PR。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>读已有记录，核对是否真实、重复或曾被拒绝，再建议类别、状态与需要补的证据。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>清楚的问题状态与接手者可执行的要求。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请用 triage 检查【指定 issue/PR】，先只读现状与历史，给类别、状态建议和依据；不要重复分流已由 to-tickets 准备好的票，不自动评论、关票或开工。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：不是整理任意聊天或每张施工票的必经步骤；远程改标签、评论、关闭要按授权执行。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/triage/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-setup-matt-pocock-skills\">\u003csummary>\u003cspan class=\"skill-name\">setup-matt-pocock-skills\u003cspan class=\"tag\">手动\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">为项目建立使用 Matt 技能所需的基本约定\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>新项目还没有明确如何记录任务、在哪里保存规则等基本约定。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>先检查现状，再补齐必要的规则和文档入口，让后续技能知道到哪里读取或保存材料。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>规则、规格和票据有明确位置。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请先检查本项目是否缺 Matt 接线；需要 setup-matt-pocock-skills 时列拟改文件和理由，保留已有约定，批准后改。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：不是每票重装，也不覆盖全局或迁走所有现有资料。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/setup-matt-pocock-skills/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-resolving-merge-conflicts\">\u003csummary>\u003cspan class=\"skill-name\">resolving-merge-conflicts\u003cspan class=\"tag\">按需匹配\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">处理已发生的代码合并冲突\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>真实 Git 合并或变基正在冲突。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>理解两侧意图、解决冲突、验证；重要行为分歧交人决定。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>冲突解决说明和验证证据。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>先核对合并状态与未提交改动，再用 resolving-merge-conflicts 处理【范围】。保留两侧意图，不为消红字创造新行为。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：默认全部暂存/提交不覆盖授权；不强行新建 Git 流程。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/resolving-merge-conflicts/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-wizard\">\u003csummary>\u003cspan class=\"skill-name\">wizard\u003cspan class=\"tag\">按需匹配\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">带人完成 AI 不能代办的步骤\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>本人必须登录、授权、输入秘密或操作外部控制台。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>生成分步 Bash 向导，先确认脚本运行环境和敏感信息的处理位置；AI 能完成的步骤仍由 AI 执行。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>确实需要你亲自完成的步骤，以及中断后继续操作的办法。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>先说哪些必须由我操作；必要时用 wizard。确认 Windows Bash 环境，静态检查脚本，秘密不进日志，不把只读排查转给我。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：Bash 不能当 PowerShell 或普通 sh 运行，也不能绕过认证限制。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/engineering/wizard/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-grill-me\">\u003csummary>\u003cspan class=\"skill-name\">grill-me\u003cspan class=\"tag\">手动\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">不依附项目文件的想法盘问\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>独立讨论一个想法，还无需项目留档。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>通过 grilling 问清假设和取舍。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>思路清楚，正式采用再进入项目文档。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请用 grill-me 检视【想法】，本次独立讨论不写项目文件，先问最影响判断的一个问题。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：需要留项目决定时优先 grill-with-docs。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/grill-me/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-grilling\">\u003csummary>\u003cspan class=\"skill-name\">grilling\u003cspan class=\"tag\">按需匹配\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">盘问的共用方法\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>明确要挑战一个方案的假设与薄弱点。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>深入真实分歧，不拿一串术语代替判断。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>被澄清或推翻的假设。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请对【方案】做 grilling，先复述理解，只问改变决定的未知，每次一个重点，用中文具体例子。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：它与两个 grill 入口是底层方法/入口关系，不是三遍盘问。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/grilling/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-handoff\">\u003csummary>\u003cspan class=\"skill-name\">handoff\u003cspan class=\"tag\">手动\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">为接手任务提供简明、必要的交接信息\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>跨工具、目录、协作者或另开独立话题。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>引用现有事实文件，写焦点、决定、失败尝试、下一步，脱敏。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>足以让接手者继续工作的简明交接说明，并确认对方已读到必要材料。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请用 handoff 为【下一任务】做窄交接包，引用 Spec/ADR/票路径，不复制聊天；列进度、失败尝试、未决问题与验证。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：不等于系统压缩、移动代码或已经创建新任务。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/handoff/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-teach\">\u003csummary>\u003cspan class=\"skill-name\">teach\u003cspan class=\"tag\">手动\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">教到你能作判断\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>需要理解概念，不只是让 AI 代做。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>设学习目标，查资料，用短课、例子、回顾和小练习检查理解。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>可回看教程与学习记录，不是施工规格。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请用 teach 教【概念】，我是建筑师不手写代码，要能判断【取舍】。中文短 HTML 加建筑例子，一次少量，用小题检验理解。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：不以一句懂了当证据，也不为简单解释建设全课程。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/teach/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-to-questionnaire\">\u003csummary>\u003cspan class=\"skill-name\">to-questionnaire\u003cspan class=\"tag\">手动\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">向真正知道答案的人收集材料\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>需要同事、用户、专家提供你不知道的信息。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>明确收件人与决定，拟具体可回答问题。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>支撑决定的问卷。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请用 to-questionnaire 给【对象】做短问卷，用于决定【问题】。问最近真实操作，说明要回收的证据，不诱导赞成方案。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：AI 编的回答不能当访谈，不能让你代答同事经历。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/to-questionnaire/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-wait-what\">\u003csummary>\u003cspan class=\"skill-name\">wait-what\u003cspan class=\"tag\">手动\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">暂停黑话，重新讲到听得懂\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>不知道 AI 在做什么，或到底要你选什么。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>重述情境、术语和选择，把理解缺口说清。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>能指导判断的一段解释。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>wait-what。请用中文解释现在卡在哪、为何重要、我需要决定什么，举建筑例子；先别继续写代码。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：不必每次完整教学，也不要求你先学会写代码。\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/wait-what/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"skill-card\" id=\"card-writing-for-agents\">\u003csummary>\u003cspan class=\"skill-name\">writing-for-agents\u003cspan class=\"tag\">按需匹配\u003c/span>\u003c/span>\u003cspan class=\"skill-title\">把工作约定写成 AI 能执行的规则\u003c/span>\u003c/summary>\u003cdl>\u003cdt>什么时候用\u003c/dt>\u003cdd>创建或维护 AGENTS.md、CLAUDE.md、Skill 时使用；角色说明含糊、规则冲突或开工包经常遗漏信息时也可使用。不需要每张票都调用。\u003c/dd>\u003cdt>它做什么\u003c/dt>\u003cdd>先读现有约束和真实例子；分清共同规则、角色差异和本次任务；写清何时读哪份资料、做什么、何时算完成，删重复而不删安全边界。\u003c/dd>\u003cdt>应交出什么\u003c/dt>\u003cdd>具体问题清单、规则修改对照、准确资料入口，以及验证办法；若已批准实施，再给更新文件与差异。\u003c/dd>\u003c/dl>\u003cdiv class=\"prompt\">\u003cpre>请实际使用 Matt writing-for-agents，先完整读取其 SKILL.md。材料是【规则文件】、【已批准流程】与【一次执行跑偏的例子】。先给问题与前后对照，标明哪些应留在共享规则、哪些属于角色说明或本票开工包；资料引用要写清触发条件，完成条件要可检查。不要改产品决定或降低权限/验收要求。本轮先只读给建议；我批准后仅修改指定规则文件，并用一次只读试派发检查是否理解一致。\u003c/pre>\u003c/div>\u003cp class=\"muted\">边界：它不负责自动派发、配置模型、设计产品或替代 implement。不能以省 Token 为由删除批准关口，也不追求固定字数。详细用法见 Agent 执行手册。\u003c/p>\u003cp class=\"note\">\u003ca href=\"#agents/agent-how-to\" data-book-route=\"agents/agent-how-to\">完整使用课\u003c/a> · \u003ca href=\"#agents/agent-stages\" data-book-route=\"agents/agent-stages\">四阶段调用时机\u003c/a> · \u003ca href=\"#agents/agent-templates\" data-book-route=\"agents/agent-templates\">项目规则与角色模板\u003c/a>\u003c/p>\u003cp class=\"source\">作者：Matt Pocock · 所属：mattpocock/skills · 教程基线：1.2.3 · \u003ca href=\"https://github.com/mattpocock/skills/blob/main/skills/productivity/writing-for-agents/SKILL.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码（可能已更新）\u003c/a>\u003c/p>\u003c/details>\n\u003c/section>\n\u003csection id=\"supporting-skills\">\n\u003ch2>根据具体需要，使用 Matt 之外的辅助技能\u003c/h2>\n\u003cp>以下辅助能力来自不同作者，来源见本页开头的表格；不是要求全部开启的新套装。Matt 组织问题、规格与施工，辅助工具处理视觉、验证或隔离。\u003c/p>\n\u003cdetails class=\"support-card\" id=\"support-frontend-design\">\u003csummary>frontend-design：细化已选方案的视觉设计\u003c/summary>\u003cp>用于\u003ca href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念阶段\u003c/a>的视觉定稿，也用于施工中落实已批准视觉。prototype 回答“这个方案行不行”；它处理信息层级、字体、颜色、空间与组件，不能私自改功能边界。\u003c/p>\u003cdiv class=\"prompt\">\u003cpre>请实际使用 frontend-design，基于【选定原型/设计基线】处理【页面】的视觉设计。先说清设计方向，再给可查看结果；保留已确认功能与交互，不同时启动 Taste 重选方向。\u003c/pre>\u003c/div>\u003cp class=\"source\">参考：\u003ca href=\"https://github.com/anthropics/skills/tree/main/skills/frontend-design\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者源码\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"support-card\" id=\"support-emil\">\u003csummary>emil-design-eng：完善组件和动效细节\u003c/summary>\u003cp>结构与视觉方向已选定后，处理一个具体问题，例如筛选反馈不清、弹窗关闭生硬、频繁动画拖慢操作。不负责整站前期研究，也不强制所有元素动起来。\u003c/p>\u003cdiv class=\"prompt\">\u003cpre>请实际使用 emil-design-eng 精修【具体组件/交互问题】，说明改动帮助使用者理解了什么。沿用已选布局和视觉，考虑高频操作、键盘与减少动态偏好，不扩为全站重设计。\u003c/pre>\u003c/div>\u003cp class=\"source\">参考：\u003ca href=\"https://emilkowal.ski/skill\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Emil 官方技能说明\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"support-card\" id=\"support-webapp-testing\">\u003csummary>webapp-testing：让 AI 真的操作页面\u003c/summary>\u003cp>概念阶段检查原型是否走通；交付阶段检查实现是否满足场景。它负责实际浏览器操作、截图与结果，不只是读取 HTML。原生 Windows 程序需要目标环境另验。\u003c/p>\u003cdiv class=\"prompt\">\u003cpre>请使用 webapp-testing，在【入口】实际走【用户任务】，逐项给操作、预期与实际结果，覆盖本任务必要的异常状态。标明模拟与真实边界；浏览器测试不能当 Windows 原生功能已验证。\u003c/pre>\u003c/div>\u003c/details>\n\u003cdetails class=\"support-card\" id=\"support-web-design-guidelines\">\u003csummary>web-design-guidelines：检查界面规范，而非替你选风格\u003c/summary>\u003cp>有真实界面代码后，读取当前规范并审查可访问性、交互与界面实现问题。它与“点开按钮真的能用”是两份不同证据，不和 webapp-testing 重复计功。\u003c/p>\u003cdiv class=\"prompt\">\u003cpre>请用 web-design-guidelines 只读审查【界面文件】，实际读取适用规范，指出具体位置、影响和建议。保留既定设计方向；未经授权先不修改，也不因审查通过就说用户任务全部可用。\u003c/pre>\u003c/div>\u003cp class=\"source\">参考：\u003ca href=\"https://github.com/vercel-labs/web-interface-guidelines\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">规范原仓库\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"support-card\" id=\"support-verification\">\u003csummary>Superpowers verification-before-completion：完成前看证据\u003c/summary>\u003cp>准备说“修好了、通过了、完成了”时核对真实命令与结果。它不是第二轮实现，不产生第二本计划；同一代码和环境已有适用的新证据，不为技能数量机械重复测试。\u003c/p>\u003cdiv class=\"prompt\">\u003cpre>请按 verification-before-completion 核对本票验收与实际证据。区分已验证、未验证和人工待验收，不把代理口头结论当证据；只补缺失或已经失效的检查。\u003c/pre>\u003c/div>\u003cp class=\"source\">参考：\u003ca href=\"https://github.com/obra/superpowers/tree/main/skills/verification-before-completion\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者方法卡\u003c/a>\u003c/p>\u003c/details>\n\u003cdetails class=\"support-card\" id=\"support-worktrees\">\u003csummary>Superpowers using-git-worktrees：隔开磁盘上的施工现场\u003c/summary>\u003cp>真实 Git 项目确实需要文件隔离时用，优先核对是否已有正确隔离目录。新任务隔离聊天，worktree 隔离工作目录，两者不能替代。没有 Git 的资料任务不用它。\u003c/p>\u003cdiv class=\"prompt\">\u003cpre>请先核对当前 Git 根、工作目录和未提交改动。确需隔离且已有授权时使用 using-git-worktrees，复用合适的已有隔离目录或安全建立新目录；保留用户改动，不把普通分支当文件隔离。\u003c/pre>\u003c/div>\u003cp class=\"source\">参考：\u003ca href=\"https://github.com/obra/superpowers/tree/main/skills/using-git-worktrees\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">作者方法卡\u003c/a>\u003c/p>\u003c/details>\n\u003cp>Karpathy 的价值、重复与保留建议见\u003ca href=\"#governance/karpathy-role\" data-book-route=\"governance/karpathy-role\">跨阶段底线\u003c/a>；Taste 仅按适用场景选择，不作为每个产品界面的默认主导。\u003c/p>\n\u003c/section>\n\n\u003csection id=\"one-worked-example\">\n\u003ch2>同一件事怎样接起来：资料库“收藏案例”\u003c/h2>\n\u003cp>以下为教学示例，不是项目已批准规格。假设页面已定，要让同事收藏并再次找到案例。\u003c/p>\n\u003col>\u003cli>\u003cstrong>盘问：\u003c/strong>有用户身份吗？收藏归个人还是团队？重复点击怎么办？读取现状能回答的不要再问你；产品取舍由你定。\u003c/li>\n\u003cli>\u003cstrong>规格：\u003c/strong>“收藏后在我的收藏能看到；取消后消失；不能看他人的私人收藏。”本期不做共享收藏夹。\u003c/li>\n\u003cli>\u003cstrong>拆票：\u003c/strong>第一票让一人从案例页收藏、在列表找回、再取消；不是先做全部数据表、再做全部按钮。写入和权限按风险补控制。\u003c/li>\n\u003cli>\u003cstrong>施工：\u003c/strong>新票任务收到文件、分支和验收，从能暴露问题的一个测试，到最少实现，再下一条。\u003c/li>\n\u003cli>\u003cstrong>交付：\u003c/strong>测试审查后给你入口，用两个示例用户检查可见性，再批准关闭。主控只收短结果和证据位置。\u003c/li>\u003c/ol>\n\u003cp>如果只把“收藏”改成“加入收藏”，不用重跑全套；保留行为，确认文案布局即可。真正改变个人/团队权限就不是文案小改。\u003c/p>\n\u003c/section>\n\u003csection id=\"watch-for-fake-use\">\n\u003ch2>遇到这些情况，需要及时纠正\u003c/h2>\n\u003cul>\u003cli>说“用 TDD”，却先批量写完实现才补测试：报告偏差，不能伪装做过红灯。\u003c/li>\n\u003cli>说“审查没问题”，比较范围却没包括未提交改动：补正确范围再下结论。\u003c/li>\n\u003cli>说“已交付”，只有构建成功：分清机器检查、真实运行和你的验收。\u003c/li>\n\u003cli>已有票又建第二份 Superpowers 状态表：沿用唯一事实源，不重复管理。\u003c/li>\n\u003cli>技能默认包括提交、发布或删除：仍受授权约束，不能借技能扩大权限。\u003c/li>\u003c/ul>\n\u003cp>最常用的流程是澄清需求 → 编写规格 → 拆分任务 → 实现 → 验收。其他技能只在遇到相应问题时使用。维护与去重见\u003ca href=\"#governance\" data-book-route=\"governance\">工具治理\u003c/a>。\u003c/p>\n\u003c/section>\n\u003cnav class=\"book-end\" aria-label=\"前后章节\">\u003ca href=\"#agents\" data-book-route=\"agents\">\u003cspan>上一册\u003c/span>← Agent 执行手册\u003c/a>\u003ca class=\"next\" href=\"#governance\" data-book-route=\"governance\">\u003cspan>下一册\u003c/span>工具治理 →\u003c/a>\u003c/nav>\u003c/article>\u003caside class=\"toc\" aria-label=\"本页目录\">\u003cstrong>本页内容\u003c/strong>\u003ca href=\"#skills/skill-origins\" data-book-route=\"skills/skill-origins\">先认识这套工具：谁做的，从哪里来？\u003c/a>\u003ca href=\"#skills/first-install\" data-book-route=\"skills/first-install\">第一次照着用：先安装和验证主工具，再按需增加\u003c/a>\u003ca href=\"#skills/start-with-the-job\" data-book-route=\"skills/start-with-the-job\">Skill 提供做事的方法，不会代替你自动完成任务\u003c/a>\u003ca href=\"#skills/invoke-and-check\" data-book-route=\"skills/invoke-and-check\">怎样调用 Skill，并检查它是否发挥了作用\u003c/a>\u003ca href=\"#skills/method-cards\" data-book-route=\"skills/method-cards\">按需要展开：二十五张方法卡\u003c/a>\u003ca href=\"#skills/supporting-skills\" data-book-route=\"skills/supporting-skills\">根据具体需要，使用 Matt 之外的辅助技能\u003c/a>\u003ca href=\"#skills/one-worked-example\" data-book-route=\"skills/one-worked-example\">同一件事怎样接起来：资料库“收藏案例”\u003c/a>\u003ca href=\"#skills/watch-for-fake-use\" data-book-route=\"skills/watch-for-fake-use\">遇到这些情况，需要及时纠正\u003c/a>\u003c/aside>\u003c/div>\u003cfooter>建筑师的 AI 开发手册 · 分享版\u003cbr>独立整理的实践教程，非相关作者或 AI 厂商官方手册。方法出处见各工具链接；团队规则需另行确认。\u003cbr>静态单文件，无账号、无分析追踪；外部作者页面需要联网。\u003c/footer>\u003c/main>\u003c/div>\u003cdiv class=\"notice-live\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003cscript>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}));}\nwindow.addEventListener('hashchange',openHash);openHash();\nconst sections=[...document.querySelectorAll('article>section')],tocLinks=[...document.querySelectorAll('.toc a')];\nif('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const id=visible[0].target.id;tocLinks.forEach(a=>a.classList.toggle('current',a.hash==='#'+id));},{rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>observer.observe(s));}\n})();\n\u003c/script>\u003cscript>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n\u003c/script>\u003c/body>\u003c/html>"},{"id":"governance","nav":"工具治理","html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"color-scheme\" content=\"light\">\u003cmeta name=\"description\" content=\"分清插件、技能与命令的作用，避免重复执行流程，不为同一个问题堆叠多套工具。\">\u003ctitle>工具治理 · 建筑师的 AI 开发手册\u003c/title>\u003cstyle>@charset \"UTF-8\";\n:root{--bg:#f7f4ed;--paper:#fffdfa;--ink:#2d2823;--muted:#70665c;--accent:#a44c34;--line:#ddd5c9;--sage:#4d6655;--soft:#eee8de;--focus:#85331e}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:32px}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.85 \"Segoe UI\",\"Microsoft YaHei\",\"PingFang SC\",sans-serif}\na{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:4px}a:hover{color:#783221}button,input{font:inherit}button{cursor:pointer}a,button,input,summary{-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:3px}\n.skip{position:fixed;left:20px;top:-100px;z-index:9;background:var(--ink);color:#fff;padding:10px 20px}.skip:focus{top:12px}\n.layout{display:grid;grid-template-columns:246px minmax(0,1fr);max-width:1640px;margin:auto;min-height:100vh}\n.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:38px 23px 25px;overflow-y:auto}\n.brand{display:block;color:var(--ink);te olor:var(--accent);margin:18px 0 4px}.term-card dd{margin:0;font-size:15px;overflow-wrap:anywhere}.term-card dd p{margin:0 0 9px}.term-check{padding:15px 18px;background:#eee7db}.term-pitfall{font-size:13px!important;color:var(--muted)}.term-walk li{margin:18px 0}.term-walk strong{color:#79543b}\n@media(max-width:760px){.term-body{padding-left:15px;padding-right:0}.term-name{font-size:16px}.term-plain{font-size:13px}.term-filter label{flex-basis:100%}}\n@media print{body{font-size:11pt;background:#fff}.layout{display:block}.sidebar,.toc,.topline,.copy-btn,.book-end,.notice-live{display:none}.page{padding:0}.reading-grid{display:block}.hero{padding:10px 0 20px}h1{font-size:26pt}h2{font-size:18pt}article>section{break-inside:auto}a{color:#222}.prompt,.example,table{break-inside:avoid}details:not([open]){display:block}footer{margin-top:25px}}\n\u003c/style>\u003cstyle>.layout{display:block;max-width:1240px}.page{padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}\u003c/style>\u003c/head>\u003cbody>\u003ca class=\"skip\" href=\"#governance/main\" data-book-route=\"governance/main\">跳到正文\u003c/a>\u003cdiv class=\"layout\">\u003cmain class=\"page\" id=\"main\">\u003cheader class=\"hero\">\u003cp class=\"eyebrow\">案头工具 · 少而清楚\u003c/p>\u003ch1>以 Matt 流程为主，按需要使用辅助技能。\u003c/h1>\u003cp class=\"lead\">分清插件、技能与命令的作用，避免重复执行流程，不为同一个问题堆叠多套工具。\u003c/p>\u003c/header>\u003cdiv class=\"reading-grid\">\u003carticle>\u003csection id=\"toolbox-map\">\u003ch2>先认清工具箱里的五种东西\u003c/h2>\n\u003cp>不了解作者和来源，先看 \u003ca href=\"#skills/skill-origins\" data-book-route=\"skills/skill-origins\">Skill 来源与用途表\u003c/a>。本页讨论怎么分工，不是让你照抄某个人的安装列表。\u003c/p>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>名字\u003c/th>\u003cth>白话解释\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>插件\u003c/td>\u003ctd>打包能力的工具箱，里面可能有 Skill、命令、连接器或自动触发机制。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>市场\u003c/td>\u003ctd>发现和分发插件的渠道；加入市场，不等于装好全部插件。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Skill\u003c/td>\u003ctd>AI 执行某类任务时参考的方法说明，可带脚本和资料；不是模型本身。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>MCP\u003c/td>\u003ctd>连接工具与资源的一种接口；连接状态和权限需另外核对。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>调用入口\u003c/td>\u003ctd>菜单、技能选择器或命令；不同客户端不保证名字和用法相同。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>管理重点不是装得多，而是职责清楚、来源可信、能实际调用。技能写着“必须”也不能扩大你已经授权的操作范围。\u003c/p>\u003c/section>\n\u003csection id=\"matt-mainline\">\u003ch2>以 Matt 为主流程，部分技能需要明确调用\u003c/h2>\n\u003cp>本册选用 \u003cstrong>Matt Pocock 发布的 mattpocock/skills\u003c/strong> 组织正式开发：盘问、规格、技术取舍、拆票、施工、审查与人工验收。进入 \u003ca href=\"#skills\" data-book-route=\"skills\">Skill 操作教程\u003c/a> 看具体方法，不要因为辅助插件也会写计划，就建立第二套规格和票据。\u003c/p>\n\u003cp>讲解基线是 \u003cstrong>Matt Pocock Skills 1.2.3\u003c/strong>：其发布清单有 25 项，14 项同时设置 \u003ccode>disable-model-invocation: true\u003c/code> 和 \u003ccode>allow_implicit_invocation: false\u003c/code>。这分别涉及 Claude Code 的自动调用限制与 Codex 的隐式调用限制，意思不是“插件坏了”。应由使用者明确选用，并遵守客户端实际规则。\u003c/p>\n\u003cdetails>\u003csummary>哪些是这 14 项？为什么别人电脑可能不同？\u003c/summary>\u003cp>ask-matt、grill-with-docs、triage、improve-codebase-architecture、setup-matt-pocock-skills、to-spec、to-tickets、wayfinder、implement、grill-me、handoff、teach、to-questionnaire、wait-what。\u003c/p>\u003cp>这是教程基线，不是所有版本永远相同的清单。文件存在、客户端发现、菜单显示和实际执行是不同事实。不要为了“自动触发”随意删掉作者的限制字段；升级后先核对变更。\u003c/p>\u003c/details>\n\u003cp class=\"source\">\u003ca href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Matt 作者仓库与安装说明\u003c/a> · \u003ca href=\"https://learn.chatgpt.com/docs/build-skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">OpenAI 调用策略说明\u003c/a> · \u003ca href=\"https://code.claude.com/docs/en/skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Claude Code 调用策略说明\u003c/a>。1.2.3 为本册核对版本，非长期最新版承诺。\u003c/p>\u003c/section>\n\u003csection id=\"professional-assistance\">\u003ch2>Superpowers：按需使用，不另建一套开发流程\u003c/h2>\n\u003cp>\u003ca href=\"https://github.com/obra/superpowers\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Superpowers\u003c/a> 由 Jesse Vincent（obra）发布，本身包含规划、测试、调试、审查和代理协作方法。它不是 Matt 的附属组件，也不能简单概括为“只会把任务变重”。\u003c/p>\n\u003cp>本册的选择是：Matt 管主链，Superpowers 按需辅助。完成前用 verification-before-completion 核证据；确需文件隔离时用 using-git-worktrees；疑难故障优先 Matt diagnosing-bugs，另一套调试流程作为备选，不同时重复运行。\u003c/p>\n\u003caside class=\"note\">\u003cp>这是\u003cstrong>推荐的分工，不是已经生效的开关\u003c/strong>。安装包可能自带自动触发和流程要求。启用前先核对实际版本及客户端设置，用低风险任务验证；如果无法安全分工，先只使用一套主流程，不承诺一句“手动”就能关闭所有触发。\u003c/p>\u003c/aside>\n\u003cp>严格 TDD 用于高风险任务或已明确约定的票；普通低风险修改按风险定向验证。读到技能默认提交或部署步骤，不等于获得了你的提交或部署授权。\u003c/p>\u003c/section>\n\u003csection id=\"keep-roles-clear\">\u003ch2>区分视觉设计、细节优化和实际验证\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>工作\u003c/th>\u003cth>可选 Skill / 来源\u003c/th>\u003cth>边界\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>探索功能与交互\u003c/td>\u003ctd>Matt prototype\u003c/td>\u003ctd>回答一个设计问题，不把试验品自动升为正式产品。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>页面视觉主设计\u003c/td>\u003ctd>Anthropic frontend-design\u003c/td>\u003ctd>在批准的功能边界内处理层级、字体和空间。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>另一种视觉探索\u003c/td>\u003ctd>Leonxlnx Design Taste\u003c/td>\u003ctd>先核对具体技能适用范围，不与另一套审美规则同时主导。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>组件与动效精修\u003c/td>\u003ctd>Emil Kowalski 的技能\u003c/td>\u003ctd>针对明确体验问题，不重新推翻整站布局。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>界面规范审查\u003c/td>\u003ctd>Vercel Labs web-design-guidelines\u003c/td>\u003ctd>检查实现质量，不代替真实用户操作。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>浏览器实际验证\u003c/td>\u003ctd>Anthropic webapp-testing\u003c/td>\u003ctd>提供操作证据；Windows 原生能力仍需目标环境实测。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>作者入口、职责和获取渠道集中在 \u003ca href=\"#skills/skill-origins\" data-book-route=\"skills/skill-origins\">来源表\u003c/a>。设计方向已经批准后，后续工具应服从它，不以“优化”为由重新选风格。\u003c/p>\n\u003cdetails>\u003csummary>研究和其他工具怎么安排？\u003c/summary>\u003cp>planning-with-files 可支持独立长研究，不重复正式工程的 Spec 和票据；bili-note 用于特定资料获取；mcp-builder 用于开发工具接口。文档、表格、演示和图片能力按交付格式选择，不是每个开发项目必装的前置。\u003c/p>\u003c/details>\u003c/section>\n\u003csection id=\"karpathy-role\">\u003ch2>Karpathy 的价值：约束行为，不增加一道仪式\u003c/h2>\n\u003cp>\u003ca href=\"https://github.com/multica-ai/andrej-karpathy-skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">andrej-karpathy-skills\u003c/a> 是 Multica 社区根据 Andrej Karpathy 的观察整理的项目，\u003cstrong>不是 Karpathy 本人发布的官方插件\u003c/strong>。参考版本为 1.0.0。\u003c/p>\n\u003col>\u003cli>\u003cstrong>先想清：\u003c/strong>说清假设和取舍，不冒充知道真实需求。\u003c/li>\u003cli>\u003cstrong>简单优先：\u003c/strong>只解决这次的问题，不搭想象中的大平台。\u003c/li>\u003cli>\u003cstrong>只改必要处：\u003c/strong>保留别人改动，不顺手重构无关部分。\u003c/li>\u003cli>\u003cstrong>目标可验证：\u003c/strong>用实际结果证明，而不是一句“已完成”。\u003c/li>\u003c/ol>\n\u003cp>可以把这些写成团队认可的行为底线；如果已有同样约定，不必再安排一个固定的“Karpathy 阶段”。当 AI 多做、跑偏或只报喜时，再用它检查具体偏差。\u003c/p>\n\u003cdiv class=\"prompt\">\u003cpre>请用 karpathy-guidelines 检查【这次工作】的具体偏差：假设是否说清、有没有多做、是否只改必要范围、实际验证是什么。\n先确认技能来源和当前可用入口；未安装就如实说明。不要重复朗读规则，不新增规划阶段，不修改配置。\u003c/pre>\u003c/div>\u003c/section>\n\u003csection id=\"four-buckets\">\u003ch2>工具太多时，按用途和可靠性分类\u003c/h2>\u003cul>\u003cli>\u003cstrong>保留：\u003c/strong>来源清楚、常用且有可靠调用方式。\u003c/li>\u003cli>\u003cstrong>按需或手动：\u003c/strong>会影响流程顺序，或只适合特定任务的能力。\u003c/li>\u003cli>\u003cstrong>观察：\u003c/strong>不确定来源、兼容性或价值，先在无真实数据的小任务试验。\u003c/li>\u003cli>\u003cstrong>可备份移除：\u003c/strong>长期不用或明显重复；先确认依赖和恢复办法，再由负责人批准。\u003c/li>\u003c/ul>\n\u003cp>不要按名称相近就删除。Matt 与 Superpowers 有流程交叠，Karpathy 与行为规范可能重复，但视觉、浏览器验证与代码审查通常解决不同问题。安装数量不是效率指标。\u003c/p>\u003c/section>\n\u003csection id=\"safe-updates\">\u003ch2>先核对安装渠道，再确认如何更新\u003c/h2>\n\u003col>\u003cli>记录实际客户端、插件或技能来源、版本或提交号。\u003c/li>\u003cli>在作者仓库看更新记录，特别检查触发、权限、输出文件与自动收尾变化。\u003c/li>\u003cli>区分市场管理的安装与手工复制的目录；自动更新是否启用以当前客户端和渠道为准，不互相套用。\u003c/li>\u003cli>用一个低风险小任务验证，再决定团队采用；保留受支持的恢复办法。\u003c/li>\u003c/ol>\n\u003cp>磁盘更新、当前会话重新加载、行为验证通过，是三件不同的事。有新提交不等于持续维护承诺，更不等于升级必然更适合你的项目。\u003c/p>\n\u003cp class=\"source\">\u003ca href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Matt 更新入口\u003c/a> · \u003ca href=\"https://github.com/obra/superpowers/blob/main/RELEASE-NOTES.md\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Superpowers 版本记录\u003c/a> · \u003ca href=\"https://code.claude.com/docs/en/discover-plugins\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Claude Code 插件管理说明\u003c/a>\u003c/p>\u003c/section>\n\u003csection id=\"version-and-rules\">\u003ch2>采用手册之前，把团队规则说清\u003c/h2>\n\u003cp>分享的是教程，不是生效的全局配置。请先确认哪些约定适用：谁批准需求、正式票是否一票一会话、谁验收、什么操作需要另外授权。再按所用客户端支持的方式写入项目规则；不要让两份规则各说各话。\u003c/p>\n\u003cdiv class=\"prompt\">\u003cpre>我希望采用这本手册。请先对照【项目现行规则】列出差异：\n哪些是作者 Skill 自带行为，哪些是手册建议，哪些需要团队决定。\n说明影响、验证和回退方式；等我批准后再修改规则。\n不自动安装、不扩大权限，也不改变正在施工任务的边界。\u003c/pre>\u003c/div>\n\u003cp>本册按需更新受影响章节，不要求每次作者更新都重做整本或重装全部工具。不同 AI 产品的兼容情况和最终模型档位，应在你的实际任务里验证。\u003c/p>\u003c/section>\n\u003c/article>\u003caside class=\"toc\" aria-label=\"本页目录\">\u003cstrong>本页内容\u003c/strong>\u003ca href=\"#governance/toolbox-map\" data-book-route=\"governance/toolbox-map\">先认清工具箱里的五种东西\u003c/a>\u003ca href=\"#governance/matt-mainline\" data-book-route=\"governance/matt-mainline\">以 Matt 为主流程，部分技能需要明确调用\u003c/a>\u003ca href=\"#governance/professional-assistance\" data-book-route=\"governance/professional-assistance\">Superpowers：按需使用，不另建一套开发流程\u003c/a>\u003ca href=\"#governance/keep-roles-clear\" data-book-route=\"governance/keep-roles-clear\">区分视觉设计、细节优化和实际验证\u003c/a>\u003ca href=\"#governance/karpathy-role\" data-book-route=\"governance/karpathy-role\">Karpathy 的价值：约束行为，不增加一道仪式\u003c/a>\u003ca href=\"#governance/four-buckets\" data-book-route=\"governance/four-buckets\">工具太多时，按用途和可靠性分类\u003c/a>\u003ca href=\"#governance/safe-updates\" data-book-route=\"governance/safe-updates\">先核对安装渠道，再确认如何更新\u003c/a>\u003ca href=\"#governance/version-and-rules\" data-book-route=\"governance/version-and-rules\">采用手册之前，把团队规则说清\u003c/a>\u003c/aside>\u003c/div>\u003cfooter>建筑师的 AI 开发手册 · 分享版\u003cbr>独立整理的实践教程，非相关作者或 AI 厂商官方手册。方法出处见各工具链接；团队规则需另行确认。\u003cbr>静态单文件，无账号、无分析追踪；外部作者页面需要联网。\u003c/footer>\u003c/main>\u003c/div>\u003cdiv class=\"notice-live\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003cscript>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;par 2}.prompt,.example,table{break-inside:avoid}details:not([open]){display:block}footer{margin-top:25px}}\n\u003c/style>\u003cstyle>.layout{display:block;max-width:1240px}.page{padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}\u003c/style>\u003c/head>\u003cbody>\u003ca class=\"skip\" href=\"#context/main\" data-book-route=\"context/main\">跳到正文\u003c/a>\u003cdiv class=\"layout\">\u003cmain class=\"page\" id=\"main\">\u003cheader class=\"hero\">\u003cp class=\"eyebrow\">案头工具 · 工作习惯\u003c/p>\u003ch1>保存重要信息，让长任务能够顺利接续。\u003c/h1>\u003cp class=\"lead\">上下文容量大，不代表 AI 始终记得准确。学会判断何时继续对话、压缩上下文或新建任务。\u003c/p>\u003c/header>\u003cdiv class=\"reading-grid\">\u003carticle>\u003csection id=\"three-limits\">\n\u003ch2>先分清模型上限、当前配置和实际可靠范围\u003c/h2>\n\u003cp>上下文像 AI 眼前的工作台：当前要求、历史对话、工具结果、读入的文件，都可能占位置。模型公布的最大容量，是工作台的设计上限；客户端配置，是这次实际给它划出的面积；可靠工作区，则是面对当前任务还能稳定找对资料、守住约束的范围。三者不能画等号。\u003c/p>\n\u003cp>容量以 token 计，不等于汉字数。窗口也不是只装聊天记录：输入、输出及部分模型的推理预算都要按产品规则计算。“还能放进去”不代表“每条早期细节都能准确利用”，但变长也不意味着必然突然失效。实际任务难度、材料相关性和验收难度，都比孤立的数字更重要。\u003c/p>\n\u003caside class=\"note\">本册不规定所有人的窗口或压缩阈值。请区分官方模型上限、当前产品实际设置和面对这次任务的可靠表现。\u003c/aside>\n\u003c/section>\n\u003csection id=\"numbers-with-labels\">\u003ch2>看数字，先看它属于哪个模型和入口\u003c/h2>\u003ctable>\u003cthead>\u003ctr>\u003cth>你看到的数字\u003c/th>\u003cth>该怎样核对\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>模型宣传页的最大窗口\u003c/td>\u003ctd>记录完整模型名称与文档日期；API 上限不能直接当成桌面任务配置。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>当前会话显示的容量\u003c/td>\u003ctd>核对客户端、提供方入口、实际设置和预留输出空间；同名模型通过不同服务接入也可能不同。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>开始自动压缩的位置\u003c/td>\u003ctd>可能低于窗口上限；按产品说明和当前环境核对，不能抄另一台电脑的数值。\u003c/td>\u003c/tr>\u003ctr>\u003ctd>所谓“聪明区间”\u003c/td>\u003ctd>是需要结合模型、任务和信息组织方式检验的经验，不是全行业统一的 150–200K 硬断崖。\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003cp>更实用的信号是：开始遗漏边界、重复失败、混淆旧方案，或找不到关键事实。先检查证据和输入组织，再决定继续、压缩或换任务，不只盯着百分比。\u003c/p>\u003cp class=\"source\">参考：\u003ca href=\"https://arxiv.org/abs/2404.06654\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">RULER 长上下文评测\u003c/a> · \u003ca href=\"https://arxiv.org/abs/2307.03172\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Lost in the Middle\u003c/a>\u003c/p>\u003c/section>\n\u003csection id=\"choose-session\">\n\u003ch2>继续、压缩，还是换任务？\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth>现在的情况\u003c/th>\u003cth>怎么处理\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>仍在解决同一件事，资料相关、表现正常\u003c/td>\u003ctd>继续；不要为“清爽”丢掉刚建立的理解。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>历史很长，下一小段仍依赖当前工作\u003c/td>\u003ctd>先把重要信息保存到文件，再在明确的阶段边界压缩并复核。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>批准的正式施工票开始实施\u003c/td>\u003ctd>按经团队确认的项目规则开票专属新任务；普通压缩不能替代它。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>跨工具、跨项目或交给别人\u003c/td>\u003ctd>准备对方能访问的 handoff 与事实文件，核对目录、版本和权限；分叉不自动完成这种交接。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>同项目另探一条独立路线\u003c/td>\u003ctd>可新建一个范围明确的任务，或确需继承历史时分叉；核对继承内容、工作目录和当前状态归谁维护。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>handoff 是交接文档，不是执行了模型压缩；分叉也不保证是空白上下文。父任务给子任务交代具体问题、必要文件、允许范围和验收方法，子任务返回结论与证据即可。内部子代理不能替代用户可见的正式施工任务，模型规则见\u003ca href=\"#delivery\" data-book-route=\"delivery\">开发交付\u003c/a>。\u003c/p>\n\u003cdetails>\u003csummary>正在排查复杂故障，系统却必须压缩怎么办？\u003c/summary>\u003cp>优先在自然边界整理，不等于硬撑到溢出。系统必须压缩或同一故障仍需继续时，先保存复现条件、已排除假设、失败尝试和下一次验证，再压缩或交接，恢复后核对。若项目现行规则禁止中途压缩，先由负责人解决规则冲突，不能悄悄忽略。\u003c/p>\u003c/details>\n\u003c/section>\n\u003csection id=\"what-compaction-does\">\n\u003ch2>压缩可能丢失细节，不能代替文件记录\u003c/h2>\n\u003cp>公开 Responses 文档描述的是不透明、加密的压缩项，不能简单说成“AI 写了一段人能读的摘要”；独立压缩结果也可能保留其他消息。Claude Code 文档则说明接近窗口时先清理较旧工具输出，再总结对话，并提醒早期细节可能丢失。\u003c/p>\n\u003cp>这是公开机制的区别，不是对每条客户端或第三方接入路径的实测。特别是使用路由代理时，要额外核对它如何处理历史。压缩后检查约束有没有留下，不能承诺无损，也不能指望它修复所有已经超出输入限制的请求。\u003c/p>\n\u003cp class=\"source\">参考：\u003ca href=\"https://developers.openai.com/api/docs/guides/compaction\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">OpenAI 压缩文档\u003c/a> · \u003ca href=\"https://code.claude.com/docs/en/how-claude-code-works\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Claude Code 工作机制\u003c/a>\u003c/p>\n\u003c/section>\n\u003csection id=\"written-memory\">\n\u003ch2>把会影响下一步的事实留在文件里\u003c/h2>\n\u003cp>唯一事实源不是把一切塞进一个巨型文档。CONTEXT.md 解释领域术语，ADR 解释重要取舍，Spec 保存批准范围，施工票保存真实进度、验证结果和未解决问题。当前状态只维护一处，其他文档引用它；不要另建一份内容相同、很快过期的交接档案。\u003c/p>\n\u003cdiv class=\"prompt\">\u003cpre>准备压缩或交接。先更新现有事实文件，不新增平行计划。\n请核对：目标与不做范围、已批准决策、实际改动、已运行验证、失败尝试及原因、下一步与权限边界。\n继续后先读这些文件，复述当前状态并指出未知项。\n未运行的测试不能写成通过；工具报完成不能写成人工验收。\u003c/pre>\u003c/div>\n\u003cp>摘要后尤其检查：有没有忘记“不要做什么”、是否把尝试当成功、是否又准备重复已失败的方法。文件路径只有被下一位实际读取才有用，写进交接并不等于已经读过。\u003c/p>\n\u003cp class=\"source\">参考：\u003ca href=\"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">Anthropic 上下文工程\u003c/a>\u003c/p>\n\u003c/section>\n\u003csection id=\"different-errors\">\n\u003ch2>报错时，先判断原因，不要一概归咎于上下文\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>502 或服务错误：\u003c/strong>先记录服务、时间与请求阶段，区分临时上游故障；不是安装 Superpowers 的理由。\u003c/li>\n\u003cli>\u003cstrong>证书错误：\u003c/strong>检查证书链、时间、代理或信任配置；不能用关闭证书验证来掩盖。\u003c/li>\n\u003cli>\u003cstrong>明确的上下文超限：\u003c/strong>检查实际模型入口、输入与压缩机制，再减少无关输入或按规则交接。\u003c/li>\n\u003cli>\u003cstrong>当前环境 sandbox／权限／DLL 错误：\u003c/strong>检查解释器、依赖和授权范围；不靠反复改提示词解决，也不绕过权限。\u003c/li>\n\u003c/ul>\n\u003caside class=\"warning\">“第三次盲试前停下”是本手册的止损建议，不是某个软件的定律：同类错误没有新证据时，停止换参数碰运气，先保留错误信息并查明哪个环节出了问题。修改配置或申请更大权限，仍要遵守授权规则。\u003c/aside>\n\u003c/section>\n\u003csection id=\"windows-habits\">\n\u003ch2>Windows 上，让命令可复现\u003c/h2>\n\u003cp>固定使用已经核验的解释器绝对路径，不混用系统 Python、项目虚拟环境与工具自带 Python。复杂命令先写成任务范围内的脚本文件，再传清楚的参数，避免在 PowerShell、Python、Bash 之间套多层引号。\u003c/p>\n\u003cdiv class=\"example\">\u003cp>例如排查 Python 中文输出，可要求 AI：“报告解释器路径、文件编码和错误位置；如证据指向 Python 输出编码，再评估 \u003ccode>-X utf8\u003c/code>。不要先重装整个环境。”这是诊断说法，不是让你现在执行安装或改配置。\u003c/p>\u003c/div>\n\u003cp>PowerShell 7 的默认文件编码更一致，却不保证 Python 输出编码正确，也不把 Bash 脚本变成 PowerShell 脚本。它们是不同层的问题。把经过验证的命令写入项目脚本和说明，采用新环境设置前先核对影响与授权。\u003c/p>\n\u003cp class=\"source\">参考：\u003ca href=\"https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_character_encoding?view=powershell-7.6\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">PowerShell 编码\u003c/a> · \u003ca href=\"https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_parsing?view=powershell-7.6\" target=\"_blank\" rel=\"noopener noreferrer\" data-external=\"true\" title=\"作者或公开资料入口，需联网\">参数与引号解析\u003c/a>\u003c/p>\n\u003c/section>\n\u003cnav class=\"book-end\" aria-label=\"前后章节\">\u003ca href=\"#governance\" data-book-route=\"governance\">\u003cspan>上一册\u003c/span>← 工具治理\u003c/a>\u003ca class=\"next\" href=\"#skills/skill-origins\" data-book-route=\"skills/skill-origins\">Skill 来源与用途\u003c/a>\u003c/nav>\u003c/article>\u003caside class=\"toc\" aria-label=\"本页目录\">\u003cstrong>本页内容\u003c/strong>\u003ca href=\"#context/three-limits\" data-book-route=\"context/three-limits\">先分清模型上限、当前配置和实际可靠范围\u003c/a>\u003ca href=\"#context/numbers-with-labels\" data-book-route=\"context/numbers-with-labels\">看数字，先看它属于哪个模型和入口\u003c/a>\u003ca href=\"#context/choose-session\" data-book-route=\"context/choose-session\">继续、压缩，还是换任务？\u003c/a>\u003ca href=\"#context/what-compaction-does\" data-book-route=\"context/what-compaction-does\">压缩可能丢失细节，不能代替文件记录\u003c/a>\u003ca href=\"#context/written-memory\" data-book-route=\"context/written-memory\">把会影响下一步的事实留在文件里\u003c/a>\u003ca href=\"#context/different-errors\" data-book-route=\"context/different-errors\">报错时，先判断原因，不要一概归咎于上下文\u003c/a>\u003ca href=\"#context/windows-habits\" data-book-route=\"context/windows-habits\">Windows 上，让命令可复现\u003c/a>\u003c/aside>\u003c/div>\u003cfooter>建筑师的 AI 开发手册 · 分享版\u003cbr>独立整理的实践教程，非相关作者或 AI 厂商官方手册。方法出处见各工具链接；团队规则需另行确认。\u003cbr>静态单文件，无账号、无分析追踪；外部作者页面需要联网。\u003c/footer>\u003c/main>\u003c/div>\u003cdiv class=\"notice-live\" role=\"status\" aria-live=\"polite\">\u003c/div>\u003cscript>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}));}\nwindow.addEventListener('hashchange',openHash);openHash();\nconst sections=[...document.querySelectorAll('article>section')],tocLinks=[...document.querySelectorAll('.toc a')];\nif('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const id=visible[0].target.id;tocLinks.forEach(a=>a.classList.toggle('current',a.hash==='#'+id));},{rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>observer.observe(s));}\n})();\n\u003c/script>\u003cscript>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n\u003c/script>\u003c/body>\u003c/html>"},{"id":"glossary","nav":"行话使用指南","html":"\u003c!doctype html>\u003chtml lang=\"zh-CN\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003cmeta name=\"color-scheme\" content=\"light\">\u003cmeta name=\"description\" content=\"从建筑师熟悉的事物理解软件开发：这个词是什么意思，什么时候出现，谁来做、用哪个 Skill，以及你要检查什么。\">\u003ctitle>行话使用指南 · 建筑师的 AI 开发手册\u003c/title>\u003cstyle>@charset \"UTF-8\";\n:root{--bg:#f7f4ed;--paper:#fffdfa;--ink:#2d2823;--muted:#70665c;--accent:#a44c34;
