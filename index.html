e}.term-card summary::after{content:'＋';grid-column:2;grid-row:1/3;align-self:center;color:var(--accent);font-weight:400;font-size:22px}.term-card[open] summary::after{content:'－'}.term-name{font-size:17px;overflow-wrap:anywhere}.term-plain{font-size:14px;font-weight:400;color:var(--muted)}.term-body{padding:6px 22px 6px;border-left:2px solid #c8aa91;margin-top:18px}.term-analogy{color:#79543b;font-size:14px}.term-card dl{margin:20px 0}.term-card dt{font-size:12px;color:var(--accent);margin:18px 0 4px}.term-card dd{margin:0;font-size:15px;overflow-wrap:anywhere}.term-card dd p{margin:0 0 9px}.term-check{padding:15px 18px;background:#eee7db}.term-pitfall{font-size:13px!important;color:var(--muted)}.term-walk li{margin:18px 0}.term-walk strong{color:#79543b}\n@media(max-width:760px){.term-body{padding-left:15px;padding-right:0}.term-name{font-size:16px}.term-plain{font-size:13px}.term-filter label{flex-basis:100%}}\n@media print{body{font-size:11pt;background:#fff}.layout{display:block}.sidebar,.toc,.topline,.copy-btn,.book-end,.notice-live{display:none}.page{padding:0}.reading-grid{display:block}.hero{padding:10px 0 20px}h1{font-size:26pt}h2{font-size:18pt}article>section{break-inside:auto}a{color:#222}.prompt,.example,table{break-inside:avoid}details:not([open]){display:block}footer{margin-top:25px}}\n</style><style>.layout{display:block;max-width:1240px}.page{padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}</style></head><body><a class=\"skip\" href=\"#team/main\" data-book-route=\"team/main\">跳到正文</a><div class=\"layout\"><main class=\"page\" id=\"main\"><header class=\"hero\"><p class=\"eyebrow\">案头工具 · 从一个人到几个人</p><h1>分工开发后，如何检查并合并彼此的成果。</h1><p class=\"lead\">你不必先学会写代码，才能与同事合作。先把分工、版本和验收交接清楚，再让每个人的 AI 在同一套约定下工作。</p></header><div class=\"reading-grid\"><article><section id=\"team-start\">\n<h2>先和一位同事试着合作，再考虑多人同时开发</h2>\n<p>本册先按 <strong>2–4 人小团队、各自用 AI、主要交付 Windows 程序</strong>设计。这是起步建议，不是对你们现有人数、技术水平或仓库状态的判断。协作不是把几份“最终版”拼起来，而是约定谁做什么、依据哪个版本、怎样交验。</p>\n\n<div class=\"route-picker\">\n<a href=\"#team/first-pilot\" data-book-route=\"team/first-pilot\"><span>刚开始协作 · 推荐</span><strong>先做一次小交接</strong><small>你做主控，同事提供场景、试用，再接一张低风险票。</small></a>\n<a href=\"#team/team-flow\" data-book-route=\"team/team-flow\"><span>两个人都要开发</span><strong>一人一票，各自施工</strong><small>各自目录与任务，通过可审查的改动合并，不互传整包覆盖。</small></a>\n</div>\n<p><strong>最小组合：</strong>一个公司允许使用的私有代码仓库、一处票据记录、每人自己的账号和工作目录、一名合并负责人。聊天群负责提醒，仓库与票据负责留事实；不急着添一套项目管理软件。</p>\n<aside class=\"note\"><p>团队协作贯穿四阶段，<strong>不是新增第五阶段</strong>。先共同确认场景与原型，施工准备时分清责任，开发交付时按票交接。本册没有创建仓库、邀请人员或修改权限。</p>\n<p>本手册的规则是“主控派工、一票一会话、一次只开当前可施工票”。本册默认先串行试点；多人并行、提前推送或自动发布都需要另行批准，不能凭阅读教程就当规则已改。</p></aside>\n</section>\n<section id=\"team-roles\">\n<h2>四种职责，可以由两个人兼任</h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>职责</th>\n<th>做什么</th>\n<th>不能混淆什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>产品负责人 · 初期建议你担任</td>\n<td>决定范围、设计方向和验收标准；处理分歧</td>\n<td>不必读懂每行代码，但要能判断演示是否满足工作需要</td>\n</tr>\n<tr>\n<td>票负责人 · 你或同事</td>\n<td>带自己的 AI 完成一张票，交出改动、演示和证据</td>\n<td>不能只转发 AI 的“已完成”，也不私自扩张需求</td>\n</tr>\n<tr>\n<td>复核人 · 另一位同事借助自己的 AI</td>\n<td>对照票与具体版本独立核查，再试用关键路径</td>\n<td>作者自查不等于独立复核；两份 AI 结论也不是人工批准</td>\n</tr>\n<tr>\n<td>合并与发布负责人 · 初期建议你担任</td>\n<td>控制版本合入与发布顺序，确认回退和整体结果</td>\n<td>合并代码和部署是两次不同授权；不是人人都有管理员权</td>\n</tr>\n</tbody></table></div>\n<p><strong>保留一个项目主控，但不用把同事都变成“子代理”。</strong>同事是独立的负责人，他的 AI 是他的执行助手。你的主控任务负责统一决定与接收摘要；读取差异、运行测试和合并等工作，交给专属复核或整合任务，不把主控重新变成施工现场。</p>\n<p class=\"source\">角色分工为本手册建议。个人身份与组织角色的能力参见 <a href=\"https://docs.github.com/en/get-started/learning-about-github/types-of-github-accounts\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">GitHub 账号类型</a>、<a href=\"https://docs.github.com/en/organizations/managing-user-access-to-your-organizations-repositories/managing-repository-roles/repository-roles-for-an-organization\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">仓库角色</a>。</p>\n</section>\n<section id=\"team-shared\">\n<h2>共享项目约定，不共享同一个施工文件夹</h2>\n<p>同事要能查到相同的有效资料，而不是复制你的聊天历史。资料如何归属、谁维护公共契约、如何避免重复记录，见<a href=\"#knowledge/knowledge-scope\" data-book-route=\"knowledge/knowledge-scope\">项目知识库的分层</a>与<a href=\"#knowledge/knowledge-maintenance\" data-book-route=\"knowledge/knowledge-maintenance\">维护责任</a>。</p>\n<div class=\"example\"><h3>像一个共享图纸档案库，配两张独立工作台</h3>\n<ol class=\"team-chain\"><li><strong>共享仓库</strong><span>保存已授权共享的代码、规格与票据版本。</span></li><li><strong>你 / 同事各自的 clone</strong><span>clone 就是从仓库取得自己的本地副本；每台电脑各一份，不直接共改共享盘目录。</span></li><li><strong>一票一条短分支</strong><span>先分开记录本票改动，复核后再合回共同主线。</span></li><li><strong>PR · 合并申请</strong><span>把差异、票据和验证依据交给复核者；它不是另一份 Spec。</span></li></ol></div>\n<p>同一人确实需要多个并行工作目录，才考虑 <a href=\"#glossary/term-worktree\" data-book-route=\"glossary/term-worktree\">worktree</a>。<strong>新任务隔离聊天，独立目录隔离文件；两者都不自动隔离数据库、账号或电脑权限。</strong>不要让两个人的 AI 在网络共享盘或同步盘里的同一个活动工作目录上写代码。</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>应该如何处理</th>\n<th>内容</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>经批准随代码共享</td>\n<td>Spec、票据、CONTEXT.md、必要 ADR、原型基线、依赖版本锁文件、验证脚本、无秘密的环境配置示例、模拟数据</td>\n</tr>\n<tr>\n<td>只保留一处当前记录</td>\n<td>负责人、票状态、阻塞、验收与版本。已用本地票就共享那一份；已用平台票就以平台为准，不要在群聊里另维护一张进度表</td>\n</tr>\n<tr>\n<td>不复制个人全套环境</td>\n<td>AI 登录记录、个人全局配置、插件缓存、绝对路径、临时文件与整段聊天；分享必要规则、技能来源和核对过的版本即可</td>\n</tr>\n<tr>\n<td>不随代码仓库上传</td>\n<td>真实 .env、密码、Token、私钥、真实客户图纸、生产/个人数据库、未脱敏录屏；私有仓库也不等于允许放这些资料</td>\n</tr>\n</tbody></table></div>\n<p>团队票用仓库内相对路径或固定版本链接，例如 <code>.scratch/资料检索/issues/02-筛选.md</code>，不要只给同事一个你电脑上的 <code>E:\\…</code> 路径。每人的开工包再填入<strong>自己实际的</strong>本地目录。</p>\n<p class=\"source\">依据：<a href=\"https://git-scm.com/docs/git-clone\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Git clone</a>、<a href=\"https://git-scm.com/docs/git-worktree\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">worktree</a>。独立工作台与共享范围是本团队的风险控制建议，不是工具自动提供的安全保证。</p>\n</section>\n<section id=\"team-onboarding\">\n<h2>同事第一次加入，完成这六件事</h2>\n<p>选择公司批准的平台：已用 GitHub / GitLab 就沿用；没有时先讨论公司组织名下的私有仓库。若公司要求资料不出内网，再选合规的内部平台。本册不替你决定上传许可，也不自动搭建服务器。</p>\n<ol>\n<li><strong>确认“谁能看到什么”。</strong>每人自己的账号，按职责授予权限；只试用的同事不必先拥有代码写权限。不要共享登录密码、个人 AI 会话或生产管理员账号。</li>\n<li><strong>拿到准确入口。</strong>仓库地址、默认分支、当前票据位置、合并负责人、可使用的测试数据；主分支叫什么以实际仓库为准，<code>main</code> 只是下文示例。</li>\n<li><strong>建立自己的副本。</strong>让 AI 先只读检查目录、已有文件和磁盘位置，确认后再 clone；不可覆盖旧项目或把同事已有改动清掉。</li>\n<li><strong>先复现基线，再接需求。</strong>使用项目记载的工具版本、依赖锁文件与启动方法；用模拟数据跑通同一条检查。缺依赖先列清单，不能因为“入场”就自行重装系统环境。</li>\n<li><strong>读统一规则，核对必要 Skill。</strong>共享项目级规则和这张票用到的技能来源/版本；不用安装你所有插件。换 AI 工具时仍遵守同一份需求、验收和权限约定。</li>\n<li><strong>给一份能追溯的入场结果。</strong>记录取得的提交编号、目标电脑环境、启动/验证结果和缺口；确认能复现基线，才开始本票。</li>\n</ol>\n<details><summary>我的 Codex / Claude 配置，要整份复制给同事吗？</summary>\n<p>不需要。团队共享的是做事规则与必要能力，不是你的个人账号。Codex 的项目级 <code>AGENTS.md</code> 和适用的仓库技能可以随版本管理；个人全局配置、插件登录和安装状态不会因此自动同步。其他客户端按其实际项目规则入口接入，先核实加载结果，不假定所有工具读法相同。</p>\n<p>已有统一规则就引用它，不在两个文件各维护一套不同流程。技能升级先由一个人用小任务验证，再批准团队采用；暂时不要各自在施工中升级成不同版本。分发第三方 Skill 时还需遵守其许可。</p>\n<p class=\"source\"><a href=\"https://learn.chatgpt.com/zh-Hans/docs/customization/overview\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">OpenAI 官方：项目规则与仓库技能</a>；<a href=\"#governance\" data-book-route=\"governance\">本手册：工具治理</a>。本次只作说明，没有替同事安装或配置。</p>\n</details>\n<details><summary>Windows 上最容易不一致的地方</summary>\n<p>把语言/运行时版本、包管理器、实际 Shell、编码、项目启动与测试入口写在已有开发说明里；让 AI 调用项目脚本，少在聊天里重新拼复杂命令。相对路径用于共享材料，真实本机路径用于执行。</p>\n<p><code>.gitattributes</code> 可以按文件类型约定行尾，不能顺便解决所有字符编码问题。首次规范化可能改变大量文件，要单独审查与批准，不能夹在功能票里“一键全库格式化”。</p>\n<p class=\"source\"><a href=\"https://git-scm.com/docs/gitattributes\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Git 官方：行尾与文件属性</a>。</p>\n</details>\n</section>\n<section id=\"team-flow\">\n<h2>同事完成一张票后，怎样合入项目</h2>\n<p>这是基于短分支与 PR 的<strong>本地适配路线</strong>，保留你现有的批准关口。初期只流转一张票；同事参与复核，也已经是协作，不必为了体现合作同时开工。</p>\n<ol class=\"team-workflow\">\n<li><strong>你批准票与负责人，主控负责调度。</strong>引用 Spec、原型与验收，说明依赖、共享接口和禁止改动范围。不要两个人同时认领同一张票。</li>\n<li><strong>票负责人开施工票会话。</strong>核对自己 clone 的实际目录、基线、分支和未存档改动。基线就是双方认可的起始版本，用提交编号标识；AI 从这里开始，只完成这一票。</li>\n<li><strong>先自检、审查，再演示。</strong>按票风险运行检查，核对需求和项目标准。截图只证明对应界面，不能代替真实行为测试；把未验证内容说清。</li>\n<li><strong>人工初验后，获准存档与推送。</strong>按本手册的规则，本地存档须人工确认，push / PR 另获授权。允许推送的内容必须先做秘密和无关文件检查。</li>\n<li><strong>用一个 PR 交给另一位复核。</strong>关联原票、固定审查提交、写明验证和演示入口；复核者让自己的 AI 读真实差异。发现问题回原票修正，不另写一部新 Spec。</li>\n<li><strong>指定人批准，整合任务执行合并。</strong>合并前核对最新基线与审批是否仍适用；更新代码后过期的检查要重做。主控负责派工、接收证据和更新施工日志，不亲自跑合并命令。</li>\n<li><strong>合并后检查组合结果，再记完成。</strong>按影响范围回归并确认实际使用；票记录审查版本与最终合并版本。最终验收成立后才关票；部署或分发安装包继续单独批准。</li>\n</ol>\n<p class=\"source\">基础方法：<a href=\"https://docs.github.com/en/get-started/using-github/github-flow\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">GitHub Flow</a>。票责任、人工初验、主控冻结与授权顺序为本手册适配；当前实际规则见<a href=\"#delivery/ticket-workspace\" data-book-route=\"delivery/ticket-workspace\">一票一会话</a>。</p>\n<details><summary>别人都是先 push、发 Draft PR，我们为什么不同？</summary>\n<p>Draft PR 是“尚未申请合并的草稿”，适合提前请同事看代码。但它已经把内容发送到远端，不能因为叫草稿就跳过你的推送授权。以后若你希望采用，可以单独批准“本票允许将已脱敏改动推到指定私有分支供复核，不允许合并/部署”；这次教程不默默改变顺序。</p>\n</details>\n<details><summary>PR 与施工票会不会重复？</summary>\n<p>票写做什么及完成状态，PR 展示这次准备合入的代码差异和审查讨论。PR 引用票，不抄一份平行需求。若未到最终验收，不用会自动关 issue 的关联方式或 <code>Closes #…</code> 等关键词；普通链接足够。合并成功不能冒充人工已经验收。</p>\n<p class=\"source\"><a href=\"https://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/linking-a-pull-request-to-an-issue\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">GitHub：PR 与 issue 的关联及自动关闭</a>。</p>\n</details>\n</section>\n<section id=\"team-feedback\">\n<h2>主控 AI 如何知道同事电脑上发生了什么？</h2>\n<p><strong>默认靠明确交接，不假设聊天自动互通。</strong>你的主控看到链接，不代表它已有访问权限或读过内容；它也不能仅凭版本名推断同事运行的是哪份程序。</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>方式</th>\n<th>怎样用</th>\n<th>适合什么时候</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>先用：人工转交短摘要</td>\n<td>同事把下面的回报贴到票/PR，再给你链接；无法读取时提供脱敏材料</td>\n<td>第一次协作，不额外搭系统</td>\n</tr>\n<tr>\n<td>再用：授权读取共享仓库</td>\n<td>主控派只读复核任务，通过现有工具读取具体票、差异和检查；明确报告真正读到的版本</td>\n<td>仓库与权限稳定后；不因此取得同事桌面的控制权</td>\n</tr>\n<tr>\n<td>以后按需：自动检查与回报</td>\n<td>CI 在配置的环境构建/测试，结果关联具体提交；Windows 真机另留证据</td>\n<td>同样的人工步骤反复发生时，再评估配置与运行费用</td>\n</tr>\n</tbody></table></div>\n<div class=\"example\"><h3>每次只交这六项，详细日志留原处</h3>\n<ol>\n<li>票号与负责人；状态是待复核、阻塞、待验收还是已验收。</li>\n<li>仓库、分支、提交编号；未存档内容单独说明，不冒充已推送。</li>\n<li>做了什么，以及没做什么；链接实际差异与批准范围。</li>\n<li>验证的命令/操作、环境、时间和结果；日志脱敏并给可访问位置。</li>\n<li>演示或安装包版本、取得方式；仅当这些信息不足以区分交付物、确有拿错包风险时，才补文件哈希（内容指纹）。</li>\n<li>已知问题、回退办法与需要主控决定的事项。</li>\n</ol></div>\n<p>这相当于同事交“这一版图纸＋检验记录＋待定问题”，不需要把一整天的聊天都交给主控。跨人员交接可用 <a href=\"#skills/card-handoff\" data-book-route=\"skills/card-handoff\">handoff</a>，重点引用已有事实源；完整对话不是必需输入。</p>\n<details><summary>同事只说“打不开”，应该怎样补资料？</summary>\n<p>让他写：哪个安装包/提交、Windows 具体版本和架构、普通用户还是管理员、从哪一步开始、期待什么、实际出现什么、能否重复。截图或日志先隐藏账号、密钥和客户内容。你的诊断任务读这些证据，必要时再请同事执行一项安全检查；没有在目标电脑复现就直说未复现，不反复猜改。</p>\n</details>\n</section>\n<section id=\"team-boundaries\">\n<h2>文件没有冲突，还要检查接口、数据和目标电脑是否兼容</h2>\n<details open><summary>什么可以并行，什么先排队？</summary>\n<p>只有依赖满足、目标可独立验收、共享约定已明确的票，才值得考虑并行。初期每人至多一张执行中的票；公共配置、依赖升级、数据库结构、权限和发布由指定负责人协调，不能多人各自改一套。</p>\n<p>同一功能里“甲做所有界面、乙以后再接所有接口”容易到最后才发现接不上。优先拆成可独立使用的小功能；确需两人分工，先约定字段含义、输入输出、失败状态、权限和模拟边界，再各做自己的部分，最后仍共同走通真实路径。</p>\n<p>这是将来批准并行时的判断依据；<strong>现在仍执行串行纪律</strong>。独立目录只减少文件覆盖，不解决业务分歧。</p>\n</details>\n<details><summary>数据库与共享测试环境：不能靠分支隔离</summary>\n<p>每人优先用独立测试数据库/数据空间和模拟样例；共享集成环境由指定人管理。代码分支不同，但连着同一个数据库，写入仍会互相影响。</p>\n<p>改表结构、迁移、权限、备份恢复按高风险任务处理：写清执行顺序、旧新版本兼容、备份与真实恢复办法，经批准由指定人执行。不要为修复测试随便清空共享库；Git 回退代码不等于数据已经恢复。</p>\n</details>\n<details><summary>Win10 安装包与 computer use：一定要在现场验证</summary>\n<p>第二位同事应在目标 Windows 环境验证安装、启动、读写权限、升级/卸载、异常恢复及本票涉及的原生能力。记录具体系统版本、架构、显示缩放和安装包；“我的开发机能跑”或网页测试通过都不能替代它。</p>\n<p>未来智能体要控制同事电脑，先在独立测试环境、模拟文档和受限测试账号上验证。明确可操作的应用/目录、何时需本人确认、暂停/停止办法、脱敏记录和误操作恢复；不能让测试直接点击真实客户设计文件或未经同意控制他人电脑。</p>\n</details>\n<details><summary>要不要马上搭 CI 自动测试？</summary>\n<p>CI 就是“每次改动后，由指定环境自动跑已经写好的检查”。先把项目启动与检查脚本跑通，再自动化最常用的一组；不是先造一套庞大流水线。它能减少漏跑，但不会自动替你想出所有测试。</p>\n<p>核对目标提交、系统、触发条件及跳过项；绿色图标不等于全部实际运行。不要把不可信改动的自动执行接到有生产权限或日常办公资料的电脑。费用、权限与 Windows 运行环境需另行确认。</p>\n<p class=\"source\"><a href=\"https://docs.github.com/en/actions/get-started/continuous-integration\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">GitHub：持续集成</a>、<a href=\"https://docs.github.com/en/actions/concepts/billing-and-usage\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">运行额度与费用</a>、<a href=\"https://docs.github.com/en/actions/reference/security/secure-use\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">安全使用</a>。目标电脑验收是本项目适配要求。</p>\n</details>\n</section>\n<section id=\"team-skills\">\n<h2>仍用 Matt 主链，只增加协作信息</h2>\n<p>不需要专门找一个“多人协作万能 Skill”。票、版本、责任和权限先说清，现有方法各干一件事。技能名可点开具体教程；这是方法分工，不是自动安装或已生效的调用。</p>\n\n<table class=\"team-skill-table\">\n<thead>\n<tr>\n<th>遇到什么</th>\n<th>用哪个 Skill</th>\n<th>协作时多交代什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>两个人理解不同</td>\n<td><a href=\"#skills/card-grill-with-docs\" data-book-route=\"skills/card-grill-with-docs\">grill-with-docs</a>；词义用 <a href=\"#skills/card-domain-modeling\" data-book-route=\"skills/card-domain-modeling\">domain-modeling</a></td>\n<td>只问真实分歧，指定谁拍板；澄清后写回原事实源</td>\n</tr>\n<tr>\n<td>能力/兼容性不明</td>\n<td><a href=\"#skills/card-research\" data-book-route=\"skills/card-research\">research</a></td>\n<td>给待核实的问题与目标环境，不为观点争论虚构结论</td>\n</tr>\n<tr>\n<td>形成共同规格</td>\n<td><a href=\"#skills/card-to-spec\" data-book-route=\"skills/card-to-spec\">to-spec</a></td>\n<td>引用共同的已批准决定；涉及相关界面或交互时引用适用原型基线，不要求所有任务补做原型。确认共享接口、验收和不做项</td>\n</tr>\n<tr>\n<td>分票与认领</td>\n<td><a href=\"#skills/card-to-tickets\" data-book-route=\"skills/card-to-tickets\">to-tickets</a></td>\n<td>每票一个负责人、真实依赖、共享部分的协调者；人确认粒度</td>\n</tr>\n<tr>\n<td>各自施工</td>\n<td><a href=\"#skills/card-implement\" data-book-route=\"skills/card-implement\">implement</a>；约定测试驱动时用 <a href=\"#skills/card-tdd\" data-book-route=\"skills/card-tdd\">tdd</a></td>\n<td>本人真实目录、固定票、允许范围和明确验证环境</td>\n</tr>\n<tr>\n<td>跨同事交接</td>\n<td><a href=\"#skills/card-handoff\" data-book-route=\"skills/card-handoff\">handoff</a></td>\n<td>引用票/PR/具体提交与脱敏证据，不复制全聊天或个人路径</td>\n</tr>\n<tr>\n<td>另一人复核</td>\n<td><a href=\"#skills/card-code-review\" data-book-route=\"skills/card-code-review\">code-review</a></td>\n<td>给共同基线和审查提交；未存档改动必须另查，空差异不代表通过</td>\n</tr>\n<tr>\n<td>已发生 Git 合并冲突</td>\n<td><a href=\"#skills/card-resolving-merge-conflicts\" data-book-route=\"skills/card-resolving-merge-conflicts\">resolving-merge-conflicts</a></td>\n<td>已有冲突与授权范围；业务选择由相关负责人确认，不能盲选一边</td>\n</tr>\n<tr>\n<td>合起来行为不对</td>\n<td><a href=\"#skills/card-diagnosing-bugs\" data-book-route=\"skills/card-diagnosing-bugs\">diagnosing-bugs</a></td>\n<td>明确合并后的具体版本、复现方法、两边预期；诊断与修复授权分开</td>\n</tr>\n<tr>\n<td>隔离和交验</td>\n<td><a href=\"#skills/support-worktrees\" data-book-route=\"skills/support-worktrees\">using-git-worktrees</a> / <a href=\"#skills/support-webapp-testing\" data-book-route=\"skills/support-webapp-testing\">webapp-testing</a> / <a href=\"#skills/support-verification\" data-book-route=\"skills/support-verification\">verification-before-completion</a></td>\n<td>分别在确需额外目录、网页实测、声称完成前使用；不另启动第二套管理流程</td>\n</tr>\n</tbody></table>\n<p>Karpathy 的“只改必要部分、先说假设、拿证据”在多人协作里更重要，但已有规则就落实，不为每个人重复加一轮流程。你不会读代码时，复核者应解释具体影响与验证缺口；权限、真实数据和原生自动化等高风险部分，必要时请有相关经验的工程师独立复核，不能只靠两位新手接受 AI 给出的通过结论。</p>\n\n</section>\n<section id=\"team-trouble\">\n<h2>协作卡住时，先识别是哪种问题</h2>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>现象</th>\n<th>安全的下一步</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Git 提示冲突</td>\n<td>暂停合并，保留双方改动；读取差异和意图，再按获准范围解决、验证。不要整份覆盖或强推“以我为准”</td>\n</tr>\n<tr>\n<td>没有冲突，但程序坏了</td>\n<td>查字段、接口、权限或环境是否理解不同；对组合版本复现。文本合并成功不证明逻辑相容</td>\n</tr>\n<tr>\n<td>同事想做另一套设计</td>\n<td>回到批准基线；有新证据就提变更，由产品负责人决定，不在施工分支偷偷改方向</td>\n</tr>\n<tr>\n<td>同事离开或任务停滞</td>\n<td>先交已授权共享的差异与未存档情况，明确换负责人；不能指望接手者读到上一人的本地未提交文件</td>\n</tr>\n<tr>\n<td>测试失败，不知道谁改坏</td>\n<td>绑定提交和环境，比较最后可用版本，再做最小复现；不要轮流凭猜测修改或频繁重装依赖</td>\n</tr>\n<tr>\n<td>凭证误上传</td>\n<td>立即通知负责人，按紧急授权吊销/轮换，再协调历史与副本清理；只删当前文件或加 .gitignore 不足以消除泄露</td>\n</tr>\n</tbody></table></div>\n<p class=\"source\"><a href=\"https://docs.github.com/en/pull-requests/reference/merge-conflicts\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">GitHub：合并冲突</a>；<a href=\"https://git-scm.com/docs/gitignore\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Git：ignore 不影响已跟踪文件</a>；<a href=\"https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/removing-sensitive-data-from-a-repository\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">GitHub：敏感数据处置</a>。处理前核对授权，不把教程当作实际操作许可。</p>\n<details><summary>怎样防止别人直接把不合格改动合进去？</summary>\n<p>在平台与套餐支持时，配置默认分支须经 PR、需要他人审查、指定检查通过；核对管理员/角色绕过权，以及新提交后旧批准是否失效。规则必须实际配置、验证，写进手册不会自动生效。</p>\n<p>GitHub 私有仓库的分支保护取决于仓库归属和适用套餐，不能推定免费组织仓库因为某成员买了个人 Pro 就有同样能力。平台不支持强制检查时，先由人工把关并说明缺少哪些保护，<strong>不能为了获得免费保护把客户项目改公开</strong>。通过状态还可能包含跳过项，要看实际运行记录。</p>\n<p class=\"source\"><a href=\"https://docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/about-protected-branches\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">GitHub：分支保护、套餐范围与绕过/检查规则</a>。本册没有检查你当前套餐或改变远端设置。</p>\n</details>\n</section>\n<section id=\"team-prompts\">\n<h2>复制给你或同事的 AI</h2>\n<p>方括号填真实信息。这里是对话用的开工/复核说法，不是脚本；实际调用仍按<a href=\"#skills/invoke-and-check\" data-book-route=\"skills/invoke-and-check\">技能调用核对</a>执行，入口不可用要说明，不能假装已调用。</p>\n<details open><summary>第一次加入：先只读检查环境与缺口</summary>\n<div class=\"prompt\"><pre>我要以同事身份参与【项目】，现在只做入场检查，不施工。\n仓库/当前基线：【位置与提交】；本地拟用目录：【我电脑的目录】；我的职责：【范围】。\n请先读项目现有入场说明、规则、当前票据入口和允许使用的样例数据说明。\n报告：实际目录与已有文件、所需工具版本、项目启动/验证入口、这类任务需要的Skill及本机是否可用。\n说明哪些可共享、哪些含秘密或客户资料不能上传。\n先列缺口和建议，不安装、不覆盖、不复制他人账号配置，不连接生产数据，不创建远端或修改权限。\n等确认入场操作范围后，再逐项配置和验证；不要把检查完成说成环境已配置好。</pre></div>\n</details>\n<details><summary>接一张批准的票：范围与证据一起带上</summary>\n<div class=\"prompt\"><pre>本提示仅用于施工票会话；若当前是主控，只准备开工包，不施工。\n我是【姓名】，负责已批准票【仓库内路径或链接】。请使用 Matt implement。\n必要输入：【Spec及适用术语/ADR；涉及相关界面或交互时的原型基线，不适用则说明】；共同基线：【提交编号及所在仓库】。\n前置成果：【真实版本与位置；无依赖则说明】；接续方式与执行者：【已批准方式、负责人及批准记录】。\n派工前核对已有材料与依赖就绪情况，不检查尚未创建的目录；新任务执行前确认前置成果已进入实际工作目录。\n本机真实根目录：【开工实测路径】；分支/隔离目录：【开工实测值】；已有未存档改动：【清单】。\n允许改动：【范围】；不得改动：【共享接口/其他同事范围】；依赖与协调人：【说明】。\n验收和验证环境：【原票条目/Windows目标环境/命令与操作】。\n先核对并指出矛盾，保留已有改动；缺少前置成果时按已授权方式接续，有新的合并、覆盖等权限缺口则暂停受影响实施并报告。超出范围或共享约定变化，先回主控请求人类负责人确认。\n交付时给实际差异、命令/操作结果、模拟与未验证部分，并按六项回报格式整理。\n不得自行提交、推送、创建PR、关票、合并或部署；这些操作分别等明确授权。</pre></div>\n</details>\n<details><summary>复核同事成果：查看实际改动和验证证据</summary>\n<div class=\"prompt\"><pre>请在独立复核任务使用 Matt code-review，只读检查【票/PR】。\n审查基线：【提交A】；待审版本：【提交B】；未存档改动：【无/另附说明】。\n读取实际差异和原票/Spec；分别核对需求与项目标准，并检查共享接口、数据与Windows目标能力的影响。\n逐条区分：代码里可以确认、已有证据确实证明、仍需真实运行、仍需人工决定。\n证据要对应本次版本；链接打不开就报告缺口，不能默认已读。\n这里只授权只读复核，不运行未知代码或写入测试；如需执行，先说明隔离环境与风险再请求授权。\n不修改、不合并、不部署；给具体问题和建议，待负责人决定下一步。</pre></div>\n</details>\n<details><summary>向主控汇报：提供简短摘要和原始记录入口</summary>\n<div class=\"prompt\"><pre>请使用 Matt handoff，按以下六项向主控整理【票】的跨人员交接。\n1. 票号、负责人、准确状态。\n2. 仓库/分支/提交编号；未存档与未推送内容单列。\n3. 做了什么/没做什么，引用实际差异和原票。\n4. 验证环境、时间、命令或操作及结果，提供脱敏证据位置。\n5. 演示/安装包的版本、取得方式和已知限制。\n6. 风险、回退与待拍板问题。\n不复制整段聊天，不写秘密，不把只在本机能读的路径当共享入口。\n优先在原票/PR留记录和引用，跨人员确需独立文件才生成一份；不再维护第二套项目状态。\n说清主控已经读取了什么、只是待他读取的又是什么。</pre></div>\n</details>\n</section>\n<section id=\"first-pilot\">\n<h2>你们的第一次协作，做到这些就够了</h2>\n<p>建议选<strong>不改真实数据、不动登录权限的低风险票</strong>试点，例如资料列表的空结果提示。若连环境基线都没在第二台电脑跑通，就先只做共同验收，不急着分代码任务。</p>\n<ol>\n<li>你给同事看真实使用场景和已批准页面，请他复述想完成什么。</li>\n<li>同事在自己的电脑复现安全样例，记录相同基线。</li>\n<li>批准一张范围明确的票，按本册路线交接、复核、合并和回归；暂不自动部署。</li>\n<li>回顾这次哪里等人、哪里因信息缺失返工；只补暴露出来的一条规则。</li>\n</ol>\n<aside class=\"note\"><p><strong>成功标准：</strong>另一台电脑能复现；两人的改动没有互相覆盖；你说得清每项决定由谁批准；主控能从票与版本证据判断进度；没有秘密误上传。</p>\n<p>跑通几次再讨论并行、CI 和更复杂权限。协作效率来自减少等待与返工，不承诺“多一个人就快一倍”。</p></aside>\n<p class=\"source\">本册以 Git/GitHub 一手文档、已核对的 Matt 方法和本手册既有规则整理。首轮试点、角色与批准顺序属于本地教学建议，不冒称 Matt 视频原样规定；核对日期 2026-09-06。</p>\n</section>\n<nav class=\"book-end\" aria-label=\"前后章节\"><a href=\"#glossary\" data-book-route=\"glossary\"><span>上一册</span>← 行话使用指南</a><a class=\"next\" href=\"#index\" data-book-route=\"index\"><span>回到入口</span>选择这次的路线 →</a></nav></article><aside class=\"toc\" aria-label=\"本页目录\"><p>这一页</p><a href=\"#team/team-start\" data-book-route=\"team/team-start\">先和一位同事试着合作，再考虑多人同时开发</a><a href=\"#team/team-roles\" data-book-route=\"team/team-roles\">四种职责，可以由两个人兼任</a><a href=\"#team/team-shared\" data-book-route=\"team/team-shared\">共享项目约定，不共享同一个施工文件夹</a><a href=\"#team/team-onboarding\" data-book-route=\"team/team-onboarding\">同事第一次加入，完成这六件事</a><a href=\"#team/team-flow\" data-book-route=\"team/team-flow\">同事完成一张票后，怎样合入项目</a><a href=\"#team/team-feedback\" data-book-route=\"team/team-feedback\">主控 AI 如何知道同事电脑上发生了什么？</a><a href=\"#team/team-boundaries\" data-book-route=\"team/team-boundaries\">文件没有冲突，还要检查接口、数据和目标电脑是否兼容</a><a href=\"#team/team-skills\" data-book-route=\"team/team-skills\">仍用 Matt 主链，只增加协作信息</a><a href=\"#team/team-trouble\" data-book-route=\"team/team-trouble\">协作卡住时，先识别是哪种问题</a><a href=\"#team/team-prompts\" data-book-route=\"team/team-prompts\">复制给你或同事的 AI</a><a href=\"#team/first-pilot\" data-book-route=\"team/first-pilot\">你们的第一次协作，做到这些就够了</a></aside></div></main></div><div class=\"notice-live\" role=\"status\" aria-live=\"polite\"></div><script>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}));}\nwindow.addEventListener('hashchange',openHash);openHash();\nconst sections=[...document.querySelectorAll('article>section')],tocLinks=[...document.querySelectorAll('.toc a')];\nif('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const id=visible[0].target.id;tocLinks.forEach(a=>a.classList.toggle('current',a.hash==='#'+id));},{rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>observer.observe(s));}\n})();\n<\/script><script>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n<\/script>\n</body></html>"},{"id":"resources","nav":"前端设计资源","html":"<!doctype html><html lang=\"zh-CN\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<meta name=\"description\" content=\"面向建筑师 AI 开发流程的前端设计案例、视觉素材、动效与组件资源导航。\">\n<title>前端设计案例与素材导航｜建筑师的 AI 开发手册</title>\n<style>\n:root{\n  --paper:#f3efe6;--paper-2:#ebe4d7;--card:#fcfaf5;--ink:#29251f;--ink-2:#5f584e;\n  --muted:#8a8174;--clay:#c56545;--clay-dark:#8c3f29;--clay-soft:#f1ddd3;\n  --line:#ded5c5;--green:#4d7355;--green-soft:#e4ede4;--shadow:0 18px 55px rgba(62,48,33,.08);\n}\n*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:\"Segoe UI\",\"Microsoft YaHei\",\"PingFang SC\",sans-serif;line-height:1.72}\na{color:inherit}.shell{width:min(1120px,calc(100% - 40px));margin:auto}.book-nav{position:sticky;top:0;z-index:20;background:rgba(243,239,230,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(140,63,41,.14)}\n.book-nav .shell{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:66px}.brand{font-family:Georgia,\"Microsoft YaHei\",serif;font-weight:700;letter-spaci route-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:var(--line);gap:1px}.route{border:0;background:var(--card);padding:20px;text-align:left;color:var(--ink);cursor:pointer;min-height:150px;font:inherit}.route:hover,.route:focus-visible{background:var(--clay-soft);outline:0}.route code{font:12px Consolas,monospace;color:var(--clay)}.route b{display:block;margin:12px 0 7px;font-family:Georgia,\"Microsoft YaHei\",serif;font-size:18px}.route span{font-size:13px;color:var(--ink-2)}\n.toolbar{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;margin-bottom:18px}.search-wrap label{display:block;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em;margin-bottom:7px}.search-wrap input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:12px 14px;font:inherit}.search-wrap input:focus{outline:2px solid var(--clay);outline-offset:2px}.count{font-size:13px;color:var(--muted);padding-bottom:10px}.count strong{color:var(--clay-dark)}\n.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.filter{border:1px solid var(--line);background:transparent;color:var(--ink-2);border-radius:999px;padding:8px 12px;cursor:pointer;font:13px inherit}.filter:hover,.filter:focus-visible,.filter.active{background:var(--ink);border-color:var(--ink);color:#fff;outline:0}\n.catalog{border-top:2px solid var(--ink)}.category{display:grid;grid-template-columns:190px 1fr;border-bottom:1px solid var(--line)}.category[hidden]{display:none}.category-label{padding:24px 22px 24px 0;position:sticky;top:68px;align-self:start}.category-label code{display:block;color:var(--clay);font:12px Consolas,monospace}.category-label h3{margin:8px 0 6px}.category-label p{font-size:12px;color:var(--muted);margin:0}.resource-list{border-left:1px solid var(--line)}\n.resource{display:grid;grid-template-columns:52px minmax(0,1.3fr) minmax(170px,.7fr) 46px;gap:18px;align-items:center;padding:21px 20px;border-bottom:1px solid var(--line);background:rgba(252,250,245,.52)}.resource:last-child{border-bottom:0}.resource[hidden]{display:none}.resource-num{font:12px Consolas,monospace;color:var(--clay)}.resource-main h3{font-size:18px}.resource-main p{font-size:13px;color:var(--ink-2);margin:6px 0 0}.meta{display:flex;flex-wrap:wrap;gap:6px}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;background:var(--paper-2);color:var(--ink-2);font-size:11px}.pill.license{background:var(--green-soft);color:var(--green)}.go{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line);border-radius:50%;text-decoration:none;font-size:18px}.go:hover,.go:focus-visible{background:var(--clay);border-color:var(--clay);color:#fff;outline:0;transform:translate(2px,-2px)}\n.empty{display:none;padding:36px;text-align:center;color:var(--muted);border-bottom:1px solid var(--line)}.empty.show{display:block}\n.bookmark-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.bookmark{background:var(--card);border:1px solid var(--line);padding:18px;text-decoration:none}.bookmark:hover,.bookmark:focus-visible{border-color:var(--clay);outline:0}.bookmark code{font:11px Consolas,monospace;color:var(--clay)}.bookmark b{display:block;margin:8px 0 4px}.bookmark span{font-size:12px;color:var(--muted)}\n.rules{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.rule-card{background:var(--card);border:1px solid var(--line);padding:24px}.rule-card.warning{background:var(--clay-soft);border-color:#d9ae9d}.rule-card ul{margin:14px 0 0;padding-left:20px}.rule-card li{margin:8px 0;color:var(--ink-2);font-size:14px}.rule-card p{color:var(--ink-2);font-size:14px}.stamp{display:inline-block;margin-top:14px;border:1px solid var(--clay);color:var(--clay-dark);padding:6px 9px;font:11px Consolas,monospace;letter-spacing:.06em}\n.pager{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}.pager a{text-decoration:none;padding:28px 0}.pager a:last-child{text-align:right}.pager small{display:block;color:var(--muted)}.pager strong{color:var(--clay-dark)}footer{padding:26px 0 50px;color:var(--muted);font-size:12px}\n@media(max-width:900px){.hero-grid,.rules{grid-template-columns:1fr}.route-grid,.bookmark-grid{grid-template-columns:repeat(2,1fr)}.category{grid-template-columns:150px 1fr}.resource{grid-template-columns:42px 1fr 44px}.meta{grid-column:2}.go{grid-column:3;grid-row:1 / span 2}}\n@media(max-width:620px){.shell{width:min(100% - 26px,1120px)}.brand{display:none}.book-nav .shell{justify-content:center}.tabs a{padding:7px 9px}.hero{padding-top:40px}h1{font-size:39px}.route-grid,.bookmark-grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.category{display:block}.category-label{position:static;padding:22px 0 12px}.resource-list{border-left:0;border-top:1px solid var(--line)}.resource{grid-template-columns:34px 1fr 40px;gap:12px;padding:18px 10px}.pager{grid-template-columns:1fr}.pager a:last-child{text-align:left;border-top:1px solid var(--line)}}\n@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.go{transition:none}}\n</style>\n<style>.hero{padding-top:36px}.category-label{top:20px}@media(max-width:620px){.section-head{grid-template-columns:1fr;gap:12px}}</style></head>\n<body>\n\n\n<main class=\"shell\">\n  <header class=\"hero\">\n    <div class=\"hero-grid\">\n      <div>\n        <div class=\"eyebrow\">第二阶段 · 外部资源库</div>\n        <h1>先找对参考，<br>再开始画页面</h1>\n        <p class=\"lead\">这不是第四套开发流程，而是概念设计阶段的“材料样本室”：用案例确定方向，用真实产品核对流线，用素材与组件快速搭出可评审原型。</p>\n        <p class=\"hero-note\"><strong>最小使用法：</strong>2 个案例库 + 1 个真实流程库 + 1 套组件基线 + 1 个动效引擎，足够开始概念方案。</p>\n      </div>\n      <aside class=\"index-board\" aria-label=\"资源选用顺序\">\n        <div class=\"index-row\"><code>01</code><b>CASE / 案例</b><span>找气质</span></div>\n        <div class=\"index-row\"><code>02</code><b>FLOW / 流线</b><span>找结构</span></div>\n        <div class=\"index-row\"><code>03</code><b>ASSET / 素材</b><span>搭画面</span></div>\n        <div class=\"index-row\"><code>04</code><b>MOTION / 动效</b><span>定手感</span></div>\n        <div class=\"index-row\"><code>05</code><b>BUILD / 组件</b><span>可实施</span></div>\n      </aside>\n    </div>\n  </header>\n\n  <section id=\"routes\">\n    <div class=\"section-head\"><div class=\"section-index\">快速选路</div><div><h2>我现在需要解决什么？</h2><p>不要从 18 个网站逐个浏览。先选择当前设计问题，页面会替你筛出对应资源。</p></div></div>\n    <div class=\"route-grid\">\n      <button class=\"route\" type=\"button\" data-route=\"case\"><code>ROUTE A</code><b>还不知道长什么样</b><span>先看行业外案例、页面气质与成熟构图。</span></button>\n      <button class=\"route\" type=\"button\" data-route=\"flow\"><code>ROUTE B</code><b>功能很多，不会排</b><span>研究真实产品屏幕、任务路径和落地页结构。</span></button>\n      <button class=\"route\" type=\"button\" data-route=\"asset\"><code>ROUTE C</code><b>页面缺少视觉素材</b><span>找摄影、插图、图标和可控动画资产。</span></button>\n      <button class=\"route\" type=\"button\" data-route=\"motion\"><code>ROUTE D</code><b>原型缺少动效手感</b><span>先借鉴动效模式，再选择一种实现体系。</span></button>\n    </div>\n  </section>\n\n  <section id=\"catalogue\">\n    <div class=\"section-head\"><div class=\"section-index\">资源目录 · 18</div><div><h2>按用途选材，不按热度堆网站</h2><p>资源已按 2026-08-14 可用入口核验。价格、授权和维护状态会变化，正式采用前仍需查看各站最新条款。</p></div></div>\n    <div class=\"toolbar\">\n      <div class=\"search-wrap\"><label for=\"resource-search\">搜索名称、用途或标签</label><input id=\"resource-search\" type=\"search\" placeholder=\"例如：落地页、流程、图标、React、滚动动效\"></div>\n      <div class=\"count\" aria-live=\"polite\">显示 <strong id=\"visible-count\">18</strong> / 18</div>\n    </div>\n    <div class=\"filters\" aria-label=\"资源类别筛选\">\n      <button class=\"filter active\" type=\"button\" data-filter=\"all\">全部 18</button>\n      <button class=\"filter\" type=\"button\" data-filter=\"case\">案例与方向</button>\n      <button class=\"filter\" type=\"button\" data-filter=\"flow\">结构与流线</button>\n      <button class=\"filter\" type=\"button\" data-filter=\"asset\">视觉素材</button>\n      <button class=\"filter\" type=\"button\" data-filter=\"motion\">动效参考</button>\n      <button class=\"filter\" type=\"button\" data-filter=\"build\">组件与实施</button>\n    </div>\n\n    <div class=\"catalog\" id=\"resource-catalog\">\n      <section class=\"category\" data-category-section=\"\">\n        <div class=\"category-label\"><code>A / 01—07</code><h3>案例与页面结构</h3><p>先借鉴解题方式，不复制成品。</p></div>\n        <div class=\"resource-list\">\n          <article class=\"resource\" data-categories=\"case motion\" data-search=\"MotionSites AI 动效 网站 提示词 灵感 原型\"><span class=\"resource-num\">01</span><div class=\"resource-main\"><h3>MotionSites AI</h3><p>高动效网站案例与提示词，适合确定“页面如何动”的概念方向。</p></div><div class=\"meta\"><span class=\"pill\">动效案例</span><span class=\"pill\">付费为主</span></div><a class=\"go\" href=\"https://motionsites.ai/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 MotionSites AI\" title=\"外部来源，需联网\" data-external=\"true\">↗</a></article>\n          <article class=\"resource\" data-categories=\"case asset\" data-search=\"Craftwork Curated curated.design 网站 视觉 情绪板\"><span class=\"resource-num\">02</span><div class=\"resource-main\"><h3>Craftwork Curated</h3><p>原 curated.design 已转入 Craftwork；适合收集风格、配色与构图情绪板。</p></div><div class=\"meta\"><span class=\"pill\">视觉案例</span><span class=\"pill\">免费浏览</span></div><a class=\"go\" href=\"https://craftwork.design/curated/websites\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 Craftwork Curated\" title=\"外部来源，需联网\" data-external=\"true\">↗</a></article>\n          <article class=\"resource\" data-categories=\"case flow\" data-search=\"Landing.Gallery 落地页 结构 技术栈 页面\"><span class=\"resource-num\">03</span><div class=\"resource-main\"><h3>Landing.Gallery</h3><p>聚焦真实落地页，可按版块与技术筛选，适合拆解首屏到转化的结构。</p></div><div class=\"meta\"><span class=\"pill\">落地页结构</span><span class=\"pill\">免费浏览</span></div><a class=\"go\" href=\"https://www.landing.gallery/\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"打开 Landing.G  function render(){
  let route;try{route=decodeURIComponent(location.hash.slice(1)).split('/');}catch{route=['index'];}
  const id=pages.has(route[0])?route[0]:'index';anchor=route.slice(1).join('/');
  tabs.forEach(tab=>{const selected=tab.dataset.page===id;tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1;});
  panel.setAttribute('aria-labelledby','tab-'+id);document.title=pages.get(id).nav+' · 建筑师的 AI 开发手册（分享版）';
  if(current===id){frame.contentWindow?.openBookSection?.(anchor);return;}
  current=id;frame.title=pages.get(id).nav;frame.srcdoc=pages.get(id).html;
  document.getElementById('portable-live').textContent='已切换到'+pages.get(id).nav;
 }
 function routeTo(route){if(!pages.has(route.split('/')[0]))return;if(location.hash==='#'+route)render();else location.hash=route;}
 frame.addEventListener('load',()=>frame.contentWindow?.openBookSection?.(anchor));
 tabs.forEach((tab,i)=>{
  tab.addEventListener('click',()=>routeTo(tab.dataset.page));
  tab.addEventListener('keydown',event=>{
   let index;if(event.key==='ArrowRight')index=(i+1)%tabs.length;else if(event.key==='ArrowLeft')index=(i-1+tabs.length)%tabs.length;else if(event.key==='Home')index=0;else if(event.key==='End')index=tabs.length-1;
   if(index!==undefined){event.preventDefault();tabs[index].focus();}
  });
 });
 window.addEventListener('message',event=>{if(event.source===frame.contentWindow&&event.data?.portableBook===true&&typeof event.data.route==='string')routeTo(event.data.route);});
 window.addEventListener('hashchange',render);
 new ResizeObserver(entries=>document.documentElement.style.setProperty('--header-height',entries[0].target.getBoundingClientRect().height+'px')).observe(document.querySelector('.portable-header'));
 render();
})();
</script></body></html>
