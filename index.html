main\" data-book-route=\"index/main\">跳到正文</a><div class=\"layout\"><main class=\"page\" id=\"main\"><header class=\"hero\"><p class=\"eyebrow\">从这里开始</p><h1>先选路线，再开始开发。</h1><p class=\"lead\">根据任务选择流程：大项目按阶段推进，明确的小改动用轻量方式处理。</p></header><div class=\"reading-grid\"><article><section id=\"begin\">\n<h2>先判断任务类型，再选择合适的开发流程</h2>\n<p>复杂目标需要跨会话研究、看原型和作决定？看<a href=\"#wayfinder/start\" data-book-route=\"wayfinder/start\">Wayfinder 使用说明</a>：完整步骤、Windows 设计助手例子和两条视频学习笔记。</p>\n<p>想知道该开哪种会话、怎么给每个会话交代工作？看<a href=\"#agents/agent-start\" data-book-route=\"agents/agent-start\">Agent 执行手册</a>：以 writing-for-agents 为核心，教你写项目规则、分清会话、写开工包。</p>\n<p><strong>准备正式开始一个新项目？</strong>先看<a href=\"#agents/agent-project-start\" data-book-route=\"agents/agent-project-start\">新项目启动与最少建档</a>：Agent 先建根规则、施工日志和资料入口，再继续你已授权的研究或原型工作。不是新增阶段，也不要求先填满所有文档。</p>\n<p>项目资料放哪、施工日志怎么写、新会话怎么接上？看<a href=\"#knowledge/knowledge-start\" data-book-route=\"knowledge/knowledge-start\">项目知识库与上下文维护</a>。碰到具体问题不知道选哪个 Skill？看<a href=\"#skills/case-entry\" data-book-route=\"skills/case-entry\">八个实际问题的案例</a>。</p>\n<p>准备与同事一起开发？看<a href=\"#team/team-start\" data-book-route=\"team/team-start\">团队协作教程</a>：从第一次小交接开始，讲清分工、共享版本、异机验证与合并。</p>\n<p class=\"glossary-entry\">遇到 Spec、ADR、施工票、关口、验收单这些词？打开<a href=\"#glossary/term-lookup\" data-book-route=\"glossary/term-lookup\">行话使用指南</a>：不只翻译，还告诉你在哪一步用、谁来做、对应哪个 Skill、你要检查什么。</p>\n<p>你负责判断“值不值得做、方案是否合适、成果能不能用”；AI 负责查证、提出选择、实现和拿出验证依据。手册不是让你学一整套软件术语，而是让你知道：现在该说什么，接着该看到什么，哪里必须由你拍板。</p>\n<div class=\"route-picker\">\n<a href=\"#research\" data-book-route=\"research\"><span>从零做 / 大改版</span><strong>从场景研究开始</strong><small>问题和使用者还没确定，先别写代码。</small></a>\n<a href=\"#concept\" data-book-route=\"concept\"><span>方向清楚 / 页面未定</span><strong>先做概念原型</strong><small>用模拟数据走通任务，再决定长什么样。</small></a>\n<a href=\"#engineering\" data-book-route=\"engineering\"><span>方案已批 / 要正式做</span><strong>进入施工准备</strong><small>讲清规格、风险和第一张可验收的票。</small></a>\n<a href=\"#index/short-route\" data-book-route=\"index/short-route\"><span>明确小改 / 日常问题</span><strong>走短链或只读路线</strong><small>不为一句文案造一整套文件。</small></a>\n</div>\n<aside class=\"note\"><p><strong>教程解释方法，规则决定执行。</strong>实际工作以 01 全局准则、<a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/02-通用开发规程.md\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">02 通用规程</a>和项目批准范围为准。任何会话开始前先交一行开工报告：走哪条路线、到哪个关口、这轮结束你会看到什么。</p></aside>\n</section>\n<section id=\"four-phases\">\n<h2>四个阶段：页面方案确定后，还需要做好开发准备</h2>\n\n<ol class=\"phase-map\">\n<li><span class=\"phase-no\">01</span><div><a href=\"#research\" data-book-route=\"research\">场景研究</a><p>为什么做、给谁用、第一期解决什么。</p><small>交出：批准的策划任务书</small></div></li>\n<li><span class=\"phase-no\">02</span><div><a href=\"#concept\" data-book-route=\"concept\">概念原型</a><p>功能如何安排、用户如何操作、页面如何呈现。</p><small>成果：经过试用并确认的原型与设计方案</small></div></li>\n<li><span class=\"phase-no\">03</span><div><a href=\"#engineering\" data-book-route=\"engineering\">施工准备</a><p>真实数据、技术、权限、风险和施工次序。</p><small>交出：批准的 Spec、必要决策与施工票</small></div></li>\n<li><span class=\"phase-no\">04</span><div><a href=\"#delivery\" data-book-route=\"delivery\">开发交付</a><p>逐票实现、验证、人工验收，最后整体回归。</p><small>交出：可用成果、证据和当前状态</small></div></li>\n</ol>\n<p>可以把这四步理解为“策划—方案设计—开发准备—实施与验收”。单独设置开发准备阶段，是因为原型确定了页面和操作方式，却未必说明数据如何存储、权限如何管理、功能分几次完成。如果等到写代码时才讨论这些问题，就容易反复修改方案。验收是开发交付中的必要步骤，不必为它再增加一个阶段和一套记录。</p>\n<p>后一阶段发现前一阶段的结论不成立，报告影响，由你决定是否回退；在当前阶段用加功能掩盖不算解决。</p>\n<details><summary>为什么不是原来的三阶段，或者 Matt 的七阶段？</summary>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>结构</th>\n<th>怎样使用</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>三阶段</td>\n<td>适合概括整个过程；但“深化开发”同时包含开发准备和实际实施，新手容易忽略开始写代码前需要确认的事项。</td>\n</tr>\n<tr>\n<td>本册四阶段</td>\n<td>把不同决策与交付物分开；这是面向非程序员小团队的整理，不是 Matt 官方规定。</td>\n</tr>\n<tr>\n<td>五阶段以上</td>\n<td>有多人运营、发布审批时可另列运营/发布；当前不必为阶段数增加表格。</td>\n</tr>\n<tr>\n<td>Matt 七步操作</td>\n<td>盘问、研究、原型、规格、拆票、实现、人工审查；根据尚未解决的问题决定是否需要研究或原型，不要求每个任务都完整执行七步。</td>\n</tr>\n</tbody></table></div>\n</details>\n<p class=\"source\">依据：Matt P08 小任务与规划答疑；<a href=\"https://www.designcouncil.org.uk/resources/framework-for-innovation/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">双钻的探索与收敛</a>；<a href=\"https://basecamp.com/shapeup/4.1-appendix-02\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Shape Up：小团队删减仪式</a>。四阶段名称及关口为本手册适配。</p>\n</section>\n<section id=\"stage-skill-overview\">\n<h2>四阶段与主力 Skill，放在一起看</h2>\n<p>阶段告诉你现在解决什么，Skill 告诉 AI 用哪套方法。先用当前那一个，只有碰到明确缺口才加辅助；不是把一行名字一次全部载入。</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>阶段</th>\n<th>推荐主路</th>\n<th>打开即用</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>场景研究</td>\n<td>grill-with-docs 问清场景 → 有事实缺口才用 research → 你批准策划任务书</td>\n<td><a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">本阶段技能与提示</a></td>\n</tr>\n<tr>\n<td>概念原型</td>\n<td>有结构分歧用 prototype → 你选方向 → 视觉还未达标才用 frontend-design → 实际操作验收</td>\n<td><a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">本阶段技能与提示</a></td>\n</tr>\n<tr>\n<td>施工准备</td>\n<td>to-spec 固定要求 → 你确认规格与技术取舍 → to-tickets 拆票 → 你确认开工次序</td>\n<td><a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">本阶段技能与提示</a></td>\n</tr>\n<tr>\n<td>开发交付</td>\n<td>implement 当前票 → 按约定测试与 code-review → 真实使用检查 → 你人工验收</td>\n<td><a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">本阶段技能与提示</a></td>\n</tr>\n</tbody></table></div>\n<p><strong>Karpathy 不另占一个阶段：</strong>四条原则作为做事底线贯穿全过程，已有全局规则就贯彻，不人为反复贴同样正文；详见<a href=\"#governance/karpathy-role\" data-book-route=\"governance/karpathy-role\">价值与保留建议</a>。</p>\n\n</section>\n<section id=\"short-route\">\n<h2>一个小修改，可以没有 Spec，也可以不拆票</h2>\n<p>关键不是改几行，而是边界是否清楚、是否影响真实数据和多人使用、能否容易撤回。目标、范围和授权已明确时，在普通执行会话里直接做：AI 简述范围和验收方式，实现，定向验证，交付改动、证据和待你查看的入口，并在施工日志记一行。主控下次开工读日志就知道了，不必经它派票。只有真实缺项、冲突或新授权需求才询问，不强制再盘问或生成计划文件。</p>\n<div class=\"example\"><h3>适合短链</h3>\n<p>现有搜索页按钮文案改名、修正已明确的间距，或已定位且可安全验证的局部展示问题。先引用现有设计基线，再给前后对比和定向检查。</p>\n<h3>要升级</h3>\n<p>“只加一个删除按钮”可能永久删资料；“只加一个管理员”可能改变权限。这类任务不能因为界面小就省略故障和回滚验证。出现重要方案争议、正式功能或施工票时，转入对应路线；仅换会话不自动升级，按现有记录接续即可。</p></div>\n<div class=\"prompt\"><pre>这次先按小任务分流评估：我要【具体修改】，沿用【现有页面/规则】。\n先用几句话复述目标、只改哪里、不改哪里、我怎样确认它做好了。\n检查权限、真实数据、生产和难撤销操作；有风险就说明，不能硬走短链。\n若边界清楚、低风险且本次已授权，直接实现并做定向验证；仅真实缺项、冲突或新授权需求才询问。不额外生成 Spec、施工票或计划文件。\n完成给入口、前后变化、实际验证结果和未验证项，在施工日志记一行；不要自行提交或部署。</pre></div>\n<p><strong>只是问答或诊断：</strong>先查证并解释，不因此开始修代码。<strong>只是探索：</strong>用最小可抛弃样例证明或否定假设，被采用后再按正式要求建设。</p>\n</section>\n<section id=\"who-decides\">\n<h2>主控像项目经理，每种会话像一个班组</h2>\n<p>本手册采用的分工方式是：一个主控负责决策和派工，具体的活各自在专门的窗口里干，详细日志和调试过程留在那里。这样主控要读的东西少，但不能自动保证质量：每个窗口必须收到完整的开工包，做完交回证据，而不只是一句“做好了”。</p>\n<p>常用的窗口有五种。<strong>主控</strong>每个项目同一时间一个，窗口按关口换，票序批准后只写记录不写产品。<strong>建图</strong>会话管决策记录：项目前期和你一起定并记台账，每轮出一页决策简报；施工期只读记录出简报。<strong>施工票</strong>会话一票一个，做完交验收单。<strong>审查</strong>会话一票一个，只读，交问题清单。<strong>回归交付</strong>会话一个功能一次，走通跨票的真实路径。小改动开普通执行会话，问答随便哪里。</p>\n<p>AI 会话不能替你打开另一个窗口。主控每次派工，回复末尾会写“请新开会话，贴入以下开工包”，你新建聊天贴进去就行。一次只开一张票，上一票你验收后再派下一票。新会话隔离聊天，worktree 隔离文件，内部子代理做窄任务；它们不能互相替代。每种会话怎么开、怎么交回，见<a href=\"#agents/agent-roles\" data-book-route=\"agents/agent-roles\">Agent 执行手册</a>。</p>\n<div class=\"prompt\"><pre>先交开工报告：本次路线、当前关口、这轮结束我会看到什么。引用现有批准材料，不重复已经拍板的内容。\n我负责价值、方案和最终验收；把需要我决定的真实取舍说清。\n主控写记录不写产品。派工时给我开工包，让我新开会话；完成只回传验收单、未决问题和状态。\n不要把“测试通过”直接等同于我验收，不静默提交、推送、合并或部署。</pre></div>\n\n</section>\n<section id=\"how-to-use\">\n<h2>遇到具体问题时查阅，不必从头记住整本手册</h2>\n<ul>\n<li><strong>不知道下一步：</strong>先选路线，再进入对应阶段，复制提示并替换括号内容。</li>\n<li><strong>知道要做什么，却不确定用哪个 Skill：</strong>打开<a href=\"#skills\" data-book-route=\"skills\">Skill 操作教程</a>，按用途查找，不必记住二十五个名字。</li>\n<li><strong>插件太多：</strong>看<a href=\"#governance\" data-book-route=\"governance\">工具治理</a>，明确谁主导、谁辅助；不替你删除。</li>\n<li><strong>对话越来越长或卡住：</strong>看<a href=\"#context\" data-book-route=\"context\">上下文与日常技巧</a>，先区分容量、服务故障和本地环境。</li>\n<li><strong>质疑依据：</strong>每张<a href=\"#skills/method-cards\" data-book-route=\"skills/method-cards\">方法卡</a>都附作者当前源码的链接。</li>\n</ul>\n<p>数据库等已接近交付的项目不必推倒重来。先核对现有成果与眼下问题，补缺失的设计依据、真实验收和下一期清单；不要给过去没做过的调研补一段“已经验证”的故事。旧规则下运行的项目改按新规程，见 <a href=\"https://github.com/zhoufff/architect-ai-handbook/blob/main/协作规则/02-通用开发规程.md#project-adopt\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">02 已有项目接入</a>。</p>\n\n</section>\n<nav class=\"book-end\" aria-label=\"前后章节\"><span>从需要的页面开始读</span><a class=\"next\" href=\"#research\" data-book-route=\"research\"><span>下一册</span>场景研究 →</a></nav></article><aside class=\"toc\" aria-label=\"本页目录\"><p>这一页</p><a href=\"#index/begin\" data-book-route=\"index/begin\">先判断任务类型，再选择合适的开发流程</a><a href=\"#index/four-phases\" data-book-route=\"index/four-phases\">四个阶段：页面方案确定后，还需要做好开发准备</a><a href=\"#index/stage-skill-overview\" data-book-route=\"index/stage-skill-overview\">四阶段与主力 Skill，放在一起看</a><a href=\"#index/short-route\" data-book-route=\"index/short-route\">一个小修改，可以没有 Spec，也可以不拆票</a><a href=\"#index/who-decides\" data-book-route=\"index/who-decides\">主控像项目经理，每种会话像一个班组</a><a href=\"#index/how-to-use\" data-book-route=\"index/how-to-use\">遇到具体问题时查阅，不必从头记住整本手册</a></aside></div></main></div><div class=\"notice-live\" role=\"status\" aria-live=\"polite\"></div><script>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}));}\nwindow.addEventListener('hashchange',openHash);openHash();\nconst sections=[...document.querySelectorAll('article>section')],tocLinks=[...document.querySelectorAll('.toc a')];\nif('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const id=visible[0].target.id;tocLinks.forEach(a=>a.classList.toggle('current',a.hash==='#'+id));},{rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>observer.observe(s));}\n})();\n<\/script><script>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n<\/script>\n</body></html>"},{"id":"research","nav":"场景研究","html":"<!doctype html><html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"color-scheme\" content=\"light\"><meta name=\"description\" content=\"从同事的一次真实工作出发，形成有证据、边界清楚的策划任务书。\"><title>场景研究 · 建筑师的 AI 开发手册</title><style>@charset \"UTF-8\";\n:root{--bg:#f7f4ed;--paper:#fffdfa;--ink:#2d2823;--muted:#70665c;--accent:#a44c34;--line:#ddd5c9;--sage:#4d6655;--soft:#eee8de;--focus:#85331e}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:32px}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.85 \"Segoe UI\",\"Microsoft YaHei\",\"PingFang SC\",sans-serif}\na{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:4px}a:hover{color:#783221}button,input{font:inherit}button{cursor:pointer}a,button,input,summary{-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:3px}\n.skip{position:fixed;left:20px;top:-100px;z-index:9;background:var(--ink);color:#fff;padding:10px 20px}.skip:focus{top:12px}\n.layout{display:grid;grid-template-columns:246px minmax(0,1fr);max-width:1640px;margin:auto;min-height:100vh}\n.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:38px 23px 25px;overflow-y:auto}\n.brand{display:block;color:var(--ink);text-decoration:none;font-size:18px;font-weight:700;line-height:1.5;margin-bottom:28px}.brand small{display:block;font-weight:400;font-size:11px;letter-spacing:.17em;text-transform:up  0 4px}.term-card dd{margin:0;font-size:15px;overflow-wrap:anywhere}.term-card dd p{margin:0 0 9px}.term-check{padding:15px 18px;background:#eee7db}.term-pitfall{font-size:13px!important;color:var(--muted)}.term-walk li{margin:18px 0}.term-walk strong{color:#79543b}\n@media(max-width:760px){.term-body{padding-left:15px;padding-right:0}.term-name{font-size:16px}.term-plain{font-size:13px}.term-filter label{flex-basis:100%}}\n@media print{body{font-size:11pt;background:#fff}.layout{display:block}.sidebar,.toc,.topline,.copy-btn,.book-end,.notice-live{display:none}.page{padding:0}.reading-grid{display:block}.hero{padding:10px 0 20px}h1{font-size:26pt}h2{font-size:18pt}article>section{break-inside:auto}a{color:#222}.prompt,.example,table{break-inside:avoid}details:not([open]){display:block}footer{margin-top:25px}}\n</style><style>.layout{display:block;max-width:1240px}.page{padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}</style></head><body><a class=\"skip\" href=\"#research/main\" data-book-route=\"research/main\">跳到正文</a><div class=\"layout\"><main class=\"page\" id=\"main\"><header class=\"hero\"><p class=\"eyebrow\">阶段 01 · 为什么做</p><h1>先看清问题，再决定做什么。</h1><p class=\"lead\">从同事的一次真实工作出发，形成有证据、边界清楚的策划任务书。</p></header><div class=\"reading-grid\"><article><section id=\"stage-skill-route\">\n<h2>这个阶段，先用哪个 Skill？</h2>\n<div class=\"stage-start\"><p>通常先用 grill-with-docs，把要解决的场景问清。</p><p class=\"stage-chain\">grill-with-docs 问清场景 → 有事实缺口才用 research → 你批准策划任务书</p></div>\n<p>首次建立或需要修正 AI 的工作约定时，看 <a href=\"#agents/agent-stages\" data-book-route=\"agents/agent-stages\">writing-for-agents 在四阶段的用途</a>；不是本阶段每次都要多跑一道流程。</p>\n<table class=\"stage-skill-table\">\n<thead>\n<tr>\n<th>Skill</th>\n<th>什么时候接手</th>\n<th>解决什么 / 交出什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><a class=\"skill-link\" href=\"#skills/card-grill-with-docs\" data-book-route=\"skills/card-grill-with-docs\">grill-with-docs</a></td>\n<td>项目资料目录已经确定，需求还有分歧时的默认入口。</td>\n<td>产出确认过的使用者、关键场景、范围；它已包含 grilling 和 domain-modeling，不再另盘问一遍。</td>\n</tr>\n</tbody></table>\n<details><summary>只有遇到这些情况，才加用其他 Skill</summary><table class=\"stage-skill-table\">\n<thead>\n<tr>\n<th>Skill</th>\n<th>什么时候接手</th>\n<th>解决什么 / 交出什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><a class=\"skill-link\" href=\"#skills/card-research\" data-book-route=\"skills/card-research\">research</a></td>\n<td>缺少案例、官方事实、技术或行业限制时。</td>\n<td>查阅一手资料，整理有出处的证据和仍待确认的问题；不替同事编造答案。</td>\n</tr>\n<tr>\n<td><a class=\"skill-link\" href=\"#skills/card-wayfinder\" data-book-route=\"skills/card-wayfinder\">wayfinder</a></td>\n<td>目标很大，关键问题互相依赖，预计多会话才能规划清楚时；取代普通盘问入口。</td>\n<td>先建决策地图，再逐项用研究/盘问/原型解开未知。它的决策票不是正式施工票。</td>\n</tr>\n<tr>\n<td><a class=\"skill-link\" href=\"#skills/card-grill-me\" data-book-route=\"skills/card-grill-me\">grill-me</a></td>\n<td>完全独立、暂不依附项目文件的想法讨论。</td>\n<td>轻量盘问；形成正式研究项目后改用有文档入口。</td>\n</tr>\n<tr>\n<td><a class=\"skill-link\" href=\"#skills/card-to-questionnaire\" data-book-route=\"skills/card-to-questionnaire\">to-questionnaire</a></td>\n<td>答案在同事或专家那里，需要对方参与。</td>\n<td>产出针对真实经历的访谈问题；等待真人回答。</td>\n</tr>\n</tbody></table></details>\n<p class=\"note\">已有批准任务书就读它，不重跑盘问。只查一个明确事实可直接 research。Wayfinder 内部已有盘问，不先跑完 grill-with-docs 再重复建一张地图。本阶段的策划任务书是人工可读成果，不借 to-spec 提前生成技术规格。</p>\n<div class=\"prompt stage-entry\"><pre>这次进入“场景研究”，现有资料在【目录】，目标是【想法或具体受阻场景】。\n若这是已明确启动的新项目，且目录、当次范围与写入授权已明确，先按通用规程完成最少建档，再继续本轮研究；已有项目复用入口，不重复初始化。\n默认请实际使用 Matt 的 grill-with-docs；先读已有材料，只问影响第一期的未知，不重复已批准结论。\n若目标跨多会话且决策依赖很多，请先说明理由，由我选择用 wayfinder 替代普通盘问入口。\n需要外部事实时才用 research；需要同事回答时用 to-questionnaire，不能自己编回答。\n把事实、判断、假设分开，最后整理策划任务书让我批准；本阶段不生成施工 Spec 或写产品代码。</pre></div>\n<p class=\"source\">技能名可点击查看用法。以上是结合 Matt 技能与辅助技能整理的本手册分工，不是自动触发配置。<a href=\"#governance/karpathy-role\" data-book-route=\"governance/karpathy-role\">Karpathy 的跨阶段底线</a>；<a href=\"#skills/invoke-and-check\" data-book-route=\"skills/invoke-and-check\">怎样确认真正调用</a>。</p>\n<p class=\"glossary-strip\"><strong>本阶段行话：</strong><a href=\"#glossary/term-prd\" data-book-route=\"glossary/term-prd\">PRD · 产品需求文档</a> · <a href=\"#glossary/term-user-story\" data-book-route=\"glossary/term-user-story\">User story · 用户故事</a> · <a href=\"#glossary/term-mvp\" data-book-route=\"glossary/term-mvp\">MVP · 最小可行产品</a> · <a href=\"#glossary/term-context-file\" data-book-route=\"glossary/term-context-file\">CONTEXT.md · 项目领域词典</a><br><span>点词查：白话、阶段、产物、Skill 和你要问的问题。</span></p>\n<p>想看完整过程？<a href=\"#skills/case-research\" data-book-route=\"skills/case-research\">本阶段的实际问题示例</a>。资料入口与更新责任见<a href=\"#knowledge/knowledge-maintenance\" data-book-route=\"knowledge/knowledge-maintenance\">项目知识库维护</a>。</p>\n\n</section>\n<section id=\"start-from-a-scene\">\n<h2>先了解工作中遇到的实际困难，再讨论做什么产品</h2>\n<aside class=\"note\"><p>新项目不用等需求全想清楚才建档。先按<a href=\"#agents/agent-project-start\" data-book-route=\"agents/agent-project-start\">启动与最少建档</a>保存已知身份、边界和资料入口，再把研究结果放到能找到的位置；只是讨论一个想法时，不额外建立整套项目文件。</p></aside>\n<p>这一阶段像建筑策划：先弄清谁来用、在哪儿用、为什么现有办法不够，再画房间。输入可以很朴素：一段最近的工作经历、现有表格或文件夹、同事的操作过程、你愿意投入的时间。不要先让 AI 列二十个功能，再替它寻找需求。</p>\n<p>例如“做建筑资料库”太宽。可以从“上周准备汇报，找不到那个屋顶节点的原始出处”开始，追问当时找了哪里、怎样确认版本、找不到有什么后果。观察一段实际操作，比问“你想要智能搜索吗”更容易得到有用信息。</p>\n<p class=\"source\">依据：<a href=\"https://www.gov.uk/service-manual/agile-delivery/how-the-discovery-phase-works\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">GOV.UK：先理解用户与约束</a>；<a href=\"https://basecamp.com/shapeup/1.2-chapter-03\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Shape Up：从具体问题设边界</a>。</p>\n</section>\n<section id=\"collect-evidence\">\n<h2>让 AI 帮你整理证据，不替同事编答案</h2>\n<p>选几个确实会使用的人，请他们带着最近一次任务演示旧办法。记录触发原因、操作顺序、卡住位置、补救办法，以及能否找到原文件。录音、截图或上传材料前先取得同意，隐去客户名、账号和项目秘密。AI 可以整理访谈、查官方资料；没有访问到的现场，必须明确说没看见。</p>\n<div class=\"prompt\"><pre>请实际使用 Matt grill-with-docs 梳理本项目场景；有外部事实缺口再用 research。已有共识不重新盘问。\n这次只做场景研究，不画正式页面、不写实现代码。\n对象是【谁】，最近一次受阻经历是【具体事件】。\n已有材料：【脱敏文件、操作记录或访谈】。\n请先还原“触发→现有做法→卡点→后果”，标明每条证据出处和日期。\n把亲眼看到的事实、我的判断、待验证假设分开。\n只问影响第一期范围的未知问题，不替受访者回答；最后提出下一次最省事的核实方法。</pre></div>\n<div class=\"example\"><h3>应得到什么：一份注明信息来源的场景记录</h3>\n<p>以下是假设教学例，不是真实调研结果：“设计师准备节点汇报时，从多个文件夹找案例；现有记录显示文件名无法辨认原始项目。需要核实：这是命名问题，还是缺少来源字段？”证据栏应链接到具体演示记录，而不是写“行业普遍如此”。</p></div>\n<details><summary>怎样避免把一句抱怨变成功能需求？</summary>\n<p>“搜索不好用”还不是结论。可能是资料根本没收录，也可能是词不一致、权限不可见，或搜索结果没有预览。先核对实际失败案例，再决定是补数据、调整流程还是开发功能。记录反例：有人靠现有目录很快找到了，原因是什么？</p>\n</details>\n</section>\n<section id=\"choose-a-first-scope\">\n<h2>第一期先解决一个有价值、能验证效果的问题</h2>\n<p>把收集到的场景放在一起比较：谁经常遇到、后果有多大、现在怎样应付、改善后怎样观察。不要让 AI 凭空打分再宣布“市场验证通过”。由你决定优先服务谁、先解决哪一件事，以及这轮愿意花多少精力；愿意投入的上限不是保证完工的估算。</p>\n<div class=\"example\"><p>建筑资料库第一期可以暂定为“在一批已获授权的样例中，按设计问题查找案例，打开详情并回到原始出处”。先不做自动抓取全网、团队计费或跨库迁移。这个边界是否有价值，仍要带回实际使用者确认，而不是因为功能少就天然正确。</p></div>\n<p>若连关键问题都谈不完，可请 AI 帮你分次查证；只有决策本身跨会话、路线仍不清楚时才考虑 <a href=\"#skills\" data-book-route=\"skills\">Wayfinder 等方法卡</a>。不必为了显得专业先铺满一张大计划表。</p>\n<p class=\"source\">依据：<a href=\"https://basecamp.com/shapeup/1.5-chapter-06\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Shape Up：问题、投入、解法与排除项</a>；<a href=\"https://basecamp.com/shapeup/4.1-appendix-02\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">按团队规模删减仪式</a>。</p>\n</section>\n<section id=\"test-the-dangerous-assumption\">\n<h2>提前验证可能导致方案无法实施的关键假设</h2>\n<p>研究不只是访谈。资料能否合法使用、同事电脑有什么限制、文件格式是否能读取，都可能影响方案。先问“哪条假设如果不成立，这个方案就无法继续？”再做必要的小范围验证，不要等页面设计完成后才发现关键功能无法实现。</p>\n<aside class=\"warning\"><p>如果目标是同事的 Win10 设计助手，并计划以后让 AI 操作电脑，应尽早安排单独的技术小验证：核对目标系统、软件版本、权限、可控范围与紧急停止方式。先用模拟窗口、样例文件或隔离环境回答问题。本阶段不实际接管同事电脑，不输入凭证，不操作真实设计文件；真实控制需要另行授权和高风险验证。</p></aside>\n<p>验证结果可以是“可继续”“要换路线”“先别做”。停止一个证据不足的方向也是成果。一次小测试只能证明测试条件下的结果，不能保证所有同事电脑都能运行。</p>\n<p class=\"source\">依据：<a href=\"https://www.gov.uk/service-manual/agile-delivery/how-the-alpha-phase-works\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">GOV.UK：用低复杂度原型检验危险假设</a>；<a href=\"https://basecamp.com/shapeup/1.4-chapter-05\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Shape Up：提前检查风险与难估依赖</a>。</p>\n</section>\n<section id=\"approve-the-brief\">\n<h2>交给你拍板的是策划任务书，不是一堆研究摘要</h2>\n<p>请 AI 把材料整理成一份简明的任务书，包括目标使用者、关键场景、现有做法、第一期价值、开发范围、本期不做的内容、证据链接，以及尚未验证的假设、风险和验证办法。它说明“为什么做、做到什么程度”，不是后续开发使用的 Spec，也不需要提前决定每个按钮的位置。</p>\n<div class=\"prompt\"><pre>承接已完成的 Matt grill-with-docs 共识与 research 证据，整理项目策划任务书草案。\n此步是汇总已批准结论，不再重复调用盘问，也不提前用 to-spec 生成技术规格。\n用一个真实任务说明第一期价值；附证据出处，保留待验证假设。\n明确第一期做什么、不做什么，以及我怎样观察它是否有帮助。\n列出需要我拍板的取舍，不替我默认批准。\n暂不写技术架构或施工票，批准后交给概念原型阶段。</pre></div>\n<p><strong>通过：</strong>你能用自己的话说明给谁用、解决哪次困难、怎样知道改善了，并接受第一期边界；重要未知已有验证结果或明确处理安排。<strong>退回：</strong>只有功能愿望、证据无法追溯、受访者结论由 AI 编造，或关键限制仍可能推翻整条路线。</p>\n\n</section>\n<section id=\"reuse-and-move-on\">\n<h2>任务书确认后开始设计原型，已有项目不必从头调研</h2>\n<p>把批准版任务书、证据与未决问题交给<a href=\"#concept\" data-book-route=\"concept\">概念原型</a>。后面发现新事实可以回来改，但要说清改了哪个判断、影响什么，而不是悄悄换目标。</p>\n<p>已有页面的明确小改，若使用者、场景和设计基线都清楚，可直接引用现有依据走<a href=\"#delivery\" data-book-route=\"delivery\">短链</a>；新风险仍要识别。已上线或接近完成的项目，先围绕当前真实问题补证据和下一期范围，不推倒代码、不伪造过去的调研。</p>\n<aside class=\"note\"><p>Matt 在答疑中坦言，从零散想法抓核心价值主要靠多年经验，并推荐 Shape Up。因此本页是结合研究方法整理的本手册操作约定，不假称视频已经提供完整的市场研究或专业设计体系。</p></aside>\n<p class=\"source\">原片依据：P08，2782–2915 秒；<a href=\"https://www.designcouncil.org.uk/resources/framework-for-innovation/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Design Council：问题与解法都需要探索、收敛和迭代</a>。</p>\n</section>\n<nav class=\"book-end\" aria-label=\"前后章节\"><a href=\"#index\" data-book-route=\"index\"><span>上一册</span>← 使用入口</a><a class=\"next\" href=\"#concept\" data-book-route=\"concept\"><span>下一册</span>概念原型 →</a></nav></article><aside class=\"toc\" aria-label=\"本页目录\"><p>这一页</p><a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">这个阶段，先用哪个 Skill？</a><a href=\"#research/start-from-a-scene\" data-book-route=\"research/start-from-a-scene\">先了解工作中遇到的实际困难，再讨论做什么产品</a><a href=\"#research/collect-evidence\" data-book-route=\"research/collect-evidence\">让 AI 帮你整理证据，不替同事编答案</a><a href=\"#research/choose-a-first-scope\" data-book-route=\"research/choose-a-first-scope\">第一期先解决一个有价值、能验证效果的问题</a><a href=\"#research/test-the-dangerous-assumption\" data-book-route=\"research/test-the-dangerous-assumption\">提前验证可能导致方案无法实施的关键假设</a><a href=\"#research/approve-the-brief\" data-book-route=\"research/approve-the-brief\">交给你拍板的是策划任务书，不是一堆研究摘要</a><a href=\"#research/reuse-and-move-on\" data-book-route=\"research/reuse-and-move-on\">任务书确认后开始设计原型，已有项目不必从头调研</a></aside></div></main></div><div class=\"notice-live\" role=\"status\" aria-live=\"polite\"></div><script>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}));}\nwindow.addEventListener('hashchange',openHash);openHash();\nconst sections=[...document.querySelectorAll('article>section')],tocLinks=[...document.querySelectorAll('.toc a')];\nif('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const id=visible[0].target.id;tocLinks.forEach(a=>a.classList.toggle('current',a.hash==='#'+id));},{rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>observer.observe(s));}\n})();\n<\/script><script>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n<\/script>\n</body></html>"},{"id":"concept","nav":"概念原型","htm 3px}.term-filter label{flex-basis:100%}}\n@media print{body{font-size:11pt;background:#fff}.layout{display:block}.sidebar,.toc,.topline,.copy-btn,.book-end,.notice-live{display:none}.page{padding:0}.reading-grid{display:block}.hero{padding:10px 0 20px}h1{font-size:26pt}h2{font-size:18pt}article>section{break-inside:auto}a{color:#222}.prompt,.example,table{break-inside:avoid}details:not([open]){display:block}footer{margin-top:25px}}\n</style><style>.layout{display:block;max-width:1240px}.page{padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}</style></head><body><a class=\"skip\" href=\"#concept/main\" data-book-route=\"concept/main\">跳到正文</a><div class=\"layout\"><main class=\"page\" id=\"main\"><header class=\"hero\"><p class=\"eyebrow\">阶段 02 · 怎样用</p><h1>先设计页面和操作流程，再用原型验证。</h1><p class=\"lead\">先安排功能和页面，再细化外观。通过可点击原型确认方案，为后续开发提供依据。</p></header><div class=\"reading-grid\"><article><section id=\"stage-skill-route\">\n<h2>这个阶段，先用哪个 Skill？</h2>\n<div class=\"stage-start\"><p>页面结构和操作方式还没确定时，用 Matt prototype；如果只需要完善视觉设计，用 frontend-design。已有符合要求的方案，就直接沿用。</p><p class=\"stage-chain\">有结构分歧用 prototype → 你选方向 → 视觉还未达标才用 frontend-design → 实际操作验收</p></div>\n<p>首次建立或需要修正 AI 的工作约定时，看 <a href=\"#agents/agent-stages\" data-book-route=\"agents/agent-stages\">writing-for-agents 在四阶段的用途</a>；不是本阶段每次都要多跑一道流程。</p>\n<table class=\"stage-skill-table\">\n<thead>\n<tr>\n<th>Skill</th>\n<th>什么时候接手</th>\n<th>解决什么 / 交出什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><a class=\"skill-link\" href=\"#skills/card-prototype\" data-book-route=\"skills/card-prototype\">prototype</a></td>\n<td>页面排布、任务流程或交互方向不确定时先用。</td>\n<td>交出可点击的探索原型、需要比较的真正差异及结论，也可比较视觉方向；若已达到评审要求，不为用另一个技能再做一稿。</td>\n</tr>\n<tr>\n<td><a class=\"skill-link\" href=\"#skills/support-frontend-design\" data-book-route=\"skills/support-frontend-design\">frontend-design</a></td>\n<td>结构方向明确，但视觉还未满足要求时使用；已有合格视觉就沿用。</td>\n<td>根据任务书设计信息层级、颜色、字体与组件，提供可以查看的方案；不重新改变已确认的产品方向。</td>\n</tr>\n</tbody></table>\n<details><summary>只有遇到这些情况，才加用其他 Skill</summary><table class=\"stage-skill-table\">\n<thead>\n<tr>\n<th>Skill</th>\n<th>什么时候接手</th>\n<th>解决什么 / 交出什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><a class=\"skill-link\" href=\"#skills/card-grill-with-docs\" data-book-route=\"skills/card-grill-with-docs\">grill-with-docs</a></td>\n<td>真正的产品取舍尚未确认。</td>\n<td>只盘问那一个分歧；已批准的场景不重问。</td>\n</tr>\n<tr>\n<td><a class=\"skill-link\" href=\"#skills/card-research\" data-book-route=\"skills/card-research\">research</a></td>\n<td>需要设计案例、平台规范或可行性事实。</td>\n<td>查原始案例/官方来源并说明可借鉴什么，案例不是功能清单。</td>\n</tr>\n<tr>\n<td><a class=\"skill-link\" href=\"#skills/support-emil\" data-book-route=\"skills/support-emil\">emil-design-eng</a></td>\n<td>方向已选定，具体组件、过渡或高频操作手感不够好。</td>\n<td>精修被点名的细节；不推翻布局，不给每个动作加动画。</td>\n</tr>\n<tr>\n<td><a class=\"skill-link\" href=\"#skills/support-webapp-testing\" data-book-route=\"skills/support-webapp-testing\">webapp-testing</a></td>\n<td>原型能打开之后。</td>\n<td>实际点击关键任务，核对返回、取消、空态、错误和模拟边界。</td>\n</tr>\n<tr>\n<td><a class=\"skill-link\" href=\"#skills/support-web-design-guidelines\" data-book-route=\"skills/support-web-design-guidelines\">web-design-guidelines</a></td>\n<td>有实际界面代码，需要做可访问性与界面规范检查。</td>\n<td>找出具体可修改的问题；不能替代真实操作，也不能替你决定审美。</td>\n</tr>\n</tbody></table></details>\n<p class=\"note\">不需要同时使用多套视觉设计技能，也不要求固定做两轮：设计问题尚未确定时用 prototype，需要完善视觉时用 frontend-design，Emil 只处理特定细节。宣传页、作品集等适合 Taste 的场景，可以用它替代 frontend-design，不让两者在同一轮同时主导设计；数据库界面不默认使用 Taste。</p>\n<div class=\"prompt stage-entry\"><pre>这次进入“概念原型”，请读取【批准任务书】和【现有界面/样例】。\n结构或交互有分歧时，实际使用 Matt prototype 验证【关键任务或页面分歧】，用模拟数据和模拟写入，给能点的方案让我选；已有明确结构就不重做。\n只有选中方案的视觉仍未满足要求，才实际使用 frontend-design 定视觉；已有合格视觉直接沿用。仅需精修某个组件或动效时用 emil-design-eng，不一起堆上。\n原型做好用 webapp-testing 实际走关键任务；有界面代码后按需用 web-design-guidelines 做规范审查。\n分开报告结构选择、视觉选择、机器操作证据与仍是假功能的部分，等我确认设计基线；不直接发布原型。</pre></div>\n<p class=\"source\">技能名可点击查看用法。以上是结合 Matt 技能与辅助技能整理的本手册分工，不是自动触发配置。<a href=\"#governance/karpathy-role\" data-book-route=\"governance/karpathy-role\">Karpathy 的跨阶段底线</a>；<a href=\"#skills/invoke-and-check\" data-book-route=\"skills/invoke-and-check\">怎样确认真正调用</a>。</p>\n<p class=\"glossary-strip\"><strong>本阶段行话：</strong><a href=\"#glossary/term-prototype\" data-book-route=\"glossary/term-prototype\">Prototype · 原型</a> · <a href=\"#glossary/term-acceptance\" data-book-route=\"glossary/term-acceptance\">Acceptance criteria · 验收标准</a> · <a href=\"#glossary/term-iteration\" data-book-route=\"glossary/term-iteration\">迭代</a><br><span>点词查：白话、阶段、产物、Skill 和你要问的问题。</span></p>\n<p>想看完整过程？<a href=\"#skills/case-prototype\" data-book-route=\"skills/case-prototype\">本阶段的实际问题示例</a>。资料入口与更新责任见<a href=\"#knowledge/knowledge-maintenance\" data-book-route=\"knowledge/knowledge-maintenance\">项目知识库维护</a>。</p>\n\n</section>\n<section id=\"bring-the-approved-brief\">\n<h2>根据已确认的使用场景，设计页面和操作流程</h2>\n<p>这一阶段类似建筑方案设计：先考虑功能如何安排、使用者如何完成任务，再评价外观。需要参考已批准的策划任务书、关键场景、已有界面、数据样例和已知技术限制；最终提供可亲自操作的概念原型，并说明哪些功能只是模拟。</p>\n<p>以建筑资料库为例，先走“找一个节点案例→判断是否适用→查看出处→回到结果”这条路径。写清每一步在哪里发生、能做什么、下一步去哪里。不要一开场就设计管理后台所有页面，也不要重问上一阶段已经批准的用户与价值。</p>\n<p class=\"source\">依据：<a href=\"https://basecamp.com/shapeup/1.3-chapter-04\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Shape Up：先找位置、动作与连接关系</a>。这是功能关系的起点，不代表草图已经足够交付。</p>\n</section>\n<section id=\"match-the-prototype-to-the-question\">\n<h2>先确定要验证的问题，再决定原型需要做到多细</h2>\n<p>一句文字能讲清的问题，不必做三套界面；文字说不清空间关系时画粗线框；涉及交互手感、筛选流程或错误恢复时，做可点击原型。越像成品，制作和修改成本通常越高，要让每次增加细节都回答一个问题。</p>\n<p>真正有分歧时比较两到三个方向。例如资料库可比较“搜索优先”和“按设计问题浏览优先”；差别应在信息组织与任务路径，不是只换三种颜色。先由你选方向，再深入字体、密度、间距和组件细节。不要让 AI 做完几稿后自行宣布胜者。</p>\n<details><summary>漂亮与好用分别怎样看？</summary>\n<p>先看关键动作是否找得到、重要信息是否排在前面，再看视觉是否一致。示例列表可能需要突出出处与缩略图，而不是把所有字段做成同等大小的卡片。涉及动效时只处理具体目的：帮助理解变化、提示完成或减少等待感；不要为了“高级”让高频操作反复播放动画。</p>\n</details>\n<p class=\"source\">依据：P08，11253–11515 秒的文字→线框→原型→实际应用；<a href=\"https://emilkowal.ski/skill\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Emil 的组件与交互细节方法</a>。这些不是 Matt 完整教授专业视觉设计的证明。</p>\n</section>\n<section id=\"make-a-testable-sample\">\n<h2>用模拟数据制作可操作原型，不影响真实业务</h2>\n<div class=\"prompt\"><pre>请实际使用 Matt prototype，根据批准的任务书制作建筑资料库的概念原型。\n先验证尚未确定的结构与交互；只有选中方案的视觉仍未达标，才使用 frontend-design 定视觉，已有合格设计直接沿用。\n本轮只验证：查找案例→看详情→回到原始出处→返回结果。\n先给关键页面关系；有真实分歧的地方提出2–3个不同方向供我选，不为所有细节强做三稿。\n使用明确标为模拟的数据，不接生产数据库、不上传真实文件、不执行删除或外部发送。\n关键动作要可点击，返回、取消、筛选和反馈要真实响应。\n覆盖正常、空结果、加载、失败、无权限、长文本等必要状态。\n交付可打开的入口、演示路线、假功能清单和待我拍板的问题；先不要写正式产品实现。</pre></div>\n<div class=\"example\"><h3>应看到的成果，不止首页截图</h3>\n<p>打开后能查“木屋架节点”，看到几条标明模拟的结果；进入详情能看适用说明与来源占位；返回仍保留筛选。切换到“没有结果”能清除条件；模拟无权限时说明原因与下一步，不假装点击按钮已获得真实访问。</p></div>\n<p>按钮可以模拟保存或提交，但必须明示“仅演示，未写入”。一个看似真实、其实无法走完任务的静态截图，只能当视觉材料，不能算交互方案已通过。</p>\n</section>\n<section id=\"walk-through-the-unhappy-paths\">\n<h2>按真实任务试用原型，同时检查失败和异常情况</h2>\n<p>评审时先别让 AI 讲解每个按钮。你或未来使用者按场景自己走一遍，边做边说“我以为这里会发生什么”。记录哪里找不到、误解了什么、哪一步要靠作者提示。再看修订是否解决了具体问题，而不是只问“这版好不好看”。</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>要检查的状态</th>\n<th>资料库中的例子</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>正常与长内容</td>\n<td>短标题和很长的项目名都能辨认，详情不会把返回入口挤走。</td>\n</tr>\n<tr>\n<td>空与等待</td>\n<td>没有资料和筛选无结果能分清；加载时知道正在等什么。</td>\n</tr>\n<tr>\n<td>失败与恢复</td>\n<td>来源打不开时仍能返回、重试或复制线索，不只显示“错误”。</td>\n</tr>\n<tr>\n<td>权限与取消</td>\n<td>不可访问有解释；退出操作不会让人误以为已经保存。</td>\n</tr>\n</tbody></table></div>\n<p>状态按任务挑选，不给每个标签都堆一套样例。也要在未来常用窗口大小、缩放和键盘操作下试用；原型在浏览器通过，不等于 Windows 客户端已验证。</p>\n<p class=\"source\">依据：<a href=\"https://www.joshwcomeau.com/career/effective-collaboration/\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">Josh Comeau：设计与实现持续协作，考虑真实数据及交互</a>；<a href=\"https://www.gov.uk/service-manual/agile-delivery/how-the-alpha-phase-works\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">GOV.UK：用原型验证假设</a>。</p>\n</section>\n<section id=\"approve-a-baseline\">\n<h2>确认一版方案作为开发依据，后续仍可按流程调整</h2>\n<p>由你拍板关键页面与任务流、方案方向、信息层级、哪些反馈必须修改、哪些暂缓。请 AI 把获选原型、演示数据、决定理由、未解决问题及不做项放在可追溯的位置；已有项目沿用既定设计，不另造一套无关视觉系统。</p>\n<div class=\"prompt\"><pre>请基于现有获选原型与视觉，以及 webapp-testing 的实际操作证据整理本轮评审；注明 Matt prototype / frontend-design 哪些实际用过，哪些因沿用合格成果而没用，不为凑齐技能补做一稿。\n缺实际操作证据就先使用 webapp-testing 检查，不把截图或技能加载当验证通过。\n记录获选方案、关键任务、已确认状态、仍是假功能的部分；无需重新盘问或另开一条设计流程。\n把我的批准和你的建议分开，列出必须修正与可后置事项。\n保留原型和比较依据的路径，不自行删除未选方案。\n我确认后，将这个版本作为工程准备的设计基线；后续变化须说明原因、影响与需要重新确认的内容。</pre></div>\n<p><strong>通过：</strong>关键任务无需额外解释就能走通；重要正常与异常状态已看过；模拟与真实边界清楚；你明确选择方案，剩余未知不推翻核心路径。<strong>退回：</strong>只好看不能操作、靠讲解才会用、关键错误或权限状态缺失，或技术限制可能令整个交互失效。</p>\n<aside class=\"note\"><p>确认设计基线的意思是“施工从这一版开始，不擅自重设计”。新证据可以触发受控修改：说明变更原因、影响的页面与验收，再由你确认。发现核心场景不成立，要回到<a href=\"#research\" data-book-route=\"research\">场景研究</a>，不是靠加按钮掩盖。</p></aside>\n</section>\n<section id=\"hand-off-without-overbuilding\">\n<h2>原型确认后进入开发准备，不能直接当成正式产品发布</h2>\n<p>把任务书、获选原型、评审记录、模拟数据说明和技术未知交给<a href=\"#engineering\" data-book-route=\"engineering\">施工准备</a>。正式开发仍要设计真实数据、权限、测试和部署；原型代码是否可复用需重新评估，不能因为能打开就原样发布。</p>\n<aside class=\"warning\"><p>同事 Win10 设计助手若未来涉及 computer use，界面原型只能模拟“准备操作→确认→执行状态→停止”。系统与软件兼容、失败停止、权限隔离需要尽早做独立技术小验证；未经批准不控制真实电脑，不把模拟成功说成真实操作安全。</p></aside>\n<p>已有基线的文案调整或明确局部样式，可直接在原页面定向预览，不强制两三稿或重做全站。旧项目只补这次变更涉及的流程和状态，保留能用的代码与已批准设计；小任务可走<a href=\"#delivery\" data-book-route=\"delivery\">短链</a>，但不能跳过实际查看与风险判断。</p>\n</section>\n<nav class=\"book-end\" aria-label=\"前后章节\"><a href=\"#research\" data-book-route=\"research\"><span>上一册</span>← 场景研究</a><a class=\"next\" href=\"#engineering\" data-book-route=\"engineering\"><span>下一册</span>施工准备 →</a></nav></article><aside class=\"toc\" aria-label=\"本页目录\"><p>这一页</p><a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">这个阶段，先用哪个 Skill？</a><a href=\"#concept/bring-the-approved-brief\" data-book-route=\"concept/bring-the-approved-brief\">根据已确认的使用场景，设计页面和操作流程</a><a href=\"#concept/match-the-prototype-to-the-question\" data-book-route=\"concept/match-the-prototype-to-the-question\">先确定要验证的问题，再决定原型需要做到多细</a><a href=\"#concept/make-a-testable-sample\" data-book-route=\"concept/make-a-testable-sample\">用模拟数据制作可操作原型，不影响真实业务</a><a href=\"#concept/walk-through-the-unhappy-paths\" data-book-route=\"concept/walk-through-the-unhappy-paths\">按真实任务试用原型，同时检查失败和异常情况</a><a href=\"#concept/approve-a-baseline\" data-book-route=\"concept/approve-a-baseline\">确认一版方案作为开发依据，后续仍可按流程调整</a><a href=\"#concept/hand-off-without-overbuilding\" data-book-route=\"concept/hand-off-without-overbuilding\">原型确认后进入开发准备，不能直接当成正式产品发布</a></aside></div></main></div><div class=\"notice-live\" role=\"status\" aria-live=\"polite\"></div><script>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el. e,.copy-btn,.book-end,.notice-live{display:none}.page{padding:0}.reading-grid{display:block}.hero{padding:10px 0 20px}h1{font-size:26pt}h2{font-size:18pt}article>section{break-inside:auto}a{color:#222}.prompt,.example,table{break-inside:avoid}details:not([open]){display:block}footer{margin-top:25px}}\n</style><style>.layout{display:block;max-width:1240px}.page{padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}</style></head><body><a class=\"skip\" href=\"#engineering/main\" data-book-route=\"engineering/main\">跳到正文</a><div class=\"layout\"><main class=\"page\" id=\"main\"><header class=\"hero\"><p class=\"eyebrow\">阶段 03 · 怎样建</p><h1>方案确认后，写清开发要求和任务安排。</h1><p class=\"lead\">这一阶段确认规格、技术方案和施工票。准备是否充分，要看要求是否清楚，而不是文档有多少。</p></header><div class=\"reading-grid\"><article><section id=\"stage-skill-route\">\n<h2>这个阶段，先用哪个 Skill？</h2>\n<div class=\"stage-start\"><p>从批准材料开始用 to-spec，规格与技术取舍确定后再用 to-tickets。</p><p class=\"stage-chain\">to-spec 固定要求 → 你确认规格与技术取舍 → to-tickets 拆票 → 你确认开工次序</p></div>\n<p>首次建立或需要修正 AI 的工作约定时，看 <a href=\"#agents/agent-stages\" data-book-route=\"agents/agent-stages\">writing-for-agents 在四阶段的用途</a>；不是本阶段每次都要多跑一道流程。</p>\n<table class=\"stage-skill-table\">\n<thead>\n<tr>\n<th>Skill</th>\n<th>什么时候接手</th>\n<th>解决什么 / 交出什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><a class=\"skill-link\" href=\"#skills/card-to-spec\" data-book-route=\"skills/card-to-spec\">to-spec</a></td>\n<td>相关需求已批准，准备形成正式规格；涉及待验证的界面或交互时，补相应原型依据。</td>\n<td>综合用户故事、可检查验收、不做项和测试边界；不是从头再访谈。</td>\n</tr>\n<tr>\n<td><a class=\"skill-link\" href=\"#skills/card-to-tickets\" data-book-route=\"skills/card-to-tickets\">to-tickets</a></td>\n<td>规格和会影响切片的技术取舍已确认。</td>\n<td>交出纵向切片票、依赖和第一张 MVP；先让你审票序，不立即批量施工。</td>\n</tr>\n</tbody></table>\n<details><summary>只有遇到这些情况，才加用其他 Skill</summary><table class=\"stage-skill-table\">\n<thead>\n<tr>\n<th>Skill</th>\n<th>什么时候接手</th>\n<th>解决什么 / 交出什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><a class=\"skill-link\" href=\"#skills/card-domain-modeling\" data-book-route=\"skills/card-domain-modeling\">domain-modeling</a></td>\n<td>术语冲突或需要记录真正重要的架构选择。</td>\n<td>维护 CONTEXT.md/必要 ADR；只是读取已有词典不用重新启动它。</td>\n</tr>\n<tr>\n<td><a class=\"skill-link\" href=\"#skills/card-codebase-design\" data-book-route=\"skills/card-codebase-design\">codebase-design</a></td>\n<td>模块边界或测试入口需要判断。</td>\n<td>用真实案例比较接口和封装，不为猜想的扩展加层。</td>\n</tr>\n<tr>\n<td><a class=\"skill-link\" href=\"#skills/card-research\" data-book-route=\"skills/card-research\">research</a></td>\n<td>选型仍卡在外部事实。</td>\n<td>带来源回答那个问题，不重新做全项目调研。</td>\n</tr>\n<tr>\n<td><a class=\"skill-link\" href=\"#skills/card-prototype\" data-book-route=\"skills/card-prototype\">prototype</a></td>\n<td>状态转换或业务逻辑是否合理，光靠文字无法判断。</td>\n<td>用逻辑原型验证具体问题，不重新设计已批准的页面。Windows 兼容性、系统权限和真实接口能力，需要获得授权后在目标环境中单独验证；模拟成功不等于实际验证通过。</td>\n</tr>\n<tr>\n<td><a class=\"skill-link\" href=\"#skills/card-setup-matt-pocock-skills\" data-book-route=\"skills/card-setup-matt-pocock-skills\">setup-matt-pocock-skills</a></td>\n<td>项目尚无 tracker/规则与文档位置约定。</td>\n<td>首次建立项目所需的技能和文档约定，先说明要修改哪里并取得授权；不是每次任务都重新安装。</td>\n</tr>\n</tbody></table></details>\n<p class=\"note\">已经澄清的场景不重复追问，也不再增加一套 Superpowers brainstorming / writing-plans 流程。只有材料中缺少必要的产品决定时，才回到上一阶段。小任务不必因为本页介绍了 to-spec，就改走完整流程。</p>\n<div class=\"prompt stage-entry\"><pre>这次进入“施工准备”，输入是【批准需求/现有规格】；涉及界面或交互时补【相应原型与评审记录】，不适用则说明。\n先实际使用 Matt to-spec 综合既有决定，明确故事、验收、不做项和公共测试边界；已批准部分引用复用，仅新增或变更内容交我确认，不重开整轮盘问。\n术语冲突或重要取舍才用 domain-modeling，接口边界问题用 codebase-design，缺事实再用 research；必须验证的逻辑未知才用 prototype 的逻辑路线。\n规格与技术取舍已有批准则复用；需要拆票时再实际使用 to-tickets 生成纵向施工票、依赖和 MVP，新增或调整的粒度与票序交我确认。\n所有输出沿用本项目事实源，不再生成一套 Superpowers Spec 或计划。本轮只准备，不施工。</pre></div>\n<p class=\"source\">技能名可点击查看用法。以上是结合 Matt 技能与辅助技能整理的本手册分工，不是自动触发配置。<a href=\"#governance/karpathy-role\" data-book-route=\"governance/karpathy-role\">Karpathy 的跨阶段底线</a>；<a href=\"#skills/invoke-and-check\" data-book-route=\"skills/invoke-and-check\">怎样确认真正调用</a>。</p>\n<p class=\"glossary-strip\"><strong>本阶段行话：</strong><a href=\"#glossary/term-spec\" data-book-route=\"glossary/term-spec\">Spec · 规格书</a> · <a href=\"#glossary/term-adr\" data-book-route=\"glossary/term-adr\">ADR · 架构决策记录</a> · <a href=\"#glossary/term-ticket\" data-book-route=\"glossary/term-ticket\">Ticket · 施工票</a> · <a href=\"#glossary/term-tracer-bullet\" data-book-route=\"glossary/term-tracer-bullet\">Tracer bullet · 纵向贯通切片</a> · <a href=\"#glossary/term-seam\" data-book-route=\"glossary/term-seam\">Seam · 接缝与测试入口</a><br><span>点词查：白话、阶段、产物、Skill 和你要问的问题。</span></p>\n<p>想看完整过程？<a href=\"#skills/case-decision\" data-book-route=\"skills/case-decision\">本阶段的实际问题示例</a>。资料入口与更新责任见<a href=\"#knowledge/knowledge-maintenance\" data-book-route=\"knowledge/knowledge-maintenance\">项目知识库维护</a>。</p>\n\n</section>\n<section id=\"ready-inputs\">\n<h2>施工准备：把已定稿的方案变成可验收的施工票</h2>\n<p class=\"glossary-entry\">多人参与时，在拆票前明确负责人、共同基线与共享接口；看<a href=\"#team/team-flow\" data-book-route=\"team/team-flow\">同事协作的票据流转</a>。本册不自动启用多人并行。</p>\n<p>进入这一页时，先核对本次相关的已批准需求、现有规格和决定，确认路径、版本、批准依据与本期边界。只有本次需要验证界面或交互时，才补相应原型；完整概念方案和可点击原型不是所有任务的前置条件。这里不重新设计产品，也不把前面已经回答的问题再盘问一遍；只补会影响施工的缺口。</p>\n<p>像建筑施工图阶段：先接收已定稿方案，再讲清材料、接口、验收与施工顺序。原型证明“这个方案值得采用”，不证明代码已经安全、稳定、可安装。原型中的假数据、模拟写入和临时页面，都要明确标出。</p>\n<aside class=\"warning\"><p>缺少真实场景证据，回到<a href=\"#research\" data-book-route=\"research\">场景研究</a>；关键页面和任务流还没确定，回到<a href=\"#concept\" data-book-route=\"concept\">概念原型</a>。不是用一份很长的 Spec 把尚未决定的问题掩盖过去。</p></aside>\n<div class=\"prompt\"><pre>这是 Matt to-spec 的输入核对：读取本次相关的已批准需求与决定；涉及界面或交互时读取相应原型依据，先复述施工输入和不做范围。\n沿用现有共识；只有出现新的产品分歧才回到 grill-with-docs，不能整轮重问。\n不要重新盘问已确定的内容，不写实现代码。\n只列出会阻碍规格、技术选择或验收的缺口；能查资料和仓库回答的，先自行查证。</pre></div>\n</section>\n<section id=\"terms-decisions\">\n<h2>先统一项目术语，再用 ADR 记录重要决策</h2>\n<p><code>CONTEXT.md</code> 是项目领域词典：例如“场景”“方案版本”“发布版”各指什么，代码里对应什么名称。它不是一般编程教材，也不放实施计划、每日进度或待办。共同语言让你和 AI 说的是同一件事。</p>\n<p>ADR 是“当时为什么这样选”的决策记录。按当前 Matt 的领域建模规则，三个条件同时成立才值得写：决定难以撤销；未来接手者没有上下文会觉得意外；确实存在需要解释的取舍。不要给每个按钮和变量都建 ADR。</p>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>内容</th>\n<th>放在哪里</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>项目领域词汇、名称对应</td>\n<td><code>CONTEXT.md</code></td>\n</tr>\n<tr>\n<td>重要选择、替代方案、为什么接受代价</td>\n<td>项目现有 ADR 位置；<code>docs/adr/</code> 是作者默认示例，项目约定优先，已有有效记录直接复用</td>\n</tr>\n<tr>\n<td>用户要求与验收边界</td>\n<td>当前功能的 Spec</td>\n</tr>\n<tr>\n<td>当前票做到哪里、验证与人工验收</td>\n<td>当前施工票</td>\n</tr>\n</tbody></table></div>\n<aside class=\"note\"><p>“唯一事实源”不是把所有信息放进一个文件，而是每类信息只在一处维护，其他页面引用它，避免多个版本互相矛盾。详见<a href=\"#context\" data-book-route=\"context\">上下文与交接</a>。</p></aside>\n</section>\n<section id=\"write-spec\">\n<h2>用 /to-spec 写清开发要求，不必提前设计每一处代码</h2>\n<p>在保留已有讨论的规划主线中调用 <code>/to-spec</code>，综合现成共识，而不是从零再做访谈。先读<a href=\"#skills\" data-book-route=\"skills\">技能调用说明</a>：菜单没有出现不等于技能已失效；没有原生入口时，明确使用等价步骤，不谎称已成功调用。</p>\n<p>Spec 至少写清用户故事、可观察的验收标准、明确不做什么，以及已知约束和仍待验证的风险。测试应放在哪个公共边界，也要在施工前说明。<code>.scratch/功能名/spec.md</code> 是作者本地票据路线的默认示例；以项目已采用的资料约定为准，复用已有有效规格，不另建第二份或预建目录。</p>\n<div class=\"example\"><p>不要只写“支持导出”。应写：“策划人员选择一个方案版本，导出包含该版本内容的文件；取消导出不留下半成品；目标目录不可写时给出可理解的提示；第一期不做批量导出。”</p></div>\n<details><summary>我审 Spec 时，只需要看懂这四件事</summary>\n<ul>\n<li>谁在什么场景做什么，结果是不是我想要的？</li>\n<li>成功、空数据、失败或取消时，分别应该看到什么？</li>\n<li>哪些原型细节已经确认为基线，哪些仍是模拟或待验证？</li>\n<li>明确排除什么，避免 AI 顺手扩展功能？</li>\n</ul>\n<p>Spec 应说明目标、范围和限制，不必提前列出每个函数、文件路径和伪代码。必要的架构决定可以引用 ADR；会在实现过程中调整的细节，由当前施工票处理。</p>\n</details>\n</section>\n<section id=\"choose-technology\">\n<h2>技术选择由 AI 解释，由你拍板</h2>\n<p>数据库、部署方式、桌面打包或系统集成等重要选择尚未确定时，AI 提出少量确实可行的方案并说明推荐理由；已有批准则引用复用，普通实现细节由 AI 处理，不为凑数假造选项。比较重点不是术语数量，而是你会得到什么、要多维护什么、离线能否用、数据在哪里、以后更换难不难，以及失败时能否退回。</p>\n<div class=\"prompt\"><pre>先核对当前规格与已批准技术决定；只对尚未确定的重要取舍提出少量可行方案和推荐理由，不固定数量、不假造选项。\n外部事实不明时实际使用 Matt research；模块边界有取舍时用 codebase-design；重大决定经我选择后由 domain-modeling 记录适用的 ADR。\n用用户影响解释：安装使用、离线与数据、维护成本、扩展限制、迁移和回退。\n指出尚未验证的假设及最小验证办法。等我选择后，再记录符合条件的 ADR；不要静默替我决定。</pre></div>\n<p>可以先做窄范围的可行性验证，例如确认目标 Windows 版本能否安装某组件。验证结果写回对应风险或决策；不能把“演示能运行”升级为整套产品通过，也不借研究之名接入生产数据。</p>\n<aside class=\"note\"><p>重要取舍由用户拍板、已批准内容复用及设计变更需确认，是<strong>本手册的补充约定</strong>，不是声称 Matt 视频逐字规定了这套审批流程。</p></aside>\n</section>\n<section id=\"slice-tickets\">\n<h2>用 /to-tickets 拆分任务，让每张施工票都能单独验收</h2>\n<p>规格审阅和技术选择完成后再拆票。普通功能按纵向切片：一张票贯通必要的数据、逻辑与界面，让你能独立演示和验收；不要先写完全部数据库，再写全部接口，最后才第一次看到产品。</p>\n<p>每张票都要说明目标、开发范围、本期不做的内容、依赖、风险、验收标准、验证方式和强度、回退方式、相关 Spec／ADR，以及哪些步骤必须由人参与（HITL）。验证强度在这里定，执行者只能提高。新会话应能根据票和开工包理解要求；如果还要翻阅大量历史聊天，就需要补齐开工信息，或进一步拆小任务。</p>\n<p><strong>本手册的补充约定：</strong>第一票优先是可演示的最小闭环 MVP，票序由你确认。数据库写入、权限、永久删除、生产部署、密钥与迁移等按高风险处理，必须写恢复或回滚办法。大范围重构可能需要准备性改造或先扩展后收缩，Matt 并非禁止这种例外；但 AI 必须解释原因，请你批准，不能偷偷改成横向拆票。</p>\n<details><summary>什么时候应该继续拆小？</summary>\n<p>一票横跨多个独立子系统、无法独立回退、人工验收过长，应评估是否继续切分；仅换会话不要求重新拆票。按用户影响和可恢复性判断，不按代码行数判断风险。新想法先留下一期，不把当前票越写越大。</p>\n</details>\n</section>\n<section id=\"ready-handoff\">\n<h2>开发前最后检查：哪些内容已批准，施工任务需要哪些材料</h2>\n<ul>\n<li>本次所需批准材料可访问；涉及原型时，版本与模拟内容已标出。</li>\n<li>Spec 的故事、验收和不做项已确认，重要技术取舍有结论。</li>\n<li>票的粒度、依赖、风险和顺序已确认，当前可开工票明确。</li>\n<li>开工包引用前置成果的真实提交与仓库，或非 Git 成果的版本与位置，并写明获批接续方式、责任人和批准依据。</li>\n<li>派工前只核对已有材料与依赖就绪情况；新会话开工后，由执行者核实实际目录、分支或 worktree、已有改动、所需成果、允许范围和验证入口，再开始实现。</li>\n</ul>\n<p>满足这些条件，再进入<a href=\"#delivery\" data-book-route=\"delivery\">开发交付</a>。票序批准就是主控的冻结点：从此写记录不写产品，实现在施工票会话。轻量小修走<a href=\"#index\" data-book-route=\"index\">入口的短路线</a>，不机械重走四阶段；换会话时按记录和实际环境接续；成为正式功能或风险升级时，才补本次所需规格、票据或安全检查。</p>\n<p class=\"source\">依据：当前 Matt <a href=\"https://github.com/mattpocock/skills\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">技能仓库</a>的 to-spec、to-tickets、domain-modeling；英文课 P04 21:57 起：纵向切片、P04 1:50:23 起：保留规划上下文。视频旧 PRD／plan 名称不替代当前调用规则。</p>\n</section>\n<nav class=\"book-end\" aria-label=\"前后章节\"><a href=\"#concept\" data-book-route=\"concept\"><span>上一册</span>← 概念原型</a><a class=\"next\" href=\"#delivery\" data-book-route=\"delivery\"><span>下一册</span>开发交付 →</a></nav></article><aside class=\"toc\" aria-label=\"本页目录\"><p>这一页</p><a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">这个阶段，先用哪个 Skill？</a><a href=\"#engineering/ready-inputs\" data-book-route=\"engineering/ready-inputs\">施工准备：把已定稿的方案变成可验收的施工票</a><a href=\"#engineering/terms-decisions\" data-book-route=\"engineering/terms-decisions\">先统一项目术语，再用 ADR 记录重要决策</a><a href=\"#engineering/write-spec\" data-book-route=\"engineering/write-spec\">用 /to-spec 写清开发要求，不必提前设计每一处代码</a><a href=\"#engineering/choose-technology\" data-book-route=\"engineering/choose-technology\">技术选择由 AI 解释，由你拍板</a><a href=\"#engineering/slice-tickets\" data-book-route=\"engineering/slice-tickets\">用 /to-tickets 拆分任务，让每张施工票都能单独验收</a><a href=\"#engineering/ready-handoff\" data-book-route=\"engineering/ready-handoff\">开发前最后检查：哪些内容已批准，施工任务需要哪些材料</a></aside></div></main></div><div class=\"notice-live\" role=\"status\" aria-live=\"polite\"></div><script>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}));}\nwindow.addEventListener('hashchange',openHash);openHash();\nconst sections=[...document.querySelectorAll('article>section')],tocLinks=[...document.querySelectorAll('.toc a')];\nif('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const id=visible[0].target.id;tocLinks.forEach(a=>a.classList.toggle('current',a.hash==='#'+id));},{rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>observer.observe(s));}\n})();\n<\/script><script>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n<\/script>\n</body></html>"},{"id":"delivery","nav":"开发交付","html":"<!doctype html><html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"color-scheme\" content=\"light\"><meta name=\"description\" content=\"主控写记录不写产品，施工票会话实现，审查会话审，你按验收单确认。\"><title>开发交付 · 建筑师的 AI 开发手册</title><style>@charset \"UTF-8\";\n:root{--bg:#f7f4ed;--paper:#fffdfa;--ink:#2d2823;--muted:#70665c;--accent:#a44c34;--line:#ddd5c9;--sage:#4d6655;--soft:#eee8de;--focus:#85331e}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:32px}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.85 \"Segoe UI\",\"Microsoft YaHei\",\"PingFang SC\",sans-serif}\na{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:4px}a:hover{color:#783221}button,input{font:inherit}button{cursor:pointer}a,button,input,summary{-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:3px}\n.skip{position:fixed;left:20px;top:-100px;z-index:9;background:var(--ink);color:#fff;padding:10px 20px}.skip:focus{top:12px}\n.layout{display:grid;grid-template-columns:246px minmax(0,1fr);max-width:1640px;margin:auto;min-height:100vh}\n.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:38px 23px 25px;overflow-y:auto}\n.brand{display:block;color:var(--ink);text-decoration:none;font-size:18px;font-weight:700;line-height:1.5;margin-bottom:28px}.brand small{display:block;font-weight:400;font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);margin-top:6px}\n.menu-toggle{display:none}.nav-label{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:24px 10px 8px}.book-nav a{display:flex;gap:12px;align-items:baseline;text-decoration:none;color:var(--muted);padding:
