ls-marker{display:none}.term-card summary::after{content:'＋';grid-column:2;grid-row:1/3;align-self:center;color:var(--accent);font-weight:400;font-size:22px}.term-card[open] summary::after{content:'－'}.term-name{font-size:17px;overflow-wrap:anywhere}.term-plain{font-size:14px;font-weight:400;color:var(--muted)}.term-body{padding:6px 22px 6px;border-left:2px solid #c8aa91;margin-top:18px}.term-analogy{color:#79543b;font-size:14px}.term-card dl{margin:20px 0}.term-card dt{font-size:12px;color:var(--accent);margin:18px 0 4px}.term-card dd{margin:0;font-size:15px;overflow-wrap:anywhere}.term-card dd p{margin:0 0 9px}.term-check{padding:15px 18px;background:#eee7db}.term-pitfall{font-size:13px!important;color:var(--muted)}.term-walk li{margin:18px 0}.term-walk strong{color:#79543b}\n@media(max-width:760px){.term-body{padding-left:15px;padding-right:0}.term-name{font-size:16px}.term-plain{font-size:13px}.term-filter label{flex-basis:100%}}\n@media print{body{font-size:11pt;background:#fff}.layout{display:block}.sidebar,.toc,.topline,.copy-btn,.book-end,.notice-live{display:none}.page{padding:0}.reading-grid{display:block}.hero{padding:10px 0 20px}h1{font-size:26pt}h2{font-size:18pt}article>section{break-inside:auto}a{color:#222}.prompt,.example,table{break-inside:avoid}details:not([open]){display:block}footer{margin-top:25px}}\n</style><style>.layout{display:block;max-width:1240px}.page{padding:18px 40px 30px}.hero{padding:30px 0}.reading-grid{grid-template-columns:minmax(0,850px) 165px;gap:40px}body{overflow-wrap:anywhere}@media(max-width:1040px){.reading-grid{display:block}.toc{display:none}}@media(max-width:760px){.page{padding:15px 22px 25px}}</style></head><body><a class=\"skip\" href=\"#glossary/main\" data-book-route=\"glossary/main\">跳到正文</a><div class=\"layout\"><main class=\"page\" id=\"main\"><header class=\"hero\"><p class=\"eyebrow\">案头工具 · 听懂，也知道怎么用</p><h1>看懂开发术语，也知道它们在什么时候使用。</h1><p class=\"lead\">从建筑师熟悉的事物理解软件开发：这个词是什么意思，什么时候出现，谁来做、用哪个 Skill，以及你要检查什么。</p></header><div class=\"reading-grid\"><article><section id=\"read-the-terms\">\n<h2>先分清：这是文件、做法，还是工具？</h2>\n<p><strong>不用背。</strong>遇到不懂的词再来查。每张卡先说白话，展开后才看“在什么环节、谁来做、Skill 负责什么、你要检查什么”。建筑类比只是帮助理解，并不表示两者完全相同。</p>\n<p>Spec、ADR、施工票能形成文件；TDD、测试、部署是要真正执行的工作；Git 是工具。<strong>不能为每个名词硬配一个“生成它的 Skill”。</strong>下方链接只表示推荐分工，不代表安装后已经自动执行。</p>\n\n</section>\n<section id=\"term-lookup\">\n<h2>遇到不懂的词，再来查对应卡片</h2>\n<label class=\"search-label\" for=\"term-search\">查名称、白话或 Skill</label>\n<input id=\"term-search\" type=\"search\" placeholder=\"例如：施工票、接缝、to-spec、部署\" autocomplete=\"off\">\n<div class=\"term-filter\"><label for=\"term-stage\">主要出现阶段</label><select id=\"term-stage\"><option value=\"all\">全部阶段</option><option value=\"research\">01 场景研究</option><option value=\"concept\">02 概念原型</option><option value=\"engineering\">03 施工准备</option><option value=\"delivery\">04 开发交付</option></select><button id=\"term-reset\" type=\"button\">清除筛选</button></div>\n<p id=\"term-count\" class=\"muted\" role=\"status\" aria-live=\"polite\"></p>\n<p id=\"term-empty\" class=\"note\" hidden=\"\">没有找到。试试中文意思或清除阶段筛选；也可以让 AI 用本页末尾的提示解释当前问题。</p>\n<details class=\"term-card\" id=\"term-prd\" data-stages=\"research engineering\"><summary><span class=\"term-name\">PRD · 产品需求文档<span class=\"tag\">文档</span></span><span class=\"term-plain\">说清给谁用、解决什么问题和做到哪里，各团队对这个名字的范围并不统一。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像设计任务书，先交代使用者与建设目标。</p><dl><dt>什么时候出现</dt><dd><a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">场景研究</a> / <a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a><br>收到叫作 PRD 的文件时，先确认它实际包含哪些要求。</dd><dt>谁来做</dt><dd>AI 整理证据与需求，用户确认范围和取舍。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-grill-with-docs\" data-book-route=\"skills/card-grill-with-docs\">grill-with-docs</a>：有需求分歧时结合项目材料问清楚。</p><p><a class=\"skill-link\" href=\"#skills/card-research\" data-book-route=\"skills/card-research\">research</a>：只补需要查证的外部事实。</p></dd><dt>应看到的产物或证据</dt><dd>一份沿用项目命名的需求文件，不另造同内容副本。</dd><dt>放到你的项目里</dt><dd>建筑资料库先说明谁找案例、为什么找不到以及第一期不做什么。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>这份 PRD 已经定了什么，还有哪些是假设？</p><p class=\"term-pitfall\"><strong>别误会：</strong>不要认定所有项目都必须先写 PRD，再另写一份 Spec。</p></div></details>\n<details class=\"term-card\" id=\"term-spec\" data-stages=\"engineering delivery\"><summary><span class=\"term-name\">Spec · 规格书<span class=\"tag\">文档</span></span><span class=\"term-plain\">把已有共识写成故事、验收、不做项及已定的实施与测试要求。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像深化任务书，明确施工必须满足什么。</p><dl><dt>什么时候出现</dt><dd><a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>方向已批准，需要跨任务持续施工和验收时使用。</dd><dt>谁来做</dt><dd>AI 综合已讨论材料，用户审阅确认。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-to-spec\" data-book-route=\"skills/card-to-spec\">to-spec</a>：综合现有决定并核对测试入口，不重新访谈全部需求。</p></dd><dt>应看到的产物或证据</dt><dd>当前功能的一份有效 Spec；.scratch/案例收藏/spec.md 是作者默认路径的示例，实际沿用项目规则约定位置，不自动迁移已有材料或另建副本。</dd><dt>放到你的项目里</dt><dd>建筑资料库规定收藏归个人所有、重复点击不重复保存。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>这些验收要求能检查吗，是否继承了我批准的方案？</p><p class=\"term-pitfall\"><strong>别误会：</strong>Spec 不是必须接在 PRD 后的固定一级，也不是逐函数实现剧本。</p></div></details>\n<details class=\"term-card\" id=\"term-ticket\" data-stages=\"engineering delivery\"><summary><span class=\"term-name\">Ticket · 施工票<span class=\"tag\">文档</span></span><span class=\"term-plain\">从规格中拆出的具体任务，说明要完成什么、如何验收，以及开始前需要满足哪些条件。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像可以单独交验的施工派工单。</p><dl><dt>什么时候出现</dt><dd><a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>正式功能需要分次交付时先拆票，再逐票施工。</dd><dt>谁来做</dt><dd>AI 提议拆分，用户确认粒度与顺序，施工票会话执行。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-to-tickets\" data-book-route=\"skills/card-to-tickets\">to-tickets</a>：拆分范围明确的施工票，并说明它们之间的依赖关系。</p><p><a class=\"skill-link\" href=\"#skills/card-implement\" data-book-route=\"skills/card-implement\">implement</a>：在批准范围内完成当前票。</p></dd><dt>应看到的产物或证据</dt><dd>本地管理施工票时，每票一份文件；使用票据平台时，每票一条工作项。</dd><dt>放到你的项目里</dt><dd>建筑资料库一票完成收藏、找回和取消收藏的最小闭环。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>这张票独立交出什么，必须先等哪张票？</p><p class=\"term-pitfall\"><strong>别误会：</strong>票不是一长串代码步骤，也不因 AI 做完就自动获得关票批准。</p></div></details>\n<details class=\"term-card\" id=\"term-tracer-bullet\" data-stages=\"engineering delivery\"><summary><span class=\"term-name\">Tracer bullet · 纵向贯通切片<span class=\"tag\">开发方法</span></span><span class=\"term-plain\">先完成一个具体功能所需的数据、逻辑和界面，让这个功能能够单独演示或验证。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像先做通一段能实际使用的样板段。</p><dl><dt>什么时候出现</dt><dd><a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>拆普通功能票或安排测试与实现的小循环时使用。</dd><dt>谁来做</dt><dd>AI 提出切片，用户确认要看到的成果。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-to-tickets\" data-book-route=\"skills/card-to-tickets\">to-tickets</a>：按贯通行为拆普通功能票。</p><p><a class=\"skill-link\" href=\"#skills/card-tdd\" data-book-route=\"skills/card-tdd\">tdd</a>：在约定入口逐条推进测试与实现。</p></dd><dt>应看到的产物或证据</dt><dd>一张可交验的票或一次有验证结果的代码小循环，无需同名文件。</dd><dt>放到你的项目里</dt><dd>建筑资料库先让一个案例能被收藏并找回，而非先做完所有数据表。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>这条路径贯通了哪些必要部分，我怎样单独验证？</p><p class=\"term-pitfall\"><strong>别误会：</strong>不要给纯逻辑强造界面或数据库，大范围机械重构也有不同拆分办法。</p></div></details>\n<details class=\"term-card\" id=\"term-tdd\" data-stages=\"delivery\"><summary><span class=\"term-name\">TDD · 测试驱动开发<span class=\"tag\">开发方法</span></span><span class=\"term-plain\">先运行一条确实失败的测试，再写最少实现让它通过。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像先准备能抓出缺陷的试压检查，再施工到检查合格。</p><dl><dt>什么时候出现</dt><dd><a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>施工票约定测试驱动时使用，高风险任务按批准规则严格执行。</dd><dt>谁来做</dt><dd>AI 编写并运行测试与实现，用户确认重要测试行为。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-tdd\" data-book-route=\"skills/card-tdd\">tdd</a>：在预先约定的接缝执行红到绿小循环。</p></dd><dt>应看到的产物或证据</dt><dd>测试代码、实现代码及真实红绿运行记录。</dd><dt>放到你的项目里</dt><dd>建筑资料库先证明他人不能读取私人收藏，再实现正确权限控制。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>请给我先失败后通过的证据，这条测试保护什么行为？</p><p class=\"term-pitfall\"><strong>别误会：</strong>先写验收清单或实现后补测试都不等于做过 TDD。</p></div></details>\n<details class=\"term-card\" id=\"term-qa\" data-stages=\"concept delivery\"><summary><span class=\"term-name\">QA · 质量保障<span class=\"tag\">开发方法</span></span><span class=\"term-plain\">通过过程检查和成果检查降低质量风险，用户最终批准是其中单独一道关口。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像施工过程质检加交付检查，不只最后看一遍效果。</p><dl><dt>什么时候出现</dt><dd><a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>原型评审和实际交付时，按任务安排相应质量检查。</dd><dt>谁来做</dt><dd>AI 提供检查证据，使用者试用，用户决定是否接受。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-code-review\" data-book-route=\"skills/card-code-review\">code-review</a>：实现后分别审要求与项目标准。</p><p><a class=\"skill-link\" href=\"#skills/support-webapp-testing\" data-book-route=\"skills/support-webapp-testing\">webapp-testing</a>：对网页实际操作并记录结果。</p></dd><dt>应看到的产物或证据</dt><dd>现有评审或验收记录中的问题、证据和人工结论。</dd><dt>放到你的项目里</dt><dd>建筑资料库既检查搜索结果，也让同事尝试找回最近使用的案例。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>机器检查、真实试用和我的批准分别完成了哪些？</p><p class=\"term-pitfall\"><strong>别误会：</strong>QA 不是只点一次页面，也没有一个技能能替用户签字。</p></div></details>\n<details class=\"term-card\" id=\"term-adr\" data-stages=\"research concept engineering delivery\"><summary><span class=\"term-name\">ADR · 架构决策记录<span class=\"tag\">文档</span></span><span class=\"term-plain\">记下重要取舍为什么这样选，以及接受了什么代价。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像重大技术选择的决策纪要，不是每颗螺丝的签字单。</p><dl><dt>什么时候出现</dt><dd><a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">场景研究</a> / <a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型</a> / <a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>决定难回头、缺背景会令人意外且确有不同方案取舍时记录。</dd><dt>谁来做</dt><dd>AI 解释方案并起草，用户拍板重大取舍。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-domain-modeling\" data-book-route=\"skills/card-domain-modeling\">domain-modeling</a>：判断是否值得记录并维护相应 ADR。</p></dd><dt>应看到的产物或证据</dt><dd>项目约定位置中的必要决策记录；docs/adr/ 是作者默认目录示例，不强制项目另建目录。调用时写明真实输出位置；若 Skill 固定默认与项目约定冲突，先说明差异，按授权适配或归位并更新受影响索引。</dd><dt>放到你的项目里</dt><dd>同事 Windows 工作台选择离线优先，记录同步复杂度的代价。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>为什么这样选，替代方案和以后改换的成本是什么？</p><p class=\"term-pitfall\"><strong>别误会：</strong>写了 ADR 不等于用户已批准，也不必给每个小决定建档。</p></div></details>\n<details class=\"term-card\" id=\"term-context-file\" data-stages=\"research concept engineering delivery\"><summary><span class=\"term-name\">CONTEXT.md · 项目领域词典<span class=\"tag\">文档</span></span><span class=\"term-plain\">统一本项目的业务词义及名称，避免双方说的不是同一件事。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像项目统一用语表。</p><dl><dt>什么时候出现</dt><dd><a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">场景研究</a> / <a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型</a> / <a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>出现新业务概念或既有词义冲突时维护。</dd><dt>谁来做</dt><dd>AI 对照实际业务提出定义，用户确认含义。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-domain-modeling\" data-book-route=\"skills/card-domain-modeling\">domain-modeling</a>：澄清并记录领域术语。</p></dd><dt>应看到的产物或证据</dt><dd>项目 CONTEXT.md 中的词典条目。</dd><dt>放到你的项目里</dt><dd>建筑资料库明确案例、附件和方案版本不是同一种对象。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>这里的案例具体指什么，是否与代码和界面叫法一致？</p><p class=\"term-pitfall\"><strong>别误会：</strong>它不存每日进度、实施计划或所有重要决定，读取词典也不必重启建模。</p></div></details>\n<details class=\"term-card\" id=\"term-seam\" data-stages=\"engineering delivery\"><summary><span class=\"term-name\">Seam · 接缝与测试入口<span class=\"tag\">设计概念</span></span><span class=\"term-plain\">设计中指可替换行为的位置，测试中常指从外部调用并观察行为的入口。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像可替换设备的接驳位置与可检查的接口。</p><dl><dt>什么时候出现</dt><dd><a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>确定模块怎样连接或测试从哪里进入时讨论。</dd><dt>谁来做</dt><dd>AI 提议接缝位置，用户确认需要保护的行为。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-codebase-design\" data-book-route=\"skills/card-codebase-design\">codebase-design</a>：帮助比较接口与接缝位置。</p><p><a class=\"skill-link\" href=\"#skills/card-to-spec\" data-book-route=\"skills/card-to-spec\">to-spec</a>：施工前确认测试接缝。</p><p><a class=\"skill-link\" href=\"#skills/card-tdd\" data-book-route=\"skills/card-tdd\">tdd</a>：在约定接缝观察行为。</p></dd><dt>应看到的产物或证据</dt><dd>Spec 中的测试约定及必要接口代码，无需独立接缝文档。</dd><dt>放到你的项目里</dt><dd>建筑资料库从收藏服务入口检查新增与取消，不窥探每个内部函数。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>为什么从这里测试，内部修改后需要保持哪些对外行为？</p><p class=\"term-pitfall\"><strong>别误会：</strong>接缝少是设计取舍，不保证越少越稳或内部可以随便改。</p></div></details>\n<details class=\"term-card\" id=\"term-handoff\" data-stages=\"research concept engineering delivery\"><summary><span class=\"term-name\">Handoff · 交接说明<span class=\"tag\">协作文档</span></span><span class=\"term-plain\">让下一位知道当前焦点、事实源和下一步，而不是复制全部聊天。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像跨单位移交时给出的资料索引和待办说明。</p><dl><dt>什么时候出现</dt><dd><a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">场景研究</a> / <a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型</a> / <a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>跨工具、目录、协作者或中途分叉时，先核对既有票和材料是否足以接手；仍不足时才补独立交接。</dd><dt>谁来做</dt><dd>当前任务 AI 整理，接手任务实际读取并核对。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-handoff\" data-book-route=\"skills/card-handoff\">handoff</a>：脱敏整理焦点并引用现有文档和建议方法。</p></dd><dt>应看到的产物或证据</dt><dd>优先补齐或引用既有票及事实源；仍不足时才补最小独立交接文件，并核对接手方能否访问。</dd><dt>放到你的项目里</dt><dd>同事 Windows 工作台交给另一工具验证时，引用当前票及失败记录。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>接手任务真正读过哪些材料，还缺什么？</p><p class=\"term-pitfall\"><strong>别误会：</strong>跨边界不等于必须另建文件；交接引用现有状态，不重复记进度。生成文件也不证明接手者已经读到。</p></div></details>\n<details class=\"term-card\" id=\"term-kanban\" data-stages=\"engineering delivery\"><summary><span class=\"term-name\">Kanban · 看板<span class=\"tag\">协作概念</span></span><span class=\"term-plain\">把工作项的当前状态和阻塞情况放在一起查看。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像施工进度墙，能看出哪里在做、哪里等条件。</p><dl><dt>什么时候出现</dt><dd><a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>已有多张票，需要查看状态与依赖时使用。</dd><dt>谁来做</dt><dd>AI 根据票据整理视图，用户决定优先次序，不需要专属 Skill。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd>不需要专属 Skill；由 AI 使用合适工具，按任务要求实际操作或说明。</dd><dt>应看到的产物或证据</dt><dd>现有票据管理工具的看板视图，不另建重复状态文件。</dd><dt>放到你的项目里</dt><dd>建筑资料库的收藏票等身份票验收后才可开工。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>哪些票真的能开工，阻塞信息来自哪里？</p><p class=\"term-pitfall\"><strong>别误会：</strong>列名不固定为三列，看板上的完成也不能替代用户验收。</p></div></details>\n<details class=\"term-card\" id=\"term-tech-stack\" data-stages=\"engineering\"><summary><span class=\"term-name\">技术栈<span class=\"tag\">设计概念</span></span><span class=\"term-plain\">一起完成产品的语言、框架、数据库及相关运行工具。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像结构体系配合材料与施工做法。</p><dl><dt>什么时候出现</dt><dd><a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a><br>需要选型或现有工具确实不满足要求时比较。</dd><dt>谁来做</dt><dd>AI 解释可行方案和代价，用户拍板重大选择。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-research\" data-book-route=\"skills/card-research\">research</a>：核实兼容性与官方能力等事实。</p><p><a class=\"skill-link\" href=\"#skills/card-domain-modeling\" data-book-route=\"skills/card-domain-modeling\">domain-modeling</a>：对符合条件的重大取舍记录 ADR。</p></dd><dt>应看到的产物或证据</dt><dd>Spec 中的已定技术要求及必要 ADR。</dd><dt>放到你的项目里</dt><dd>同事 Windows 工作台比较离线运行、安装维护与数据保存方式。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>推荐方案对使用、维护和以后迁移分别有什么影响？</p><p class=\"term-pitfall\"><strong>别误会：</strong>不能因某工具热门就默认采用，也不为旧项目无故整套换栈。</p></div></details>\n<details class=\"term-card\" id=\"term-architecture\" data-stages=\"engineering delivery\"><summary><span class=\"term-name\">架构<span class=\"tag\">设计概念</span></span><span class=\"term-plain\">决定系统主要部分怎样分工、连接，以及变化由哪里承担。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像结构与平面组织，既看连接也看改动影响。</p><dl><dt>什么时候出现</dt><dd><a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>模块职责、接口或关键取舍会影响施工时讨论。</dd><dt>谁来做</dt><dd>AI 提出比较方案，用户批准重大难回头选择。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-codebase-design\" data-book-route=\"skills/card-codebase-design\">codebase-design</a>：比较模块接口、封装与改动集中程度。</p><p><a class=\"skill-link\" href=\"#skills/card-domain-modeling\" data-book-route=\"skills/card-domain-modeling\">domain-modeling</a>：记录值得保留的决策理由。</p></dd><dt>应看到的产物或证据</dt><dd>必要接口约定、代码结构及适用 ADR。</dd><dt>放到你的项目里</dt><dd>建筑资料库把检索行为集中在明确入口，避免页面各写一套规则。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>这个划分解决当前什么问题，改需求会影响哪些部分？</p><p class=\"term-pitfall\"><strong>别误会：</strong>好架构不等于层数多，也不保证以后增加任何功能都无代价。</p></div></details>\n<details class=\"term-card\" id=\"term-mvp\" data-stages=\"research engineering delivery\"><summary><span class=\"term-name\">MVP · 最小可行产品<span class=\"tag\">产品概念</span></span><span class=\"term-plain\">用最小真实闭环提供价值并检验方向，而非一次做完愿望清单。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像最小可投入使用的区域，而不是只能参观的样板间。</p><dl><dt>什么时候出现</dt><dd><a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">场景研究</a> / <a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>确定第一期范围和首个可交验成果时使用。</dd><dt>谁来做</dt><dd>AI 提议最小范围，用户判断是否已有使用价值。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-grill-with-docs\" data-book-route=\"skills/card-grill-with-docs\">grill-with-docs</a>：澄清第一期价值与不做项。</p><p><a class=\"skill-link\" href=\"#skills/card-to-tickets\" data-book-route=\"skills/card-to-tickets\">to-tickets</a>：把批准的最小闭环落实到票序。</p></dd><dt>应看到的产物或证据</dt><dd>先在任务书和施工票中明确最小开发范围，再实现可以实际使用的功能。</dd><dt>放到你的项目里</dt><dd>建筑资料库先能录入少量案例并可靠检索，不先造完整协作平台。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>少到这个程度，使用者仍能完成哪件有价值的事？</p><p class=\"term-pitfall\"><strong>别误会：</strong>MVP 不等于模拟原型，也不允许为求小而省掉必要数据安全。</p></div></details>\n<details class=\"term-card\" id=\"term-iteration\" data-stages=\"research concept engineering delivery\"><summary><span class=\"term-name\">迭代<span class=\"tag\">开发方法</span></span><span class=\"term-plain\">根据实际反馈做下一轮有边界的改进。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像分期建设，每一期交付后再决定下一期。</p><dl><dt>什么时候出现</dt><dd><a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">场景研究</a> / <a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型</a> / <a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>已有反馈足以说明下一轮该改善什么时开始。</dd><dt>谁来做</dt><dd>用户决定优先级，AI 整理变更与证据，不需要专属 Skill。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd>不需要专属 Skill；由 AI 使用合适工具，按任务要求实际操作或说明。</dd><dt>应看到的产物或证据</dt><dd>更新后的批准范围或下一期票据，不新增平行计划。</dd><dt>放到你的项目里</dt><dd>建筑资料库使用后发现出处难辨认，再安排一次详情页改进。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>这轮由什么反馈驱动，做到哪里就停？</p><p class=\"term-pitfall\"><strong>别误会：</strong>迭代不是当前票永远加需求，也不意味着已批准基线不能受控修改。</p></div></details>\n<details class=\"term-card\" id=\"term-testing\" data-stages=\"concept engineering delivery\"><summary><span class=\"term-name\">测试与验证<span class=\"tag\">开发方法</span></span><span class=\"term-plain\">用实际检查取得证据，判断指定要求是否满足。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像打压试水和尺寸复核，各检查只能证明对应范围。</p><dl><dt>什么时候出现</dt><dd><a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型</a> / <a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>验证假设、检查原型或证明实现符合要求时使用。</dd><dt>谁来做</dt><dd>AI 按约定执行检查，用户确认真实使用和接受结论。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/support-webapp-testing\" data-book-route=\"skills/support-webapp-testing\">webapp-testing</a>：实际检查浏览器可操作的行为。</p><p><a class=\"skill-link\" href=\"#skills/support-verification\" data-book-route=\"skills/support-verification\">superpowers:verification-before-completion</a>：声称完成前核对适用的新证据。</p></dd><dt>应看到的产物或证据</dt><dd>测试代码或操作记录及实际结果，写回现有票或评审记录。</dd><dt>放到你的项目里</dt><dd>建筑资料库检查搜索、无结果和来源打不开时的返回行为。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>运行了什么、预期是什么，还有哪些没有验证？</p><p class=\"term-pitfall\"><strong>别误会：</strong>启动成功不等于全部通过，浏览器模拟也不证明 Windows 原生能力可用。</p></div></details>\n<details class=\"term-card\" id=\"term-git\" data-stages=\"engineering delivery\"><summary><span class=\"term-name\">Git · 版本管理<span class=\"tag\">工具与操作</span></span><span class=\"term-plain\">记录和比较纳入管理的文件版本，帮助追溯修改。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像有修改说明和版本编号的图纸档案。</p><dl><dt>什么时候出现</dt><dd><a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>真实代码仓库需要检查改动、批准存档或准备恢复时使用。</dd><dt>谁来做</dt><dd>AI 核对并在授权下执行 Git 操作，不需要专属 Matt Git 技能。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd>不需要专属 Skill；由 AI 使用合适工具，按任务要求实际操作或说明。</dd><dt>应看到的产物或证据</dt><dd>仓库中的提交记录、差异或恢复操作结果。</dd><dt>放到你的项目里</dt><dd>建筑资料库验收后存档本票代码，并记录对应提交编号。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>这次存了哪些文件，数据库和未跟踪文件有没有另行保护？</p><p class=\"term-pitfall\"><strong>别误会：</strong>Git 不是整台电脑或真实数据的快照，不能保证任何事故都能一键恢复。</p></div></details>\n<details class=\"term-card\" id=\"term-bug\" data-stages=\"concept delivery\"><summary><span class=\"term-name\">Bug · 缺陷<span class=\"tag\">质量概念</span></span><span class=\"term-plain\">实际行为偏离已约定或合理预期，需要查明原因。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像渗漏或安装偏差，先定位再处理。</p><dl><dt>什么时候出现</dt><dd><a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>出现错误、失败、异常结果或性能退化时调查。</dd><dt>谁来做</dt><dd>使用者描述症状，AI 复现定位，获得修复授权后再改。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-diagnosing-bugs\" data-book-route=\"skills/card-diagnosing-bugs\">diagnosing-bugs</a>：建立症状反馈、验证假设并按授权处理。</p></dd><dt>应看到的产物或证据</dt><dd>复现记录、原因证据及获准后的修复与回归结果。</dd><dt>放到你的项目里</dt><dd>建筑资料库返回列表后筛选丢失，先确认复现条件再修改。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>怎样稳定复现，什么证据说明找到了真正原因？</p><p class=\"term-pitfall\"><strong>别误会：</strong>诊断请求不自动授权修复，更不能用猜测替代定位证据。</p></div></details>\n<details class=\"term-card\" id=\"term-context\" data-stages=\"research concept engineering delivery\"><summary><span class=\"term-name\">上下文<span class=\"tag\">协作概念</span></span><span class=\"term-plain\">AI 当前可用来理解任务的信息，包括对话与实际读入的材料。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像此刻工作台上可见的图纸和讨论记录。</p><dl><dt>什么时候出现</dt><dd><a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">场景研究</a> / <a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型</a> / <a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>判断是否继续当前任务或为新任务准备必要输入时考虑。</dd><dt>谁来做</dt><dd>用户提供目标，AI 读取相关事实源，不需要专属上下文 Skill。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd>不需要专属 Skill；由 AI 使用合适工具，按任务要求实际操作或说明。</dd><dt>应看到的产物或证据</dt><dd>无需独立文件，重要结论按类型写入现有事实源。</dd><dt>放到你的项目里</dt><dd>建筑资料库票任务只需当前票、相关规格、术语和批准原型。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>你实际读过哪些输入，哪些理解还只来自猜测？</p><p class=\"term-pitfall\"><strong>别误会：</strong>上下文不是完整可靠的永久记忆，也不是名为 CONTEXT.md 的文件本身。</p></div></details>\n<details class=\"term-card\" id=\"term-deploy\" data-stages=\"delivery\"><summary><span class=\"term-name\">部署<span class=\"tag\">工具与操作</span></span><span class=\"term-plain\">把软件及必要配置放到目标运行环境，让目标使用者能够使用。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像设备进场安装并接入实际运行条件。</p><dl><dt>什么时候出现</dt><dd><a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>软件经过相应验收且获得独立部署授权之后进行。</dd><dt>谁来做</dt><dd>AI 提供步骤与回退办法，获授权的执行者操作，用户确认结果。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/support-verification\" data-book-route=\"skills/support-verification\">superpowers:verification-before-completion</a>：核对实际部署与验证证据，不代替部署授权。</p></dd><dt>应看到的产物或证据</dt><dd>目标环境中的运行版本及部署、回退与验证记录。</dd><dt>放到你的项目里</dt><dd>同事 Windows 工作台需要在目标机器验证安装、启动和恢复办法。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>将影响哪个环境，失败怎样退回，谁批准这次操作？</p><p class=\"term-pitfall\"><strong>别误会：</strong>部署不只指上传服务器，构建成功或提交代码也不等于已经部署。</p></div></details>\n<details class=\"term-card\" id=\"term-refactor\" data-stages=\"engineering delivery\"><summary><span class=\"term-name\">重构<span class=\"tag\">开发方法</span></span><span class=\"term-plain\">在保持外部行为的前提下调整内部组织，让当前代码更易维护。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像不改变使用功能的内部改造，但仍需复核影响。</p><dl><dt>什么时候出现</dt><dd><a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>有真实理解、修改或测试阻力，且改动范围已获批准时进行。</dd><dt>谁来做</dt><dd>AI 解释收益与风险，用户确认范围，执行任务修改验证。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-codebase-design\" data-book-route=\"skills/card-codebase-design\">codebase-design</a>：判断接口和封装怎样减少实际阻力。</p><p><a class=\"skill-link\" href=\"#skills/card-code-review\" data-book-route=\"skills/card-code-review\">code-review</a>：检查行为与项目标准是否保持。</p></dd><dt>应看到的产物或证据</dt><dd>内部调整的代码和行为未回退的验证记录。</dd><dt>放到你的项目里</dt><dd>建筑资料库把重复的筛选规则集中起来，搜索结果保持一致。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>解决了什么实际问题，怎样证明外部行为没有改变？</p><p class=\"term-pitfall\"><strong>别误会：</strong>重构不是顺手加功能，也不能借整理代码修改无关用户改动。</p></div></details>\n<details class=\"term-card\" id=\"term-prototype\" data-stages=\"concept engineering\"><summary><span class=\"term-name\">Prototype · 原型<span class=\"tag\">探索产物</span></span><span class=\"term-plain\">用最小可抛弃样例回答布局、交互或逻辑问题。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像样板间或验证节点做法的试样。</p><dl><dt>什么时候出现</dt><dd><a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型</a> / <a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a><br>文字不足以判断设计或状态逻辑是否合适时制作。</dd><dt>谁来做</dt><dd>AI 制作与验证，用户选择采用、修改或废弃。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-prototype\" data-book-route=\"skills/card-prototype\">prototype</a>：制作回答指定问题的探索原型。</p><p><a class=\"skill-link\" href=\"#skills/support-frontend-design\" data-book-route=\"skills/support-frontend-design\">frontend-design</a>：视觉仍需设计时处理选中方向。</p></dd><dt>应看到的产物或证据</dt><dd>可查看或操作的样例代码、模拟边界及结论记录。</dd><dt>放到你的项目里</dt><dd>建筑资料库用模拟数据比较搜索优先与按设计问题浏览两条路径。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>这个原型回答什么问题，哪些行为仍然只是模拟？</p><p class=\"term-pitfall\"><strong>别误会：</strong>原型能点不等于可发布，逻辑模拟也不证明目标系统兼容或安全。</p></div></details>\n<details class=\"term-card\" id=\"term-user-story\" data-stages=\"research engineering\"><summary><span class=\"term-name\">User story · 用户故事<span class=\"tag\">需求表达</span></span><span class=\"term-plain\">从使用者角度说明想做什么以及为什么有价值。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像描述某类使用者在空间里要完成的活动。</p><dl><dt>什么时候出现</dt><dd><a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">场景研究</a> / <a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a><br>将真实场景转成可讨论的功能要求时使用。</dd><dt>谁来做</dt><dd>AI 根据证据起草，用户确认不是虚构需求。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-to-spec\" data-book-route=\"skills/card-to-spec\">to-spec</a>：把已有共识综合为规格中的用户故事。</p></dd><dt>应看到的产物或证据</dt><dd>Spec 中的故事条目，无需每条另建文件。</dd><dt>放到你的项目里</dt><dd>作为设计师，我想收藏案例，以便下一次快速找回。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>是谁要做这件事，价值有什么真实依据？</p><p class=\"term-pitfall\"><strong>别误会：</strong>把一句话改成作为某人格式，不会自动使它成为已验证需求。</p></div></details>\n<details class=\"term-card\" id=\"term-acceptance\" data-stages=\"concept engineering delivery\"><summary><span class=\"term-name\">Acceptance criteria · 验收标准<span class=\"tag\">需求表达</span></span><span class=\"term-plain\">明确满足哪些可观察条件，才算这项要求做到了。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像约定尺寸、性能和使用结果的交验条件。</p><dl><dt>什么时候出现</dt><dd><a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型</a> / <a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>批准方案或施工票前写清，并在交验时逐条核对。</dd><dt>谁来做</dt><dd>AI 提出可检查条件，用户确认标准并最终验收。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-to-spec\" data-book-route=\"skills/card-to-spec\">to-spec</a>：固定功能要求及验证边界。</p><p><a class=\"skill-link\" href=\"#skills/card-to-tickets\" data-book-route=\"skills/card-to-tickets\">to-tickets</a>：给每票写明可检查的交付条件。</p></dd><dt>应看到的产物或证据</dt><dd>现有规格、票或原型评审中的验收条目。</dd><dt>放到你的项目里</dt><dd>建筑资料库取消收藏后列表不再显示，刷新后仍保持取消结果。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>我执行什么操作、看到什么结果才算通过？</p><p class=\"term-pitfall\"><strong>别误会：</strong>运行正常或界面美观过于含糊，标准通过也不等于人工已批准。</p></div></details>\n<details class=\"term-card\" id=\"term-smoke-test\" data-stages=\"delivery\"><summary><span class=\"term-name\">Smoke test · 冒烟测试<span class=\"tag\">测试方法</span></span><span class=\"term-plain\">用少量关键检查快速发现版本是否存在明显不可用问题。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像设备通电后的基本运行检查。</p><dl><dt>什么时候出现</dt><dd><a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>新版本构建、安装或部署后先检查最基本路径。</dd><dt>谁来做</dt><dd>AI 按约定执行，必要时用户在目标设备配合。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/support-webapp-testing\" data-book-route=\"skills/support-webapp-testing\">webapp-testing</a>：对网页执行选定的基本操作检查。</p></dd><dt>应看到的产物或证据</dt><dd>现有验证记录中的少量关键检查结果。</dd><dt>放到你的项目里</dt><dd>同事 Windows 工作台能启动、打开资料列表并正常退出。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>这次基本检查覆盖什么，还不能证明什么？</p><p class=\"term-pitfall\"><strong>别误会：</strong>冒烟通过不代表权限、异常恢复和全部用户流程都已通过。</p></div></details>\n<details class=\"term-card\" id=\"term-regression\" data-stages=\"delivery\"><summary><span class=\"term-name\">Regression test · 回归测试<span class=\"tag\">测试方法</span></span><span class=\"term-plain\">修改后检查原本应该保持的行为有没有被破坏。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像改造后重新试水，确认原有部分仍正常。</p><dl><dt>什么时候出现</dt><dd><a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>修复、重构或增加功能后按影响范围执行。</dd><dt>谁来做</dt><dd>AI 选择并运行相应检查，报告缺口。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-implement\" data-book-route=\"skills/card-implement\">implement</a>：施工中组织相关测试与票末检查。</p><p><a class=\"skill-link\" href=\"#skills/card-diagnosing-bugs\" data-book-route=\"skills/card-diagnosing-bugs\">diagnosing-bugs</a>：获准修复后验证症状和受影响行为。</p></dd><dt>应看到的产物或证据</dt><dd>已有测试的运行结果及必要补充测试。</dd><dt>放到你的项目里</dt><dd>建筑资料库新增收藏筛选后，原有关键词搜索仍返回正确案例。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>这次修改可能碰坏哪里，你检查了哪些原有行为？</p><p class=\"term-pitfall\"><strong>别误会：</strong>只重跑原缺陷的一条路径，不一定覆盖相关功能的回退风险。</p></div></details>\n<details class=\"term-card\" id=\"term-e2e\" data-stages=\"concept delivery\"><summary><span class=\"term-name\">E2E · 端到端测试<span class=\"tag\">测试方法</span></span><span class=\"term-plain\">沿一条完整任务链检查多个部分连接后的实际结果。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像从入口到目的地走完整条使用路线。</p><dl><dt>什么时候出现</dt><dd><a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>需要证明界面与相关系统连起来能完成任务时使用。</dd><dt>谁来做</dt><dd>AI 在约定环境执行，说明真实系统与模拟部分。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/support-webapp-testing\" data-book-route=\"skills/support-webapp-testing\">webapp-testing</a>：实走浏览器中的完整任务路线。</p></dd><dt>应看到的产物或证据</dt><dd>自动测试或实际操作记录，附预期、结果和环境范围。</dd><dt>放到你的项目里</dt><dd>建筑资料库从登录、查找案例到收藏，再进入收藏列表核对。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>这条链经过哪些真实部分，哪里使用了模拟？</p><p class=\"term-pitfall\"><strong>别误会：</strong>原型里的端到端演示不等于生产系统已完成端到端验证。</p></div></details>\n<details class=\"term-card\" id=\"term-worktree\" data-stages=\"engineering delivery\"><summary><span class=\"term-name\">Worktree · 独立工作目录<span class=\"tag\">工具与操作</span></span><span class=\"term-plain\">让同一 Git 仓库拥有另一份可单独操作的工作目录。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像共享版本档案、但分开摆放图纸的工作台。</p><dl><dt>什么时候出现</dt><dd><a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>真实 Git 项目确实需要隔离文件改动时使用。</dd><dt>谁来做</dt><dd>AI 核对现有目录并在授权范围创建或复用。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/support-worktrees\" data-book-route=\"skills/support-worktrees\">superpowers:using-git-worktrees</a>：确认并安排适用的隔离工作目录。</p></dd><dt>应看到的产物或证据</dt><dd>实际独立目录及所关联分支或检出状态。</dd><dt>放到你的项目里</dt><dd>建筑资料库票任务在独立目录修改，不直接混入另一任务的未存档文件。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>当前实际目录是哪一个，它隔开了什么、没隔开什么？</p><p class=\"term-pitfall\"><strong>别误会：</strong>worktree 不隔离账号、数据库或系统权限，也不能替代票专属新任务。</p></div></details>\n<details class=\"term-card\" id=\"term-git-actions\" data-stages=\"delivery\"><summary><span class=\"term-name\">Commit / Push / Merge · 存档、推送、合并<span class=\"tag\">工具与操作</span></span><span class=\"term-plain\">Commit 记录本地版本，push 更新远端引用，merge 合并不同开发历史。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像本地归档、发送到共享档案库，以及合并两套修订。</p><dl><dt>什么时候出现</dt><dd><a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>验收后按各动作的授权范围存档或整合工作。</dd><dt>谁来做</dt><dd>AI 说明实际目标并获授权后执行，不需要专属 Matt 技能。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd>不需要专属 Skill；由 AI 使用合适工具，按任务要求实际操作或说明。</dd><dt>应看到的产物或证据</dt><dd>对应的提交编号、远端更新或合并结果。</dd><dt>放到你的项目里</dt><dd>建筑资料库本票验收后可获准本地存档，推送仍另等确认。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>这次到底是本地存档、更新远端还是合并，目标是什么？</p><p class=\"term-pitfall\"><strong>别误会：</strong>三个动作不是同一件事，任何一个都不自动代表允许部署。</p></div></details>\n<details class=\"term-card\" id=\"term-agents\" data-stages=\"research concept engineering delivery\"><summary><span class=\"term-name\">Agent / 子代理 · 执行角色<span class=\"tag\">协作概念</span></span><span class=\"term-plain\">代理按授权使用工具完成工作；子代理负责其中一项范围明确的工作，并汇报结果。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像总工把专项核查交给专业负责人。</p><dl><dt>什么时候出现</dt><dd><a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">场景研究</a> / <a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型</a> / <a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>有范围明确、可独立完成且已获授权的工作时，才考虑委派。</dd><dt>谁来做</dt><dd>主任务限定输入、范围与回报要求，子代理执行，不需要固定专属技能。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd>不需要专属 Skill；由 AI 使用合适工具，按任务要求实际操作或说明。</dd><dt>应看到的产物或证据</dt><dd>被委派工作的结果与证据，不另造整套项目状态。</dd><dt>放到你的项目里</dt><dd>建筑资料库让一个子代理只读核对来源链接，主任务继续整理结论。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>交给它什么范围，它实际做了什么，结果有证据吗？</p><p class=\"term-pitfall\"><strong>别误会：</strong>子代理不自动拥有更多权限，也不能替代施工票会话。</p></div></details>\n<details class=\"term-card\" id=\"term-compaction\" data-stages=\"research concept engineering delivery\"><summary><span class=\"term-name\">Compaction · 上下文压缩<span class=\"tag\">协作概念</span></span><span class=\"term-plain\">把较长历史收敛成更短表示，便于继续处理当前工作。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像把一桌讨论记录整理为工作摘要。</p><dl><dt>什么时候出现</dt><dd><a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">场景研究</a> / <a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型</a> / <a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>需要缩减历史负担时，先确认重要事实已有可靠出处。</dd><dt>谁来做</dt><dd>当前工具提供相应能力，AI 核对继续所需信息，不需要 Matt 专属技能。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd>不需要专属 Skill；由 AI 使用合适工具，按任务要求实际操作或说明。</dd><dt>应看到的产物或证据</dt><dd>缩减后的上下文表示，无需另建项目状态文件。</dd><dt>放到你的项目里</dt><dd>建筑资料库长讨论后继续时，先读回已批准规格和当前票。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>哪些重要决定已有文件依据，继续前还需要重新读取什么？</p><p class=\"term-pitfall\"><strong>别误会：</strong>压缩可能丢细节，不是永久存档，也不能代替正式票的新任务闸门。</p></div></details>\n<details class=\"term-card\" id=\"term-skill\" data-stages=\"research concept engineering delivery\"><summary><span class=\"term-name\">Skill · 方法卡<span class=\"tag\">协作概念</span></span><span class=\"term-plain\">给 AI 一套完成特定工作的步骤、约束和产出要求。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>像针对专项工作的操作说明，不是一位自动上班的员工。</p><dl><dt>什么时候出现</dt><dd><a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">场景研究</a> / <a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型</a> / <a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>明确要解决的问题后，选择当前适用的方法。</dd><dt>谁来做</dt><dd>作者编写方法，AI 实际读取并按授权使用，不需另一个 Skill 来证明调用。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd>不需要专属 Skill；由 AI 使用合适工具，按任务要求实际操作或说明。</dd><dt>应看到的产物或证据</dt><dd>当前任务要求的文档、代码或行为证据，加载本身不是成果。</dd><dt>放到你的项目里</dt><dd>建筑资料库明确使用 to-spec，检查它是否读到正文并交出符合要求的规格。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>你实际读了哪个方法，完成了哪些适用步骤？</p><p class=\"term-pitfall\"><strong>别误会：</strong>文件存在不证明入口可用或自动触发，手册携带方法原文也不等于安装插件。</p></div></details>\n<details class=\"term-card\" id=\"term-gate\" data-stages=\"research concept engineering delivery\"><summary><span class=\"term-name\">关口 · 停工待检点<span class=\"tag\">协作概念</span></span><span class=\"term-plain\">每一步结束时你确认了什么，这步才算完；没过关口不进下一步。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>隐蔽工程验收、分项验收的停检点。</p><dl><dt>什么时候出现</dt><dd><a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">场景研究</a> / <a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型</a> / <a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>正式功能主线七步各有一个关口。</dd><dt>谁来做</dt><dd>AI 把这一步做到能被检查，你确认。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd>无专用 Skill；关口在 02 第 3 节定义，各步产出由对应 Skill 生成。</dd><dt>应看到的产物或证据</dt><dd>一句“关口：用户确认了什么”，写进施工日志。</dd><dt>放到你的项目里</dt><dd>资料库 Spec 批准是一个关口，票序确认是下一个。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>现在到哪个关口了，要我确认什么？</p><p class=\"term-pitfall\"><strong>别误会：</strong>关口不是每条消息都要我点头；普通细节由 AI 在已批准范围内继续。</p></div></details>\n<details class=\"term-card\" id=\"term-acceptance-sheet\" data-stages=\"delivery\"><summary><span class=\"term-name\">验收单 · 验收记录表<span class=\"tag\">协作文档</span></span><span class=\"term-plain\">每条验收标准一行：你做什么操作、应看到什么、机器验证结果、待你确认。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>分项工程验收记录表，施工方填，监理和业主签。</p><dl><dt>什么时候出现</dt><dd><a href=\"#delivery/real-acceptance\" data-book-route=\"delivery/real-acceptance\">开发交付</a><br>施工票收工时。</dd><dt>谁来做</dt><dd>施工票会话填，你逐行照做、逐行勾。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-implement\" data-book-route=\"skills/card-implement\">implement</a> 产出证据；<a class=\"skill-link\" href=\"#skills/card-code-review\" data-book-route=\"skills/card-code-review\">code-review</a> 在审查会话核对；格式由 02 定义。</p></dd><dt>应看到的产物或证据</dt><dd>一张表，附在票里；填好的例子见<a href=\"#delivery/real-acceptance\" data-book-route=\"delivery/real-acceptance\">开发交付</a>。</dd><dt>放到你的项目里</dt><dd>类型筛选票的四行验收单。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>验收单每行的“机器验证”是真的跑过，还是推断的？</p><p class=\"term-pitfall\"><strong>别误会：</strong>机器验证通过那一列不等于我已确认；“待确认”要我勾了才算。</p></div></details>\n<details class=\"term-card\" id=\"term-contact-sheet\" data-stages=\"delivery\"><summary><span class=\"term-name\">联系单 · 工程联系单<span class=\"tag\">协作文档</span></span><span class=\"term-plain\">执行者发现 Spec 或票本身有错时的回报：哪里错、影响什么、建议怎么改；不自己改。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>施工方发现图纸问题时发的工程联系单，由设计方答复。</p><dl><dt>什么时候出现</dt><dd><a href=\"#delivery/close-deliver\" data-book-route=\"delivery/close-deliver\">开发交付</a><br>施工中发现规格或票与现实冲突时。</dd><dt>谁来做</dt><dd>施工票会话填，你决定，主控记进施工日志。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd>无专用 Skill；<a href=\"#skills/card-diagnosing-bugs\" data-book-route=\"skills/card-diagnosing-bugs\">diagnosing-bugs</a> 可用于弄清是实现错了还是 Spec 错了。</dd><dt>应看到的产物或证据</dt><dd>三项回报，进入施工日志“待用户决定的事”。</dd><dt>放到你的项目里</dt><dd>详情页字段“来源”与 Spec 第 3 条冲突，交联系单等你选。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>这是实现错了还是 Spec 错了？</p><p class=\"term-pitfall\"><strong>别误会：</strong>联系单不是变更单；变更由我批准后才改 Spec 和票。</p></div></details>\n<details class=\"term-card\" id=\"term-closeout-states\" data-stages=\"delivery\"><summary><span class=\"term-name\">收工三态 · 三种收工状态<span class=\"tag\">协作概念</span></span><span class=\"term-plain\">一张票只能以完成待验收、部分完成、阻塞三种状态之一收工。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>班组交班只报三种：完工待验、部分完工并列出未完项、停工待指示。</p><dl><dt>什么时候出现</dt><dd><a href=\"#delivery/close-deliver\" data-book-route=\"delivery/close-deliver\">开发交付</a><br>每张施工票收工时。</dd><dt>谁来做</dt><dd>施工票会话。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd>无专用 Skill；由 02 第 4 节要求。</dd><dt>应看到的产物或证据</dt><dd>收工摘要第一行就是三态之一，后面跟验收单或未达项。</dd><dt>放到你的项目里</dt><dd>“票 03 部分完成：清空恢复未做，原因是接口不支持，需要你决定是否加接口”。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>这票现在是哪一态？</p><p class=\"term-pitfall\"><strong>别误会：</strong>“基本做好了”“差不多了”不是状态。</p></div></details>\n<details class=\"term-card\" id=\"term-start-report\" data-stages=\"research concept engineering delivery\"><summary><span class=\"term-name\">开工报告 · 开工前的一行<span class=\"tag\">协作文档</span></span><span class=\"term-plain\">任何会话开始时先说：本次路线、当前关口、这轮结束你会看到什么。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>开工报告。</p><dl><dt>什么时候出现</dt><dd><a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">场景研究</a> / <a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型</a> / <a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>所有会话、所有阶段；路线变了重新报告。</dd><dt>谁来做</dt><dd>AI。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd>无专用 Skill；由 02 第 1 节要求。</dd><dt>应看到的产物或证据</dt><dd>回复的第一行。</dd><dt>放到你的项目里</dt><dd>“路线：正式功能第 5 步；关口：验收单交付；你会看到：一张四行验收单”。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>你的开工报告呢？</p><p class=\"term-pitfall\"><strong>别误会：</strong>开工报告不是批准，只是让你一眼看出它走没走错路线。</p></div></details>\n<details class=\"term-card\" id=\"term-site-log\" data-stages=\"research concept engineering delivery\"><summary><span class=\"term-name\">施工日志 · 项目状态记录<span class=\"tag\">协作文档</span></span><span class=\"term-plain\">项目“现在到哪了”的唯一记录，六项：当前阶段、决策现场、当前票、上一票验收结果、待你定的事、下一步。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>施工日志本。</p><dl><dt>什么时候出现</dt><dd><a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">场景研究</a> / <a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型</a> / <a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>所有阶段；每过一个关口更新。</dd><dt>谁来做</dt><dd>主控写；任何会话开工先读。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd>无专用 Skill；位置由 03 模板定，默认 <code>项目总览/md/施工日志.md</code>。</dd><dt>应看到的产物或证据</dt><dd>一个六行的 MD 文件；填好的例子见<a href=\"#knowledge/knowledge-maintenance\" data-book-route=\"knowledge/knowledge-maintenance\">项目知识库</a>。</dd><dt>放到你的项目里</dt><dd>见 07 章的例子。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>施工日志更新了吗？决策现场现在是谁？</p><p class=\"term-pitfall\"><strong>别误会：</strong>施工日志不是聊天记录，也不是票；票里的细节不复制进来。</p></div></details>\n<details class=\"term-card\" id=\"term-decision-venue\" data-stages=\"research concept engineering delivery\"><summary><span class=\"term-name\">决策现场 · 谁在写决策台账<span class=\"tag\">协作概念</span></span><span class=\"term-plain\">在哪个会话和你定决定、由谁写决策卡和 ADR：探索期是建图会话，施工准备起是主控。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>图纸此刻在方案组手里，还是在项目部手里。</p><dl><dt>什么时候出现</dt><dd><a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">场景研究</a> / <a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型</a> / <a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a> / <a href=\"#delivery/stage-skill-route\" data-book-route=\"delivery/stage-skill-route\">开发交付</a><br>所有阶段；记在施工日志第二项。</dd><dt>谁来做</dt><dd>主控在日志里切换；不是现场的会话收到决策问题就记下并让你去现场。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-wayfinder\" data-book-route=\"skills/card-wayfinder\">wayfinder</a> 在建图会话用；每轮简报由决策简报程序从卡生成；<a class=\"skill-link\" href=\"#skills/card-decision-map\" data-book-route=\"skills/card-decision-map\">Archify</a> 按需出架构图。</p></dd><dt>应看到的产物或证据</dt><dd>施工日志一行“决策现场：建图／主控”。</dd><dt>放到你的项目里</dt><dd>地图上没有未定问题挡住第一份 Spec 时，从建图切到主控。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>现在决策现场是谁？这个问题该在哪个窗口定？</p><p class=\"term-pitfall\"><strong>别误会：</strong>现场只决定在哪谈、谁写台账；决定永远是你做的。</p></div></details>\n<details class=\"term-card\" id=\"term-freeze\" data-stages=\"engineering delivery\"><summary><span class=\"term-name\">冻结 · 主控的派工模式<span class=\"tag\">协作概念</span></span><span class=\"term-plain\">票序批准后主控进入的状态：写记录，不写产品。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>施工图会审通过后设计冻结，之后改图走变更单。</p><dl><dt>什么时候出现</dt><dd><a href=\"#engineering/ready-handoff\" data-book-route=\"engineering/ready-handoff\">施工准备</a> / <a href=\"#delivery/ticket-workspace\" data-book-route=\"delivery/ticket-workspace\">开发交付</a><br>票序批准那一刻起。</dd><dt>谁来做</dt><dd>主控。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd>无专用 Skill；边界见 04。</dd><dt>应看到的产物或证据</dt><dd>主控从此只写施工日志、根路由、开工包、决策卡、ADR、批准变更后的 Spec 和票；代码和配置由施工票会话写。</dd><dt>放到你的项目里</dt><dd>票序批准后，主控收到修 Bug 请求只写开工包，不改代码。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>你现在是冻结状态吗？这件事该谁做？</p><p class=\"term-pitfall\"><strong>别误会：</strong>冻结不等于主控不写字，它照样写记录。设计基线确认不叫冻结。</p></div></details>\n<details class=\"term-card\" id=\"term-start-package\" data-stages=\"engineering delivery\"><summary><span class=\"term-name\">开工包 · 派工单<span class=\"tag\">协作文档</span></span><span class=\"term-plain\">你新开一个会话时贴入的第一条消息，由派工者填好：核心九行加该会话的变体。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>派工单表头加工种附页。</p><dl><dt>什么时候出现</dt><dd><a href=\"#engineering/ready-handoff\" data-book-route=\"engineering/ready-handoff\">施工准备</a> / <a href=\"#delivery/start-package\" data-book-route=\"delivery/start-package\">开发交付</a><br>开主控、建图、施工票、审查、回归交付会话时。</dd><dt>谁来做</dt><dd>主控写，审查的由施工票收工时附上；你贴进新窗口。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-writing-for-agents\" data-book-route=\"skills/card-writing-for-agents\">writing-for-agents</a> 用来整理模板；填包本身不需要 Skill。</p></dd><dt>应看到的产物或证据</dt><dd>一段文字。模板在 05；填好的施工票例子见<a href=\"#delivery/start-package\" data-book-route=\"delivery/start-package\">开发交付</a>，主控例子见<a href=\"#agents/agent-templates\" data-book-route=\"agents/agent-templates\">Agent 执行手册</a>。</dd><dt>放到你的项目里</dt><dd>收到开工包，对着核心九行看少了哪行。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>开工包里的入口路径都能打开吗？</p><p class=\"term-pitfall\"><strong>别误会：</strong>开工包不是授权，硬停仍按 01。AI 不能替我开窗口，开工包只能由我贴。</p></div></details>\n<details class=\"term-card\" id=\"term-decision-card\" data-stages=\"research concept engineering\"><summary><span class=\"term-name\">决策卡 · 决策台账的单页<span class=\"tag\">协作文档</span></span><span class=\"term-plain\">每个问题一张卡：问题、结论、依据、状态；地图 MD 是它们的总表。</span></summary><div class=\"term-body\"><p class=\"term-analogy\"><strong>像建筑里的：</strong>设计决策台账里的一条记录。</p><dl><dt>什么时候出现</dt><dd><a href=\"#research/stage-skill-route\" data-book-route=\"research/stage-skill-route\">场景研究</a> / <a href=\"#concept/stage-skill-route\" data-book-route=\"concept/stage-skill-route\">概念原型</a> / <a href=\"#engineering/stage-skill-route\" data-book-route=\"engineering/stage-skill-route\">施工准备</a><br>探索期为主；施工期由联系单引出的决定也记。</dd><dt>谁来做</dt><dd>决策现场写。</dd><dt>哪些 Skill 参与 · 各负责什么</dt><dd><p><a class=\"skill-link\" href=\"#skills/card-wayfinder\" data-book-route=\"skills/card-wayfinder\">wayfinder</a> 组织问题；<a class=\"skill-link\" href=\"#skills/card-domain-modeling\" data-book-route=\"skills/card-domain-modeling\">domain-modeling</a> 写难以回头的 ADR；每轮简报由决策简报程序从卡生成；<a class=\"skill-link\" href=\"#skills/card-decision-map\" data-book-route=\"skills/card-decision-map\">Archify</a> 按需出架构图。</p></dd><dt>应看到的产物或证据</dt><dd><code>专题工作/某专题/决策卡/</code> 下的 MD 文件，状态从待定变为已定。</dd><dt>放到你的项目里</dt><dd>“案例来源字段是否必填”一张卡。</dd></dl><p class=\"term-check\"><strong>你可以这样问 AI：</strong><br>这个决定的卡在哪，依据是什么？</p><p class=\"term-pitfall\"><strong>别误会：</strong>决策卡不是施工票；Wayfinder 的决策票是待解的问题，解开后结论写进卡。</p></div></details>\n</section>\n<section id=\"one-feature\">\n<h2>以“在建筑资料库中按材料搜索”为例</h2>\n<p>以下是教学示例，不声称你的项目已经这样实现。真实项目继续使用已批准材料；小修改不必为了套用表格而补齐整套文件。</p>\n<ol class=\"term-walk\">\n<li><strong>场景研究：同事找节点资料太费劲。</strong>用 <a href=\"#skills/card-grill-with-docs\" data-book-route=\"skills/card-grill-with-docs\">grill-with-docs</a> 问清什么时候找、现在怎么找；缺证据才加 <a href=\"#skills/card-research\" data-book-route=\"skills/card-research\">research</a>。任务书写“第一期改善找资料”，不是先拍板做十个功能。</li>\n<li><strong>概念原型：先看看怎样找才顺手。</strong>结构或交互有分歧时用 <a href=\"#skills/card-prototype\" data-book-route=\"skills/card-prototype\">prototype</a>；选中方案仍需视觉设计时，再用 <a href=\"#skills/support-frontend-design\" data-book-route=\"skills/support-frontend-design\">frontend-design</a>。展示搜索框、结果和无结果状态；先用模拟资料，别把原型当已上线的数据库。</li>\n<li><strong>施工准备：明确搜索功能的验收要求。</strong><a href=\"#skills/card-to-spec\" data-book-route=\"skills/card-to-spec\">to-spec</a> 综合已讨论的规格；例如“材料=铝板，只返回允许当前用户查看的资料；无结果时能清除筛选”。必要取舍才用 <a href=\"#skills/card-domain-modeling\" data-book-route=\"skills/card-domain-modeling\">domain-modeling</a> 记录 ADR。</li>\n<li><strong>拆票：第一张票先完成一种实际用法。</strong><a href=\"#skills/card-to-tickets\" data-book-route=\"skills/card-to-tickets\">to-tickets</a> 切出“单一材料筛选并查看结果”。真实数据、权限、查询和页面中本票需要的部分一起贯通，而不是先造完全部页面再等接口。</li>\n<li><strong>开发交付：AI 提供验证证据，你实际试用并验收。</strong><a href=\"#skills/card-implement\" data-book-route=\"skills/card-implement\">implement</a> 在票任务实现，按风险测试，再用 <a href=\"#skills/card-code-review\" data-book-route=\"skills/card-code-review\">code-review</a> 查规范和规格。你用真实场景验收；提交、合并、部署分别遵守授权，不因测试通过就直接发布。</li>\n</ol>\n<details><summary>任务书、Spec、Ticket、ADR、CONTEXT.md，到底各写什么？</summary>\n<div class=\"table-scroll\"><table>\n<thead>\n<tr>\n<th>材料</th>\n<th>只承担这个职责</th>\n<th>不应放入什么</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><a href=\"#glossary/term-prd\" data-book-route=\"glossary/term-prd\">策划任务书 / PRD</a></td>\n<td>给谁做、真实问题、第一期价值与边界</td>\n<td>每个按钮的代码实现</td>\n</tr>\n<tr>\n<td><a href=\"#glossary/term-spec\" data-book-route=\"glossary/term-spec\">Spec</a></td>\n<td>批准的行为要求、实施与测试决定</td>\n<td>另一套重复需求，或每天施工日志</td>\n</tr>\n<tr>\n<td><a href=\"#glossary/term-ticket\" data-book-route=\"glossary/term-ticket\">Ticket</a></td>\n<td>当前工作包、依赖、验收标准与结果</td>\n<td>整段规划聊天和无关任务</td>\n</tr>\n<tr>\n<td><a href=\"#glossary/term-adr\" data-book-route=\"glossary/term-adr\">ADR</a></td>\n<td>重要取舍：为何选它、放弃什么</td>\n<td>每个小样式决定</td>\n</tr>\n<tr>\n<td><a href=\"#glossary/term-context-file\" data-book-route=\"glossary/term-context-file\">CONTEXT.md</a></td>\n<td>项目里同一个词到底指什么</td>\n<td>进度、技术计划、聊天摘要</td>\n</tr>\n</tbody></table></div>\n<p>这是本手册的职责划分。各团队对 PRD / Spec 的叫法不统一，Matt 当前的 to-spec 也不要求先复制一份 PRD；已有材料能承担职责，就引用它。</p>\n</details>\n</section>\n<section id=\"ask-in-plain-language\">\n<h2>听不懂时，让 AI 停下来翻译</h2>\n<p><a href=\"#skills/card-wait-what\" data-book-route=\"skills/card-wait-what\">wait-what</a> 适合当场用更简单的话重说；<a href=\"#skills/card-teach\" data-book-route=\"skills/card-teach\">teach</a> 适合把一个概念讲明白。不是要把研究、盘问和规格流程再跑一遍。</p>\n<div class=\"prompt\"><pre>请使用 Matt 的 wait-what，把你刚才提到的【术语或原句】用建筑师能听懂的话重说。\n不要继续施工，也不要因此新增 Spec 或计划文件。\n每个词只说：白话意思、当前哪个阶段会用、是文件还是实际操作、哪个 Skill 参与以及它具体负责什么、我要检查什么。\n用【我正在做的项目】举一个例子；没有专属 Skill 就直说，没有验证的事不要说成已经完成。\n优先使用当前应用的真实技能入口；未提供时完整读取本机对应 SKILL.md，报告实际名称和路径；读不到就说明，不能把普通解释冒充调用。</pre></div>\n<p class=\"source\">依据：各 Skill 链接通向本手册方法卡及原文。Git 边界参见 <a href=\"https://git-scm.com/docs/git-commit\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">commit</a>、<a href=\"https://git-scm.com/docs/git-revert\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">revert</a> 和 <a href=\"https://git-scm.com/docs/git-worktree\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">worktree</a> 官方文档；Skill 概念参见 <a href=\"https://learn.chatgpt.com/docs/build-skills\" target=\"_blank\" rel=\"noopener noreferrer\" title=\"外部来源，需联网\" data-external=\"true\">OpenAI 方法说明</a>。词条阶段与建筑类比为本手册教学适配，核对日期 2026-09-06。</p>\n</section>\n<nav class=\"book-end\" aria-label=\"前后章节\"><a href=\"#context\" data-book-route=\"context\"><span>上一册</span>← 上下文与日常技巧</a><a class=\"next\" href=\"#team\" data-book-route=\"team\"><span>下一册</span>团队协作 →</a></nav></article><aside class=\"toc\" aria-label=\"本页目录\"><p>这一页</p><a href=\"#glossary/read-the-terms\" data-book-route=\"glossary/read-the-terms\">先分清：这是文件、做法，还是工具？</a><a href=\"#glossary/term-lookup\" data-book-route=\"glossary/term-lookup\">遇到不懂的词，再来查对应卡片</a><a href=\"#glossary/one-feature\" data-book-route=\"glossary/one-feature\">以“在建筑资料库中按材料搜索”为例</a><a href=\"#glossary/ask-in-plain-language\" data-book-route=\"glossary/ask-in-plain-language\">听不懂时，让 AI 停下来翻译</a></aside></div></main></div><div class=\"notice-live\" role=\"status\" aria-live=\"polite\"></div><script>(() => {\nconst toggle=document.querySelector('.menu-toggle'),nav=document.querySelector('.book-nav');\ntoggle?.addEventListener('click',()=>{const open=toggle.getAttribute('aria-expanded')!=='true';toggle.setAttribute('aria-expanded',String(open));nav.classList.toggle('is-open',open);});\nconst live=document.querySelector('.notice-live');let timer;\nfunction announce(message){live.textContent=message;clearTimeout(timer);timer=setTimeout(()=>{live.textContent='';},2400);}\ndocument.querySelectorAll('.prompt').forEach((box)=>{\n const bar=document.createElement('div');bar.className='prompt-bar';\n const label=document.createElement('span');label.textContent='可复制 · 替换【括号内容】';\n const button=document.createElement('button');button.className='copy-btn';button.type='button';button.textContent='复制提示';button.setAttribute('aria-label','复制这段提示');\n bar.append(label,button);box.prepend(bar);\n button.addEventListener('click',async()=>{\n  const text=box.querySelector('pre').textContent;let ok=false;\n  try{if(navigator.clipboard){await navigator.clipboard.writeText(text);ok=true;}}catch{}\n  if(!ok){const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(area);area.select();try{ok=document.execCommand('copy');}catch{}area.remove();button.focus();}\n  button.textContent=ok?'已复制':'请选中文字复制';announce(ok?'提示已复制，请替换括号内容。':'复制受浏览器限制，可直接选中文字复制。');\n  setTimeout(()=>{button.textContent='复制提示';},2400);\n });\n});\nconst search=document.getElementById('skill-search'),cards=[...document.querySelectorAll('.skill-card')],count=document.getElementById('skill-count');\nfunction filter(){const q=(search?.value||'').trim().toLowerCase();let total=0;cards.forEach(card=>{const hit=!q||card.textContent.toLowerCase().includes(q);card.hidden=!hit;if(hit)total++;});if(count)count.textContent=total+' / '+cards.length+' 张方法卡';}\nsearch?.addEventListener('input',filter);if(search)filter();\nconst termSearch=document.getElementById('term-search'),termStage=document.getElementById('term-stage'),termCards=[...document.querySelectorAll('.term-card')],termCount=document.getElementById('term-count'),termEmpty=document.getElementById('term-empty');\nfunction filterTerms(){const q=(termSearch?.value||'').trim().toLowerCase(),stage=termStage?.value||'all';let total=0;termCards.forEach(card=>{const hit=(!q||card.textContent.toLowerCase().includes(q))&&(stage==='all'||card.dataset.stages.split(' ').includes(stage));card.hidden=!hit;if(hit)total++;});if(termCount)termCount.textContent=total+' / '+termCards.length+' 个词条 · 展开查看用法';if(termEmpty)termEmpty.hidden=total!==0;}\ntermSearch?.addEventListener('input',filterTerms);termStage?.addEventListener('change',filterTerms);if(termSearch)filterTerms();\nwindow.resetTermFilters=()=>{if(termSearch)termSearch.value='';if(termStage)termStage.value='all';filterTerms();};\ndocument.getElementById('term-reset')?.addEventListener('click',()=>{window.resetTermFilters();termSearch.focus();});\nfunction openHash(){if(!location.hash)return;let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}const el=document.getElementById(id);if(!el)return;if(el.classList.contains('skill-card')&&search){search.value='';filter();}if(el.classList.contains('term-card'))window.resetTermFilters();if(el.tagName==='DETAILS')el.open=true;let parent=el.parentElement;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement;}requestAnimationFrame(()=>el.scrollIntoView({behavior:'instant',block:'start'}));}\nwindow.addEventListener('hashchange',openHash);openHash();\nconst sections=[...document.querySelectorAll('article>section')],tocLinks=[...document.querySelectorAll('.toc a')];\nif('IntersectionObserver'in window){const observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);if(!visible.length)return;const id=visible[0].target.id;tocLinks.forEach(a=>a.classList.toggle('current',a.hash==='#'+id));},{rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>observer.observe(s));}\n})();\n<\/script><script>(() => {\n const send=data=>window.parent.postMessage({portableBook:true,...data},'*');\n window.openBookSection=anchor=>{\n  if(!anchor){window.scrollTo(0,0);return;}\n  const el=document.getElementById(anchor);if(!el)return;\n  const search=document.getElementById('skill-search');\n  if(el.classList.contains('skill-card')&&search){search.value='';search.dispatchEvent(new Event('input'));}\n  if(el.classList.contains('term-card'))window.resetTermFilters?.();\n  for(let node=el;node;node=node.parentElement)if(node.tagName==='DETAILS')node.open=true;\n  requestAnimationFrame(()=>el.scrollIntoView({block:'start',behavior:'instant'}));\n };\n document.addEventListener('click',event=>{\n  const link=event.target.closest('a');if(!link)return;\n  if(link.dataset.bookRoute){event.preventDefault();send({route:link.dataset.bookRoute});}\n  else if(link.dataset.attachment){event.preventDefault();send({attachment:link.dataset.attachment});}\n });\n})();\n<\/script>\n</body></html>"},{"id":"team","nav":"团队协作","html":"<!doctype html><html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta name=\"color-scheme\" content=\"light\"><meta name=\"description\" content=\"你不必先学会写代码，才能与同事合作。先把分工、版本和验收交接清楚，再让每个人的 AI 在同一套约定下工作。\"><title>团队协作 · 建筑师的 AI 开发手册</title><style>@charset \"UTF-8\";\n:root{--bg:#f7f4ed;--paper:#fffdfa;--ink:#2d2823;--muted:#70665c;--accent:#a44c34;--line:#ddd5c9;--sage:#4d6655;--soft:#eee8de;--focus:#85331e}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:32px}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.85 \"Segoe UI\",\"Microsoft YaHei\",\"PingFang SC\",sans-serif}\na{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:4px}a:hover{color:#783221}button,input{font:inherit}button{cursor:pointer}a,button,input,summary{-webkit-tap-highlight-color:transparent}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:4px;border-radius:3px}\n.skip{position:fixed;left:20px;top:-100px;z-index:9;background:var(--ink);color:#fff;padding:10px 20px}.skip:focus{top:12px}\n.layout{display:grid;grid-template-columns:246px minmax(0,1fr);max-width:1640px;margin:auto;min-height:100vh}\n.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:38px 23px 25px;overflow-y:auto}\n.brand{display:block;color:var(--ink);text-decoration:none;font-size:18px;font-weight:700;line-height:1.5;margin-bottom:28px}.brand small{display:block;font-weight:400;font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted);margin-top:6px}\n.menu-toggle{display:none}.nav-label{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:24px 10px 8px}.book-nav a{display:flex;gap:12px;align-items:baseline;text-decoration:none;color:var(--muted);padding:9px 11px;margin:3px 0;border-radius:5px;font-size:14px}.book-nav a span{font-size:10px;font-variant-numeric:tabular-nums;color:inherit;width:18px}.book-nav a:hover{background:var(--soft);color:var(--ink)}.book-nav a[aria-current=page]{background:#e9ded1;color:#773a29;font-weight:650}\n.side-note{font-size:11px;line-height:1.8;color:var(--muted);margin:30px 10px 0;padding-top:17px;border-top:1px solid var(--line)}\n.page{min-width:0;padding:44px 52px 30px}.topline{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:15px;font-size:11px;color:var(--muted);letter-spacing:.05em}.topline a{color:var(--muted)}\n.hero{padding:47px 0 39px;max-width:830px}.eyebrow{font-size:12px;letter-spacing:.13em;color:var(--accent);margin:0 0 17px;font-weight:600}\nh1,h2{font-family:Georgia,\"Noto Serif CJK SC\",\"Source Han Serif SC\",SimSun,serif;line-height:1.4;letter-spacing:-.025em;text-wrap:balance}h1{font-size:clamp(32px,3.1vw,49px);font-weight:600;margin:0 0 23px;max-width:760px}h2{font-size:27px;font-weight:600;margin:0 0 23px}h3{font-size:17px;line-height:1.6;margin:24px 0 10px}p{margin:0 0 18px}p:last-child{margin-bottom:0}.lead{font-size:17px;max-width:690px;color:var(--muted);line
